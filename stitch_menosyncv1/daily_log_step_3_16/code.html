<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log Your Symptoms | Monochrome Edition</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#000000",
                        "surface": "#FFFFFF",
                        "border-main": "#000000",
                        "border-muted": "#E5E5E5",
                        "on-surface": "#000000"
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                        "display": ["Space Grotesk", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-surface text-on-surface font-sans overflow-hidden h-screen w-screen;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .progress-dot {
            width: 8px;
            height: 8px;
            @apply border border-primary;
        }
        .progress-dot.active {
            @apply bg-primary w-6;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col">
<header class="pt-8 px-6 pb-4 bg-surface">
<div class="flex justify-between items-center mb-6">
<button class="w-10 h-10 flex items-center justify-center border border-primary">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex gap-2">
<div class="progress-dot"></div>
<div class="progress-dot"></div>
<div class="progress-dot active"></div>
</div>
<div class="w-10"></div>
</div>
<div class="w-full bg-border-muted h-0.5 overflow-hidden">
<div class="bg-primary h-full w-3/5 transition-all duration-500"></div>
</div>
<p class="text-[10px] uppercase tracking-[0.3em] font-black text-primary mt-4 text-center">Step 3 of 5: Triggers</p>
</header>
<main class="flex-1 overflow-y-auto px-6 pt-4 pb-56">
<div class="flex flex-col items-center text-center max-w-md mx-auto" id="step-triggers">
<h2 class="font-display text-3xl font-bold text-primary mb-3 leading-tight tracking-tight uppercase">What might have triggered your symptoms?</h2>
<p class="text-primary/60 text-xs mb-10 font-medium uppercase tracking-widest">Select all that apply to today's entry</p>
<div class="grid grid-cols-2 gap-px bg-primary border border-primary w-full">
<button class="flex flex-col items-center justify-center p-8 bg-white hover:bg-black hover:text-white transition-colors aspect-square">
<span class="material-symbols-outlined text-4xl mb-4">coffee</span>
<span class="text-xs font-bold uppercase tracking-widest">Caffeine</span>
</button>
<button class="flex flex-col items-center justify-center p-8 bg-white hover:bg-black hover:text-white transition-colors aspect-square">
<span class="material-symbols-outlined text-4xl mb-4">wine_bar</span>
<span class="text-xs font-bold uppercase tracking-widest">Alcohol</span>
</button>
<button class="flex flex-col items-center justify-center p-8 bg-black text-white transition-colors aspect-square relative">
<div class="absolute top-4 right-4">
<span class="material-symbols-outlined text-sm">check_circle</span>
</div>
<span class="material-symbols-outlined text-4xl mb-4" style="font-variation-settings: 'FILL' 1;">psychology</span>
<span class="text-xs font-bold uppercase tracking-widest">Stress</span>
</button>
<button class="flex flex-col items-center justify-center p-8 bg-white hover:bg-black hover:text-white transition-colors aspect-square">
<span class="material-symbols-outlined text-4xl mb-4">fitness_center</span>
<span class="text-xs font-bold uppercase tracking-widest">Exercise</span>
</button>
<button class="flex flex-col items-center justify-center p-8 bg-white hover:bg-black hover:text-white transition-colors aspect-square">
<span class="material-symbols-outlined text-4xl mb-4">thermostat</span>
<span class="text-xs font-bold uppercase tracking-widest">Weather</span>
</button>
<button class="flex flex-col items-center justify-center p-8 bg-white hover:bg-black hover:text-white transition-colors aspect-square">
<span class="material-symbols-outlined text-4xl mb-4">restaurant</span>
<span class="text-xs font-bold uppercase tracking-widest">Foods</span>
</button>
</div>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full p-6 bg-white border-t border-primary z-40">
<div class="max-w-lg mx-auto flex flex-col gap-4">
<button class="w-full py-4 border border-primary bg-transparent text-primary font-black active:bg-primary active:text-white duration-100 transition-all flex items-center justify-center gap-2 text-xs uppercase tracking-[0.25em]">
<span class="material-symbols-outlined text-lg">add</span>
                Add Custom Symptom
            </button>
<div class="flex gap-4">
<button class="flex-1 py-5 border border-primary text-primary font-black active:bg-primary active:text-white duration-100 transition-all text-xs uppercase tracking-[0.25em]">
                    Back
                </button>
<button class="flex-[2] py-5 bg-primary text-white font-black active:bg-white active:text-primary border border-primary duration-100 transition-all flex items-center justify-center gap-2 text-xs uppercase tracking-[0.25em]">
                    Continue <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
<div class="mt-2 flex justify-center gap-2">
<div class="h-1 w-8 bg-primary"></div>
<div class="h-1 w-2 bg-border-muted"></div>
<div class="h-1 w-2 bg-border-muted"></div>
<div class="h-1 w-2 bg-border-muted"></div>
</div>
</div>
</footer>

</body></html>
