<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#6c6074",
                        "surface-dim": "#ded9d7",
                        "on-surface": "#1d1b1a",
                        "secondary-fixed-dim": "#d0c1d8",
                        "secondary-fixed": "#edddf5",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "secondary": "#655a6e",
                        "outline-variant": "#d0c4bc",
                        "inverse-surface": "#32302f",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#ede7e5",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#f2edea",
                        "on-tertiary": "#ffffff",
                        "surface": "#fef8f6",
                        "on-tertiary-fixed": "#341009",
                        "on-secondary-fixed": "#211828",
                        "secondary-container": "#edddf5",
                        "on-surface-variant": "#4d453f",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "tertiary-container": "#9d675c",
                        "primary": "#67594e",
                        "primary-fixed-dim": "#d6c3b5",
                        "tertiary-fixed": "#ffdad3",
                        "outline": "#7f756e",
                        "surface-container-low": "#f8f2f0",
                        "surface-bright": "#fef8f6",
                        "inverse-on-surface": "#f5f0ed",
                        "on-primary": "#ffffff",
                        "surface-tint": "#6a5c50",
                        "background": "#fef8f6",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-primary-container": "#fffbff",
                        "on-background": "#1d1b1a",
                        "error": "#ba1a1a",
                        "primary-container": "#817266",
                        "on-tertiary-container": "#fffbff",
                        "surface-variant": "#e7e1df",
                        "on-primary-fixed-variant": "#51443a",
                        "tertiary": "#814f45",
                        "on-tertiary-fixed-variant": "#683a31",
                        "surface-container-highest": "#e7e1df",
                        "on-primary-fixed": "#231a11",
                        "inverse-primary": "#d6c3b5",
                        "primary-fixed": "#f2dfd0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Manrope', sans-serif; background-color: #fef8f6; }
        .serif { font-family: 'Noto Serif', serif; }
        ::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface">
<!-- Top Navigation Anchor (As per Shared Components) -->
<header class="bg-[#fef8f6]/70 dark:bg-stone-950/70 backdrop-blur-md fixed top-0 w-full z-50">
<div class="flex items-center justify-between px-6 h-16 w-full max-max-w-screen-md mx-auto">
<button class="transition-all duration-300 ease-in-out active:scale-95 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 rounded-full p-2">
<span class="material-symbols-outlined text-stone-700 dark:text-stone-300" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Noto_Serif'] text-xl font-semibold text-stone-700 dark:text-stone-300">Your Lifestyle Baseline</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="pt-20 pb-40 px-6 max-w-screen-md mx-auto min-h-screen">
<!-- Intro & Progress Section -->
<section class="mb-10">
<div class="flex justify-between items-end mb-4">
<span class="text-[10px] font-bold uppercase tracking-widest text-primary">Step 5 of 7</span>
<div class="w-32 h-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[71.4%]"></div>
</div>
</div>
<p class="text-on-surface-variant text-sm leading-relaxed max-w-[90%]">
                Help us understand your baseline. This identifies lifestyle patterns that may correlate with your symptoms.
            </p>
</section>
<!-- Questions Stack -->
<div class="space-y-6">
<!-- Q1: Weight -->
<div class="bg-surface-container-lowest rounded-xl p-6 transition-all duration-300">
<label class="block text-primary font-bold text-sm uppercase tracking-wider mb-4">Current weight (optional)</label>
<div class="flex gap-4">
<div class="flex-1 bg-surface-container rounded-full px-6 py-4">
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface font-headline text-lg" placeholder="70" type="text"/>
</div>
<div class="flex bg-surface-container-high p-1 rounded-full w-32">
<button class="flex-1 rounded-full text-xs font-bold py-2 bg-primary text-on-primary">kg</button>
<button class="flex-1 rounded-full text-xs font-bold py-2 text-on-surface-variant">lbs</button>
</div>
</div>
</div>
<!-- Q2: Smoking -->
<div class="bg-surface-container-lowest rounded-xl p-6">
<label class="block text-primary font-bold text-sm uppercase tracking-wider mb-6">Do you smoke?</label>
<div class="space-y-3">
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container text-on-surface-variant hover:bg-secondary-container transition-colors group">
<span class="font-medium">Never</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center group-hover:border-primary"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container text-on-surface-variant hover:bg-secondary-container transition-colors group">
<span class="font-medium">Former</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center group-hover:border-primary"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container text-on-surface-variant hover:bg-secondary-container transition-colors group">
<span class="font-medium">Occasional</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center group-hover:border-primary"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container text-on-surface-variant hover:bg-secondary-container transition-colors group">
<span class="font-medium">Daily</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center group-hover:border-primary"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container text-on-surface-variant hover:bg-secondary-container transition-colors group">
<span class="font-medium">Prefer not to say</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center group-hover:border-primary"></div>
</button>
</div>
</div>
<!-- Q3: Alcohol -->
<div class="bg-surface-container-lowest rounded-xl p-6">
<label class="block text-primary font-bold text-sm uppercase tracking-wider mb-6">How often do you drink alcohol?</label>
<div class="grid grid-cols-1 gap-3">
<!-- Example of Selected State -->
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-secondary-container text-on-surface transition-colors">
<span class="font-semibold">Rarely</span>
<div class="w-5 h-5 rounded-full border-[6px] border-primary flex items-center justify-center"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container text-on-surface-variant">
<span class="font-medium">Occasionally</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container text-on-surface-variant">
<span class="font-medium">Regularly</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container text-on-surface-variant">
<span class="font-medium">Daily</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container text-on-surface-variant">
<span class="font-medium">Prefer not to say</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant"></div>
</button>
</div>
</div>
<!-- Q4: Sleep -->
<div class="bg-surface-container-lowest rounded-xl p-6">
<label class="block text-primary font-bold text-sm uppercase tracking-wider mb-6">How many hours do you typically sleep per night?</label>
<div class="flex items-center justify-center space-x-8 py-4">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container text-primary transition-transform active:scale-90">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<div class="text-center">
<span class="font-headline text-4xl font-bold text-on-surface">7</span>
<span class="block text-xs font-bold text-on-surface-variant uppercase tracking-tighter">hours</span>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container text-primary transition-transform active:scale-90">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Q5: Exercise -->
<div class="bg-surface-container-lowest rounded-xl p-6">
<label class="block text-primary font-bold text-sm uppercase tracking-wider mb-6">How often do you exercise?</label>
<div class="space-y-3">
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container text-on-surface-variant">
<span class="font-medium">Rarely/never</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container text-on-surface-variant">
<span class="font-medium">1-2x/week</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-secondary-container text-on-surface">
<span class="font-semibold">3-4x/week</span>
<div class="w-5 h-5 rounded-full border-[6px] border-primary"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container text-on-surface-variant">
<span class="font-medium">Daily</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant"></div>
</button>
</div>
</div>
<!-- Q6: Caffeine -->
<div class="bg-surface-container-lowest rounded-xl p-6 mb-12">
<label class="block text-primary font-bold text-sm uppercase tracking-wider mb-6">Typical daily caffeine intake</label>
<div class="grid grid-cols-2 gap-4">
<button class="flex flex-col items-center p-4 rounded-2xl bg-surface-container gap-2 group transition-all">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="water_drop">water_drop</span>
<span class="text-xs font-bold">None</span>
</button>
<button class="flex flex-col items-center p-4 rounded-2xl bg-secondary-container gap-2 border-2 border-primary/10">
<span class="material-symbols-outlined text-primary" data-icon="coffee" data-weight="fill" style="font-variation-settings: 'FILL' 1;">coffee</span>
<span class="text-xs font-bold text-primary">Moderate</span>
</button>
<button class="flex flex-col items-center p-4 rounded-2xl bg-surface-container gap-2">
<span class="material-symbols-outlined text-primary" data-icon="bolt">bolt</span>
<span class="text-xs font-bold">High</span>
</button>
<button class="flex flex-col items-center p-4 rounded-2xl bg-surface-container gap-2">
<span class="material-symbols-outlined text-primary" data-icon="visibility_off">visibility_off</span>
<span class="text-xs font-bold">Privacy</span>
</button>
</div>
</div>
</div>
</main>
<!-- Fixed Footer Container -->
<div class="fixed bottom-0 left-0 w-full px-6 pt-6 pb-10 bg-[#fef8f6]/95 backdrop-blur-md z-50">
<div class="max-w-screen-md mx-auto space-y-4">
<button class="w-full py-5 bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-xl font-bold tracking-widest text-sm uppercase shadow-xl transition-all active:scale-[0.98]">
                Continue
            </button>
<button class="w-full text-center text-xs font-bold text-on-surface-variant/60 uppercase tracking-[0.2em] hover:text-primary transition-colors">
                Skip this step
            </button>
</div>
</div>
<!-- Background Decoration for Editorial Feel -->
<div class="fixed top-0 right-0 -z-10 w-[50%] h-[30%] bg-gradient-to-bl from-tertiary-fixed/10 to-transparent blur-3xl pointer-events-none"></div>
<div class="fixed bottom-0 left-0 -z-10 w-[40%] h-[20%] bg-gradient-to-tr from-secondary-fixed/20 to-transparent blur-3xl pointer-events-none"></div>
</body></html>
