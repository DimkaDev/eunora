<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Journal Your Influences</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#fef8f6",
                        "primary-fixed": "#f2dfd0",
                        "primary-container": "#817266",
                        "on-surface-variant": "#4d453f",
                        "surface-container-high": "#ede7e5",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#341009",
                        "on-secondary-container": "#6c6074",
                        "inverse-surface": "#32302f",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#edddf5",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#ded9d7",
                        "secondary-fixed-dim": "#d0c1d8",
                        "surface-container-low": "#f8f2f0",
                        "on-primary-fixed": "#231a11",
                        "on-primary-container": "#fffbff",
                        "surface": "#fef8f6",
                        "secondary": "#655a6e",
                        "tertiary-fixed": "#ffdad3",
                        "surface-container-highest": "#e7e1df",
                        "on-background": "#1d1b1a",
                        "on-surface": "#1d1b1a",
                        "surface-variant": "#e7e1df",
                        "primary": "#67594e",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f5f0ed",
                        "surface-container": "#f2edea",
                        "inverse-primary": "#d6c3b5",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-tertiary-container": "#fffbff",
                        "on-primary": "#ffffff",
                        "background": "#fef8f6",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "tertiary": "#814f45",
                        "secondary-container": "#edddf5",
                        "on-secondary-fixed": "#211828",
                        "outline-variant": "#d0c4bc",
                        "on-primary-fixed-variant": "#51443a",
                        "surface-tint": "#6a5c50",
                        "outline": "#7f756e",
                        "error": "#ba1a1a",
                        "tertiary-container": "#9d675c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Manrope', sans-serif; background-color: #F7F5F0; }
        h1, h2, h3 { font-family: 'Noto Serif', serif; }
        .glass-header {
            background: rgba(247, 245, 240, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface min-h-screen pb-32">
<header class="sticky top-0 w-full z-50 glass-header border-b border-outline-variant/10">
<div class="flex justify-between items-center px-5 h-16 w-full">
<button class="text-[#67594e] hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-lg tracking-tight text-[#67594e] font-bold">Step 3 of 3</h1>
<button class="text-[#67594e] hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<div class="w-full h-1 bg-surface-container-highest overflow-hidden">
<div class="h-full w-full bg-[#9B8B7E]"></div>
</div>
</header>
<main class="px-5 pt-6 max-w-md mx-auto">
<div class="mb-6">
<h2 class="text-2xl font-headline text-on-surface">Journal Your Influences</h2>
<p class="text-on-surface-variant text-sm font-body">Quick-log your daily habits.</p>
</div>
<div class="grid grid-cols-2 gap-4 mb-8">
<div class="bg-surface-container-lowest p-4 rounded-2xl shadow-sm border border-outline-variant/10 flex flex-col items-center justify-between min-h-[140px]">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-xl" data-icon="coffee">coffee</span>
<span class="font-body font-bold text-sm text-on-surface">Caffeine</span>
</div>
<div class="flex items-center gap-3">
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-container-high text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined text-lg" data-icon="remove">remove</span>
</button>
<div class="text-center">
<span class="block text-2xl font-headline text-on-surface leading-none">2</span>
<span class="text-[9px] uppercase tracking-wider text-on-surface-variant font-bold">Cups</span>
</div>
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-container-high text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined text-lg" data-icon="add">add</span>
</button>
</div>
</div>
<div class="bg-surface-container-lowest p-4 rounded-2xl shadow-sm border border-outline-variant/10 flex flex-col items-center justify-between min-h-[140px]">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-xl" data-icon="wine_bar">wine_bar</span>
<span class="font-body font-bold text-sm text-on-surface">Alcohol</span>
</div>
<div class="flex items-center gap-3">
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-container-high text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined text-lg" data-icon="remove">remove</span>
</button>
<div class="text-center">
<span class="block text-2xl font-headline text-on-surface leading-none">0</span>
<span class="text-[9px] uppercase tracking-wider text-on-surface-variant font-bold">Glasses</span>
</div>
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-container-high text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined text-lg" data-icon="add">add</span>
</button>
</div>
</div>
<div class="bg-surface-container-lowest p-4 rounded-2xl shadow-sm border border-outline-variant/10 flex flex-col items-center min-h-[140px]">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-xl" data-icon="psychology">psychology</span>
<span class="font-body font-bold text-sm text-on-surface">Stress</span>
</div>
<div class="flex gap-1.5 w-full">
<button class="flex-1 py-2 rounded-lg bg-surface-container-high/50 flex flex-col items-center justify-center">
<span class="text-base">😊</span>
<span class="text-[8px] font-bold text-on-surface-variant uppercase mt-1">Calm</span>
</button>
<button class="flex-1 py-2 rounded-lg bg-[#f2dfd0] ring-1 ring-[#9B8B7E]/30 flex flex-col items-center justify-center">
<span class="text-base">😐</span>
<span class="text-[8px] font-bold text-primary uppercase mt-1">Med</span>
</button>
<button class="flex-1 py-2 rounded-lg bg-surface-container-high/50 flex flex-col items-center justify-center">
<span class="text-base">😟</span>
<span class="text-[8px] font-bold text-on-surface-variant uppercase mt-1">High</span>
</button>
</div>
</div>
<div class="bg-surface-container-lowest p-4 rounded-2xl shadow-sm border border-outline-variant/10 flex flex-col items-center justify-between min-h-[140px]">
<div class="flex flex-col items-center gap-1 mb-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-xl" data-icon="restaurant">restaurant</span>
<span class="font-body font-bold text-sm text-on-surface">Food Triggers</span>
</div>
<span class="text-[10px] text-on-surface-variant text-center">Sugar/Fried/Spicy</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#9B8B7E]"></div>
</label>
</div>
</div>
<section class="space-y-3">
<div class="flex items-center justify-between px-1">
<h3 class="font-body font-bold text-base text-on-surface">Evening Thoughts</h3>
<span class="text-[11px] text-[#9B8B7E] font-semibold uppercase tracking-wider">Optional</span>
</div>
<div class="bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant/10 p-4">
<textarea class="w-full bg-transparent border-none focus:ring-0 font-body italic text-on-surface placeholder:text-outline/40 min-h-[110px] resize-none text-sm" placeholder="How do you feel emotionally today?"></textarea>
</div>
</section>
</main>
<div class="fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-[#F7F5F0] via-[#F7F5F0] to-transparent pointer-events-none">
<div class="max-w-md mx-auto pointer-events-auto">
<button class="w-full h-14 bg-[#9B8B7E] text-white rounded-full text-base font-bold shadow-lg shadow-[#9B8B7E]/20 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
            Save Daily Log
            <span class="material-symbols-outlined text-lg" data-icon="done_all">done_all</span>
</button>
</div>
</div>

</body></html>
