<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Health Setup - Contraception</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "primary": "#67594e",
                        "surface-dim": "#ded9d7",
                        "primary-container": "#817266",
                        "secondary-container": "#edddf5",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#f2dfd0",
                        "on-primary-fixed": "#231a11",
                        "on-primary-container": "#fffbff",
                        "secondary-fixed": "#edddf5",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "secondary": "#655a6e",
                        "tertiary": "#814f45",
                        "surface": "#fef8f6",
                        "on-tertiary-fixed": "#341009",
                        "tertiary-fixed": "#ffdad3",
                        "on-secondary-fixed-variant": "#4d4355",
                        "tertiary-container": "#9d675c",
                        "surface-variant": "#e7e1df",
                        "surface-container": "#f2edea",
                        "surface-bright": "#fef8f6",
                        "inverse-on-surface": "#f5f0ed",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#fffbff",
                        "secondary-fixed-dim": "#d0c1d8",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#6a5c50",
                        "on-surface-variant": "#4d453f",
                        "on-background": "#1d1b1a",
                        "background": "#fef8f6",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#51443a",
                        "inverse-surface": "#32302f",
                        "outline": "#7f756e",
                        "on-secondary-container": "#6c6074",
                        "on-secondary-fixed": "#211828",
                        "on-surface": "#1d1b1a",
                        "surface-container-low": "#f8f2f0",
                        "error": "#ba1a1a",
                        "outline-variant": "#d0c4bc",
                        "surface-container-highest": "#e7e1df",
                        "inverse-primary": "#d6c3b5",
                        "surface-container-high": "#ede7e5",
                        "primary-fixed-dim": "#d6c3b5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Manrope', sans-serif;
            min-height: max(884px, 100dvh);
        }
        h1, h2, h3, h4, h5, h6, .font-headline {
            font-family: 'Noto Serif', serif;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1.25rem);
        }
        .choice-card.selected {
            @apply border-primary bg-primary/5 ring-1 ring-primary;
        }
        .chip-selected {
            @apply bg-primary text-on-primary border-primary;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<header class="sticky top-0 z-50 bg-surface/70 backdrop-blur-md px-5 py-4 flex items-center justify-between">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex flex-col items-center text-center">
<h1 class="font-headline text-lg font-bold text-on-surface leading-tight tracking-[-0.015em]">Health Setup</h1>
<span class="font-body text-xs text-on-surface-variant mt-0.5">Step 4 of 7</span>
</div>
<div class="w-10"></div>
</header>
<div class="w-full bg-surface-container-low h-1">
<div class="bg-gradient-to-r from-primary to-primary-container h-full rounded-r-full" style="width: 57%;"></div>
</div>
<main class="flex-1 flex flex-col px-5 py-8 pb-36 max-w-2xl mx-auto w-full">
<header class="mb-8 px-2">
<h2 class="font-headline text-3xl font-bold text-on-surface mb-2">Contraception</h2>
<p class="font-body text-base text-on-surface-variant">(Optional - but helpful for understanding your health)</p>
</header>
<div class="flex flex-col gap-6">
<div class="flex flex-col gap-4">
<h3 class="font-body text-lg font-medium text-on-surface px-2">Are you currently using any form of contraception?</h3>
<div class="grid grid-cols-2 gap-4">
<button class="choice-card selected flex flex-col items-center justify-center gap-3 p-6 rounded-2xl border-2 border-surface-variant bg-surface-container-lowest transition-all">
<div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-2xl">check</span>
</div>
<span class="font-body font-bold text-lg text-on-surface">Yes</span>
</button>
<button class="choice-card flex flex-col items-center justify-center gap-3 p-6 rounded-2xl border-2 border-surface-variant bg-surface-container-lowest transition-all hover:border-primary/30">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-2xl">close</span>
</div>
<span class="font-body font-bold text-lg text-on-surface">No</span>
</button>
</div>
</div>
<div class="flex flex-col gap-8 mt-4 animate-in fade-in duration-500">
<div class="flex flex-col gap-4">
<div class="flex items-center gap-2 px-2">
<span class="flex items-center justify-center w-6 h-6 rounded-full bg-secondary-container text-[10px] font-bold text-on-secondary-container">1</span>
<label class="font-body text-sm font-bold text-on-surface uppercase tracking-wider">What type?</label>
</div>
<div class="flex flex-wrap gap-2 px-2">
<button class="px-4 py-2.5 rounded-full border border-outline-variant bg-surface-container-lowest font-body text-sm text-on-surface-variant transition-all hover:bg-surface-container-low">Combination pill</button>
<button class="chip-selected px-4 py-2.5 rounded-full border font-body text-sm transition-all shadow-sm">Progestin-only pill</button>
<button class="px-4 py-2.5 rounded-full border border-outline-variant bg-surface-container-lowest font-body text-sm text-on-surface-variant transition-all hover:bg-surface-container-low">Copper IUD</button>
<button class="px-4 py-2.5 rounded-full border border-outline-variant bg-surface-container-lowest font-body text-sm text-on-surface-variant transition-all hover:bg-surface-container-low">Hormonal IUD</button>
<button class="px-4 py-2.5 rounded-full border border-outline-variant bg-surface-container-lowest font-body text-sm text-on-surface-variant transition-all hover:bg-surface-container-low">Subdermal implant</button>
<button class="px-4 py-2.5 rounded-full border border-outline-variant bg-surface-container-lowest font-body text-sm text-on-surface-variant transition-all hover:bg-surface-container-low">Injection</button>
<button class="px-4 py-2.5 rounded-full border border-outline-variant bg-surface-container-lowest font-body text-sm text-on-surface-variant transition-all hover:bg-surface-container-low">Barrier method</button>
<button class="px-4 py-2.5 rounded-full border border-outline-variant bg-surface-container-lowest font-body text-sm text-on-surface-variant transition-all hover:bg-surface-container-low">Other</button>
</div>
</div>
<div class="flex flex-col gap-4">
<div class="flex items-center gap-2 px-2">
<span class="flex items-center justify-center w-6 h-6 rounded-full bg-secondary-container text-[10px] font-bold text-on-secondary-container">2</span>
<label class="font-body text-sm font-bold text-on-surface uppercase tracking-wider">Brand name <span class="font-normal lowercase opacity-60">(optional)</span></label>
</div>
<div class="px-2">
<input class="w-full bg-surface-container-lowest border-none ring-1 ring-outline-variant/30 text-on-surface placeholder:text-on-surface-variant/40 text-lg rounded-2xl py-4 px-5 focus:ring-2 focus:ring-primary shadow-sm font-body transition-all" id="brand-name" placeholder="e.g., Yasmin, Mirena" type="text" value="Cerazette"/>
</div>
</div>
<div class="flex flex-col gap-4">
<div class="flex items-center gap-2 px-2">
<span class="flex items-center justify-center w-6 h-6 rounded-full bg-secondary-container text-[10px] font-bold text-on-secondary-container">3</span>
<label class="font-body text-sm font-bold text-on-surface uppercase tracking-wider">Dose <span class="font-normal lowercase opacity-60">(optional)</span></label>
</div>
<div class="px-2">
<input class="w-full bg-surface-container-lowest border-none ring-1 ring-outline-variant/30 text-on-surface placeholder:text-on-surface-variant/40 text-lg rounded-2xl py-4 px-5 focus:ring-2 focus:ring-primary shadow-sm font-body transition-all" id="dose" placeholder="e.g., 30 mcg ethinyl estradiol" type="text"/>
</div>
</div>
</div>
</div>
<div class="mt-12 px-4">
<p class="font-headline italic text-on-surface-variant text-center text-sm opacity-70 leading-relaxed">
            Understanding your hormonal balance helps us curate a better experience for your unique journey.
        </p>
</div>
</main>
<div class="fixed bottom-0 left-0 right-0 p-5 bg-surface/90 backdrop-blur-xl border-t border-surface-variant/30 pb-safe">
<div class="max-w-2xl mx-auto flex gap-4">
<button class="font-body text-sm font-bold text-primary px-6 py-4 rounded-2xl hover:bg-surface-container-low transition-colors">
            Skip
        </button>
<button class="flex-1 bg-primary text-on-primary font-body text-base font-bold py-4 px-8 rounded-2xl shadow-lg shadow-primary/20 hover:shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            Continue
            <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</div>

</body></html>
