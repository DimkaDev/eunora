<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log Your Triggers | MenoSync Guided</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#67594e",
                        "surface": "#F7F5F0",
                        "taupe": "#9B8B7E",
                        "lavender": "#9D8BC9",
                        "rose": "#D59898",
                        "lavender-soft": "#E6E1F0",
                        "charcoal": "#333333",
                        "outline-soft": "#D0C4BC",
                        "on-surface": "#1d1b1a"
                    },
                    fontFamily: {
                        "serif": ["Noto Serif", "serif"],
                        "sans": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-surface text-on-surface font-sans overflow-hidden h-screen w-screen;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 99px;
            @apply bg-outline-soft;
        }
        .progress-dot.active {
            @apply bg-taupe w-6;
        }
    </style>
<style>
        body {
            min-height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col">
<header class="pt-8 px-6 pb-4 bg-surface shrink-0">
<div class="flex justify-between items-center mb-6">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-sm text-primary">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex gap-2">
<div class="progress-dot"></div>
<div class="progress-dot"></div>
<div class="progress-dot active"></div>
</div>
<div class="w-10"></div>
</div>
<div class="w-full bg-outline-soft/30 h-1 rounded-full overflow-hidden">
<div class="bg-taupe h-full w-3/5 rounded-full transition-all duration-500"></div>
</div>
<p class="text-[10px] uppercase tracking-[0.2em] font-bold text-taupe mt-3 text-center">Step 3 of 5: Triggers</p>
</header>
<main class="flex-1 overflow-y-auto px-6 pt-4 pb-56">
<div class="flex flex-col max-w-md mx-auto" id="step-triggers">
<div class="text-center mb-8">
<h2 class="serif text-2xl font-semibold text-charcoal mb-4 leading-relaxed">What might have triggered your symptoms?</h2>
<p class="text-primary/60 text-sm">Select all that apply to today's entry</p>
</div>
<div class="flex flex-col gap-3 w-full">
<button class="flex items-start gap-4 p-5 rounded-3xl bg-white border-2 border-transparent shadow-sm hover:border-taupe/20 transition-all text-left group">
<div class="w-12 h-12 flex items-center justify-center rounded-2xl bg-taupe text-white transition-colors shrink-0 shadow-sm">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'wght' 300;">coffee</span>
</div>
<div>
<h3 class="text-sm font-bold text-primary mb-1">Caffeine</h3>
<p class="text-xs text-primary/60 leading-relaxed">Coffee, tea, energy drinks, or soda consumed throughout the day.</p>
</div>
</button>
<button class="flex items-start gap-4 p-5 rounded-3xl bg-white border-2 border-transparent shadow-sm hover:border-taupe/20 transition-all text-left group">
<div class="w-12 h-12 flex items-center justify-center rounded-2xl bg-lavender text-white transition-colors shrink-0 shadow-sm">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'wght' 300;">wine_bar</span>
</div>
<div>
<h3 class="text-sm font-bold text-primary mb-1">Alcohol</h3>
<p class="text-xs text-primary/60 leading-relaxed">Wine, beer, or cocktails, especially late in the evening.</p>
</div>
</button>
<button class="flex items-start gap-4 p-5 rounded-3xl bg-lavender-soft/50 border-2 border-taupe shadow-md transition-all text-left relative overflow-hidden group">
<div class="absolute top-3 right-4 bg-taupe text-white rounded-full p-0.5">
<span class="material-symbols-outlined text-[14px] block font-bold">check</span>
</div>
<div class="w-12 h-12 flex items-center justify-center rounded-2xl bg-rose text-white shrink-0 shadow-sm">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
<div>
<h3 class="text-sm font-bold text-primary mb-1">Stress</h3>
<p class="text-xs text-primary/70 leading-relaxed">High mental or emotional pressure from work, home, or personal life.</p>
</div>
</button>
<button class="flex items-start gap-4 p-5 rounded-3xl bg-white border-2 border-transparent shadow-sm hover:border-taupe/20 transition-all text-left group">
<div class="w-12 h-12 flex items-center justify-center rounded-2xl bg-taupe text-white transition-colors shrink-0 shadow-sm">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'wght' 300;">fitness_center</span>
</div>
<div>
<h3 class="text-sm font-bold text-primary mb-1">Exercise</h3>
<p class="text-xs text-primary/60 leading-relaxed">Physical exertion, intense workouts, or new activity levels.</p>
</div>
</button>
<button class="flex items-start gap-4 p-5 rounded-3xl bg-white border-2 border-transparent shadow-sm hover:border-taupe/20 transition-all text-left group">
<div class="w-12 h-12 flex items-center justify-center rounded-2xl bg-lavender text-white transition-colors shrink-0 shadow-sm">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'wght' 300;">thermostat</span>
</div>
<div>
<h3 class="text-sm font-bold text-primary mb-1">Weather</h3>
<p class="text-xs text-primary/60 leading-relaxed">Extreme heat, high humidity, or sudden temperature shifts.</p>
</div>
</button>
<button class="flex items-start gap-4 p-5 rounded-3xl bg-white border-2 border-transparent shadow-sm hover:border-taupe/20 transition-all text-left group">
<div class="w-12 h-12 flex items-center justify-center rounded-2xl bg-rose text-white transition-colors shrink-0 shadow-sm">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'wght' 300;">restaurant</span>
</div>
<div>
<h3 class="text-sm font-bold text-primary mb-1">Foods</h3>
<p class="text-xs text-primary/60 leading-relaxed">Spicy foods, sugary snacks, or heavy meals before bed.</p>
</div>
</button>
</div>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full p-6 pt-2 bg-surface/95 backdrop-blur-md z-40 border-t border-taupe/5">
<div class="max-w-lg mx-auto flex flex-col gap-4">
<button class="w-full py-4 bg-taupe/10 hover:bg-taupe/15 text-taupe font-bold rounded-2xl active:scale-[0.98] duration-200 transition-all flex items-center justify-center gap-2 text-xs uppercase tracking-[0.15em]">
<span class="material-symbols-outlined text-lg">add</span>
                Add Custom Symptom
            </button>
<div class="flex gap-4">
<button class="flex-1 py-5 bg-white border border-outline-soft text-primary font-bold rounded-[2rem] active:scale-95 duration-200 transition-all text-sm uppercase tracking-widest">
                    Back
                </button>
<button class="flex-[2] py-5 bg-taupe text-white font-bold rounded-[2rem] shadow-lg shadow-taupe/20 active:scale-95 duration-200 transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-[0.2em]">
                    Continue <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
<div class="mt-2 flex justify-center gap-1.5 opacity-30">
<div class="h-1 w-4 bg-taupe rounded-full"></div>
<div class="h-1 w-1 bg-taupe rounded-full"></div>
<div class="h-1 w-1 bg-taupe rounded-full"></div>
<div class="h-1 w-1 bg-taupe rounded-full"></div>
<div class="h-1 w-1 bg-taupe rounded-full"></div>
</div>
</div>
</footer>
</body></html>
