<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Surgical Menopause Profile - Error State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e7e1df",
                        "outline": "#7f756e",
                        "on-surface-variant": "#4d453f",
                        "on-primary-container": "#fffbff",
                        "on-primary-fixed": "#231a11",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#ffdad3",
                        "surface-container-low": "#f8f2f0",
                        "on-surface": "#1d1b1a",
                        "primary": "#67594e",
                        "surface-container-high": "#ede7e5",
                        "surface-bright": "#fef8f6",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#6c6074",
                        "on-tertiary-container": "#fffbff",
                        "error": "#ba1a1a",
                        "tertiary": "#814f45",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-secondary-fixed": "#211828",
                        "on-tertiary-fixed": "#341009",
                        "surface-tint": "#6a5c50",
                        "primary-fixed-dim": "#d6c3b5",
                        "secondary-fixed": "#edddf5",
                        "on-background": "#1d1b1a",
                        "surface": "#fef8f6",
                        "secondary-container": "#edddf5",
                        "on-primary-fixed-variant": "#51443a",
                        "surface-variant": "#e7e1df",
                        "inverse-on-surface": "#f5f0ed",
                        "inverse-primary": "#d6c3b5",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "inverse-surface": "#32302f",
                        "secondary": "#655a6e",
                        "background": "#fef8f6",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-dim": "#ded9d7",
                        "surface-container": "#f2edea",
                        "secondary-fixed-dim": "#d0c1d8",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#817266",
                        "outline-variant": "#d0c4bc",
                        "primary-fixed": "#f2dfd0",
                        "tertiary-container": "#9d675c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": ["Noto Serif", "serif"],
                        "display": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    },
                    "fontSize": {}
                },
            },
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-serif { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-6 py-4 bg-[#fef8f6]/70 dark:bg-stone-950/70 backdrop-blur-md docked full-width top-0 z-50">
<button class="text-[#67594e] dark:text-[#9B8B7E] hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-2xl" data-icon="close">close</span>
</button>
<h1 class="font-serif italic text-xl text-[#67594e] dark:text-[#9B8B7E]">The Serene Curator</h1>
<div class="w-6 h-6"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-5 md:px-8 py-6 mb-24 max-w-2xl mx-auto w-full">
<!-- Header Section -->
<div class="mb-10 text-center">
<h2 class="font-headline text-3xl md:text-4xl text-on-surface mb-3">Your Journey</h2>
<p class="font-body text-on-surface-variant text-sm md:text-base px-4">
                Let's gather a few details to personalize your care experience.
            </p>
</div>
<!-- Form Section -->
<div class="space-y-8">
<!-- Procedure Date (Error State) -->
<div class="flex flex-col">
<label class="font-label text-sm text-on-surface-variant mb-2 pl-4">Date of Procedure <span class="text-error">*</span></label>
<div class="relative">
<input class="w-full bg-surface-container-highest text-on-surface rounded-full px-6 py-4 font-body text-base placeholder:text-outline-variant focus:outline-none ring-1 ring-error/50 transition-all border-none" placeholder="MM/DD/YYYY" type="text" value=""/>
<span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-error" data-icon="calendar_today">calendar_today</span>
</div>
<div class="flex items-center gap-1 mt-2 pl-4 text-error">
<span class="material-symbols-outlined text-[16px]" data-icon="error">error</span>
<span class="font-label text-xs">This field is required.</span>
</div>
</div>
<!-- Procedure Type (Valid/Default State) -->
<div class="flex flex-col">
<label class="font-label text-sm text-on-surface-variant mb-3 pl-4">Procedure Type</label>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
<button class="bg-surface-container-high hover:bg-surface-container-highest text-on-surface rounded-full px-5 py-3 font-body text-sm text-left transition-colors flex justify-between items-center">
                        Oophorectomy
                    </button>
<button class="bg-surface-container-high hover:bg-surface-container-highest text-on-surface rounded-full px-5 py-3 font-body text-sm text-left transition-colors flex justify-between items-center">
                        Hysterectomy
                    </button>
<button class="bg-surface-container-high hover:bg-surface-container-highest text-on-surface rounded-full px-5 py-3 font-body text-sm text-left transition-colors flex justify-between items-center md:col-span-2">
                        Both (Total Hysterectomy with Bilateral Salpingo-Oophorectomy)
                    </button>
</div>
</div>
<!-- Prescribed HRT (Error State) -->
<div class="flex flex-col">
<label class="font-label text-sm text-on-surface-variant mb-3 pl-4">Were you prescribed HRT? <span class="text-error">*</span></label>
<div class="flex gap-4">
<button class="flex-1 bg-surface-container-high text-on-surface rounded-full px-5 py-3 font-body text-sm text-center ring-1 ring-error/50 transition-colors">
                        Yes
                    </button>
<button class="flex-1 bg-surface-container-high text-on-surface rounded-full px-5 py-3 font-body text-sm text-center ring-1 ring-error/50 transition-colors">
                        No
                    </button>
</div>
<div class="flex items-center gap-1 mt-2 pl-4 text-error">
<span class="material-symbols-outlined text-[16px]" data-icon="error">error</span>
<span class="font-label text-xs">Please select an option.</span>
</div>
</div>
<!-- Primary Concerns (Valid/Default State) -->
<div class="flex flex-col">
<label class="font-label text-sm text-on-surface-variant mb-3 pl-4">Current primary concerns</label>
<div class="flex flex-wrap gap-2">
<span class="bg-surface-container-high text-on-surface rounded-full px-4 py-2 font-body text-xs cursor-pointer hover:bg-surface-container-highest transition-colors">Hot Flashes</span>
<span class="bg-surface-container-high text-on-surface rounded-full px-4 py-2 font-body text-xs cursor-pointer hover:bg-surface-container-highest transition-colors">Sleep Disruption</span>
<span class="bg-surface-container-high text-on-surface rounded-full px-4 py-2 font-body text-xs cursor-pointer hover:bg-surface-container-highest transition-colors">Mood Changes</span>
<span class="bg-surface-container-high text-on-surface rounded-full px-4 py-2 font-body text-xs cursor-pointer hover:bg-surface-container-highest transition-colors">Brain Fog</span>
<span class="bg-surface-container-high text-on-surface rounded-full px-4 py-2 font-body text-xs cursor-pointer hover:bg-surface-container-highest transition-colors">Joint Pain</span>
</div>
</div>
</div>
<!-- Action Button -->
<div class="mt-12 flex justify-center">
<button class="w-full md:w-auto min-w-[200px] bg-gradient-to-br from-primary to-primary-container text-white rounded-xl px-8 py-4 font-body font-medium text-sm hover:opacity-90 transition-opacity shadow-[0_4px_24px_rgba(29,27,26,0.06)] flex justify-center items-center gap-2">
                Continue
                <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
</body></html>
