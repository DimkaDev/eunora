<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Your PCOS &amp; Hormone Condition Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;family=Manrope:wght@400;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        :root {
            --bg-cream: #F7F5F0;
            --charcoal: #3A3A3A;
            --gray-subtext: #666666;
            --taupe: #817266;
            --lavender: #E8E0F0;
            --green: #E8F0E8;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }.step-card {
            display: none;
        }
        .step-card.active {
            display: flex;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#817266",
                        "on-primary": "#ffffff",
                        "surface": "#F7F5F0",
                        "on-surface": "#3A3A3A",
                        "on-surface-variant": "#666666",
                        "outline-variant": "#D0C4BC",
                    },
                    fontFamily: {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">
<div class="relative flex h-screen w-full flex-col max-w-md mx-auto group/design-root" style="--checkbox-tick-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(253,253,253)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath d=%27M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z%27/%3e%3c/svg%3e');">
<header class="px-6 pt-8 pb-4 flex flex-col shrink-0">
<div class="flex items-center gap-3 mb-2">
<button aria-label="Go back" class="text-on-surface w-8 h-8 flex items-center justify-start rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="text-[10px] text-on-surface-variant font-semibold tracking-widest uppercase">Step 2e of 7</span>
</div>
<h1 class="font-headline text-[20px] text-on-surface font-bold leading-tight">Your PCOS &amp; Hormone Condition Profile</h1>
<p class="text-[12px] text-on-surface-variant mt-1">Different conditions need different tracking. Let's customize your experience.</p>
</header>
<main class="flex-1 px-6 flex flex-col relative overflow-hidden">
<section class="step-card active flex-col h-full">
<div class="bg-white rounded-[20px] p-6 shadow-sm flex-1 overflow-y-auto mb-6">
<h2 class="text-[13px] font-bold mb-5">Which condition are you managing?</h2>
<div class="flex flex-col gap-4">
<label class="flex items-start gap-3 cursor-pointer group">
<input class="mt-1 w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<div class="flex flex-col">
<span class="text-sm font-semibold">PCOS (Polycystic Ovary Syndrome)</span>
<span class="text-xs text-on-surface-variant">Irregular cycles, hormone imbalances</span>
</div>
</label>
<label class="flex items-start gap-3 cursor-pointer group">
<input class="mt-1 w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<div class="flex flex-col">
<span class="text-sm font-semibold">PMDD (Premenstrual Dysphoric Disorder)</span>
<span class="text-xs text-on-surface-variant">Severe mood changes before period</span>
</div>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<span class="text-sm font-semibold">Thyroid disorder</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<span class="text-sm font-semibold">Insulin resistance</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<span class="text-sm font-semibold">Hyperprolactinemia</span>
</label>
<div class="flex flex-col gap-2 mt-1">
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<span class="text-sm font-semibold">Other</span>
</label>
<input class="ml-8 w-full rounded-lg border border-outline-variant bg-surface px-4 py-2 text-sm focus:ring-1 focus:ring-primary" placeholder="Please specify" type="text"/>
</div>
</div>
</div>
</section>
<section class="step-card flex-col h-full">
<div class="bg-white rounded-[20px] p-6 shadow-sm flex-1 overflow-y-auto mb-6">
<h2 class="text-[13px] font-bold mb-5">How would you describe your cycles?</h2>
<div class="flex flex-col gap-3">
<label class="flex items-center gap-3 p-3 border border-outline-variant/30 rounded-xl">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<span class="text-sm">Irregular</span>
</label>
<label class="flex items-center gap-3 p-3 border border-outline-variant/30 rounded-xl">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<span class="text-sm">Very heavy</span>
</label>
<label class="flex items-center gap-3 p-3 border border-outline-variant/30 rounded-xl">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<span class="text-sm">Light/minimal</span>
</label>
<label class="flex items-center gap-3 p-3 border border-outline-variant/30 rounded-xl">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<span class="text-sm">Absent</span>
</label>
<label class="flex items-center gap-3 p-3 border border-outline-variant/30 rounded-xl">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<span class="text-sm">Constant light bleeding</span>
</label>
<label class="flex items-center gap-3 p-3 border border-outline-variant/30 rounded-xl">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<span class="text-sm">Multiple periods per month</span>
</label>
</div>
</div>
</section>
<div class="flex flex-col gap-4 pb-8 shrink-0">
<div class="flex gap-3">
<button class="flex-1 rounded-xl bg-white border border-outline-variant py-4 text-primary font-bold text-base shadow-sm active:scale-[0.98] transition-transform">
                        Previous
                    </button>
<button class="flex-[2] rounded-xl bg-primary py-4 text-on-primary font-bold text-base shadow-[0_4px_12px_rgba(129,114,102,0.25)] active:scale-[0.98] transition-transform">
                        Next
                    </button>
</div>
<div class="text-center">
<button class="text-on-surface-variant text-xs font-semibold hover:underline opacity-80">Skip this detailed setup</button>
</div>
</div>
</main>
</div>

</body></html>
