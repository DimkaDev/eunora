<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#FAFAF8",
                        "on-surface": "#32302f",
                        "primary": "#67594e",
                        "accent-pink": "#FDE2E4",
                        "accent-blue": "#E2EAFC",
                        "accent-green": "#E2F0CB",
                        "accent-purple": "#EDDDF5",
                        "accent-yellow": "#FFF1E6"
                    },
                    fontFamily: {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .pastel-gradient-pink { background: linear-gradient(135deg, #FDE2E4 0%, #FFB5B5 100%); }
            .pastel-gradient-blue { background: linear-gradient(135deg, #E2EAFC 0%, #B9D1FF 100%); }
            .pastel-gradient-green { background: linear-gradient(135deg, #E2F0CB 0%, #C5E1A5 100%); }
            .pastel-gradient-purple { background: linear-gradient(135deg, #EDDDF5 0%, #D8B4E2 100%); }
        }
        .symptom-chip {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .symptom-chip:active {
            transform: scale(0.95);
        }
        .symptom-chip.selected {
            transform: scale(1.05);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        body { font-family: 'Manrope', sans-serif; background-color: #FAFAF8; }
        .font-noto-serif { font-family: 'Noto Serif', serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface min-h-screen pb-32">
<header class="bg-white/80 backdrop-blur-md fixed top-0 w-full z-50 flex items-center justify-between px-6 py-4 border-b border-gray-100">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer p-2 rounded-full hover:bg-gray-50" data-icon="close">close</span>
<h1 class="font-noto-serif text-xl font-semibold text-primary">Discovery</h1>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary cursor-pointer p-2 rounded-full hover:bg-gray-50" data-icon="search">search</span>
</div>
</header>
<main class="pt-24 px-6 max-w-lg mx-auto">
<div class="mb-8">
<div class="flex justify-between items-end mb-2">
<span class="text-xs font-bold uppercase tracking-widest text-primary/60">Step 1 of 4</span>
<span class="text-xs font-bold text-primary">25% Complete</span>
</div>
<div class="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/4 rounded-full"></div>
</div>
</div>
<section class="space-y-6">
<div class="text-center space-y-2 mb-8">
<h2 class="font-noto-serif text-2xl font-bold text-primary">Vasomotor Symptoms</h2>
<p class="text-on-surface/70 text-sm">Have you experienced any of these internal temperature changes lately?</p>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="symptom-chip selected flex flex-col items-center justify-center p-6 rounded-3xl bg-accent-pink text-center h-40 border-2 border-white relative overflow-hidden group">
<div class="absolute top-3 right-3 w-6 h-6 bg-white rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-pink-500 text-sm font-bold">check</span>
</div>
<span class="material-symbols-outlined text-4xl mb-3 text-pink-500/80" data-icon="device_thermostat">device_thermostat</span>
<span class="font-bold text-primary leading-tight">Hot flashes</span>
</button>
<button class="symptom-chip flex flex-col items-center justify-center p-6 rounded-3xl bg-accent-blue text-center h-40 border-2 border-transparent hover:border-white transition-all group">
<span class="material-symbols-outlined text-4xl mb-3 text-blue-400/80" data-icon="bedtime">bedtime</span>
<span class="font-bold text-primary leading-tight">Night sweats</span>
</button>
<button class="symptom-chip flex flex-col items-center justify-center p-6 rounded-3xl bg-accent-green text-center h-40 border-2 border-transparent hover:border-white transition-all group">
<span class="material-symbols-outlined text-4xl mb-3 text-green-500/60" data-icon="ac_unit">ac_unit</span>
<span class="font-bold text-primary leading-tight">Cold flashes</span>
</button>
<button class="symptom-chip flex flex-col items-center justify-center p-6 rounded-3xl bg-white border-2 border-dashed border-primary/20 text-center h-40 group">
<div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center mb-3 group-hover:bg-primary/10">
<span class="material-symbols-outlined text-primary/40 group-hover:text-primary transition-colors" data-icon="add">add</span>
</div>
<span class="font-bold text-primary/40 leading-tight group-hover:text-primary transition-colors">Add Other</span>
</button>
</div>
<div class="pt-10">
<button class="w-full py-4 rounded-2xl bg-primary text-white font-bold text-lg shadow-lg shadow-primary/20 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
                    Next: Emotional Well-being
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full mt-4 py-2 text-primary/60 font-semibold text-sm hover:text-primary transition-colors">
                    Skip for now
                </button>
</div>
</section>
</main>
<nav class="fixed bottom-0 w-full z-50 rounded-t-[32px] bg-white/90 backdrop-blur-xl shadow-[0_-10px_40px_rgba(0,0,0,0.04)] flex justify-around items-center px-4 pb-8 pt-4">
<a class="flex flex-col items-center justify-center text-primary/40 px-5 py-2" href="#">
<span class="material-symbols-outlined mb-1" data-icon="auto_stories">auto_stories</span>
<span class="font-manrope text-[10px] uppercase tracking-widest font-bold">Journal</span>
</a>
<a class="flex flex-col items-center justify-center text-primary px-5 py-2 relative" href="#">
<div class="absolute -top-1 w-1 h-1 bg-primary rounded-full"></div>
<span class="material-symbols-outlined mb-1" data-icon="local_library" style="font-variation-settings: 'FILL' 1;">local_library</span>
<span class="font-manrope text-[10px] uppercase tracking-widest font-bold">Library</span>
</a>
<a class="flex flex-col items-center justify-center text-primary/40 px-5 py-2" href="#">
<span class="material-symbols-outlined mb-1" data-icon="insights">insights</span>
<span class="font-manrope text-[10px] uppercase tracking-widest font-bold">Insights</span>
</a>
<a class="flex flex-col items-center justify-center text-primary/40 px-5 py-2" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-manrope text-[10px] uppercase tracking-widest font-bold">Profile</span>
</a>
</nav>

</body></html>
