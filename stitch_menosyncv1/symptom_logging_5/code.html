<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Quick Log Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed-variant": "#683a31",
              "on-primary-fixed-variant": "#51443a",
              "on-error-container": "#93000a",
              "surface-container-low": "#f8f2f0",
              "background": "#fef8f6",
              "surface-tint": "#6a5c50",
              "outline-variant": "#d0c4bc",
              "on-surface": "#1d1b1a",
              "tertiary-fixed": "#ffdad3",
              "secondary-container": "#edddf5",
              "on-secondary-container": "#6c6074",
              "on-error": "#ffffff",
              "surface-container-highest": "#e7e1df",
              "inverse-on-surface": "#f5f0ed",
              "surface-container-high": "#ede7e5",
              "primary-container": "#817266",
              "secondary": "#655a6e",
              "primary-fixed": "#f2dfd0",
              "on-secondary-fixed-variant": "#4d4355",
              "secondary-fixed-dim": "#d0c1d8",
              "primary": "#67594e",
              "on-primary-container": "#fffbff",
              "on-tertiary": "#ffffff",
              "surface-dim": "#ded9d7",
              "error-container": "#ffdad6",
              "on-tertiary-container": "#fffbff",
              "tertiary": "#814f45",
              "inverse-surface": "#32302f",
              "on-secondary-fixed": "#211828",
              "on-background": "#1d1b1a",
              "on-primary-fixed": "#231a11",
              "secondary-fixed": "#edddf5",
              "on-surface-variant": "#4d453f",
              "surface-variant": "#e7e1df",
              "inverse-primary": "#d6c3b5",
              "surface-container-lowest": "#ffffff",
              "on-tertiary-fixed": "#341009",
              "surface-container": "#f2edea",
              "tertiary-container": "#9d675c",
              "outline": "#7f756e",
              "on-secondary": "#ffffff",
              "tertiary-fixed-dim": "#f9b7a9",
              "surface-bright": "#fef8f6",
              "primary-fixed-dim": "#d6c3b5",
              "error": "#ba1a1a",
              "on-primary": "#ffffff",
              "surface": "#fef8f6"
            },
            fontFamily: {
              "headline": ["Noto Serif"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .custom-scrollbar::-webkit-scrollbar {
        height: 0px;
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #d0c4bc;
        border-radius: 10px;
      }
      .gradient-track {
        background: linear-gradient(90deg, #ffdad3 0%, #9B8B7E 100%);
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface h-screen flex flex-col overflow-hidden">
<nav class="w-full bg-[#fef8f6] flex items-center justify-between px-5 py-3 shrink-0">
<div class="flex items-center gap-3">
<button class="text-[#9B8B7E]">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col">
<h1 class="font-headline text-lg font-bold text-on-surface leading-tight">Log Your Symptoms</h1>
<span class="text-[10px] font-medium text-outline uppercase tracking-wider">Today, 10:45 AM</span>
</div>
</div>
<button class="text-[#9B8B7E]">
<span class="material-symbols-outlined">info</span>
</button>
</nav>
<div class="px-5 py-2 bg-[#fef8f6] border-b border-surface-container shrink-0">
<div class="flex items-center justify-between mb-2">
<span class="text-[11px] font-bold text-outline uppercase">Quick Select</span>
<button class="text-primary text-[10px] font-bold">+ Add</button>
</div>
<div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
<label class="flex flex-col items-center shrink-0">
<input checked="" class="hidden peer" type="checkbox"/>
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-fixed transition-all">
<span class="material-symbols-outlined text-primary">thermometer</span>
</div>
<span class="text-[9px] mt-1 font-semibold text-outline peer-checked:text-primary">Hot Flash</span>
</label>
<label class="flex flex-col items-center shrink-0">
<input class="hidden peer" type="checkbox"/>
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-fixed transition-all">
<span class="material-symbols-outlined text-primary/60">sentiment_satisfied</span>
</div>
<span class="text-[9px] mt-1 font-semibold text-outline peer-checked:text-primary">Mood</span>
</label>
<label class="flex flex-col items-center shrink-0">
<input class="hidden peer" type="checkbox"/>
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-fixed transition-all">
<span class="material-symbols-outlined text-primary/60">bedtime</span>
</div>
<span class="text-[9px] mt-1 font-semibold text-outline peer-checked:text-primary">Sleep</span>
</label>
<label class="flex flex-col items-center shrink-0">
<input class="hidden peer" type="checkbox"/>
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-fixed transition-all">
<span class="material-symbols-outlined text-primary/60">water_drop</span>
</div>
<span class="text-[9px] mt-1 font-semibold text-outline peer-checked:text-primary">Dryness</span>
</label>
<label class="flex flex-col items-center shrink-0">
<input class="hidden peer" type="checkbox"/>
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-fixed transition-all">
<span class="material-symbols-outlined text-primary/60">fitness_center</span>
</div>
<span class="text-[9px] mt-1 font-semibold text-outline peer-checked:text-primary">Joints</span>
</label>
<label class="flex flex-col items-center shrink-0">
<input class="hidden peer" type="checkbox"/>
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-fixed transition-all">
<span class="material-symbols-outlined text-primary/60">psychology</span>
</div>
<span class="text-[9px] mt-1 font-semibold text-outline peer-checked:text-primary">Brain Fog</span>
</label>
<label class="flex flex-col items-center shrink-0">
<input class="hidden peer" type="checkbox"/>
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-fixed transition-all">
<span class="material-symbols-outlined text-primary/60">calendar_month</span>
</div>
<span class="text-[9px] mt-1 font-semibold text-outline peer-checked:text-primary">Period</span>
</label>
</div>
</div>
<main class="flex-1 overflow-y-auto px-4 py-4 space-y-4">
<div class="grid grid-cols-12 gap-3">
<section class="col-span-12 bg-surface-container-lowest rounded-xl p-4 shadow-sm border-l-4 border-tertiary-fixed">
<div class="flex justify-between items-center mb-3">
<div class="flex flex-col">
<h2 class="text-on-surface font-bold text-xs">Hot Flashes/Night Sweats</h2>
<p class="text-outline text-[10px]">Intensity level</p>
</div>
<div class="bg-surface-container-high w-8 h-8 flex items-center justify-center rounded-full">
<span class="text-primary font-bold text-sm">7</span>
</div>
</div>
<div class="px-1">
<div class="relative h-4 flex items-center">
<div class="absolute w-full h-1.5 bg-surface-container rounded-full overflow-hidden">
<div class="h-full gradient-track" style="width: 70%;"></div>
</div>
<div class="absolute left-[70%] -translate-x-1/2 w-4 h-4 bg-primary border-2 border-white rounded-full shadow-md"></div>
</div>
<div class="flex justify-between mt-1 text-[9px] font-bold text-outline uppercase tracking-tight">
<span class="material-symbols-outlined text-xs">sentiment_neutral</span>
<span class="mx-auto">Moderate</span>
<span class="material-symbols-outlined text-xs" style="font-variation-settings: 'FILL' 1">sentiment_extremely_dissatisfied</span>
</div>
</div>
</section>
<section class="col-span-6 bg-surface-container-lowest rounded-xl p-4 shadow-sm space-y-2">
<h2 class="text-on-surface font-bold text-[11px] uppercase tracking-wide">Occurrence</h2>
<div class="flex items-center gap-2 p-2 bg-surface-container-low rounded-lg border border-outline-variant/30">
<span class="material-symbols-outlined text-sm text-primary">schedule</span>
<span class="text-xs font-semibold">10:45 AM</span>
</div>
</section>
<section class="col-span-6 bg-surface-container-lowest rounded-xl p-4 shadow-sm space-y-2">
<h2 class="text-on-surface font-bold text-[11px] uppercase tracking-wide">Duration</h2>
<div class="flex items-center gap-2 p-2 bg-surface-container-low rounded-lg">
<span class="material-symbols-outlined text-sm text-primary">timer</span>
<span class="text-xs font-semibold">45 min</span>
</div>
</section>
<section class="col-span-12 bg-surface-container-lowest rounded-xl p-4 shadow-sm">
<h2 class="text-on-surface font-bold text-[11px] uppercase tracking-wide mb-3">Potential Triggers</h2>
<div class="flex flex-wrap gap-1.5">
<button class="px-3 py-1 rounded-full text-[10px] font-semibold bg-secondary-container text-on-secondary-container">Stress</button>
<button class="px-3 py-1 rounded-full text-[10px] font-semibold bg-surface-container-high text-outline">Poor Sleep</button>
<button class="px-3 py-1 rounded-full text-[10px] font-semibold bg-secondary-container text-on-secondary-container">Caffeine</button>
<button class="px-3 py-1 rounded-full text-[10px] font-semibold bg-surface-container-high text-outline">Exercise</button>
<button class="px-3 py-1 rounded-full text-[10px] font-semibold bg-surface-container-high text-outline">Diet</button>
<button class="px-3 py-1 rounded-full text-[10px] font-semibold bg-surface-container-high text-outline">Not sure</button>
</div>
</section>
<div class="col-span-12 grid grid-cols-12 gap-3">
<section class="col-span-6 bg-surface-container-lowest rounded-xl p-4 shadow-sm space-y-3">
<div class="flex items-center justify-between">
<span class="material-symbols-outlined text-sm text-primary">medication</span>
<div class="w-8 h-4 bg-primary rounded-full relative flex items-center px-0.5">
<div class="w-3 h-3 bg-white rounded-full absolute right-0.5"></div>
</div>
</div>
<div class="text-[10px] font-bold text-on-surface">HRT (Estrogen)</div>
<label class="flex items-start gap-1.5">
<input class="w-3 h-3 text-primary border-outline-variant rounded mt-0.5" type="checkbox"/>
<span class="text-[9px] text-outline leading-tight">Post-dose start?</span>
</label>
</section>
<section class="col-span-6 bg-surface-container-lowest rounded-xl p-4 shadow-sm flex flex-col">
<h2 class="text-on-surface font-bold text-[11px] uppercase tracking-wide mb-2">Quick Note</h2>
<textarea class="flex-1 w-full bg-surface-container-low border-none rounded-lg p-2 text-[10px] font-serif italic text-on-surface-variant resize-none" placeholder="Add details..." rows="2"></textarea>
</section>
</div>
<div class="col-span-12 h-24"></div>
</div>
</main>
<div class="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-outline-variant/15 px-5 pt-3 pb-6 shrink-0">
<div class="flex flex-col items-center gap-2">
<div class="flex items-center gap-1.5 opacity-60">
<span class="material-symbols-outlined text-[10px]">lock</span>
<span class="text-[9px] font-bold text-outline tracking-wider uppercase">Private &amp; Encrypted</span>
</div>
<button class="w-full bg-primary text-white font-bold py-3.5 rounded-xl text-sm shadow-md active:scale-[0.98] transition-all">
                Save &amp; Continue
            </button>
</div>
</div>

</body></html>
