</button>

<div class="flex justify-center flex-1">
<h1 class="font-serif text-[18px] font-medium tracking-tight text-[#67594e]">Reset Your Password</h1>
</div>
<div class="flex-1"></div>
</div>
</header>
<main class="flex-1 flex items-center justify-center px-5 py-12 relative overflow-hidden">
<!-- Abstract Background Glow for Depth -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120%] h-[120%] opacity-20 pointer-events-none">
<div class="absolute top-0 right-0 w-96 h-96 bg-secondary-fixed rounded-full blur-[120px]"></div>
<div class="absolute bottom-0 left-0 w-96 h-96 bg-tertiary-fixed rounded-full blur-[120px]"></div>
</div>
<!-- Central Action Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-[1.5rem] p-8 shadow-[0_4px_24px_rgba(29,27,26,0.04)] relative z-10">
<div class="mb-8 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-low mb-4 text-primary">
<span class="material-symbols-outlined text-3xl" data-icon="lock_reset">lock_reset</span>
</div>
<p class="text-on-surface-variant font-body text-sm leading-relaxed">
                    Enter your new secure password below to regain access to your sanctuary.
                </p>
</div>
<form class="space-y-6">
<!-- New Password Field -->
<div class="space-y-2">
<label class="block text-[13px] font-bold text-on-surface ml-1">New Password</label>
<div class="relative group">
<input class="w-full bg-surface-container-highest border-none rounded-full px-5 py-4 text-on-surface placeholder-on-surface-variant/40 focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Requirements Checklist -->
<div class="bg-surface-container-low/50 rounded-xl p-4 space-y-3">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-sm text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[12px] font-medium text-on-surface-variant">At least 8 characters</span>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-sm text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[12px] font-medium text-on-surface-variant">One uppercase letter</span>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-sm text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[12px] font-medium text-on-surface-variant">One number (0-9)</span>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-sm text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[12px] font-medium text-on-surface-variant">One special character (!@#$)</span>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-2">
<label class="block text-[13px] font-bold text-on-surface ml-1">Confirm Password</label>
<input class="w-full bg-surface-container-highest border border-error rounded-full px-5 py-4 text-on-surface placeholder-on-surface-variant/40 focus:ring-2 focus:ring-error/20 transition-all outline-none" placeholder="••••••••" type="password"/>
<p class="text-[12px] text-[#E8A89B] italic font-medium ml-1">Passwords must match</p>
</div>
<!-- Primary Action -->
<div class="pt-2">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-body font-semibold py-4 rounded-full text-sm tracking-wide shadow-lg opacity-50 cursor-not-allowed flex items-center justify-center gap-2" disabled="" type="button">
                        Reset Password
                        <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Secondary Action -->
<div class="mt-8 text-center">
<button class="text-[13px] font-bold text-primary hover:opacity-80 transition-opacity">
                    Return to Login
                </button>
</div>
</div>
