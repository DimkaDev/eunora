<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#6c6074",
                        "surface-dim": "#ded9d7",
                        "on-surface": "#1d1b1a",
                        "secondary-fixed-dim": "#d0c1d8",
                        "secondary-fixed": "#edddf5",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "secondary": "#655a6e",
                        "outline-variant": "#d0c4bc",
                        "inverse-surface": "#32302f",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#ede7e5",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#f2edea",
                        "on-tertiary": "#ffffff",
                        "surface": "#fef8f6",
                        "on-tertiary-fixed": "#341009",
                        "on-secondary-fixed": "#211828",
                        "secondary-container": "#edddf5",
                        "on-surface-variant": "#4d453f",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "tertiary-container": "#9d675c",
                        "primary": "#67594e",
                        "primary-fixed-dim": "#d6c3b5",
                        "tertiary-fixed": "#ffdad3",
                        "outline": "#7f756e",
                        "surface-container-low": "#f8f2f0",
                        "surface-bright": "#fef8f6",
                        "inverse-on-surface": "#f5f0ed",
                        "on-primary": "#ffffff",
                        "surface-tint": "#6a5c50",
                        "background": "#fef8f6",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-primary-container": "#fffbff",
                        "on-background": "#1d1b1a",
                        "error": "#ba1a1a",
                        "primary-container": "#817266",
                        "on-tertiary-container": "#fffbff",
                        "surface-variant": "#e7e1df",
                        "on-primary-fixed-variant": "#51443a",
                        "tertiary": "#814f45",
                        "on-tertiary-fixed-variant": "#683a31",
                        "surface-container-highest": "#e7e1df",
                        "on-primary-fixed": "#231a11",
                        "inverse-primary": "#d6c3b5",
                        "primary-fixed": "#f2dfd0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        }
        body { font-family: 'Manrope', sans-serif; background-color: #fef8f6; -webkit-font-smoothing: antialiased; }
        .serif { font-family: 'Noto Serif', serif; }
        ::-webkit-scrollbar { display: none; }.card-compact { @apply p-4 rounded-xl bg-surface-container-lowest; }
        .input-compact { @apply py-2 px-4 bg-surface-container rounded-full text-sm; }
        .choice-compact { @apply py-2 px-3 rounded-lg text-xs font-medium bg-surface-container flex items-center justify-between transition-all; }
        .choice-compact.selected { @apply bg-secondary-container text-on-surface ring-1 ring-primary/20; }
        .label-compact { @apply text-primary font-bold text-[10px] uppercase tracking-wider mb-2 block; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface">
<header class="bg-[#fef8f6]/80 backdrop-blur-md fixed top-0 w-full z-50 border-b border-surface-container">
<div class="flex items-center justify-between px-4 h-14 w-full max-w-screen-md mx-auto">
<button class="active:scale-95 rounded-full p-1.5">
<span class="material-symbols-outlined text-stone-700" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Noto_Serif'] text-lg font-semibold text-stone-700">Lifestyle Baseline</h1>
<div class="text-[10px] font-bold text-primary px-2 py-1 bg-primary/5 rounded-full">5/7</div>
</div>
</header>
<main class="pt-16 pb-36 px-4 max-w-screen-md mx-auto">
<div class="w-full h-1 bg-surface-container-high rounded-full overflow-hidden mb-4">
<div class="h-full bg-primary-container w-[71.4%] transition-all duration-500"></div>
</div>
<section class="mb-4">
<p class="text-on-surface-variant text-[12px] leading-relaxed">
            Understand your baseline to identify lifestyle patterns that may correlate with your symptoms.
        </p>
</section>
<div class="space-y-3">
<div class="grid grid-cols-2 gap-3">
<div class="card-compact">
<label class="label-compact">Weight (Opt)</label>
<div class="flex gap-2">
<input class="w-full bg-surface-container border-none focus:ring-0 rounded-lg px-2 py-2 text-sm font-bold text-center" placeholder="70" type="number"/>
<div class="flex flex-col bg-surface-container-high p-0.5 rounded-lg">
<button class="px-2 py-1 rounded-md text-[9px] font-black bg-primary text-on-primary">KG</button>
<button class="px-2 py-1 rounded-md text-[9px] font-black text-on-surface-variant">LB</button>
</div>
</div>
</div>
<div class="card-compact">
<label class="label-compact">Avg Sleep</label>
<div class="flex items-center justify-between bg-surface-container rounded-lg p-1">
<button class="w-7 h-7 flex items-center justify-center rounded-md bg-white shadow-sm text-primary active:scale-90">
<span class="material-symbols-outlined text-sm" data-icon="remove">remove</span>
</button>
<div class="text-center">
<span class="font-headline text-lg font-bold text-on-surface">7</span>
<span class="text-[8px] block -mt-1 font-bold opacity-60">HRS</span>
</div>
<button class="w-7 h-7 flex items-center justify-center rounded-md bg-white shadow-sm text-primary active:scale-90">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span>
</button>
</div>
</div>
</div>
<div class="card-compact">
<label class="label-compact">Do you smoke?</label>
<div class="flex flex-wrap gap-2">
<button class="choice-compact selected">Never <span class="ml-2 w-2 h-2 rounded-full bg-primary"></span></button>
<button class="choice-compact">Former</button>
<button class="choice-compact">Occasional</button>
<button class="choice-compact">Daily</button>
<button class="choice-compact">Skip</button>
</div>
</div>
<div class="card-compact">
<label class="label-compact">Alcohol consumption</label>
<div class="grid grid-cols-2 gap-2">
<button class="choice-compact">Never</button>
<button class="choice-compact selected">Rarely <span class="w-2 h-2 rounded-full bg-primary"></span></button>
<button class="choice-compact">Occasionally</button>
<button class="choice-compact">Regularly</button>
<button class="choice-compact">Daily</button>
<button class="choice-compact">N/A</button>
</div>
</div>
<div class="card-compact">
<label class="label-compact">Exercise frequency</label>
<div class="grid grid-cols-2 gap-2">
<button class="choice-compact">Rarely/never</button>
<button class="choice-compact">1-2x/week</button>
<button class="choice-compact selected">3-4x/week <span class="w-2 h-2 rounded-full bg-primary"></span></button>
<button class="choice-compact">Daily</button>
</div>
</div>
<div class="card-compact">
<label class="label-compact">Daily caffeine intake</label>
<div class="grid grid-cols-4 gap-2">
<button class="flex flex-col items-center py-2 px-1 rounded-lg bg-surface-container gap-1 border border-transparent">
<span class="material-symbols-outlined text-primary text-base" data-icon="water_drop">water_drop</span>
<span class="text-[9px] font-bold">None</span>
</button>
<button class="flex flex-col items-center py-2 px-1 rounded-lg bg-secondary-container gap-1 border border-primary/20">
<span class="material-symbols-outlined text-primary text-base" data-icon="coffee" style="font-variation-settings: 'FILL' 1;">coffee</span>
<span class="text-[9px] font-bold text-primary">Light</span>
</button>
<button class="flex flex-col items-center py-2 px-1 rounded-lg bg-surface-container gap-1 border border-transparent">
<span class="material-symbols-outlined text-primary text-base" data-icon="bolt">bolt</span>
<span class="text-[9px] font-bold">High</span>
</button>
<button class="flex flex-col items-center py-2 px-1 rounded-lg bg-surface-container gap-1 border border-transparent">
<span class="material-symbols-outlined text-primary text-base" data-icon="visibility_off">visibility_off</span>
<span class="text-[9px] font-bold">Skip</span>
</button>
</div>
</div>
</div>
</main>
<div class="fixed bottom-0 left-0 w-full px-4 pt-3 pb-6 bg-[#fef8f6]/95 backdrop-blur-md z-50 border-t border-surface-container">
<div class="max-w-screen-md mx-auto flex flex-col items-center gap-3">
<button class="w-full py-3.5 bg-primary text-on-primary rounded-lg font-bold tracking-widest text-xs uppercase shadow-md active:scale-[0.98]">
            Continue
        </button>
<button class="text-[10px] font-bold text-on-surface-variant/60 uppercase tracking-widest hover:text-primary">
            Skip this step
        </button>
</div>
</div>
<div class="fixed top-0 right-0 -z-10 w-[50%] h-[30%] bg-gradient-to-bl from-tertiary-fixed/10 to-transparent blur-3xl pointer-events-none"></div>
<div class="fixed bottom-0 left-0 -z-10 w-[40%] h-[20%] bg-gradient-to-tr from-secondary-fixed/20 to-transparent blur-3xl pointer-events-none"></div>

</body></html>
