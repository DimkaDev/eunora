<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verify Email - MenoSync</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#7f756e",
                        "on-primary-container": "#fffbff",
                        "on-secondary": "#ffffff",
                        "primary": "#67594e",
                        "background": "#F7F5F0",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#d6c3b5",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-tertiary-fixed": "#341009",
                        "surface-bright": "#F7F5F0",
                        "tertiary-fixed": "#ffdad3",
                        "surface-container-low": "#f8f2f0",
                        "secondary": "#655a6e",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "error": "#ba1a1a",
                        "on-surface": "#1d1b1a",
                        "primary-container": "#817266",
                        "on-tertiary-container": "#fffbff",
                        "on-primary-fixed-variant": "#51443a",
                        "secondary-fixed-dim": "#d0c1d8",
                        "on-surface-variant": "#4d453f",
                        "error-container": "#ffdad6",
                        "surface-dim": "#ded9d7",
                        "secondary-fixed": "#edddf5",
                        "surface-tint": "#6a5c50",
                        "on-primary-fixed": "#231a11",
                        "surface-container-high": "#ede7e5",
                        "on-error": "#ffffff",
                        "surface-variant": "#e7e1df",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#6c6074",
                        "tertiary": "#814f45",
                        "outline-variant": "#d0c4bc",
                        "on-error-container": "#93000a",
                        "surface-container": "#f2edea",
                        "surface": "#F7F5F0",
                        "primary-fixed-dim": "#d6c3b5",
                        "secondary-container": "#edddf5",
                        "primary-fixed": "#f2dfd0",
                        "on-background": "#1d1b1a",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#211828",
                        "inverse-surface": "#32302f",
                        "tertiary-container": "#9d675c",
                        "on-tertiary-fixed-variant": "#683a31",
                        "inverse-on-surface": "#f5f0ed",
                        "surface-container-highest": "#EEEEEE"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .tonal-transition {
            background: linear-gradient(180deg, #F7F5F0 0%, #ede7e5 100%);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .power-input {
            letter-spacing: 0.5em;
            text-indent: 0.25em;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface min-h-screen flex flex-col items-center">
<header class="w-full sticky top-0 z-50 bg-background/80 backdrop-blur-md flex justify-between items-center px-6 py-4">
<div class="flex items-center gap-4">
<button class="transition-all duration-300 ease-in-out active:scale-95 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline text-xl font-semibold text-primary">Verify Email</h1>
</div>
<div class="w-10"></div>
</header>
<main class="flex-1 w-full max-w-[340px] px-4 pt-8 pb-12 flex flex-col items-center">
<div class="mb-8 flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-2xl bg-surface-container-high flex items-center justify-center mb-6 shadow-sm">
<span class="material-symbols-outlined text-[32px] text-primary">mail</span>
</div>
<h2 class="font-headline text-[22px] font-bold text-on-surface leading-tight mb-2">Verify Your Email</h2>
<p class="font-body text-[13px] text-on-surface-variant leading-relaxed">
                We sent a code to <span class="font-semibold text-primary">sarah@email.com</span>
</p>
</div>
<div class="w-full mb-8">
<a class="flex items-center justify-center gap-2 py-3 bg-surface-container-low rounded-xl text-primary font-semibold text-[13px] transition-all hover:bg-surface-container-high active:scale-98" href="#">
<span class="material-symbols-outlined text-[18px]">edit</span>
                Use a different email
            </a>
</div>
<div class="w-full space-y-6">
<div class="text-left">
<div class="flex justify-between items-end mb-2 px-1">
<label class="block font-label text-[13px] font-bold text-on-surface-variant">
                        Enter verification code
                    </label>
</div>
<div class="relative group">
<input class="w-full h-16 bg-[#EEEEEE] border-2 border-transparent focus:border-primary text-center font-mono text-[28px] font-bold tracking-[0.2em] rounded-2xl transition-all outline-none shadow-inner power-input" maxlength="7" placeholder="000-000" type="text" value="843-"/>
<div class="absolute inset-0 pointer-events-none rounded-2xl border-2 border-primary/5 group-focus-within:border-primary/20"></div>
</div>
<p class="font-body text-[11px] text-outline mt-3 px-1 flex items-center gap-1.5">
<span class="material-symbols-outlined text-[14px]">info</span>
                    Check your email (spam folder too)
                </p>
</div>
<button class="w-full py-4.5 bg-primary text-white font-bold text-[16px] rounded-2xl shadow-lg shadow-primary/20 transition-all duration-300 active:scale-[0.97] flex items-center justify-center gap-2">
                Verify Email
            </button>
</div>
<div class="mt-10 w-full">
<button class="w-full py-4 bg-surface-container-highest/50 border border-outline-variant/30 text-outline font-bold text-[14px] rounded-2xl flex items-center justify-center gap-3 cursor-not-allowed" disabled="">
<span class="material-symbols-outlined text-[20px] animate-pulse">history</span>
                Resend Code (45s)
            </button>
<p class="mt-3 text-center font-body text-[12px] text-on-surface-variant/70">
                Didn't receive the code?
            </p>
</div>
<div class="mt-12 w-full space-y-3">
<div class="p-3 bg-[#E8F5E9] rounded-xl flex items-center gap-3 border border-green-200/50">
<span class="material-symbols-outlined text-[#2E7D32]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[12px] text-[#1B5E20] font-semibold">Code verified successfully!</span>
</div>
<div class="p-3 bg-error-container rounded-xl flex items-center gap-3 border border-error/10">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="text-[12px] text-on-error-container font-semibold text-left">Incorrect code. Please try again.</span>
</div>
</div>
</main>
<div class="fixed top-[-10%] right-[-10%] w-[60%] h-[40%] rounded-full bg-primary/5 blur-[100px] -z-10"></div>
<div class="fixed bottom-[-5%] left-[-10%] w-[50%] h-[30%] rounded-full bg-secondary/5 blur-[80px] -z-10"></div>

</body></html>
