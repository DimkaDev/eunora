<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Interactive Journal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#9B8B7E",
                        "cream": "#F7F5F0",
                        "lavender": "#E8E0F0",
                        "on-surface": "#1d1b1a",
                        "on-surface-variant": "#4d453f",
                        "surface-container-low": "#f8f2f0",
                        "outline-variant": "#d0c4bc",
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body { 
            font-family: 'Manrope', sans-serif; 
            background-color: #F7F5F0; 
        }
        .serif-font { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            vertical-align: middle;
        }
        .custom-shadow { box-shadow: 0 8px 30px rgba(155, 139, 126, 0.08); }
        .no-scrollbar::-webkit-scrollbar { display: none; }.intensity-bar {
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #E8E0F0 0%, #9B8B7E 100%);
            position: relative;
            overflow: hidden;
        }
        .intensity-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #9B8B7E;
            transition: width 0.4s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface min-h-screen flex flex-col items-center">
<header class="w-full fixed top-0 z-50 bg-[#F7F5F0]/90 backdrop-blur-md">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-xl mx-auto">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined !fill-0" style="font-size: 24px;">arrow_back</span>
</button>
<h1 class="serif-font text-lg font-semibold text-primary">Step 2 of 3: Rate Severity</h1>
<div class="w-10"></div>
</div>
<div class="px-6 pb-4 max-w-xl mx-auto">
<div class="w-full bg-[#E5E1D8] h-1.5 rounded-full overflow-hidden">
<div class="bg-primary h-full w-[66%]"></div>
</div>
</div>
</header>
<main class="flex-1 w-full max-w-xl px-6 pt-32 pb-32 overflow-y-auto no-scrollbar">
<section class="mb-8 text-center">
<h2 class="serif-font text-[28px] font-bold text-on-surface mb-2 leading-tight">Journal Your Experience</h2>
<p class="text-on-surface-variant text-sm font-medium">Capture the nuance of how you're feeling today.</p>
</section>
<div class="space-y-8">
<article class="bg-white rounded-[2rem] p-6 custom-shadow border border-lavender/30">
<div class="flex flex-col items-center text-center mb-6">
<div class="w-20 h-20 bg-lavender/40 rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-5xl">mode_heat</span>
</div>
<h3 class="serif-font text-xl font-bold text-on-surface">Hot Flashes</h3>
</div>
<div class="mb-8">
<div class="flex justify-between items-end mb-3">
<p class="text-xs font-bold uppercase tracking-[0.1em] text-on-surface-variant">Intensity</p>
<p class="text-xs font-bold text-primary">MODERATE</p>
</div>
<div class="intensity-bar">
<div class="intensity-fill" style="width: 66%;"></div>
</div>
<div class="grid grid-cols-3 gap-4 mt-6">
<button class="flex flex-col items-center gap-2 p-3 rounded-2xl bg-cream/50 border border-transparent transition-all">
<span class="text-3xl grayscale opacity-50">😊</span>
<span class="text-[10px] font-bold uppercase text-primary/60">Mild</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-2xl bg-lavender border-2 border-primary shadow-sm transition-all">
<span class="text-3xl">😐</span>
<span class="text-[10px] font-bold uppercase text-primary">Moderate</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-2xl bg-cream/50 border border-transparent transition-all">
<span class="text-3xl grayscale opacity-50">😟</span>
<span class="text-[10px] font-bold uppercase text-primary/60">Severe</span>
</button>
</div>
</div>
<div class="pt-6 border-t border-cream">
<p class="text-xs font-bold uppercase tracking-[0.1em] text-on-surface-variant mb-4 text-center">Duration</p>
<div class="flex items-center justify-between bg-cream rounded-full p-1.5">
<button class="w-11 h-11 flex items-center justify-center bg-white rounded-full text-primary shadow-sm hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined !fill-0" style="font-size: 20px;">remove</span>
</button>
<div class="flex items-baseline gap-1">
<span class="text-2xl font-bold text-primary">30</span>
<span class="text-xs font-medium text-primary/60">min</span>
</div>
<button class="w-11 h-11 flex items-center justify-center bg-white rounded-full text-primary shadow-sm hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined !fill-0" style="font-size: 20px;">add</span>
</button>
</div>
</div>
</article>
<article class="bg-white rounded-[2rem] p-6 custom-shadow border border-lavender/30">
<div class="flex flex-col items-center text-center mb-6">
<div class="w-20 h-20 bg-lavender/40 rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-5xl">dark_mode</span>
</div>
<h3 class="serif-font text-xl font-bold text-on-surface">Night Sweats</h3>
</div>
<div class="mb-8">
<div class="flex justify-between items-end mb-3">
<p class="text-xs font-bold uppercase tracking-[0.1em] text-on-surface-variant">Intensity</p>
<p class="text-xs font-bold text-primary">SEVERE</p>
</div>
<div class="intensity-bar">
<div class="intensity-fill" style="width: 100%;"></div>
</div>
<div class="grid grid-cols-3 gap-4 mt-6">
<button class="flex flex-col items-center gap-2 p-3 rounded-2xl bg-cream/50 border border-transparent transition-all">
<span class="text-3xl grayscale opacity-50">😊</span>
<span class="text-[10px] font-bold uppercase text-primary/60">Mild</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-2xl bg-cream/50 border border-transparent transition-all">
<span class="text-3xl grayscale opacity-50">😐</span>
<span class="text-[10px] font-bold uppercase text-primary/60">Moderate</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-2xl bg-lavender border-2 border-primary shadow-sm transition-all">
<span class="text-3xl">😟</span>
<span class="text-[10px] font-bold uppercase text-primary">Severe</span>
</button>
</div>
</div>
<div class="pt-6 border-t border-cream">
<p class="text-xs font-bold uppercase tracking-[0.1em] text-on-surface-variant mb-4 text-center">Duration</p>
<div class="flex items-center justify-between bg-cream rounded-full p-1.5">
<button class="w-11 h-11 flex items-center justify-center bg-white rounded-full text-primary shadow-sm hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined !fill-0" style="font-size: 20px;">remove</span>
</button>
<div class="flex items-baseline gap-1">
<span class="text-2xl font-bold text-primary">15</span>
<span class="text-xs font-medium text-primary/60">min</span>
</div>
<button class="w-11 h-11 flex items-center justify-center bg-white rounded-full text-primary shadow-sm hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined !fill-0" style="font-size: 20px;">add</span>
</button>
</div>
</div>
</article>
<article class="bg-white rounded-[2rem] p-6 custom-shadow border border-lavender/30">
<div class="flex flex-col items-center text-center mb-6">
<div class="w-20 h-20 bg-lavender/40 rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-5xl">psychology</span>
</div>
<h3 class="serif-font text-xl font-bold text-on-surface">Mood Changes</h3>
</div>
<div>
<div class="flex justify-between items-end mb-3">
<p class="text-xs font-bold uppercase tracking-[0.1em] text-on-surface-variant">Intensity</p>
<p class="text-xs font-bold text-primary">MILD</p>
</div>
<div class="intensity-bar">
<div class="intensity-fill" style="width: 33%;"></div>
</div>
<div class="grid grid-cols-3 gap-4 mt-6">
<button class="flex flex-col items-center gap-2 p-3 rounded-2xl bg-lavender border-2 border-primary shadow-sm transition-all">
<span class="text-3xl">😊</span>
<span class="text-[10px] font-bold uppercase text-primary">Mild</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-2xl bg-cream/50 border border-transparent transition-all">
<span class="text-3xl grayscale opacity-50">😐</span>
<span class="text-[10px] font-bold uppercase text-primary/60">Moderate</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-2xl bg-cream/50 border border-transparent transition-all">
<span class="text-3xl grayscale opacity-50">😟</span>
<span class="text-[10px] font-bold uppercase text-primary/60">Severe</span>
</button>
</div>
</div>
</article>
</div>
<div class="mt-12 mb-8">
<button class="w-full py-6 rounded-[2rem] border-2 border-dashed border-primary/30 flex items-center justify-center gap-3 group transition-all hover:bg-white hover:border-primary">
<span class="material-symbols-outlined text-primary/60 group-hover:scale-110 transition-transform">add_circle</span>
<span class="text-sm font-bold text-primary">Log additional symptom</span>
</button>
</div>
</main>
<footer class="fixed bottom-0 w-full bg-[#F7F5F0]/95 backdrop-blur-xl border-t border-lavender/50">
<div class="max-w-xl mx-auto px-6 py-6 flex gap-4">
<button class="flex-1 h-14 rounded-2xl border-2 border-primary bg-white text-primary font-bold text-sm hover:bg-cream transition-all active:scale-95">
                Back
            </button>
<button class="flex-[2] h-14 rounded-2xl bg-primary text-white font-bold text-sm shadow-xl shadow-primary/20 hover:opacity-95 transition-all active:scale-95 flex items-center justify-center gap-2">
                Next → Triggers
            </button>
</div>
</footer>

</body></html>
