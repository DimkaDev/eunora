<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Surgical Menopause Profile - Filled State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#e7e1df",
                        "outline": "#7f756e",
                        "on-surface-variant": "#4d453f",
                        "on-primary-container": "#fffbff",
                        "on-primary-fixed": "#231a11",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#ffdad3",
                        "surface-container-low": "#f8f2f0",
                        "on-surface": "#1d1b1a",
                        "primary": "#67594e",
                        "surface-container-high": "#ede7e5",
                        "surface-bright": "#fef8f6",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#6c6074",
                        "on-tertiary-container": "#fffbff",
                        "error": "#ba1a1a",
                        "tertiary": "#814f45",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-secondary-fixed": "#211828",
                        "on-tertiary-fixed": "#341009",
                        "surface-tint": "#6a5c50",
                        "primary-fixed-dim": "#d6c3b5",
                        "secondary-fixed": "#edddf5",
                        "on-background": "#1d1b1a",
                        "surface": "#fef8f6",
                        "secondary-container": "#edddf5",
                        "on-primary-fixed-variant": "#51443a",
                        "surface-variant": "#e7e1df",
                        "inverse-on-surface": "#f5f0ed",
                        "inverse-primary": "#d6c3b5",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "inverse-surface": "#32302f",
                        "secondary": "#655a6e",
                        "background": "#fef8f6",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-dim": "#ded9d7",
                        "surface-container": "#f2edea",
                        "secondary-fixed-dim": "#d0c1d8",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#817266",
                        "outline-variant": "#d0c4bc",
                        "primary-fixed": "#f2dfd0",
                        "tertiary-container": "#9d675c"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {},
                    fontFamily: {
                        "headline": ["Noto Serif", "serif"],
                        "display": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    },
                    fontSize: {
                        "display-lg": ["3.5rem", { lineHeight: "1.1" }],
                        "headline-md": ["1.75rem", { lineHeight: "1.2" }],
                        "title-lg": ["1.375rem", { lineHeight: "1.3" }],
                        "title-sm": ["0.875rem", { lineHeight: "1.4", letterSpacing: "0.1px" }],
                        "label-md": ["0.75rem", { lineHeight: "1.33", letterSpacing: "0.5px" }],
                        "body-md": ["1rem", { lineHeight: "1.5" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline, .font-display { font-family: 'Noto Serif', serif; }
        
        .glass-header {
            background-color: rgba(254, 248, 246, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .gradient-primary {
            background: linear-gradient(135deg, #67594e 0%, #817266 100%);
        }
        
        .ambient-shadow {
            box-shadow: 0 4px 24px rgba(29, 27, 26, 0.06);
        }
        
        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e7e1df;
            border-radius: 2px;
        }
        
        /* Custom radio/checkbox styling for wellness vibe */
        .wellness-radio:checked + div {
            background-color: #edddf5;
            border-color: transparent;
            color: #211828;
        }
        .wellness-checkbox:checked + div {
            background-color: #edddf5;
            border-color: transparent;
            color: #211828;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="glass-header docked full-width top-0 z-40 sticky transition-all duration-300">
<div class="flex justify-between items-center w-full px-6 py-4">
<button aria-label="Menu" class="text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<div class="text-center flex-grow">
<span class="font-headline italic text-xl text-primary font-bold tracking-tight">The Serene Curator</span>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high ambient-shadow flex-shrink-0">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="close up portrait of a serene woman with natural makeup in soft warm natural light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuABBNKOOxe-S2IFAV9XKL6-0v7wdFnHntQifo06G8iWNP71uVrwTnSk8LP1n8fCrTZcQGy-oqKe3n7FdReQS_rqA2L-QrBK5JXf57r-KZtFHI1qw642w2fh23fCE2X2nFTQnnQTd7s8UlXdr4ozyfU8udavAAwLb5vqhwttUADN1ykjFWuGh_Lfu1nx4s23OuFiCne5_IgJ4XPhJx-QPAMCrAXcxAgERQj9d1fNyce_lAHVxBB3RELtnCypTb9SISOFU7f2D91pDKk"/>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center w-full max-w-2xl mx-auto px-5 md:px-8 py-8 md:py-12 space-y-10">
<!-- Hero Title -->
<section class="w-full text-center space-y-3">
<h1 class="text-headline-md font-headline text-on-surface">Your Profile Details</h1>
<p class="text-body-md text-on-surface-variant font-body px-4">Reviewing your surgical details to curate your serene experience.</p>
</section>
<!-- Form Container -->
<form class="w-full space-y-8 flex flex-col">
<!-- Procedure Date -->
<div class="w-full space-y-3 bg-surface-container-lowest p-6 rounded-xl ambient-shadow relative overflow-hidden">
<div class="absolute top-0 right-0 p-4">
<span class="material-symbols-outlined text-tertiary-fixed opacity-70">calendar_month</span>
</div>
<label class="block text-label-md font-bold text-primary uppercase tracking-wider">Procedure Date</label>
<div class="relative">
<input class="w-full bg-surface-container rounded-full py-4 px-6 text-on-surface font-medium border-none focus:ring-2 focus:ring-primary-container outline-none transition-shadow" readonly="" type="text" value="October 2023"/>
<span class="absolute right-6 top-1/2 -translate-y-1/2 material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Type of Procedure -->
<div class="w-full space-y-4 bg-surface-container-lowest p-6 rounded-xl ambient-shadow">
<label class="block text-label-md font-bold text-primary uppercase tracking-wider">Type of Procedure</label>
<div class="grid grid-cols-1 md:grid-cols-3 gap-3">
<label class="relative cursor-pointer">
<input class="peer sr-only wellness-radio" name="procedure_type" type="radio" value="ovaries"/>
<div class="w-full text-center py-4 px-3 rounded-xl bg-surface-container-high text-on-surface-variant transition-all border border-transparent peer-focus:ring-2 peer-focus:ring-primary-container">
<span class="font-medium text-sm">Ovaries Only</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only wellness-radio" name="procedure_type" type="radio" value="uterus"/>
<div class="w-full text-center py-4 px-3 rounded-xl bg-surface-container-high text-on-surface-variant transition-all border border-transparent peer-focus:ring-2 peer-focus:ring-primary-container">
<span class="font-medium text-sm">Uterus Only</span>
</div>
</label>
<label class="relative cursor-pointer">
<input checked="" class="peer sr-only wellness-radio" name="procedure_type" type="radio" value="both"/>
<div class="w-full text-center py-4 px-3 rounded-xl bg-secondary-container text-on-secondary-fixed transition-all border border-transparent peer-focus:ring-2 peer-focus:ring-primary-container flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">check</span>
<span class="font-medium text-sm">Both</span>
</div>
</label>
</div>
</div>
<!-- HRT Prescription -->
<div class="w-full space-y-4 bg-surface-container p-6 rounded-xl">
<label class="block text-label-md font-bold text-primary uppercase tracking-wider">HRT Prescription</label>
<div class="space-y-3">
<label class="flex items-center space-x-4 cursor-pointer bg-surface-container-lowest p-4 rounded-xl border border-transparent transition-all">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" name="hrt" type="radio" value="yes_immediate"/>
<div class="w-6 h-6 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-all">
<div class="w-2.5 h-2.5 rounded-full bg-surface peer-checked:opacity-100 opacity-0 transition-opacity"></div>
</div>
</div>
<span class="text-on-surface font-medium">Yes - immediately</span>
</label>
<label class="flex items-center space-x-4 cursor-pointer bg-surface-container-highest p-4 rounded-xl opacity-70 transition-all">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" name="hrt" type="radio" value="yes_delayed"/>
<div class="w-6 h-6 rounded-full border-2 border-outline flex items-center justify-center transition-all">
<div class="w-2.5 h-2.5 rounded-full bg-surface opacity-0 transition-opacity"></div>
</div>
</div>
<span class="text-on-surface-variant">Yes - delayed</span>
</label>
<label class="flex items-center space-x-4 cursor-pointer bg-surface-container-highest p-4 rounded-xl opacity-70 transition-all">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" name="hrt" type="radio" value="no"/>
<div class="w-6 h-6 rounded-full border-2 border-outline flex items-center justify-center transition-all">
<div class="w-2.5 h-2.5 rounded-full bg-surface opacity-0 transition-opacity"></div>
</div>
</div>
<span class="text-on-surface-variant">No</span>
</label>
</div>
</div>
<!-- Symptoms Experienced -->
<div class="w-full space-y-4 bg-surface-container-lowest p-6 rounded-xl ambient-shadow">
<label class="block text-label-md font-bold text-primary uppercase tracking-wider">Current Symptoms</label>
<div class="flex flex-wrap gap-3">
<label class="cursor-pointer">
<input checked="" class="peer sr-only wellness-checkbox" name="symptoms" type="checkbox" value="hot_flashes"/>
<div class="py-2.5 px-5 rounded-full bg-secondary-container text-on-secondary-fixed transition-all border border-transparent flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">local_fire_department</span>
<span class="font-medium text-sm">Hot Flashes</span>
</div>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only wellness-checkbox" name="symptoms" type="checkbox" value="night_sweats"/>
<div class="py-2.5 px-5 rounded-full bg-secondary-container text-on-secondary-fixed transition-all border border-transparent flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">bedtime</span>
<span class="font-medium text-sm">Night Sweats</span>
</div>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only wellness-checkbox" name="symptoms" type="checkbox" value="mood_swings"/>
<div class="py-2.5 px-5 rounded-full bg-secondary-container text-on-secondary-fixed transition-all border border-transparent flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">mood</span>
<span class="font-medium text-sm">Mood Swings</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only wellness-checkbox" name="symptoms" type="checkbox" value="fatigue"/>
<div class="py-2.5 px-5 rounded-full bg-surface-container-high text-on-surface-variant transition-all border border-transparent hover:bg-surface-container-highest">
<span class="font-medium text-sm">Fatigue</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only wellness-checkbox" name="symptoms" type="checkbox" value="insomnia"/>
<div class="py-2.5 px-5 rounded-full bg-surface-container-high text-on-surface-variant transition-all border border-transparent hover:bg-surface-container-highest">
<span class="font-medium text-sm">Insomnia</span>
</div>
</label>
</div>
</div>
<!-- Wellbeing Slider -->
<div class="w-full space-y-6 bg-surface-container-lowest p-6 rounded-xl ambient-shadow relative">
<div class="flex justify-between items-end">
<label class="block text-label-md font-bold text-primary uppercase tracking-wider">Overall Wellbeing</label>
<span class="text-headline-md font-headline text-primary font-bold">7</span>
</div>
<div class="relative w-full pt-4 pb-2">
<!-- Custom progress track visual -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 h-1 bg-primary rounded-full" style="width: 70%;"></div>
<input class="w-full relative z-10" id="wellbeingSlider" max="10" min="1" type="range" value="7"/>
<div class="flex justify-between w-full text-xs text-outline mt-4 font-medium px-1">
<span>Challenging</span>
<span>Balanced</span>
</div>
</div>
</div>
<!-- Action Area -->
<div class="w-full pt-8 flex flex-col gap-4">
<button class="w-full py-4 px-8 rounded-xl gradient-primary text-on-primary font-bold text-title-sm ambient-shadow hover:opacity-90 transition-opacity flex items-center justify-center gap-2" type="button">
<span>Save Profile Updates</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="w-full py-4 text-primary font-bold text-title-sm hover:opacity-80 transition-opacity" type="button">
                    Cancel
                </button>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="glass-header docked full-width bottom-0 rounded-t-[2.5rem] shadow-[0_-4px_24px_rgba(29,27,26,0.06)] fixed left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 md:hidden">
<button class="flex flex-col items-center justify-center text-[#9B8B7E] px-5 py-2 hover:text-[#67594e] transition-colors group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">auto_stories</span>
<span class="font-sans text-[11px] uppercase tracking-wider font-medium">Journal</span>
</button>
<button class="flex flex-col items-center justify-center text-[#9B8B7E] px-5 py-2 hover:text-[#67594e] transition-colors group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">analytics</span>
<span class="font-sans text-[11px] uppercase tracking-wider font-medium">Insights</span>
</button>
<button class="flex flex-col items-center justify-center text-[#9B8B7E] px-5 py-2 hover:text-[#67594e] transition-colors group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">favorite</span>
<span class="font-sans text-[11px] uppercase tracking-wider font-medium">Care</span>
</button>
<button class="flex flex-col items-center justify-center bg-[#D8C9E0] text-[#1d1b1a] rounded-full px-5 py-2 scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-sans text-[11px] uppercase tracking-wider font-medium">Profile</span>
</button>
</nav>
</body></html>
