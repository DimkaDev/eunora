<!-- Question 1: Condition Type -->
<section class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_4px_24px_rgba(29,27,26,0.06)]">
<h2 class="font-headline text-lg font-bold mb-4">Which condition are you managing?</h2>
<div class="flex flex-col gap-4">
<label class="flex items-start gap-3 cursor-pointer group">
<input class="mt-1 w-5 h-5 rounded border-outline-variant bg-transparent text-primary focus:ring-primary focus:ring-offset-0 transition-colors cursor-pointer checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<div class="flex flex-col">
<span class="text-base font-semibold group-hover:text-primary transition-colors">PCOS (Polycystic Ovary Syndrome)</span>
<span class="text-sm text-on-surface-variant">Irregular cycles, hormone imbalances</span>
</div>
</label>
<label class="flex items-start gap-3 cursor-pointer group">
<input class="mt-1 w-5 h-5 rounded border-outline-variant bg-transparent text-primary focus:ring-primary focus:ring-offset-0 transition-colors cursor-pointer checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<div class="flex flex-col">
<span class="text-base font-semibold group-hover:text-primary transition-colors">PMDD (Premenstrual Dysphoric Disorder)</span>
<span class="text-sm text-on-surface-variant">Severe mood changes before period</span>
</div>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant bg-transparent text-primary focus:ring-primary focus:ring-offset-0 transition-colors cursor-pointer checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>

</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant bg-transparent text-primary focus:ring-primary focus:ring-offset-0 transition-colors cursor-pointer checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<span class="text-base font-semibold group-hover:text-primary transition-colors">Insulin resistance</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant bg-transparent text-primary focus:ring-primary focus:ring-offset-0 transition-colors cursor-pointer checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<span class="text-base font-semibold group-hover:text-primary transition-colors">Hyperprolactinemia</span>
</label>
<div class="flex flex-col gap-2 mt-2">
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant bg-transparent text-primary focus:ring-primary focus:ring-offset-0 transition-colors cursor-pointer checked:bg-[image:--checkbox-tick-svg]" type="checkbox"/>
<span class="text-base font-semibold group-hover:text-primary transition-colors">Other</span>
</label>
<input class="ml-8 w-full max-w-[240px] rounded-full border-0 bg-surface-container-highest px-4 py-3 text-sm focus:ring-2 focus:ring-primary transition-shadow" placeholder="Please specify" type="text"/>
</div>
</div>

<label class="flex items-center gap-3 cursor-pointer group">

<label class="flex items-center gap-3 cursor-pointer group">
