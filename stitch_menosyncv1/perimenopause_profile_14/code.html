<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quick Review Dashboard - MenoSync</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#edddf5",
                        "on-surface-variant": "#4d453f",
                        "primary": "#67594e",
                        "background": "#F7F5F0",
                        "surface": "#F7F5F0",
                        "outline-variant": "#d0c4bc",
                        "on-surface": "#1d1b1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "12px",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        }
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3 { font-family: 'Noto Serif', serif; }
        .symptom-checkbox:checked + .symptom-pill {
            @apply bg-[#9B8B7E] border-[#9B8B7E] text-white;
        }
        .symptom-checkbox:checked + .symptom-pill .material-symbols-outlined {
            @apply text-white;
        }
        .section-header-icon {
            @apply text-primary/60 text-[18px] shrink-0;
        }input[type="radio"]:checked {
            background-color: #9B8B7E;
            border-color: #9B8B7E;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F7F5F0] text-on-surface min-h-screen flex flex-col max-w-lg mx-auto overflow-hidden">
<header class="w-full sticky top-0 z-50 bg-[#F7F5F0]/95 backdrop-blur-md px-5 h-16 flex items-center border-b border-outline-variant/10">
<div class="flex items-center w-full gap-3">
<button class="material-symbols-outlined text-[#3A3A3A] text-xl">arrow_back</button>
<div class="flex flex-col flex-grow">
<h1 class="text-[16px] font-bold text-[#3A3A3A] leading-tight">Quick Review</h1>
<p class="text-[10px] text-[#666666] font-medium tracking-wide uppercase opacity-70">Dashboard • Step 2 of 7</p>
</div>
</div>
</header>
<main class="flex-grow overflow-y-auto px-5 py-4 space-y-0 pb-32">
<section class="border-b border-outline-variant/20 py-5">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined section-header-icon">history</span>
<h2 class="text-[15px] font-bold text-on-surface">Irregular Periods</h2>
</div>
<div class="space-y-2">
<label class="flex items-center px-3 py-2.5 rounded-lg border border-outline-variant/30 bg-white/50 cursor-pointer active:bg-white transition-colors">
<input checked="" class="w-4 h-4 text-[#9B8B7E] focus:ring-[#9B8B7E] border-outline-variant" name="irregularity" type="radio"/>
<div class="ml-3">
<span class="block text-xs font-semibold text-on-surface">Less than 6 months</span>
</div>
</label>
<div class="grid grid-cols-2 gap-2">
<label class="flex items-center px-3 py-2.5 rounded-lg border border-outline-variant/10 bg-white/30 cursor-pointer">
<input class="w-4 h-4 text-[#9B8B7E] focus:ring-[#9B8B7E] border-outline-variant" name="irregularity" type="radio"/>
<span class="ml-3 text-xs font-medium text-on-surface">6-12 months</span>
</label>
<label class="flex items-center px-3 py-2.5 rounded-lg border border-outline-variant/10 bg-white/30 cursor-pointer">
<input class="w-4 h-4 text-[#9B8B7E] focus:ring-[#9B8B7E] border-outline-variant" name="irregularity" type="radio"/>
<span class="ml-3 text-xs font-medium text-on-surface">Over 1 year</span>
</label>
</div>
</div>
</section>
<section class="border-b border-outline-variant/20 py-5">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined section-header-icon">pill</span>
<h2 class="text-[15px] font-bold text-on-surface">Hormone Treatment</h2>
</div>
<div class="space-y-2">
<label class="flex items-center px-3 py-2.5 rounded-lg border border-outline-variant/30 bg-[#9B8B7E]/5 cursor-pointer">
<input checked="" class="w-4 h-4 text-[#9B8B7E] focus:ring-[#9B8B7E] border-outline-variant" name="hormone" type="radio"/>
<span class="ml-3 text-xs font-semibold text-on-surface">Currently on HRT/Hormones</span>
</label>
<div class="relative pl-7">
<input class="w-full bg-white/60 py-2 px-3 rounded-lg border border-[#9B8B7E]/40 text-xs focus:ring-1 focus:ring-[#9B8B7E] outline-none" placeholder="Medication name..." type="text"/>
</div>
<label class="flex items-center px-3 py-2.5 rounded-lg border border-outline-variant/10 bg-white/30 cursor-pointer">
<input class="w-4 h-4 text-[#9B8B7E] focus:ring-[#9B8B7E] border-outline-variant" name="hormone" type="radio"/>
<span class="ml-3 text-xs font-medium text-on-surface">Managing naturally</span>
</label>
</div>
</section>
<section class="border-b border-outline-variant/20 py-5">
<div class="flex items-center justify-between mb-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined section-header-icon">forum</span>
<h2 class="text-[15px] font-bold text-on-surface">Symptoms</h2>
</div>
<span class="text-[9px] uppercase font-bold text-on-surface-variant/50">Select all</span>
</div>
<div class="grid grid-cols-2 gap-2">
<label class="relative cursor-pointer">
<input class="hidden symptom-checkbox" type="checkbox"/>
<div class="symptom-pill flex items-center px-3 py-2.5 rounded-xl border border-outline-variant/30 bg-white/40 transition-all gap-2 h-full">
<span class="material-symbols-outlined text-primary text-[18px]">light_mode</span>
<span class="text-[11px] font-semibold">Hot flashes</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="hidden symptom-checkbox" type="checkbox"/>
<div class="symptom-pill flex items-center px-3 py-2.5 rounded-xl border border-outline-variant/30 bg-white/40 transition-all gap-2 h-full">
<span class="material-symbols-outlined text-primary text-[18px]">bedtime</span>
<span class="text-[11px] font-semibold">Night sweats</span>
</div>
</label>
<label class="relative cursor-pointer">
<input checked="" class="hidden symptom-checkbox" type="checkbox"/>
<div class="symptom-pill flex items-center px-3 py-2.5 rounded-xl border border-outline-variant/30 bg-white/40 transition-all gap-2 h-full">
<span class="material-symbols-outlined text-primary text-[18px]">psychology_alt</span>
<span class="text-[11px] font-semibold">Mood changes</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="hidden symptom-checkbox" type="checkbox"/>
<div class="symptom-pill flex items-center px-3 py-2.5 rounded-xl border border-outline-variant/30 bg-white/40 transition-all gap-2 h-full">
<span class="material-symbols-outlined text-primary text-[18px]">psychology</span>
<span class="text-[11px] font-semibold">Brain fog</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="hidden symptom-checkbox" type="checkbox"/>
<div class="symptom-pill flex items-center px-3 py-2.5 rounded-xl border border-outline-variant/30 bg-white/40 transition-all gap-2 h-full">
<span class="material-symbols-outlined text-primary text-[18px]">alarm_off</span>
<span class="text-[11px] font-semibold">Sleep issues</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="hidden symptom-checkbox" type="checkbox"/>
<div class="symptom-pill flex items-center px-3 py-2.5 rounded-xl border border-outline-variant/30 bg-white/40 transition-all gap-2 h-full">
<span class="material-symbols-outlined text-primary text-[18px]">more_horiz</span>
<span class="text-[11px] font-semibold italic">Other</span>
</div>
</label>
</div>
</section>
<section class="border-b border-outline-variant/20 py-5">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined section-header-icon">calendar_month</span>
<h2 class="text-[15px] font-bold text-on-surface">Timeline</h2>
</div>
<button class="w-full flex justify-between items-center px-4 py-2.5 rounded-lg border border-[#9B8B7E] bg-white/40 text-[#9B8B7E] text-xs font-bold">
<span>Started: March 2022</span>
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
</button>
</section>
<section class="py-5">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined section-header-icon">medical_information</span>
<h2 class="text-[15px] font-bold text-on-surface">Medical History</h2>
</div>
<textarea class="w-full bg-white/40 border border-outline-variant/20 rounded-lg p-3 text-xs focus:ring-1 focus:ring-[#9B8B7E] placeholder:text-on-surface-variant/40 outline-none" placeholder="Notes (PCOS, surgeries, etc...)" rows="2"></textarea>
</section>
</main>
<footer class="fixed bottom-0 w-full z-50 bg-[#F7F5F0]/90 backdrop-blur-xl border-t border-outline-variant/10 px-5 py-4 max-w-lg mx-auto">
<div class="flex items-center gap-3">
<button class="flex-1 bg-[#9B8B7E] text-white rounded-xl py-3.5 flex justify-center items-center gap-2 text-sm font-bold shadow-lg shadow-[#9B8B7E]/20">
            Confirm Profile
            <span class="material-symbols-outlined text-sm">check_circle</span>
</button>
<button class="px-4 py-3.5 text-[#666666] text-xs font-bold uppercase tracking-wider">
            Skip
        </button>
</div>
</footer>

</body></html>
