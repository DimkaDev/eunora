<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verify Email - MenoSync</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#6B8E61", // Muted sage green
                        "primary-soft": "#D1DDCF",
                        "secondary": "#9D84B7", // Lavender accent
                        "secondary-soft": "#EBE4F2",
                        "background": "#F7F5F0", // Cream background
                        "surface": "#FFFFFF",
                        "text-charcoal": "#333333",
                        "text-gray": "#666666",
                        "error": "#D95D5D",
                        "success": "#6B8E61"
                    },
                    "borderRadius": {
                        "organic": "30% 70% 70% 30% / 30% 30% 70% 70%",
                        "blob": "42% 58% 70% 30% / 45% 45% 55% 55%",
                        "xl": "2rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"]
                    },
                    "letterSpacing": {
                        "serene": "0.05em",
                        "relaxed-plus": "0.1em"
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-background text-text-charcoal font-body tracking-serene;
            }
            h1, h2, h3 {
                @apply font-headline tracking-relaxed-plus;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
        .organic-shape {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }
        .fluid-card {
            border-radius: 40px;
        }input {
            @apply border-none focus:ring-2 focus:ring-primary/20 transition-all duration-500;
        }
        .spa-gradient {
            background: radial-gradient(circle at top left, #D1DDCF 0%, #F7F5F0 50%, #EBE4F2 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center overflow-x-hidden">
<div class="fixed top-[-10%] left-[-10%] w-[300px] h-[300px] bg-primary-soft/30 blur-[100px] -z-10 organic-shape"></div>
<div class="fixed bottom-[-5%] right-[-10%] w-[400px] h-[400px] bg-secondary-soft/40 blur-[100px] -z-10 organic-shape"></div>
<header class="w-full flex justify-between items-center px-6 py-6 max-w-[340px]">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white/50 backdrop-blur-sm text-text-charcoal active:scale-90 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="w-10"></div>
</header>
<main class="flex-1 w-full max-w-[340px] px-4 flex flex-col items-center text-center">
<div class="mb-10 relative">
<div class="w-24 h-24 organic-shape bg-primary-soft/50 flex items-center justify-center animate-pulse">
<div class="w-16 h-16 organic-shape bg-white flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'wght' 200;">all_inclusive</span>
</div>
</div>
</div>
<div class="mb-10">
<h2 class="text-[24px] font-semibold text-text-charcoal mb-4">Verify Your Email</h2>
<p class="text-[14px] text-text-gray leading-relaxed px-4 tracking-serene">
                We sent a verification code to <br/>
<span class="text-primary font-medium">sarah@email.com</span>
</p>
</div>
<div class="w-full space-y-8">
<div class="text-center">
<label class="block text-[12px] uppercase tracking-relaxed-plus text-text-gray mb-6">
                    Enter verification code
                </label>
<div class="flex justify-between gap-2 px-1">
<input class="w-11 h-14 bg-white/70 backdrop-blur-sm text-center font-body text-[20px] rounded-2xl shadow-sm border-none focus:bg-white" maxlength="1" type="text" value="8"/>
<input class="w-11 h-14 bg-white/70 backdrop-blur-sm text-center font-body text-[20px] rounded-2xl shadow-sm border-none focus:bg-white" maxlength="1" type="text" value="4"/>
<input class="w-11 h-14 bg-white/70 backdrop-blur-sm text-center font-body text-[20px] rounded-2xl shadow-sm border-none focus:bg-white" maxlength="1" placeholder="·" type="text"/>
<input class="w-11 h-14 bg-white/70 backdrop-blur-sm text-center font-body text-[20px] rounded-2xl shadow-sm border-none focus:bg-white" maxlength="1" placeholder="·" type="text"/>
<input class="w-11 h-14 bg-white/70 backdrop-blur-sm text-center font-body text-[20px] rounded-2xl shadow-sm border-none focus:bg-white" maxlength="1" placeholder="·" type="text"/>
<input class="w-11 h-14 bg-white/70 backdrop-blur-sm text-center font-body text-[20px] rounded-2xl shadow-sm border-none focus:bg-white" maxlength="1" placeholder="·" type="text"/>
</div>
<p class="text-[11px] text-text-gray/70 mt-6 flex justify-center items-center gap-2 tracking-serene">
<span class="material-symbols-outlined text-[14px]">waves</span>
                    Check your email (including spam)
                </p>
</div>
<button class="w-full py-4 bg-primary text-white font-medium text-[15px] rounded-full shadow-lg shadow-primary/20 hover:shadow-primary/30 transition-all duration-500 active:scale-[0.98] tracking-relaxed-plus">
                Verify Email
            </button>
</div>
<div class="mt-14 w-full space-y-6">
<p class="text-[13px] text-text-gray tracking-serene">
                Didn't receive the code?
            </p>
<div class="flex flex-col items-center gap-4">
<button class="w-full py-3.5 bg-transparent border border-secondary text-secondary font-medium text-[14px] rounded-full transition-all duration-300 hover:bg-secondary/5 tracking-relaxed-plus">
                    Resend Code
                </button>
<div class="flex items-center gap-2 text-text-gray/60 text-[12px] tracking-serene">
<span class="material-symbols-outlined text-[16px]">hourglass_empty</span>
                    Resend in 45s
                </div>
</div>
</div>
<footer class="mt-16 mb-8">
<a class="text-primary hover:text-primary/80 text-[13px] font-medium transition-colors border-b border-primary/20 pb-0.5 tracking-serene" href="#">
                Use a different email
            </a>
</footer>
<div class="mt-12 w-full space-y-4 opacity-50 mb-12">
<div class="p-4 bg-primary-soft/30 fluid-card flex items-center gap-4 border border-primary/10">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[12px] text-text-charcoal font-medium tracking-serene">Code verified successfully</span>
</div>
<div class="p-4 bg-secondary-soft/30 fluid-card flex items-center gap-4 border border-secondary/10">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="text-[12px] text-text-charcoal font-medium text-left tracking-serene">Code incorrect. Please try again.</span>
</div>
</div>
</main>

</body></html>
