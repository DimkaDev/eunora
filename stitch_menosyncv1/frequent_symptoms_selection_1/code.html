<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Streamlined Review</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "secondary-fixed": "#edddf5",

                        "on-tertiary-container": "#fffbff",

                        "on-secondary-container": "#6c6074",
                        "on-surface-variant": "#4d453f",
                        "background": "#F7F5F0",
                        "surface-dim": "#ded9d7",
                        "surface-variant": "#e7e1df",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#341009",
                        "tertiary-container": "#9d675c",
                        "on-error-container": "#93000a",

                        "primary-fixed": "#f2dfd0",
                        "inverse-surface": "#32302f",
                        "secondary-fixed-dim": "#d0c1d8",

                        "on-secondary": "#ffffff",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",

                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }

<style type="text/tailwindcss">
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #F7F5F0;
        }
        .font-noto-serif { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .symptom-card-selected {
            background-color: #E8E0F0 !important;
            border: 2px solid #9B8B7E !important;
        }
        .symptom-card {
            background-color: #ffffff;
            border: 1px solid #d0c4bc;
            transition: all 0.2s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="text-on-surface min-h-screen pb-32">
<header class="fixed top-0 w-full z-50 bg-[#F7F5F0]/80 backdrop-blur-md flex items-center justify-between px-6 py-4 transition-opacity duration-300">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform text-brand-taupe">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-noto-serif italic text-lg text-brand-taupe">Step 4 of 7</h1>
</div>
<div class="text-xl font-bold text-primary">MenoSync</div>
</header>
<main class="pt-20 px-6 max-w-xl mx-auto">
<section class="mb-6">
<h2 class="font-headline text-2xl font-bold text-on-surface leading-tight mb-2">Your Most Frequent Symptoms</h2>
<p class="font-body text-on-surface-variant text-[13px] leading-relaxed">
                Select your most frequent ones. We'll emphasize tracking them in your daily log.
            </p>
</section>
<div class="relative mb-6">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl" data-icon="search">search</span>
<input class="w-full bg-[#f2edea] border-brand-taupe/30 border rounded-full py-3 pl-12 pr-6 text-on-surface placeholder:text-outline/70 focus:ring-1 focus:ring-brand-taupe transition-all outline-none text-sm" placeholder="Search symptoms..." type="text"/>
</div>
<div class="h-1 w-full bg-surface-container rounded-full overflow-hidden mb-8">
<div class="h-full bg-brand-taupe w-[57%] transition-all duration-500"></div>
</div>
<div class="flex flex-col gap-3">
<button class="symptom-card symptom-card-selected relative flex items-center p-4 rounded-[10px] w-full text-left active:scale-[0.99]">
<div class="w-12 h-12 rounded-full bg-brand-taupe/10 flex items-center justify-center text-brand-taupe mr-4 shrink-0">
<span class="material-symbols-outlined text-2xl" data-icon="thermostat">thermostat</span>
</div>
<div class="flex-grow pr-8">
<p class="font-bold text-base text-on-surface">Hot Flashes</p>
<p class="text-xs text-on-surface-variant leading-tight">Sudden waves of heat</p>
</div>
<span class="material-symbols-outlined text-brand-taupe text-2xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="symptom-card flex items-center p-4 rounded-[10px] w-full text-left active:scale-[0.99]">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-secondary mr-4 shrink-0">
<span class="material-symbols-outlined text-2xl" data-icon="bedtime">bedtime</span>
</div>
<div class="flex-grow pr-8">
<p class="font-bold text-base text-on-surface">Night Sweats</p>
<p class="text-xs text-on-surface-variant leading-tight">Heavy sweating at night</p>
</div>
<div class="w-6 h-6 border-2 border-outline-variant rounded-full"></div>
</button>
<button class="symptom-card symptom-card-selected relative flex items-center p-4 rounded-[10px] w-full text-left active:scale-[0.99]">
<div class="w-12 h-12 rounded-full bg-brand-taupe/10 flex items-center justify-center text-brand-taupe mr-4 shrink-0">
<span class="material-symbols-outlined text-2xl" data-icon="nights_stay">nights_stay</span>
</div>
<div class="flex-grow pr-8">
<p class="font-bold text-base text-on-surface">Sleep Issues</p>
<p class="text-xs text-on-surface-variant leading-tight">Difficulty falling/staying asleep</p>
</div>
<span class="material-symbols-outlined text-brand-taupe text-2xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="symptom-card flex items-center p-4 rounded-[10px] w-full text-left active:scale-[0.99]">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-secondary mr-4 shrink-0">
<span class="material-symbols-outlined text-2xl" data-icon="mood_bad">mood_bad</span>
</div>
<div class="flex-grow pr-8">
<p class="font-bold text-base text-on-surface">Mood Changes</p>
<p class="text-xs text-on-surface-variant leading-tight">Anxiety, irritability, sadness</p>
</div>
<div class="w-6 h-6 border-2 border-outline-variant rounded-full"></div>
</button>
<button class="symptom-card flex items-center p-4 rounded-[10px] w-full text-left active:scale-[0.99]">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-secondary mr-4 shrink-0">
<span class="material-symbols-outlined text-2xl" data-icon="cloud">cloud</span>
</div>
<div class="flex-grow pr-8">
<p class="font-bold text-base text-on-surface">Brain Fog</p>
<p class="text-xs text-on-surface-variant leading-tight">Difficulty concentrating or remembering</p>
</div>
<div class="w-6 h-6 border-2 border-outline-variant rounded-full"></div>
</button>
<button class="symptom-card flex items-center p-4 rounded-[10px] w-full text-left active:scale-[0.99]">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-secondary mr-4 shrink-0">
<span class="material-symbols-outlined text-2xl" data-icon="accessibility_new">accessibility_new</span>
</div>
<div class="flex-grow pr-8">
<p class="font-bold text-base text-on-surface">Joint Pain</p>
<p class="text-xs text-on-surface-variant leading-tight">Aches and stiffness</p>
</div>
<div class="w-6 h-6 border-2 border-outline-variant rounded-full"></div>
</button>
<button class="symptom-card flex items-center p-4 rounded-[10px] w-full text-left active:scale-[0.99]">
<div class="w-12 h-12 rounded-full bg-tertiary-fixed flex items-center justify-center text-tertiary mr-4 shrink-0">
<span class="material-symbols-outlined text-2xl" data-icon="water_drop">water_drop</span>
</div>
<div class="flex-grow pr-8">
<p class="font-bold text-base text-on-surface">Vaginal Dryness</p>
<p class="text-xs text-on-surface-variant leading-tight">Discomfort or reduced lubrication</p>
</div>
<div class="w-6 h-6 border-2 border-outline-variant rounded-full"></div>
</button>
<button class="symptom-card flex items-center p-4 rounded-[10px] w-full text-left active:scale-[0.99]">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-secondary mr-4 shrink-0">
<span class="material-symbols-outlined text-2xl" data-icon="personal_injury">personal_injury</span>
</div>
<div class="flex-grow pr-8">
<p class="font-bold text-base text-on-surface">Headaches</p>
<p class="text-xs text-on-surface-variant leading-tight">Migraines or tension headaches</p>
</div>
<div class="w-6 h-6 border-2 border-outline-variant rounded-full"></div>
</button>
<button class="symptom-card flex items-center p-4 rounded-[10px] w-full text-left active:scale-[0.99]">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-secondary mr-4 shrink-0">
<span class="material-symbols-outlined text-2xl" data-icon="scale">scale</span>
</div>
<div class="flex-grow pr-8">
<p class="font-bold text-base text-on-surface">Weight Changes</p>
<p class="text-xs text-on-surface-variant leading-tight">Sudden weight gain or difficulty losing</p>
</div>
<div class="w-6 h-6 border-2 border-outline-variant rounded-full"></div>
</button>
<button class="symptom-card flex items-center p-4 rounded-[10px] w-full text-left active:scale-[0.99]">
<div class="w-12 h-12 rounded-full bg-tertiary-fixed flex items-center justify-center text-tertiary mr-4 shrink-0">
<span class="material-symbols-outlined text-2xl" data-icon="calendar_today">calendar_today</span>
</div>
<div class="flex-grow pr-8">
<p class="font-bold text-base text-on-surface">Irregular Periods</p>
<p class="text-xs text-on-surface-variant leading-tight">Unpredictable menstrual cycles</p>
</div>
<div class="w-6 h-6 border-2 border-outline-variant rounded-full"></div>
</button>
<button class="border-2 border-dashed border-brand-taupe/40 bg-white/50 p-4 rounded-[10px] flex items-center justify-center gap-3 active:scale-[0.99] mt-2 group">
<span class="material-symbols-outlined text-brand-taupe text-2xl" data-icon="add_circle">add_circle</span>
<p class="font-bold text-sm text-brand-taupe uppercase tracking-wider">Other Symptoms</p>
</button>
</div>
<div class="mt-10 mb-8 p-6 bg-white rounded-xl border border-outline-variant/30">
<p class="font-noto-serif italic text-on-surface-variant/80 text-[13px] mb-3 leading-relaxed">
                "Personalized tracking helps our experts provide better recommendations for your unique experience."
            </p>
<div class="h-[1px] bg-outline-variant/20 w-full mb-3"></div>
<p class="font-body text-[11px] text-outline uppercase tracking-widest text-center">Step 4 of 7</p>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full bg-[#F7F5F0]/90 backdrop-blur-lg px-6 pb-8 pt-4 flex flex-col items-center gap-4 z-50">
<button class="text-[12px] font-bold text-outline hover:text-primary transition-colors tracking-widest uppercase">
            Skip this step
        </button>
<button class="w-full bg-brand-taupe text-white py-4 rounded-[10px] font-bold text-lg shadow-md active:scale-95 transition-all">
            Continue
        </button>
</footer>

</body></html>
