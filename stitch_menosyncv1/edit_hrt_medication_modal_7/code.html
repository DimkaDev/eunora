<style>
        body { font-family: 'Manrope', sans-serif; }
        .serif { font-family: 'Noto Serif', serif; }

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        .bottom-sheet-gradient {
            background: linear-gradient(180deg, rgba(254, 248, 246, 0) 0%, rgba(254, 248, 246, 1) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface min-h-screen">
<!-- Dashboard Background (Simulated) -->
<div class="fixed inset-0 z-0 overflow-hidden px-6 pt-20">
<!-- TopAppBar Placeholder (Using JSON styles) -->
<header class="fixed top-0 left-0 w-full z-10 flex justify-between items-center px-6 py-4 bg-[#fef8f6]/70 dark:bg-stone-900/70 backdrop-blur-xl shadow-[0_4px_20px_rgba(29,27,26,0.04)]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#9B8B7E]">menu</span>
<h1 class="font-serif italic text-2xl tracking-tight text-[#9B8B7E]">Daily Bloom</h1>
</div>
<span class="material-symbols-outlined text-[#9B8B7E]">account_circle</span>
</header>
<!-- Background Content -->
<div class="space-y-8 mt-4 opacity-40 blur-[2px]">
<div class="flex items-center justify-between">
<h2 class="headline-md serif text-3xl">Hello, Elena</h2>
<div class="w-12 h-12 rounded-full bg-secondary-fixed"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="h-32 bg-surface-container rounded-xl p-4 flex flex-col justify-between">
<span class="material-symbols-outlined text-primary">edit_note</span>
<div class="h-4 w-2/3 bg-outline-variant/30 rounded"></div>
</div>
<div class="h-32 bg-surface-container rounded-xl p-4 flex flex-col justify-between">
<span class="material-symbols-outlined text-primary">auto_graph</span>
<div class="h-4 w-1/2 bg-outline-variant/30 rounded"></div>
</div>
</div>
<div class="p-6 bg-surface-container-lowest rounded-xl shadow-sm">
<div class="h-6 w-1/3 bg-outline-variant/20 rounded mb-4"></div>
<div class="space-y-3">
<div class="h-4 w-full bg-outline-variant/10 rounded"></div>
<div class="h-4 w-5/6 bg-outline-variant/10 rounded"></div>
</div>
</div>
</div>
</div>
<!-- Modal Backdrop Overlay -->
<div class="fixed inset-0 z-20 bg-on-surface/20 backdrop-blur-[2px]"></div>
<!-- Bottom Sheet Modal -->
<div class="fixed inset-x-0 bottom-0 z-30 transform translate-y-0 transition-transform duration-300">
<div class="bg-surface rounded-t-[2.5rem] shadow-[0_-8px_32px_rgba(29,27,26,0.08)] flex flex-col max-w-2xl mx-auto border-t border-outline-variant/10">
<!-- Drag Handle -->
<div class="flex justify-center pt-4 pb-2">
<div class="w-10 h-1 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="px-8 pt-4 pb-6 text-center">
<h2 class="headline-md serif text-2xl text-on-surface mb-1">Edit Medication</h2>
<p class="body-md text-on-surface-variant font-medium">Estradiol Patch</p>
</div>
<!-- Form Content -->
<div class="px-8 pb-10 space-y-8">
<!-- Time Taken Field -->
<div class="space-y-3">
<label class="font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant/80 ml-1">Time taken</label>
<button class="w-full h-16 bg-surface-container-highest rounded-full flex items-center justify-between px-8 hover:bg-surface-variant transition-colors group">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-2xl">schedule</span>
<span class="text-xl font-body font-semibold text-on-surface">08:30 AM</span>
</div>
<span class="material-symbols-outlined text-outline group-active:scale-90 transition-transform">expand_more</span>
</button>
</div>
<!-- Dosage Field -->
<div class="space-y-3">
<label class="font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant/80 ml-1">Dose</label>
<div class="flex items-center gap-3">
<div class="relative flex-grow">
<input class="w-full h-16 bg-surface-container-highest border-none rounded-full px-8 text-xl font-body font-semibold focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant" placeholder="0.05" type="number"/>
</div>
<div class="flex bg-surface-container-high p-1.5 rounded-full">
<button class="px-4 py-2 bg-surface-container-lowest rounded-full text-xs font-bold text-on-surface shadow-sm">mcg</button>
<button class="px-4 py-2 text-xs font-bold text-on-surface-variant/60">mg</button>
</div>
</div>
</div>
<!-- Reflection Space Pattern -->
<div class="p-6 bg-surface-container-low rounded-xl border border-outline-variant/10">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary text-xl mt-0.5">info</span>
<p class="text-sm italic serif text-on-surface-variant leading-relaxed">
                            "Consistent timing helps maintain steady hormone levels in your system."
                        </p>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-8 pb-12 space-y-4">
<button class="w-full h-16 bg-gradient-to-r from-primary to-primary-container rounded-full text-on-primary font-label font-bold text-base shadow-lg shadow-primary/10 active:scale-[0.98] transition-transform">
                    Save Changes
                </button>
<button class="w-full py-2 text-primary font-label font-bold text-sm tracking-wide hover:opacity-70 transition-opacity">
                    Cancel
                </button>
</div>
</div>
</div>
<!-- BottomNavBar (Suppressed for focused modal task) -->
<!-- The BottomNavBar is visually excluded to prioritize the focused Edit journey per the "Shell Visibility & Relevance" rule -->
<!-- Decorative Glow Element (The Progress Veil Pattern) -->
<div class="fixed -bottom-24 left-1/2 -translate-x-1/2 w-[120%] h-64 bg-secondary-fixed/20 blur-[80px] -z-10 rounded-full"></div>
