<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Verify Your Email</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed-dim": "#d0c1d8",
                      "on-error": "#ffffff",
                      "tertiary-container": "#9d675c",
                      "on-tertiary": "#ffffff",
                      "tertiary": "#814f45",
                      "outline": "#7f756e",
                      "error": "#ba1a1a",
                      "primary-fixed": "#f2dfd0",
                      "on-primary": "#ffffff",
                      "on-surface-variant": "#4d453f",
                      "inverse-surface": "#32302f",
                      "inverse-primary": "#d6c3b5",
                      "outline-variant": "#d0c4bc",
                      "primary-fixed-dim": "#d6c3b5",
                      "surface-tint": "#6a5c50",
                      "tertiary-fixed": "#ffdad3",
                      "surface-bright": "#fef8f6",
                      "on-tertiary-fixed-variant": "#683a31",
                      "on-primary-container": "#fffbff",
                      "surface": "#fef8f6",
                      "on-secondary-container": "#6c6074",
                      "surface-container-low": "#f8f2f0",
                      "inverse-on-surface": "#f5f0ed",
                      "surface-variant": "#e7e1df",
                      "on-secondary": "#ffffff",
                      "on-background": "#1d1b1a",
                      "background": "#fef8f6",
                      "secondary-container": "#edddf5",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed": "#211828",
                      "on-tertiary-container": "#fffbff",
                      "on-surface": "#1d1b1a",
                      "surface-container-highest": "#e7e1df",
                      "surface-container-high": "#ede7e5",
                      "on-secondary-fixed-variant": "#4d4355",
                      "surface-dim": "#ded9d7",
                      "surface-container": "#f2edea",
                      "secondary": "#655a6e",
                      "tertiary-fixed-dim": "#f9b7a9",
                      "on-primary-fixed": "#231a11",
                      "primary": "#67594e",
                      "on-primary-fixed-variant": "#51443a",
                      "error-container": "#ffdad6",
                      "secondary-fixed": "#edddf5",
                      "on-error-container": "#93000a",
                      "on-tertiary-fixed": "#341009",
                      "primary-container": "#817266"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Noto Serif"],
                      "body": ["Manrope"],
                      "label": ["Manrope"]
              }
            },
          },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #F7F5F0;
        }
        .bottom-shelf {
            box-shadow: 0 -10px 40px rgba(0,0,0,0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body text-on-surface antialiased min-h-screen flex flex-col relative overflow-hidden">
<header class="w-full pt-8 pb-4 px-6 z-10">
<button class="mb-8 text-primary hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col items-center text-center gap-4">
<div class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center text-primary mb-2">
<span class="material-symbols-outlined text-[32px]">mail</span>
</div>
<div class="space-y-2">
<h1 class="font-headline text-[24px] font-semibold text-on-surface leading-tight">Verify Your Email</h1>
<p class="text-[13px] text-on-surface-variant max-w-[280px] mx-auto">
                    We sent a verification code to <span class="font-semibold text-primary">sarah@email.com</span>
</p>
</div>
</div>
</header>
<main class="flex-grow flex flex-col justify-end px-6 pb-[309px]">
<div class="flex items-center justify-between gap-4 mb-6">
<div class="flex flex-col gap-1">
<p class="text-[12px] text-on-surface-variant font-medium">Didn't receive the code?</p>
<div class="flex items-center gap-3">
<button class="text-primary font-bold text-[13px] hover:underline">
                        Resend Code
                    </button>
<span class="text-[11px] text-on-surface-variant/50">Resend in <span class="text-primary">45s</span></span>
</div>
</div>
<div class="h-8 w-[1px] bg-outline-variant/30"></div>
<a class="text-[12px] text-primary font-semibold underline underline-offset-4 decoration-primary/30" href="#">
                Use a different email
            </a>
</div>
</main>
<div class="fixed bottom-0 left-0 w-full bg-surface bottom-shelf rounded-t-[40px] px-8 pt-10 pb-12 z-20">
<div class="max-w-[340px] mx-auto space-y-6">
<div class="space-y-3">
<div class="flex justify-between items-end px-1">
<label class="text-[13px] font-bold text-on-surface-variant uppercase tracking-wider" for="verification-code">
                        Enter code
                    </label>
<div class="flex items-center gap-1.5 text-on-surface-variant/60">
<span class="material-symbols-outlined text-xs">info</span>
<p class="text-[11px]">Check spam folder</p>
</div>
</div>
<input class="w-full h-20 bg-[#EEEEEE] border-2 border-[#9B8B7E] rounded-[18px] text-center font-mono text-3xl tracking-[0.4em] text-[#3A3A3A] placeholder:text-[#9B8B7E]/30 focus:outline-none focus:ring-4 focus:ring-[#E8E0F0] focus:border-[#9B8B7E] transition-all" id="verification-code" maxlength="6" placeholder="000000" type="text"/>
</div>
<button class="w-full py-5 bg-[#9B8B7E] text-white rounded-[20px] font-bold text-[16px] shadow-lg shadow-[#9B8B7E]/20 active:scale-[0.98] transition-transform">
                Verify Email
            </button>
</div>
</div>
<div class="fixed top-[15%] -left-20 w-72 h-72 bg-secondary-container/10 rounded-full blur-[80px] pointer-events-none"></div>
<div class="fixed top-0 -right-20 w-64 h-64 bg-primary-fixed/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="hidden fixed bottom-[318px] left-6 right-6 z-30">
<div class="bg-error-container text-on-error-container px-4 py-3 rounded-2xl flex items-center gap-3 shadow-xl">
<span class="material-symbols-outlined text-error">error</span>
<span class="text-sm font-medium">Invalid code. Please try again.</span>
</div>
</div>

</body></html>
