<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f5f0ed",
                        "primary-fixed": "#f2dfd0",
                        "primary": "#67594e",
                        "tertiary-container": "#9d675c",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#ede7e5",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#231a11",
                        "secondary-fixed": "#edddf5",
                        "background": "#F7F5F0",
                        "secondary": "#655a6e",
                        "secondary-fixed-dim": "#d0c1d8",
                        "outline-variant": "#d0c4bc",
                        "on-secondary-fixed": "#211828",
                        "inverse-primary": "#d6c3b5",
                        "on-error": "#ffffff",
                        "tertiary": "#814f45",
                        "surface-container": "#f2edea",
                        "surface-bright": "#fef8f6",
                        "on-tertiary-container": "#fffbff",
                        "surface-variant": "#e7e1df",
                        "surface": "#fef8f6",
                        "tertiary-fixed": "#ffdad3",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#32302f",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "outline": "#7f756e",
                        "on-secondary-container": "#6c6074",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#edddf5",
                        "on-surface-variant": "#4d453f",
                        "error": "#ba1a1a",
                        "surface-dim": "#ded9d7",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-primary-fixed-variant": "#51443a",
                        "on-background": "#1d1b1a",
                        "surface-tint": "#6a5c50",
                        "primary-container": "#817266",
                        "on-surface": "#1d1b1a",
                        "on-primary-container": "#fffbff",
                        "surface-container-highest": "#e7e1df",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-tertiary-fixed": "#341009",
                        "surface-container-low": "#f8f2f0",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
    .trigger-pill {
        @apply flex items-center gap-2 px-3 py-2 rounded-full border bg-white transition-all active:scale-95 duration-150;
        border-color: #E8E2DD;
    }
    .trigger-pill.selected {
        background-color: #67594E;
        border-color: #67594E;
        color: white;
    }
    .trigger-pill.selected .material-symbols-outlined {
        color: white !important;
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
    body {
      min-height: 100dvh;
    }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface antialiased">
<header class="sticky top-0 z-50 bg-[#F7F5F0]/80 backdrop-blur-xl flex items-center justify-between px-6 py-4 w-full border-b border-outline-variant/10">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-200 transition-opacity text-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-xl tracking-tight text-primary">Logging</h1>
</div>
<button class="active:scale-95 duration-200 transition-opacity text-primary">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<main class="max-w-2xl mx-auto px-6 pb-40 pt-6">
<div class="mb-8">
<h2 class="font-headline font-bold text-2xl text-on-surface leading-tight">
            What might have caused this?
        </h2>
<p class="mt-2 text-on-surface-variant text-sm font-medium opacity-80">
            Tap triggers for quick logging. Speed matters.
        </p>
</div>
<div class="flex flex-wrap gap-2">
<button class="trigger-pill selected">
<span class="material-symbols-outlined text-primary text-lg" data-icon="coffee">coffee</span>
<span class="text-xs font-semibold uppercase tracking-wider">Caffeine</span>
</button>
<button class="trigger-pill">
<span class="material-symbols-outlined text-primary text-lg" data-icon="wine_bar">wine_bar</span>
<span class="text-xs font-semibold uppercase tracking-wider">Alcohol</span>
</button>
<button class="trigger-pill">
<span class="material-symbols-outlined text-primary text-lg" data-icon="psychology_alt">psychology_alt</span>
<span class="text-xs font-semibold uppercase tracking-wider">Stress</span>
</button>
<button class="trigger-pill">
<span class="material-symbols-outlined text-primary text-lg" data-icon="fitness_center">fitness_center</span>
<span class="text-xs font-semibold uppercase tracking-wider">Exercise</span>
</button>
<button class="trigger-pill">
<span class="material-symbols-outlined text-primary text-lg" data-icon="thermostat">thermostat</span>
<span class="text-xs font-semibold uppercase tracking-wider">Weather</span>
</button>
<button class="trigger-pill">
<span class="material-symbols-outlined text-primary text-lg" data-icon="bedtime">bedtime</span>
<span class="text-xs font-semibold uppercase tracking-wider">Poor Sleep</span>
</button>
<button class="trigger-pill">
<span class="material-symbols-outlined text-primary text-lg" data-icon="restaurant">restaurant</span>
<span class="text-xs font-semibold uppercase tracking-wider">Foods</span>
</button>
<button class="trigger-pill">
<span class="material-symbols-outlined text-primary text-lg" data-icon="flight">flight</span>
<span class="text-xs font-semibold uppercase tracking-wider">Travel</span>
</button>
<button class="trigger-pill">
<span class="material-symbols-outlined text-primary text-lg" data-icon="water_drop">water_drop</span>
<span class="text-xs font-semibold uppercase tracking-wider">Hydration</span>
</button>
<button class="trigger-pill">
<span class="material-symbols-outlined text-primary text-lg" data-icon="work">work</span>
<span class="text-xs font-semibold uppercase tracking-wider">Work Load</span>
</button>
<button class="trigger-pill">
<span class="material-symbols-outlined text-primary text-lg" data-icon="pill">pill</span>
<span class="text-xs font-semibold uppercase tracking-wider">Meds</span>
</button>
<button class="flex items-center gap-2 px-3 py-2 rounded-full border-2 border-dashed border-outline-variant bg-transparent transition-all active:scale-95 duration-150">
<span class="material-symbols-outlined text-outline text-lg" data-icon="add">add</span>
<span class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Custom</span>
</button>
</div>
<div class="mt-10 p-6 rounded-2xl bg-surface-container/30 border border-outline-variant/20">
<h3 class="font-headline italic text-base text-primary mb-2">Efficiency Note</h3>
<p class="font-body text-on-surface-variant text-xs leading-relaxed opacity-90">
            Rapid logging helps identify subtle lifestyle correlations. Your daily consistency builds more accurate health insights.
        </p>
</div>
</main>
<div class="fixed bottom-0 left-0 w-full z-50 bg-[#F7F5F0]/90 backdrop-blur-md px-6 py-6 border-t border-outline-variant/10">
<div class="max-w-2xl mx-auto flex items-center gap-4">
<button class="flex-1 py-3.5 px-6 rounded-full font-bold text-primary bg-surface-container-high active:scale-95 transition-all text-sm">
            Back
        </button>
<button class="flex-[2] py-3.5 px-6 rounded-full font-bold text-white bg-primary shadow-lg shadow-primary/10 active:scale-95 transition-all text-sm">
            Save Log
        </button>
</div>
</div>

</body></html>
