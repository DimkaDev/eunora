<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Verify Your Email</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed-dim": "#d0c1d8",
                      "on-error": "#ffffff",
                      "tertiary-container": "#9d675c",
                      "on-tertiary": "#ffffff",
                      "tertiary": "#814f45",
                      "outline": "#7f756e",
                      "error": "#ba1a1a",
                      "primary-fixed": "#f2dfd0",
                      "on-primary": "#ffffff",
                      "on-surface-variant": "#4d453f",
                      "inverse-surface": "#32302f",
                      "inverse-primary": "#d6c3b5",
                      "outline-variant": "#d0c4bc",
                      "primary-fixed-dim": "#d6c3b5",
                      "surface-tint": "#6a5c50",
                      "tertiary-fixed": "#ffdad3",
                      "surface-bright": "#fef8f6",
                      "on-tertiary-fixed-variant": "#683a31",
                      "on-primary-container": "#fffbff",
                      "surface": "#fef8f6",
                      "on-secondary-container": "#6c6074",
                      "surface-container-low": "#f8f2f0",
                      "inverse-on-surface": "#f5f0ed",
                      "surface-variant": "#e7e1df",
                      "on-secondary": "#ffffff",
                      "on-background": "#1d1b1a",
                      "background": "#fef8f6",
                      "secondary-container": "#edddf5",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed": "#211828",
                      "on-tertiary-container": "#fffbff",
                      "on-surface": "#1d1b1a",
                      "surface-container-highest": "#e7e1df",
                      "surface-container-high": "#ede7e5",
                      "on-secondary-fixed-variant": "#4d4355",
                      "surface-dim": "#ded9d7",
                      "surface-container": "#f2edea",
                      "secondary": "#655a6e",
                      "tertiary-fixed-dim": "#f9b7a9",
                      "on-primary-fixed": "#231a11",
                      "primary": "#67594e",
                      "on-primary-fixed-variant": "#51443a",
                      "error-container": "#ffdad6",
                      "secondary-fixed": "#edddf5",
                      "on-error-container": "#93000a",
                      "on-tertiary-fixed": "#341009",
                      "primary-container": "#817266"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Noto Serif"],
                      "body": ["Manrope"],
                      "label": ["Manrope"]
              }
            },
          },
        }
      </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-cream { background-color: #fef8f6; } /* Using surface token for cream background */
        .tap-highlight-none { -webkit-tap-highlight-color: transparent; }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased">
<!-- Top AppBar (Simulated from JSON but for back action) -->
<header class="w-full top-0 sticky bg-surface dark:bg-stone-950 flex items-center justify-between px-6 py-4 w-full z-10">
<div class="flex items-center gap-4">
<button class="text-primary dark:text-[#D8C9E0] hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-headline italic text-2xl text-primary dark:text-[#D8C9E0]">MenoSync</span>
</div>
</header>
<main class="min-h-[calc(100vh-72px)] flex flex-col items-center justify-start pt-8 pb-12 px-6 overflow-y-auto">
<!-- Error State Banner (Conditional Visibility Mockup) -->
<div class="hidden w-full max-w-[340px] mb-6 bg-error-container text-on-error-container px-4 py-3 rounded-xl flex items-center gap-3 animate-in fade-in slide-in-from-top-2 duration-300">
<span class="material-symbols-outlined text-error">error</span>
<span class="text-sm font-medium">Invalid code. Please try again.</span>
</div>
<!-- Success State Banner (Hidden by default) -->
<div class="hidden w-full max-w-[340px] mb-6 bg-secondary-container text-on-secondary-container px-4 py-3 rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-sm font-medium uppercase tracking-wider">Email verified!</span>
</div>
<div class="w-full max-w-[340px] flex flex-col items-center gap-8">
<!-- Header Section -->
<section class="flex flex-col items-center text-center gap-4">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[40px]">mail</span>
</div>
<div class="space-y-2">
<h1 class="font-headline text-[22px] font-semibold text-on-surface leading-tight">Verify Your Email</h1>
<p class="text-[13px] text-on-surface-variant max-w-[280px] mx-auto">
                        We sent a verification code to <span class="font-semibold text-primary">sarah@email.com</span>
</p>
</div>
</section>
<!-- Section 1: Code Input -->
<section class="w-full space-y-4">
<label class="block text-[13px] font-bold text-on-surface-variant px-1" for="verification-code">
                    Enter verification code
                </label>
<div class="relative group">
<input class="w-full h-14 bg-surface-container-high border-2 border-outline-variant rounded-xl text-center font-mono text-2xl tracking-[0.5em] text-on-surface placeholder:text-outline-variant/50 focus:outline-none focus:ring-4 focus:ring-secondary-container focus:border-secondary transition-all duration-300" id="verification-code" maxlength="6" placeholder="000000" type="text"/>
</div>
<div class="flex items-center justify-center gap-2 text-on-surface-variant/70">
<span class="material-symbols-outlined text-sm">info</span>
<p class="text-[12px]">Check your email (spam folder too)</p>
</div>
</section>
<!-- Section 2: Buttons -->
<section class="w-full">
<button class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-white rounded-xl font-bold text-[15px] shadow-sm hover:opacity-95 active:scale-[0.98] transition-all duration-200">
                    Verify Email
                </button>
</section>
<!-- Section 3: Resend -->
<section class="w-full flex flex-col items-center gap-6">
<div class="w-full h-[1px] bg-outline-variant opacity-20"></div>
<div class="flex flex-col items-center gap-4 w-full">
<p class="text-[13px] text-on-surface-variant font-medium">Didn't receive the code?</p>
<button class="w-full py-3 bg-surface border-2 border-primary text-primary rounded-xl font-bold text-[14px] hover:bg-surface-container-low transition-colors active:scale-[0.98]">
                        Resend Code
                    </button>
<p class="text-[12px] text-on-surface-variant/60 font-medium">
                        Resend in <span class="text-primary">45s</span>
</p>
</div>
</section>
<!-- Section 4: Change Email -->
<section class="w-full pt-4">
<a class="block text-center text-[12px] text-primary font-semibold underline underline-offset-4 decoration-primary/30 hover:text-primary-container transition-colors" href="#">
                    Use a different email
                </a>
</section>
</div>
</main>
<!-- Visual Embellishment (Optional Magazine-feel asset) -->
<div class="fixed top-[20%] -right-12 w-48 h-48 bg-secondary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed bottom-[10%] -left-12 w-64 h-64 bg-tertiary-fixed/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Navigation suppression as per instructions for task-focused page -->
</body></html>
