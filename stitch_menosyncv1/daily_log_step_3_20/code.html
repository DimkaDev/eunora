<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log Your Symptoms | MenoSync Guided</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#67594e",
                        "surface": "#F7F5F0",
                        "taupe": "#9B8B7E",
                        "lavender-soft": "#E6E1F0",
                        "charcoal": "#333333",
                        "outline-soft": "#D0C4BC",
                        "on-surface": "#1d1b1a"
                    },
                    fontFamily: {
                        "serif": ["Noto Serif", "serif"],
                        "sans": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-surface text-on-surface font-sans overflow-hidden h-screen w-screen;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .circular-slider-container {
            position: relative;
            width: 280px;
            height: 280px;
        }
        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 99px;
            @apply bg-outline-soft;
        }
        .progress-dot.active {
            @apply bg-taupe w-6;
        }
        .glass-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .7; }
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col">
<header class="pt-8 px-6 pb-4 bg-surface">
<div class="flex justify-between items-center mb-6">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-sm text-primary">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex gap-2">
<div class="progress-dot"></div>
<div class="progress-dot"></div>
<div class="progress-dot active"></div>
</div>
<div class="w-10"></div>
</div>
<div class="w-full bg-outline-soft/30 h-1 rounded-full overflow-hidden">
<div class="bg-taupe h-full w-3/5 rounded-full transition-all duration-500"></div>
</div>
<p class="text-[10px] uppercase tracking-[0.2em] font-bold text-taupe mt-3 text-center">Step 3 of 5: Triggers</p>
</header>
<main class="flex-1 overflow-y-auto px-6 pt-4 pb-48">
<div class="flex flex-col items-center text-center max-w-md mx-auto" id="step-triggers">
<h2 class="serif text-2xl font-semibold text-charcoal mb-4 leading-relaxed">What might have triggered your symptoms?</h2>
<p class="text-primary/60 text-sm mb-10">Select all that apply to today's entry</p>
<div class="grid grid-cols-2 gap-4 w-full">
<button class="flex flex-col items-center justify-center p-6 rounded-3xl bg-white border-2 border-transparent shadow-sm hover:border-taupe/20 transition-all">
<span class="material-symbols-outlined text-3xl mb-3 text-taupe" style="font-variation-settings: 'wght' 300;">coffee</span>
<span class="text-sm font-bold text-primary">Caffeine</span>
</button>
<button class="flex flex-col items-center justify-center p-6 rounded-3xl bg-white border-2 border-transparent shadow-sm hover:border-taupe/20 transition-all">
<span class="material-symbols-outlined text-3xl mb-3 text-taupe" style="font-variation-settings: 'wght' 300;">wine_bar</span>
<span class="text-sm font-bold text-primary">Alcohol</span>
</button>
<button class="flex flex-col items-center justify-center p-6 rounded-3xl bg-lavender-soft/50 border-2 border-taupe shadow-md transition-all relative">
<div class="absolute top-3 right-3 bg-taupe text-white rounded-full p-0.5">
<span class="material-symbols-outlined text-[14px] block">check</span>
</div>
<span class="material-symbols-outlined text-3xl mb-3 text-taupe" style="font-variation-settings: 'FILL' 1;">psychology</span>
<span class="text-sm font-bold text-primary">Stress</span>
</button>
<button class="flex flex-col items-center justify-center p-6 rounded-3xl bg-white border-2 border-transparent shadow-sm hover:border-taupe/20 transition-all">
<span class="material-symbols-outlined text-3xl mb-3 text-taupe" style="font-variation-settings: 'wght' 300;">fitness_center</span>
<span class="text-sm font-bold text-primary">Exercise</span>
</button>
<button class="flex flex-col items-center justify-center p-6 rounded-3xl bg-white border-2 border-transparent shadow-sm hover:border-taupe/20 transition-all">
<span class="material-symbols-outlined text-3xl mb-3 text-taupe" style="font-variation-settings: 'wght' 300;">thermostat</span>
<span class="text-sm font-bold text-primary">Weather</span>
</button>
<button class="flex flex-col items-center justify-center p-6 rounded-3xl bg-white border-2 border-transparent shadow-sm hover:border-taupe/20 transition-all">
<span class="material-symbols-outlined text-3xl mb-3 text-taupe" style="font-variation-settings: 'wght' 300;">restaurant</span>
<span class="text-sm font-bold text-primary">Foods</span>
</button>
</div>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full p-6 pt-2 bg-surface/90 backdrop-blur-md z-40">
<div class="max-w-lg mx-auto flex flex-col gap-4">
<button class="w-full py-4 border-2 border-dashed border-outline-soft bg-white/50 text-taupe font-bold rounded-2xl active:scale-[0.98] duration-200 transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-widest">
<span class="material-symbols-outlined text-xl">add</span>
                Add Custom Symptom
            </button>
<div class="flex gap-4">
<button class="flex-1 py-5 bg-white border border-outline-soft text-primary font-bold rounded-[2rem] active:scale-95 duration-200 transition-all text-sm uppercase tracking-widest">
                    Back
                </button>
<button class="flex-[2] py-5 bg-taupe text-white font-bold rounded-[2rem] shadow-lg shadow-taupe/20 active:scale-95 duration-200 transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-[0.2em]">
                    Continue <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
<div class="mt-2 flex justify-center gap-1.5 opacity-30">
<div class="h-1 w-4 bg-taupe rounded-full"></div>
<div class="h-1 w-1 bg-taupe rounded-full"></div>
<div class="h-1 w-1 bg-taupe rounded-full"></div>
<div class="h-1 w-1 bg-taupe rounded-full"></div>
<div class="h-1 w-1 bg-taupe rounded-full"></div>
</div>
</div>
</footer>

</body></html>
