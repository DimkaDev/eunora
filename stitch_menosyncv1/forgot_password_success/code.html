<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3 {
            font-family: 'Noto Serif', serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation Suppression (Transactional Screen Rule) -->
<!-- Content Canvas -->
<main class="flex-grow flex items-center justify-center px-6 py-12 relative overflow-hidden">
<!-- Subtle Ambient Background Decor -->
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-secondary-container opacity-20 blur-[80px] rounded-full"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-80 h-80 bg-tertiary-fixed opacity-15 blur-[100px] rounded-full"></div>
<div class="max-w-md w-full text-center z-10">
<!-- Celebratory Icon Container -->
<div class="mb-8 inline-flex items-center justify-center">
<div class="w-24 h-24 bg-surface-container-lowest rounded-full flex items-center justify-center shadow-[0_4px_24px_rgba(29,27,26,0.04)] relative">
<!-- Progress Glow Effect -->
<div class="absolute inset-0 bg-gradient-to-tr from-[#D8C9E0]/30 to-transparent rounded-full blur-xl"></div>
<span class="material-symbols-outlined text-[48px] text-[#43A047] relative z-10" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">
                        check_circle
                    </span>
</div>
</div>
<!-- Title & Messaging -->
<h1 class="text-primary text-[1.125rem] font-medium leading-snug mb-3 tracking-tight">
                Password reset successfully!
            </h1>
<p class="text-on-surface-variant text-[0.75rem] font-body leading-relaxed mb-12 max-w-[240px] mx-auto">
                You can now log in with your new password
            </p>
<!-- Card Layout (Tonal Layering instead of borders) -->
<div class="bg-surface-container-lowest rounded-xl p-2 mb-12 shadow-[0_8px_32px_rgba(29,27,26,0.03)]">
<div class="relative w-full aspect-video rounded-lg overflow-hidden mb-0">
<img alt="Peaceful morning light" class="w-full h-full object-cover opacity-80" data-alt="Soft morning sunlight streaming through a window onto a cozy, minimal wellness space with warm neutral tones and serene atmosphere" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCd0eOVpVV4NgFzOE9va4Opwk4-0J_RvOR1hcb6-KQMuHLcblUNPUqkYsIQDcZTKEduXYaVYM3vjqQ3QA_tuSCqD0gy8tfqN7urLVrvumHlDGZon6hcdGrhHIZ-yvR_2-U6MEzeWzf6Qjvwq9RTwg-mPANYLON-aC0f8bXyNFgrfUjdazOTnGzdDlxCo5Qnk5CJZgysBarnU7X5EBTCINVlZlzqNJI1SddBV9BOAm08XW8aHmtmcuEha-N03ZQbp7yuluLFoMgft7s"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/80 to-transparent"></div>
</div>
</div>
<!-- Action Button -->
<div class="space-y-4">
<button class="w-full h-14 bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-xl font-label text-[0.875rem] font-semibold tracking-wide shadow-sm hover:opacity-95 transition-all active:scale-[0.98] duration-150">
                    Return to Login
                </button>
<p class="text-[0.75rem] text-on-surface-variant/60 font-body italic">
                    Redirecting to home in 5 seconds...
                </p>
</div>
</div>
</main>
<!-- Bottom Navigation Suppression (Transactional Screen Rule) -->
</body></html>
