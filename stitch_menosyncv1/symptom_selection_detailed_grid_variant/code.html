<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Frequent Symptoms Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "peachy-rose": "#E8A89B",
                        "soft-lavender": "#D8C9E0",
                        "charcoal": "#333333",
                        "cream-bg": "#F7F5F0",
                        "primary": "#E8A89B",
                        "on-surface": "#333333",
                        "on-surface-variant": "#666666",
                        "outline": "#D1D5DB",
                    },
                    borderRadius: {
                        "pill": "50px",
                    },
                    fontFamily: {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                font-family: 'Manrope', sans-serif;
                -webkit-font-smoothing: antialiased;
                background-color: #F7F5F0;
            }
        }
        .font-noto-serif { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-on-surface min-h-screen pb-36">
<header class="fixed top-0 w-full z-50 bg-[#F7F5F0]/80 backdrop-blur-md flex items-center justify-between px-6 py-4 transition-opacity duration-300">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform text-charcoal">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-noto-serif italic text-sm text-on-surface-variant">Step 4 of 7</span>
</div>
<div class="text-lg font-bold text-peachy-rose tracking-tight">MenoSync</div>
</header>
<main class="pt-24 px-6 max-w-2xl mx-auto">
<section class="mb-8">
<h2 class="font-headline text-2xl font-bold text-charcoal leading-tight mb-2">Your Most Frequent Symptoms</h2>
<p class="font-body text-on-surface-variant text-[13px] leading-relaxed">
                Select your most frequent ones. We'll emphasize tracking them in your daily log.
            </p>
</section>
<div class="relative mb-8">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50" data-icon="search">search</span>
<input class="w-full bg-white border border-gray-200 rounded-full py-3.5 pl-12 pr-6 text-on-surface placeholder:text-gray-400 focus:ring-2 focus:ring-peachy-rose/30 focus:border-peachy-rose transition-all outline-none" placeholder="Search symptoms..." type="text"/>
</div>
<div class="grid grid-cols-1 gap-4">
<button class="bg-peachy-rose/10 border-2 border-peachy-rose text-left p-5 rounded-2xl transition-all active:scale-[0.98] flex items-center gap-4 relative shadow-sm">
<div class="w-16 h-16 shrink-0 rounded-2xl bg-white flex items-center justify-center text-peachy-rose shadow-sm">
<span class="material-symbols-outlined text-3xl" data-icon="thermostat">thermostat</span>
</div>
<div class="flex-1 pr-8">
<p class="font-bold text-base text-charcoal">Hot Flashes</p>
<p class="text-[13px] text-on-surface-variant leading-snug mt-1">Sudden, intense waves of heat across the body.</p>
</div>
<span class="material-symbols-outlined absolute top-5 right-5 text-peachy-rose text-xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="bg-white border border-gray-100 text-left p-5 rounded-2xl transition-all active:scale-[0.98] flex items-center gap-4 hover:shadow-md">
<div class="w-16 h-16 shrink-0 rounded-2xl bg-soft-lavender/30 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-3xl" data-icon="bedtime">bedtime</span>
</div>
<div class="flex-1">
<p class="font-bold text-base text-charcoal">Night Sweats</p>
<p class="text-[13px] text-on-surface-variant leading-snug mt-1">Heavy sweating that interrupts your sleep.</p>
</div>
</button>
<button class="bg-peachy-rose/10 border-2 border-peachy-rose text-left p-5 rounded-2xl transition-all active:scale-[0.98] flex items-center gap-4 relative shadow-sm">
<div class="w-16 h-16 shrink-0 rounded-2xl bg-white flex items-center justify-center text-peachy-rose shadow-sm">
<span class="material-symbols-outlined text-3xl" data-icon="nights_stay">nights_stay</span>
</div>
<div class="flex-1 pr-8">
<p class="font-bold text-base text-charcoal">Sleep Issues</p>
<p class="text-[13px] text-on-surface-variant leading-snug mt-1">Trouble falling or staying asleep at night.</p>
</div>
<span class="material-symbols-outlined absolute top-5 right-5 text-peachy-rose text-xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="bg-white border border-gray-100 text-left p-5 rounded-2xl transition-all active:scale-[0.98] flex items-center gap-4 hover:shadow-md">
<div class="w-16 h-16 shrink-0 rounded-2xl bg-soft-lavender/30 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-3xl" data-icon="mood_bad">mood_bad</span>
</div>
<div class="flex-1">
<p class="font-bold text-base text-charcoal">Mood Changes</p>
<p class="text-[13px] text-on-surface-variant leading-snug mt-1">Unexplained anxiety, irritability, or sadness.</p>
</div>
</button>
<button class="bg-white border border-gray-100 text-left p-5 rounded-2xl transition-all active:scale-[0.98] flex items-center gap-4 hover:shadow-md">
<div class="w-16 h-16 shrink-0 rounded-2xl bg-soft-lavender/30 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-3xl" data-icon="cloud">cloud</span>
</div>
<div class="flex-1">
<p class="font-bold text-base text-charcoal">Brain Fog</p>
<p class="text-[13px] text-on-surface-variant leading-snug mt-1">Difficulty focusing or remembering things.</p>
</div>
</button>
<button class="bg-white border border-gray-100 text-left p-5 rounded-2xl transition-all active:scale-[0.98] flex items-center gap-4 hover:shadow-md">
<div class="w-16 h-16 shrink-0 rounded-2xl bg-soft-lavender/30 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-3xl" data-icon="accessibility_new">accessibility_new</span>
</div>
<div class="flex-1">
<p class="font-bold text-base text-charcoal">Joint Pain</p>
<p class="text-[13px] text-on-surface-variant leading-snug mt-1">Aches, stiffness, or swelling in joints.</p>
</div>
</button>
<button class="bg-white border border-gray-100 text-left p-5 rounded-2xl transition-all active:scale-[0.98] flex items-center gap-4 hover:shadow-md">
<div class="w-16 h-16 shrink-0 rounded-2xl bg-soft-lavender/30 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-3xl" data-icon="water_drop">water_drop</span>
</div>
<div class="flex-1">
<p class="font-bold text-base text-charcoal">Vaginal Dryness</p>
<p class="text-[13px] text-on-surface-variant leading-snug mt-1">Discomfort, itching, or dryness.</p>
</div>
</button>
<button class="bg-white border border-gray-100 text-left p-5 rounded-2xl transition-all active:scale-[0.98] flex items-center gap-4 hover:shadow-md">
<div class="w-16 h-16 shrink-0 rounded-2xl bg-soft-lavender/30 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-3xl" data-icon="personal_injury">personal_injury</span>
</div>
<div class="flex-1">
<p class="font-bold text-base text-charcoal">Headaches</p>
<p class="text-[13px] text-on-surface-variant leading-snug mt-1">Frequent tension headaches or migraines.</p>
</div>
</button>
<button class="border-2 border-dashed border-peachy-rose/50 bg-white/50 text-center p-5 rounded-2xl transition-all active:scale-[0.98] flex items-center justify-center gap-3 mt-2">
<span class="material-symbols-outlined text-peachy-rose text-3xl" data-icon="add_circle">add_circle</span>
<p class="font-bold text-sm text-peachy-rose tracking-wide uppercase">Add Other Symptoms</p>
</button>
</div>
<div class="mt-12 p-6 bg-white/60 border border-white rounded-3xl shadow-sm">
<p class="font-noto-serif italic text-on-surface-variant text-sm mb-3">Journal your thoughts today...</p>
<div class="h-px bg-peachy-rose/10 w-full mb-3"></div>
<p class="font-body text-[12px] text-on-surface-variant italic leading-relaxed">Personalized tracking helps our experts provide better recommendations for your unique experience.</p>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full bg-[#F7F5F0]/90 backdrop-blur-xl px-6 pb-8 pt-4 flex flex-col items-center gap-4">
<button class="text-[12px] font-semibold text-on-surface-variant/60 hover:text-peachy-rose transition-colors tracking-widest uppercase">
            Skip this step
        </button>
<button class="w-full bg-peachy-rose text-white py-4 rounded-[1.25rem] font-bold text-lg shadow-lg shadow-peachy-rose/20 active:scale-95 transition-all">
            Continue
        </button>
</footer>
</body></html>
