<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f5f0ed",
                        "primary-fixed": "#f2dfd0",
                        "primary": "#67594e",
                        "tertiary-container": "#9d675c",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#ede7e5",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#231a11",
                        "secondary-fixed": "#edddf5",
                        "background": "#F7F5F0",
                        "secondary": "#655a6e",
                        "secondary-fixed-dim": "#d0c1d8",
                        "outline-variant": "#d0c4bc",
                        "on-secondary-fixed": "#211828",
                        "inverse-primary": "#d6c3b5",
                        "on-error": "#ffffff",
                        "tertiary": "#814f45",
                        "surface-container": "#f2edea",
                        "surface-bright": "#fef8f6",
                        "on-tertiary-container": "#fffbff",
                        "surface-variant": "#e7e1df",
                        "surface": "#fef8f6",
                        "tertiary-fixed": "#ffdad3",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#32302f",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "outline": "#7f756e",
                        "on-secondary-container": "#6c6074",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#edddf5",
                        "on-surface-variant": "#4d453f",
                        "error": "#ba1a1a",
                        "surface-dim": "#ded9d7",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-primary-fixed-variant": "#51443a",
                        "on-background": "#1d1b1a",
                        "surface-tint": "#6a5c50",
                        "primary-container": "#817266",
                        "on-surface": "#1d1b1a",
                        "on-primary-container": "#fffbff",
                        "surface-container-highest": "#e7e1df",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-tertiary-fixed": "#341009",
                        "surface-container-low": "#f8f2f0",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .selected-trigger {
            border-color: #9B8B7E !important;
            background-color: #FDFBFA !important;
        }
        .selected-trigger .check-indicator {
            display: flex !important;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface antialiased min-h-screen">
<header class="sticky top-0 z-50 bg-[#F7F5F0]/80 backdrop-blur-xl flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-200 hover:opacity-80 transition-opacity text-[#67594e]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-xl tracking-tight text-[#67594e]">Daily Journal</h1>
</div>
<button class="active:scale-95 duration-200 hover:opacity-80 transition-opacity text-[#67594e]">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<main class="max-w-2xl mx-auto px-6 pb-40 pt-8">
<div class="mb-10">
<h2 class="font-headline font-bold text-3xl text-on-surface leading-tight">
                What might have caused this?
            </h2>
<p class="mt-3 text-on-surface-variant font-medium opacity-80">
                Identify triggers to help MenoSync find patterns in your cycle and well-being.
            </p>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="selected-trigger relative group flex flex-col items-center justify-center p-5 rounded-2xl bg-white border-2 border-[#E6E0EB] transition-all active:scale-95 duration-200 text-center h-40">
<div class="mb-3">
<span class="material-symbols-outlined text-[40px] text-[#E67E22]" data-icon="coffee">coffee</span>
</div>
<div>
<span class="block font-bold text-base text-on-surface">Caffeine</span>
</div>
<div class="check-indicator absolute top-3 right-3 hidden items-center justify-center bg-[#9B8B7E] text-white rounded-full w-6 h-6">
<span class="material-symbols-outlined text-[14px]" data-icon="check">check</span>
</div>
</button>
<button class="relative group flex flex-col items-center justify-center p-5 rounded-2xl bg-white border-2 border-[#E6E0EB] transition-all hover:border-[#9B8B7E]/40 active:scale-95 duration-200 text-center h-40">
<div class="mb-3">
<span class="material-symbols-outlined text-[40px] text-[#C0392B]" data-icon="wine_bar">wine_bar</span>
</div>
<div>
<span class="block font-bold text-base text-on-surface">Alcohol</span>
</div>
</button>
<button class="relative group flex flex-col items-center justify-center p-5 rounded-2xl bg-white border-2 border-[#E6E0EB] transition-all hover:border-[#9B8B7E]/40 active:scale-95 duration-200 text-center h-40">
<div class="mb-3">
<span class="material-symbols-outlined text-[40px] text-[#8E44AD]" data-icon="psychology_alt">psychology_alt</span>
</div>
<div>
<span class="block font-bold text-base text-on-surface">Stress</span>
</div>
</button>
<button class="relative group flex flex-col items-center justify-center p-5 rounded-2xl bg-white border-2 border-[#E6E0EB] transition-all hover:border-[#9B8B7E]/40 active:scale-95 duration-200 text-center h-40">
<div class="mb-3">
<span class="material-symbols-outlined text-[40px] text-[#27AE60]" data-icon="fitness_center">fitness_center</span>
</div>
<div>
<span class="block font-bold text-base text-on-surface">Exercise</span>
</div>
</button>
<button class="relative group flex flex-col items-center justify-center p-5 rounded-2xl bg-white border-2 border-[#E6E0EB] transition-all hover:border-[#9B8B7E]/40 active:scale-95 duration-200 text-center h-40">
<div class="mb-3">
<span class="material-symbols-outlined text-[40px] text-[#95A5A6]" data-icon="thermostat">thermostat</span>
</div>
<div>
<span class="block font-bold text-base text-on-surface">Weather</span>
</div>
</button>
<button class="relative group flex flex-col items-center justify-center p-5 rounded-2xl bg-white border-2 border-[#E6E0EB] transition-all hover:border-[#9B8B7E]/40 active:scale-95 duration-200 text-center h-40">
<div class="mb-3">
<span class="material-symbols-outlined text-[40px] text-[#3F51B5]" data-icon="bedtime">bedtime</span>
</div>
<div>
<span class="block font-bold text-base text-on-surface">Poor Sleep</span>
</div>
</button>
<button class="relative group flex flex-col items-center justify-center p-5 rounded-2xl bg-white border-2 border-[#E6E0EB] transition-all hover:border-[#9B8B7E]/40 active:scale-95 duration-200 text-center h-40">
<div class="mb-3">
<span class="material-symbols-outlined text-[40px] text-[#D35400]" data-icon="restaurant">restaurant</span>
</div>
<div>
<span class="block font-bold text-base text-on-surface">Foods</span>
</div>
</button>
<button class="relative flex flex-col items-center justify-center p-5 rounded-2xl bg-transparent border-2 border-dashed border-outline-variant transition-all hover:bg-surface-container-low active:scale-95 duration-200 h-40">
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-outline text-[32px]" data-icon="add_circle">add_circle</span>
<span class="block font-bold text-sm text-on-surface-variant">+ Add custom</span>
</div>
</button>
</div>
<div class="mt-12 p-8 rounded-2xl bg-white shadow-[0_4px_24px_rgba(103,89,78,0.06)]">
<h3 class="font-headline italic text-lg text-primary mb-3">Notice anything else?</h3>
<div class="w-full h-px bg-outline-variant/20 mb-4"></div>
<p class="font-body text-on-surface-variant text-sm leading-relaxed">
                Sometimes the smallest changes in routine can impact how you feel. Take a moment to breathe and reflect on your day.
            </p>
</div>
</main>
<div class="fixed bottom-0 left-0 w-full z-50 bg-[#F7F5F0]/90 backdrop-blur-md px-6 py-6 border-none shadow-[0_-4px_24px_rgba(29,27,26,0.06)]">
<div class="max-w-2xl mx-auto flex items-center gap-4">
<button class="flex-1 py-4 px-6 rounded-2xl font-bold text-[#67594e] bg-[#EBE7E1] active:scale-95 transition-all">
                Back
            </button>
<button class="flex-[2] py-4 px-6 rounded-2xl font-bold text-white bg-gradient-to-br from-primary to-[#817266] shadow-lg shadow-primary/20 active:scale-95 transition-all">
                Save Log
            </button>
</div>
</div>

</body></html>
