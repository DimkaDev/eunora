<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verify Email - MenoSync</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#9B8B7E", // Warm Taupe
                        "background": "#F7F5F0", // Cream
                        "accent-lavender": "#D8C9E0", // Soft Lavender
                        "accent-rose": "#E8A89B", // Peachy Rose
                        "on-surface": "#4A4542",
                        "on-surface-variant": "#7C746E",
                        "surface-light": "#EFEEE9", // Light Gray Box
                        "success-bg": "#F1F8F1", // Pale Green
                        "error-bg": "#FEF4F2", // Pale Peach
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "round-eight": "0.5rem", // ROUND_EIGHT
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        body {
            min-height: 100dvh;
            background-color: #F7F5F0;
        }
    </style>
</head>
<body class="bg-background font-body text-on-surface flex flex-col items-center antialiased">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-background/80 backdrop-blur-md flex justify-between items-center px-6 py-5">
<button class="transition-all duration-300 ease-in-out active:scale-95 text-primary">
<span class="material-symbols-outlined text-[28px]">arrow_back</span>
</button>
<h1 class="hidden">Verify Email</h1> <!-- Accessibility only -->
<div class="w-7"></div> <!-- Balance for header -->
</header>
<main class="flex-1 w-full max-w-[360px] px-6 pt-8 pb-16 flex flex-col items-center text-center">
<!-- Header Section -->
<div class="mb-14 flex flex-col items-center">
<div class="w-20 h-20 rounded-full bg-surface-light flex items-center justify-center mb-8">
<span class="material-symbols-outlined text-[36px] text-primary" style="font-variation-settings: 'FILL' 0;">mail</span>
</div>
<h2 class="font-headline text-[26px] font-bold text-on-surface leading-tight mb-4">Verify Your Email</h2>
<p class="font-body text-[14px] text-on-surface-variant leading-relaxed max-w-[260px]">
                We sent a verification code to <span class="font-semibold text-primary">sarah@email.com</span>
</p>
</div>
<!-- Code Input Section -->
<div class="w-full space-y-10">
<div class="text-left">
<label class="block font-label text-[12px] font-bold uppercase tracking-wider text-on-surface-variant mb-5 px-1">
                    Enter 6-digit code
                </label>
<div class="flex justify-between gap-2.5">
<!-- Premium individual digit inputs -->
<input class="w-11 h-14 bg-surface-light border-0 focus:ring-2 focus:ring-accent-lavender text-center font-body text-[20px] font-semibold rounded-lg transition-all outline-none" maxlength="1" type="text" value="8"/>
<input class="w-11 h-14 bg-surface-light border-0 focus:ring-2 focus:ring-accent-lavender text-center font-body text-[20px] font-semibold rounded-lg transition-all outline-none" maxlength="1" type="text" value="4"/>
<input class="w-11 h-14 bg-surface-light border-0 focus:ring-2 focus:ring-accent-lavender text-center font-body text-[20px] font-semibold rounded-lg transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-11 h-14 bg-surface-light border-0 focus:ring-2 focus:ring-accent-lavender text-center font-body text-[20px] font-semibold rounded-lg transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-11 h-14 bg-surface-light border-0 focus:ring-2 focus:ring-accent-lavender text-center font-body text-[20px] font-semibold rounded-lg transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-11 h-14 bg-surface-light border-0 focus:ring-2 focus:ring-accent-lavender text-center font-body text-[20px] font-semibold rounded-lg transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
</div>
<p class="font-body text-[12px] text-on-surface-variant/70 mt-5 px-1 flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">info</span>
                    Check your email (including spam)
                </p>
</div>
<!-- Main CTA -->
<button class="w-full py-4.5 bg-primary text-white font-label font-bold text-[15px] rounded-lg shadow-sm active:scale-[0.98] transition-transform" style="border-radius: 0.5rem;">
                Verify Email
            </button>
</div>
<!-- Resend Section -->
<div class="mt-14 w-full space-y-6">
<p class="font-body text-[14px] text-on-surface-variant">
                Didn't receive the code?
            </p>
<div class="flex flex-col items-center gap-4">
<button class="w-full py-3.5 bg-transparent border border-primary/20 text-primary font-label font-bold text-[14px] rounded-lg active:bg-surface-light transition-colors">
                    Resend Code
                </button>
<div class="flex items-center gap-2 text-accent-rose font-label text-[13px] font-semibold">
<span class="material-symbols-outlined text-[18px]">schedule</span>
                    Resend in 45s
                </div>
</div>
</div>
<!-- Footer -->
<footer class="mt-12">
<a class="text-primary/80 underline underline-offset-4 font-label text-[13px] font-medium transition-colors hover:text-primary" href="#">
                Use a different email
            </a>
</footer>
<!-- Feedback States -->
<div class="mt-16 w-full space-y-4">
<div class="p-4 bg-success-bg rounded-lg flex items-center gap-3">
<span class="material-symbols-outlined text-[#4CAF50]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[13px] text-[#2E7D32] font-medium font-body">Code verified successfully!</span>
</div>
<div class="p-4 bg-error-bg rounded-lg flex items-center gap-3">
<span class="material-symbols-outlined text-accent-rose" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="text-[13px] text-[#A66D63] font-medium font-body text-left leading-tight">The code you entered is incorrect. Please try again.</span>
</div>
</div>
</main>
</body></html>
