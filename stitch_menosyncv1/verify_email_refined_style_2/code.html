<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verify Email - MenoSync</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#9B8B7E",
                        "on-primary-container": "#ffffff",
                        "on-secondary": "#ffffff",
                        "primary": "#9B8B7E",
                        "background": "#F7F5F0",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#d6c3b5",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-tertiary-fixed": "#341009",
                        "surface-bright": "#F7F5F0",
                        "tertiary-fixed": "#D8C9E0",
                        "surface-container-low": "#f4f1ea",
                        "secondary": "#655a6e",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "error": "#ba1a1a",
                        "on-surface": "#32302f",
                        "primary-container": "#9B8B7E",
                        "on-tertiary-container": "#ffffff",
                        "on-primary-fixed-variant": "#51443a",
                        "secondary-fixed-dim": "#d0c1d8",
                        "on-surface-variant": "#6D6661",
                        "error-container": "#ffdad6",
                        "surface-dim": "#ded9d7",
                        "secondary-fixed": "#D8C9E0",
                        "surface-tint": "#9B8B7E",
                        "on-primary-fixed": "#231a11",
                        "surface-container-high": "#e9e4dc",
                        "on-error": "#ffffff",
                        "surface-variant": "#e7e1df",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#6c6074",
                        "tertiary": "#814f45",
                        "outline-variant": "#d0c4bc",
                        "on-error-container": "#93000a",
                        "surface-container": "#f0ede6",
                        "surface": "#F7F5F0",
                        "primary-fixed-dim": "#d6c3b5",
                        "secondary-container": "#D8C9E0",
                        "primary-fixed": "#f2dfd0",
                        "on-background": "#32302f",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#211828",
                        "inverse-surface": "#32302f",
                        "tertiary-container": "#9d675c",
                        "on-tertiary-fixed-variant": "#683a31",
                        "inverse-on-surface": "#f5f0ed",
                        "surface-container-highest": "#e2ddd5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .serene-gradient {
            background: linear-gradient(180deg, #F7F5F0 0%, #f0ede6 100%);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .rounded-eight {
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-background font-body text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-background/80 backdrop-blur-md flex justify-between items-center px-6 py-4 border-b border-outline/5">
<div class="flex items-center gap-4">
<button class="transition-all duration-300 ease-in-out active:scale-95 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline text-xl font-semibold text-on-surface">Verify Email</h1>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 w-full max-w-[360px] px-6 pt-16 pb-20 flex flex-col items-center text-center">
<!-- Header Section -->
<div class="mb-12 flex flex-col items-center">
<div class="w-20 h-20 rounded-full bg-surface-container flex items-center justify-center mb-8 shadow-sm border border-outline/5">
<span class="material-symbols-outlined text-[36px] text-primary" style="font-variation-settings: 'FILL' 0, 'wght' 300;">mail</span>
</div>
<h2 class="font-headline text-2xl font-bold text-on-surface leading-tight mb-4">Verify Your Email</h2>
<p class="font-body text-sm text-on-surface-variant leading-relaxed px-4">
                We sent a verification code to <span class="font-semibold text-primary">sarah@email.com</span>
</p>
</div>
<!-- Code Input Section -->
<div class="w-full space-y-8">
<div class="text-left">
<label class="block font-label text-[13px] font-bold text-on-surface-variant mb-4 px-1">
                    Enter verification code
                </label>
<div class="flex justify-between gap-2.5">
<!-- Individual digit inputs with refined styling -->
<input class="w-12 h-14 bg-white border border-outline/30 focus:border-primary text-center font-body text-xl rounded-eight shadow-sm transition-all outline-none" maxlength="1" type="text" value="8"/>
<input class="w-12 h-14 bg-white border border-outline/30 focus:border-primary text-center font-body text-xl rounded-eight shadow-sm transition-all outline-none" maxlength="1" type="text" value="4"/>
<input class="w-12 h-14 bg-white border border-outline/30 focus:border-primary text-center font-body text-xl rounded-eight shadow-sm transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-14 bg-white border border-outline/30 focus:border-primary text-center font-body text-xl rounded-eight shadow-sm transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-14 bg-white border border-outline/30 focus:border-primary text-center font-body text-xl rounded-eight shadow-sm transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-14 bg-white border border-outline/30 focus:border-primary text-center font-body text-xl rounded-eight shadow-sm transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
</div>
<p class="font-body text-[12px] text-on-surface-variant mt-4 px-1 flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-primary">info</span>
                    Check your email (spam folder too)
                </p>
</div>
<!-- Main CTA -->
<button class="w-full py-4 bg-primary text-white font-label font-bold text-[15px] rounded-eight shadow-md shadow-primary/20 hover:shadow-lg transition-all duration-300 active:scale-[0.98]">
                Verify Email
            </button>
</div>
<!-- Resend Section -->
<div class="mt-14 w-full space-y-6">
<p class="font-body text-sm text-on-surface-variant">
                Didn't receive the code?
            </p>
<div class="flex flex-col items-center gap-4">
<button class="w-full py-4 bg-white border border-outline/20 text-primary font-label font-bold text-[14px] rounded-eight transition-all duration-300 active:scale-[0.98] hover:bg-surface-container-low">
                    Resend Code
                </button>
<div class="flex items-center gap-2 text-on-surface-variant font-label text-[12px] font-medium">
<span class="material-symbols-outlined text-[16px] text-primary">schedule</span>
                    Resend in 45s
                </div>
</div>
</div>
<!-- Footer -->
<footer class="mt-auto pt-16">
<a class="text-primary underline underline-offset-4 font-label text-[13px] font-bold transition-colors hover:opacity-80" href="#">
                Use a different email
            </a>
</footer>
<!-- Optional Status References -->
<div class="mt-16 w-full space-y-4 opacity-60">
<div class="p-4 bg-secondary-fixed/30 rounded-eight flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[13px] text-on-surface font-medium">Code verified successfully!</span>
</div>
<div class="p-4 bg-error-container/40 rounded-eight flex items-center gap-3 border border-error/10">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="text-[13px] text-on-error-container font-medium text-left leading-tight">The code you entered is incorrect. Please try again.</span>
</div>
</div>
</main>
<!-- Visual Embellishment: Layered Textures -->
<div class="fixed top-[-10%] right-[-10%] w-[70%] h-[40%] rounded-full bg-secondary-fixed/10 blur-[120px] -z-10"></div>
<div class="fixed bottom-[-5%] left-[-10%] w-[60%] h-[30%] rounded-full bg-primary/5 blur-[100px] -z-10"></div>
</body></html>
