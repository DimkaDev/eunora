<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary": "#ffffff",
                    "tertiary-fixed": "#ffdad3",
                    "on-primary-fixed": "#231a11",
                    "inverse-surface": "#32302f",
                    "tertiary-fixed-dim": "#f9b7a9",
                    "on-surface": "#1d1b1a",
                    "surface-container-high": "#ede7e5",
                    "outline": "#7f756e",
                    "on-tertiary-fixed": "#341009",
                    "inverse-on-surface": "#f5f0ed",
                    "tertiary": "#814f45",
                    "surface-container-highest": "#e7e1df",
                    "outline-variant": "#d0c4bc",
                    "tertiary-container": "#9d675c",
                    "secondary": "#655a6e",
                    "on-secondary": "#ffffff",
                    "on-tertiary-container": "#fffbff",
                    "surface-tint": "#6a5c50",
                    "surface-dim": "#ded9d7",
                    "inverse-primary": "#d6c3b5",
                    "surface-variant": "#e7e1df",
                    "surface": "#fef8f6",
                    "error": "#ba1a1a",
                    "primary-container": "#817266",
                    "on-primary-container": "#fffbff",
                    "on-primary": "#ffffff",
                    "on-surface-variant": "#4d453f",
                    "on-secondary-container": "#6c6074",
                    "on-primary-fixed-variant": "#51443a",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#683a31",
                    "on-secondary-fixed-variant": "#4d4355",
                    "on-secondary-fixed": "#211828",
                    "secondary-container": "#edddf5",
                    "secondary-fixed": "#edddf5",
                    "surface-container-low": "#f8f2f0",
                    "surface-bright": "#fef8f6",
                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#d6c3b5",
                    "surface-container": "#f2edea",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed": "#f2dfd0",
                    "primary": "#67594e",
                    "on-background": "#1d1b1a",
                    "secondary-fixed-dim": "#d0c1d8",
                    "background": "#fef8f6",
                    "on-error-container": "#93000a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Noto Serif"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #fef8f6; /* surface */
        }
        .serif-voice {
            font-family: 'Noto Serif', serif;
        }
        .editorial-gradient {
            background: linear-gradient(135deg, #67594e 0%, #817266 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center min-h-screen p-6">
<!-- Login Shell Suppression: No TopAppBar or BottomNavBar as per transactional rule -->
<main class="w-full max-w-[340px] flex flex-col items-center">
<!-- Header Section -->
<header class="text-center mb-8">
<div class="mb-4 inline-flex items-center justify-center w-12 h-12 rounded-full bg-surface-container">
<span class="material-symbols-outlined text-[32px] text-primary" data-icon="spa">spa</span>
</div>
<h1 class="serif-voice text-[22px] font-bold text-on-surface tracking-tight leading-tight">Welcome Back</h1>
<p class="text-[12px] text-on-surface-variant font-medium mt-1">Sign in to your MenoSync account</p>
</header>
<!-- Form Card -->
<section class="w-full bg-surface-container-lowest p-5 rounded-xl shadow-[0_4px_24px_rgba(29,27,26,0.04)] mb-6">
<form action="#" class="space-y-4" method="POST">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="block text-[12px] font-bold text-on-surface ml-1" for="email">Email Address</label>
<input class="w-full px-4 py-3 rounded-xl bg-surface-container-highest border-none text-[14px] text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="email" name="email" placeholder="you@email.com" type="email"/>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-[12px] font-bold text-on-surface" for="password">Password</label>
<a class="text-[11px] text-primary underline underline-offset-2 hover:text-primary-container transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full px-4 py-3 rounded-xl bg-surface-container-highest border-none text-[14px] text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/60 hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full editorial-gradient text-white font-bold py-3.5 rounded-[10px] text-[14px] shadow-sm hover:opacity-90 active:scale-[0.98] transition-all mt-2" type="submit">
                    Sign In
                </button>
</form>
</section>
<!-- Social Login Section -->
<div class="w-full flex flex-col items-center gap-4">
<div class="w-full flex items-center gap-3">
<div class="h-px flex-1 bg-outline-variant/30"></div>
<span class="text-[11px] font-semibold text-on-surface-variant/60 uppercase tracking-widest">Or continue with</span>
<div class="h-px flex-1 bg-outline-variant/30"></div>
</div>
<div class="grid grid-cols-2 gap-3 w-full">
<!-- Apple -->
<button class="flex items-center justify-center gap-2 py-3 rounded-xl bg-white border border-on-surface/10 hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[18px]" data-icon="apple">ios</span>
<span class="text-[12px] font-bold">Apple</span>
</button>
<!-- Google -->
<button class="flex items-center justify-center gap-2 py-3 rounded-xl bg-white border border-outline-variant/30 hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<img alt="" class="w-4 h-4" data-alt="Official Google G icon with original colors red, yellow, green, and blue on a clean background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3RKwb287WL6LcvvN-g0EuUlzOBO_YTt9wEWApQdRZ7ZlVuvNiO3-IHmqFoX-1BoYEw_rk_bnr2lTT0sIqnSfd9IXLxGQwPAlSLpUVfXjKnYkZNyH3mJFyrtteggj1wLvkxod3cN1coUOuAIUwlVE9g-h2yN1zbshyZbjmj2bk0ozdSUMVlkGO55gwogcLlxOeLjVfNHal7UTiV5ntTf4yM6dhXzr752CP80RWPNm1T_ML-DAot2HIxgcRA3C8lR6E8ifo1nw1tiA"/>
<span class="text-[12px] font-bold">Google</span>
</button>
</div>
</div>
<!-- Footer Link -->
<footer class="mt-10">
<p class="text-[13px] text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-semibold underline underline-offset-4 decoration-primary/30 hover:decoration-primary transition-all ml-1" href="#">Create one</a>
</p>
</footer>
</main>
<!-- Decorative Aesthetic Elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-secondary-container/20 rounded-full blur-[100px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-tertiary-fixed/20 rounded-full blur-[100px]"></div>
</div>
</body></html>
