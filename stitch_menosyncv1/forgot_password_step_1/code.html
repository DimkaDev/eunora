<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar - Following Shared Component Logic (Suppressing Nav for transactional page) -->
<header class="sticky top-0 w-full z-50 bg-[#fef8f6]/70 backdrop-blur-md flex items-center justify-between px-6 py-4">
<div class="flex items-center gap-4">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col">
<h1 class="font-serif text-[18px] font-medium tracking-tight text-primary">Reset Your Password</h1>
<p class="font-body text-[12px] text-on-surface-variant">We'll help you get back to your account</p>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center w-full px-6 py-12">
<!-- Centered Illustration for Editorial Depth -->
<div class="mb-10 w-24 h-24 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="lock_reset">lock_reset</span>
</div>
<!-- Verification Card -->
<div class="w-full max-w-[340px] bg-surface-container-lowest rounded-xl p-8 shadow-[0_4px_24px_rgba(29,27,26,0.04)]">
<div class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-body font-bold text-[13px] text-on-surface ml-1" for="email">
                        Email Address
                    </label>
<input class="w-full bg-surface-container-highest border-outline-variant/30 focus:border-primary focus:ring-1 focus:ring-primary rounded-[10px] py-3 px-4 text-[14px] placeholder:text-outline text-on-surface outline-none transition-all" id="email" placeholder="you@email.com" type="email"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-container text-surface-container-lowest font-semibold py-3.5 rounded-[10px] transition-all active:scale-[0.98] duration-150 flex items-center justify-center gap-2">
<span class="text-[14px]">Send Reset Link</span>
</button>
</div>
</div>

<a class="mt-8 text-primary font-medium text-[12px] hover:opacity-80 transition-opacity flex items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-[14px] transition-transform group-hover:-translate-x-1" data-icon="chevron_left">chevron_left</span>
