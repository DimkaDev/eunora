<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Frequent Symptoms Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "charcoal": "#2D2D2D",
                        "lavender-selected": "#E8E0F0",
                        "lavender-deep": "#6B4E8B",
                        "background": "#FFFFFF",
                        "card-border": "#2D2D2D",
                    },
                    fontFamily: {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-white text-charcoal font-body antialiased;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 48;
            font-size: 32px;
        }
        .selected-state .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 48;
        }
        .symptom-card {
            @apply border-2 border-charcoal bg-white transition-all active:scale-[0.98];
        }
        .symptom-card-selected {
            @apply bg-lavender-selected border-lavender-deep;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen pb-40">
<header class="fixed top-0 w-full z-50 bg-white border-b-2 border-charcoal/10 px-6 py-5 flex items-center justify-between">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined text-charcoal" style="font-size: 32px;">arrow_back</span>
</button>
<h1 class="font-bold text-xl text-charcoal">Step 4 of 7</h1>
</div>
<div class="text-2xl font-black text-charcoal tracking-tight">MenoSync</div>
</header>
<main class="pt-28 px-6 max-w-2xl mx-auto">
<section class="mb-8">
<h2 class="font-headline text-4xl font-bold text-charcoal leading-tight mb-4">Your Most Frequent Symptoms</h2>
<p class="font-body text-xl font-medium text-charcoal/80 leading-snug">
                Select your most frequent symptoms. We'll emphasize tracking these in your daily log.
            </p>
</section>
<div class="relative mb-10">
<span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-charcoal" style="font-size: 28px;">search</span>
<input class="w-full bg-white border-2 border-charcoal rounded-xl py-5 pl-14 pr-6 text-xl text-charcoal font-semibold placeholder:text-charcoal/40 focus:ring-4 focus:ring-lavender-selected transition-all" placeholder="Search symptoms..." type="text"/>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
<button class="symptom-card symptom-card-selected selected-state relative text-left p-6 rounded-2xl flex flex-col gap-4">
<span class="material-symbols-outlined absolute top-4 right-4 text-lavender-deep" style="font-size: 36px;">check_circle</span>
<div class="w-14 h-14 rounded-full bg-white border-2 border-lavender-deep flex items-center justify-center text-lavender-deep">
<span class="material-symbols-outlined" style="font-size: 36px;">thermostat</span>
</div>
<div>
<p class="font-extrabold text-xl text-charcoal">Hot Flashes</p>
<p class="text-base font-bold text-charcoal/70 mt-1">Sudden waves of heat</p>
</div>
</button>
<button class="symptom-card relative text-left p-6 rounded-2xl flex flex-col gap-4">
<div class="w-14 h-14 rounded-full bg-charcoal/5 flex items-center justify-center text-charcoal">
<span class="material-symbols-outlined" style="font-size: 36px;">bedtime</span>
</div>
<div>
<p class="font-extrabold text-xl text-charcoal">Night Sweats</p>
<p class="text-base font-bold text-charcoal/70 mt-1">Heavy sweating at night</p>
</div>
</button>
<button class="symptom-card symptom-card-selected selected-state relative text-left p-6 rounded-2xl flex flex-col gap-4">
<span class="material-symbols-outlined absolute top-4 right-4 text-lavender-deep" style="font-size: 36px;">check_circle</span>
<div class="w-14 h-14 rounded-full bg-white border-2 border-lavender-deep flex items-center justify-center text-lavender-deep">
<span class="material-symbols-outlined" style="font-size: 36px;">nights_stay</span>
</div>
<div>
<p class="font-extrabold text-xl text-charcoal">Sleep Issues</p>
<p class="text-base font-bold text-charcoal/70 mt-1">Difficulty falling asleep</p>
</div>
</button>
<button class="symptom-card relative text-left p-6 rounded-2xl flex flex-col gap-4">
<div class="w-14 h-14 rounded-full bg-charcoal/5 flex items-center justify-center text-charcoal">
<span class="material-symbols-outlined" style="font-size: 36px;">mood_bad</span>
</div>
<div>
<p class="font-extrabold text-xl text-charcoal">Mood Changes</p>
<p class="text-base font-bold text-charcoal/70 mt-1">Anxiety or irritability</p>
</div>
</button>
<button class="symptom-card relative text-left p-6 rounded-2xl flex flex-col gap-4">
<div class="w-14 h-14 rounded-full bg-charcoal/5 flex items-center justify-center text-charcoal">
<span class="material-symbols-outlined" style="font-size: 36px;">cloud</span>
</div>
<div>
<p class="font-extrabold text-xl text-charcoal">Brain Fog</p>
<p class="text-base font-bold text-charcoal/70 mt-1">Difficulty concentrating</p>
</div>
</button>
<button class="symptom-card relative text-left p-6 rounded-2xl flex flex-col gap-4">
<div class="w-14 h-14 rounded-full bg-charcoal/5 flex items-center justify-center text-charcoal">
<span class="material-symbols-outlined" style="font-size: 36px;">accessibility_new</span>
</div>
<div>
<p class="font-extrabold text-xl text-charcoal">Joint Pain</p>
<p class="text-base font-bold text-charcoal/70 mt-1">Aches and stiffness</p>
</div>
</button>
<button class="symptom-card relative text-left p-6 rounded-2xl flex flex-col gap-4">
<div class="w-14 h-14 rounded-full bg-charcoal/5 flex items-center justify-center text-charcoal">
<span class="material-symbols-outlined" style="font-size: 36px;">water_drop</span>
</div>
<div>
<p class="font-extrabold text-xl text-charcoal">Vaginal Dryness</p>
<p class="text-base font-bold text-charcoal/70 mt-1">Discomfort or dryness</p>
</div>
</button>
<button class="symptom-card relative text-left p-6 rounded-2xl flex flex-col gap-4">
<div class="w-14 h-14 rounded-full bg-charcoal/5 flex items-center justify-center text-charcoal">
<span class="material-symbols-outlined" style="font-size: 36px;">personal_injury</span>
</div>
<div>
<p class="font-extrabold text-xl text-charcoal">Headaches</p>
<p class="text-base font-bold text-charcoal/70 mt-1">Migraines or tension</p>
</div>
</button>
<button class="border-2 border-dashed border-charcoal/40 bg-white text-center p-8 rounded-2xl flex flex-col items-center justify-center gap-3 col-span-1 sm:col-span-2 mt-4">
<span class="material-symbols-outlined text-charcoal" style="font-size: 48px;">add_circle</span>
<p class="font-black text-xl text-charcoal tracking-wider">+ OTHER SYMPTOMS</p>
</button>
</div>
<div class="mt-16 mb-12 p-8 border-2 border-charcoal/10 rounded-2xl">
<p class="font-headline italic text-2xl text-charcoal/60 mb-6 font-medium">Journal your thoughts today...</p>
<div class="h-0.5 bg-charcoal/10 w-full mb-6"></div>
<p class="font-body text-lg text-charcoal font-semibold italic">Personalized tracking helps our experts provide better recommendations for your unique experience.</p>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full bg-white border-t-2 border-charcoal px-6 pb-10 pt-6 flex flex-col items-center gap-6 shadow-[0_-10px_30px_rgba(0,0,0,0.05)]">
<button class="text-lg font-extrabold text-charcoal/60 hover:text-charcoal underline underline-offset-4 decoration-2 uppercase tracking-widest">
            Skip this step
        </button>
<button class="w-full bg-charcoal text-white py-6 rounded-2xl font-black text-2xl shadow-xl active:scale-95 transition-all">
            CONTINUE
        </button>
</footer>

</body></html>
