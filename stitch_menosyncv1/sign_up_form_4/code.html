<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-variant": "#e7e1df",
                        "on-primary-fixed": "#231a11",
                        "on-tertiary-fixed": "#341009",
                        "on-secondary": "#ffffff",
                        "tertiary": "#814f45",
                        "on-secondary-fixed-variant": "#4d4355",
                        "secondary-fixed": "#edddf5",
                        "surface-container-high": "#ede7e5",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-tertiary-container": "#fffbff",
                        "surface-container": "#f2edea",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f8f2f0",
                        "outline-variant": "#d0c4bc",
                        "background": "#fef8f6",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-secondary-fixed": "#211828",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "on-surface": "#1d1b1a",
                        "inverse-primary": "#d6c3b5",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e7e1df",
                        "inverse-on-surface": "#f5f0ed",
                        "surface": "#fef8f6",
                        "secondary-fixed-dim": "#d0c1d8",
                        "primary": "#67594e",
                        "on-surface-variant": "#4d453f",
                        "on-primary-container": "#fffbff",
                        "on-error-container": "#93000a",
                        "surface-dim": "#ded9d7",
                        "on-primary-fixed-variant": "#51443a",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#1d1b1a",
                        "primary-container": "#817266",
                        "outline": "#7f756e",
                        "secondary-container": "#edddf5",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#9d675c",
                        "on-secondary-container": "#6c6074",
                        "tertiary-fixed": "#ffdad3",
                        "surface-tint": "#6a5c50",
                        "surface-bright": "#fef8f6",
                        "primary-fixed": "#f2dfd0",
                        "inverse-surface": "#32302f",
                        "secondary": "#655a6e"
                    },
                    fontFamily: {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tonal-transition {
            background-image: linear-gradient(to bottom, rgba(247, 245, 240, 0.9), rgba(247, 245, 240, 0));
        }
        input:focus {
            background-color: #E8E0F0 !important;
            outline: none;
            border-color: #9B8B7E !important;
            box-shadow: 0 0 0 2px rgba(155, 139, 126, 0.1);
        }.floating-label-group {
            @apply relative;
        }
        .floating-label-group input:placeholder-shown + label {
            @apply text-[14px] top-[14px] left-[12px] font-medium text-stone-400;
            pointer-events: none;
        }
        .floating-label-group input:focus + label,
        .floating-label-group input:not(:placeholder-shown) + label {
            @apply text-[10px] top-[6px] left-[12px] font-bold text-[#9B8B7E] uppercase tracking-wider;
        }
        .floating-label-group input {
            @apply pt-[22px] pb-[6px] px-[12px];
        }.segmented-control input:checked + label {
            @apply bg-[#9B8B7E] text-white border-[#9B8B7E];
        }
        body {
            min-height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F7F5F0] font-body text-on-surface flex flex-col">
<header class="fixed top-0 w-full z-50 bg-[#F7F5F0]/80 backdrop-blur-md flex items-center px-6 py-5 tonal-transition">
<button class="text-stone-700 hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="ml-4 font-serif text-stone-800 headline-md text-[24px] font-semibold leading-tight">Create Your Account</h1>
</header>
<main class="flex-1 flex flex-col items-center justify-start pt-28 pb-12 px-6">
<div class="w-full max-w-[380px] flex flex-col space-y-6">
<div class="floating-label-group">
<input class="w-full bg-[#EEEEEE] border-2 border-[#9B8B7E] rounded-[8px] text-[15px] placeholder-transparent transition-all duration-200" id="email" placeholder="you@email.com" type="email"/>
<label class="absolute transition-all duration-200" for="email">Email Address</label>
</div>
<div>
<div class="floating-label-group">
<input class="w-full bg-[#EEEEEE] border-2 border-[#9B8B7E] rounded-[8px] text-[15px] placeholder-transparent transition-all duration-200" id="password" placeholder="Create a secure password" type="password"/>
<label class="absolute transition-all duration-200" for="password">Password</label>
</div>
<p class="text-[10px] text-stone-500 pl-1 mt-1.5">At least 8 characters</p>
</div>
<div class="flex flex-col space-y-3">
<label class="font-bold text-[12px] uppercase tracking-wider text-stone-500">Age Range</label>
<div class="flex flex-wrap gap-2">
<div class="segmented-control flex-1 min-w-[65px]">
<input class="hidden" id="age-40" name="age" type="radio"/>
<label class="flex items-center justify-center h-11 border-2 border-stone-300 bg-white rounded-xl text-[14px] font-semibold text-stone-600 cursor-pointer transition-all active:scale-95" for="age-40">40-44</label>
</div>
<div class="segmented-control flex-1 min-w-[65px]">
<input class="hidden" id="age-45" name="age" type="radio"/>
<label class="flex items-center justify-center h-11 border-2 border-stone-300 bg-white rounded-xl text-[14px] font-semibold text-stone-600 cursor-pointer transition-all active:scale-95" for="age-45">45-49</label>
</div>
<div class="segmented-control flex-1 min-w-[65px]">
<input class="hidden" id="age-50" name="age" type="radio"/>
<label class="flex items-center justify-center h-11 border-2 border-stone-300 bg-white rounded-xl text-[14px] font-semibold text-stone-600 cursor-pointer transition-all active:scale-95" for="age-50">50-54</label>
</div>
<div class="segmented-control flex-1 min-w-[65px]">
<input class="hidden" id="age-55" name="age" type="radio"/>
<label class="flex items-center justify-center h-11 border-2 border-stone-300 bg-white rounded-xl text-[14px] font-semibold text-stone-600 cursor-pointer transition-all active:scale-95" for="age-55">55-59</label>
</div>
<div class="segmented-control flex-1 min-w-[65px]">
<input class="hidden" id="age-60" name="age" type="radio"/>
<label class="flex items-center justify-center h-11 border-2 border-stone-300 bg-white rounded-xl text-[14px] font-semibold text-stone-600 cursor-pointer transition-all active:scale-95" for="age-60">60+</label>
</div>
</div>
</div>
<div class="flex flex-col space-y-3">
<label class="font-bold text-[12px] uppercase tracking-wider text-stone-500">Menopause Journey Stage</label>
<div class="flex flex-col space-y-2">
<div class="segmented-control w-full">
<input class="hidden" id="stage-not-sure" name="stage" type="radio"/>
<label class="flex items-center px-4 h-12 border-2 border-stone-300 bg-white rounded-xl text-[14px] font-medium text-stone-600 cursor-pointer transition-all active:scale-[0.98]" for="stage-not-sure">Not sure</label>
</div>
<div class="segmented-control w-full">
<input class="hidden" id="stage-early-peri" name="stage" type="radio"/>
<label class="flex items-center px-4 h-12 border-2 border-stone-300 bg-white rounded-xl text-[14px] font-medium text-stone-600 cursor-pointer transition-all active:scale-[0.98]" for="stage-early-peri">Early perimenopause</label>
</div>
<div class="segmented-control w-full">
<input class="hidden" id="stage-active-peri" name="stage" type="radio"/>
<label class="flex items-center px-4 h-12 border-2 border-stone-300 bg-white rounded-xl text-[14px] font-medium text-stone-600 cursor-pointer transition-all active:scale-[0.98]" for="stage-active-peri">Active perimenopause</label>
</div>
<div class="segmented-control w-full">
<input class="hidden" id="stage-early-meno" name="stage" type="radio"/>
<label class="flex items-center px-4 h-12 border-2 border-stone-300 bg-white rounded-xl text-[14px] font-medium text-stone-600 cursor-pointer transition-all active:scale-[0.98]" for="stage-early-meno">Early menopause</label>
</div>
<div class="segmented-control w-full">
<input class="hidden" id="stage-post" name="stage" type="radio"/>
<label class="flex items-center px-4 h-12 border-2 border-stone-300 bg-white rounded-xl text-[14px] font-medium text-stone-600 cursor-pointer transition-all active:scale-[0.98]" for="stage-post">Post-menopause</label>
</div>
</div>
</div>
<div class="pt-4 space-y-6">
<button class="w-full bg-[#9B8B7E] text-white py-[16px] rounded-full font-bold text-[16px] shadow-md hover:shadow-lg active:scale-[0.98] transition-all duration-200">
                    Create Account
                </button>
<div class="text-center">
<a class="text-stone-600 font-bold text-[13px] hover:text-[#9B8B7E] transition-all" href="#">
                        Already have account? <span class="underline">Sign in</span>
</a>
</div>
</div>
<div class="pt-8 border-t border-stone-300/30">
<p class="font-serif italic text-stone-400 text-center text-sm leading-relaxed">
                    "This is the start of a more supported, <br/>harmonious transition."
                </p>
</div>
</div>
</main>
<div class="h-1.5 w-full bg-[#9B8B7E]/20 mt-auto"></div>

</body></html>
