<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-lowest": "#ffffff",
                    "surface-container": "#f2edea",
                    "error": "#ba1a1a",
                    "on-primary-container": "#fffbff",
                    "surface-tint": "#6a5c50",
                    "on-surface-variant": "#4d453f",
                    "on-secondary-fixed": "#211828",
                    "secondary-fixed": "#edddf5",
                    "primary-container": "#817266",
                    "tertiary": "#814f45",
                    "primary-fixed-dim": "#d6c3b5",
                    "outline-variant": "#d0c4bc",
                    "on-tertiary-fixed": "#341009",
                    "surface-dim": "#ded9d7",
                    "secondary-fixed-dim": "#d0c1d8",
                    "surface-container-highest": "#e7e1df",
                    "on-tertiary-fixed-variant": "#683a31",
                    "surface-bright": "#fef8f6",
                    "on-primary-fixed": "#231a11",
                    "secondary": "#655a6e",
                    "on-tertiary-container": "#fffbff",
                    "tertiary-container": "#9d675c",
                    "on-surface": "#1d1b1a",
                    "tertiary-fixed": "#ffdad3",
                    "on-tertiary": "#ffffff",
                    "secondary-container": "#edddf5",
                    "on-secondary-fixed-variant": "#4d4355",
                    "background": "#fef8f6",
                    "inverse-on-surface": "#f5f0ed",
                    "tertiary-fixed-dim": "#f9b7a9",
                    "surface": "#fef8f6",
                    "error-container": "#ffdad6",
                    "inverse-surface": "#32302f",
                    "primary": "#67594e",
                    "on-secondary": "#ffffff",
                    "surface-variant": "#e7e1df",
                    "on-primary-fixed-variant": "#51443a",
                    "on-error": "#ffffff",
                    "inverse-primary": "#d6c3b5",
                    "outline": "#7f756e",
                    "primary-fixed": "#f2dfd0",
                    "on-error-container": "#93000a",
                    "surface-container-high": "#ede7e5",
                    "on-primary": "#ffffff",
                    "surface-container-low": "#f8f2f0",
                    "on-secondary-container": "#6c6074",
                    "on-background": "#1d1b1a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Noto Serif"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Manrope', sans-serif; }
        .serif { font-family: 'Noto Serif', serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#fef8f6] text-[#1d1b1a] min-h-screen flex items-center justify-center p-0 m-0 overflow-hidden">
<!-- Mock Background Page -->
<main class="w-full h-full absolute inset-0 z-0 px-6 py-8 opacity-40 blur-sm flex flex-col gap-6">
<div class="h-48 w-full rounded-2xl bg-gradient-to-br from-[#67594e] to-[#817266] p-6 flex flex-col justify-end">
<h1 class="text-white text-3xl font-headline font-bold">Good morning, Sarah</h1>
<p class="text-white/80 font-body">Your wellness journey is on track.</p>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="h-32 bg-white rounded-2xl shadow-sm p-4"></div>
<div class="h-32 bg-white rounded-2xl shadow-sm p-4"></div>
</div>
<div class="h-64 bg-white rounded-2xl shadow-sm p-4"></div>
</main>
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-[#1A1A2E]/40 backdrop-blur-sm z-40 flex flex-col justify-end">
<!-- Bottom Sheet Container -->
<section class="bg-white w-full max-w-lg mx-auto rounded-t-[24px] shadow-2xl flex flex-col max-h-[813px] relative overflow-hidden">
<!-- Handle & Header Area -->
<header class="pt-3 pb-6 flex flex-col items-start px-6">
<div class="w-8 h-1 bg-[#E0DEDA] rounded-full self-center mb-6"></div>
<div class="flex justify-between items-start w-full">
<div>
<h2 class="text-[20px] font-extrabold text-[#1A1A2E] leading-tight">Edit today's symptoms</h2>
<p class="text-[14px] text-[#767676] mt-1">Tap <span class="material-symbols-outlined text-[12px] align-middle">close</span> to remove. Tap <span class="material-symbols-outlined text-[12px] align-middle">add</span> to add more.</p>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-[#F2EDEA] hover:bg-[#E7E1DF] transition-colors">
<span class="material-symbols-outlined text-[#67594e]">close</span>
</button>
</div>
</header>
<!-- Scrollable Content -->
<div class="overflow-y-auto px-6 pb-32">
<!-- Logged Today Section -->
<div class="mb-8">
<h3 class="text-[11px] font-bold tracking-[0.08em] text-[#767676] uppercase mb-4">Logged Today</h3>
<div class="flex flex-wrap gap-3">
<!-- Chip 1 -->
<div class="h-[44px] bg-[#F0EBF7] text-[#6B4E8C] px-4 rounded-full flex items-center gap-2 font-semibold text-[15px] whitespace-nowrap">
                            Hot flashes <span class="opacity-40 text-xs mt-1">·</span> 4/5
                            <button class="w-6 h-6 bg-[#D4B8E8] rounded-full flex items-center justify-center ml-1">
<span class="material-symbols-outlined text-white text-[14px]">close</span>
</button>
</div>
<!-- Chip 2 -->
<div class="h-[44px] bg-[#F0EBF7] text-[#6B4E8C] px-4 rounded-full flex items-center gap-2 font-semibold text-[15px] whitespace-nowrap">
                            Anxiety <span class="opacity-40 text-xs mt-1">·</span> 3/5
                            <button class="w-6 h-6 bg-[#D4B8E8] rounded-full flex items-center justify-center ml-1">
<span class="material-symbols-outlined text-white text-[14px]">close</span>
</button>
</div>
<!-- Chip 3 -->
<div class="h-[44px] bg-[#F0EBF7] text-[#6B4E8C] px-4 rounded-full flex items-center gap-2 font-semibold text-[15px] whitespace-nowrap">
                            Fatigue <span class="opacity-40 text-xs mt-1">·</span> 3/5
                            <button class="w-6 h-6 bg-[#D4B8E8] rounded-full flex items-center justify-center ml-1">
<span class="material-symbols-outlined text-white text-[14px]">close</span>
</button>
</div>
<!-- Chip 4 -->
<div class="h-[44px] bg-[#F0EBF7] text-[#6B4E8C] px-4 rounded-full flex items-center gap-2 font-semibold text-[15px] whitespace-nowrap">
                            Brain fog <span class="opacity-40 text-xs mt-1">·</span> 2/5
                            <button class="w-6 h-6 bg-[#D4B8E8] rounded-full flex items-center justify-center ml-1">
<span class="material-symbols-outlined text-white text-[14px]">close</span>
</button>
</div>
<!-- Chip 5 -->
<div class="h-[44px] bg-[#F0EBF7] text-[#6B4E8C] px-4 rounded-full flex items-center gap-2 font-semibold text-[15px] whitespace-nowrap">
                            Joint pain <span class="opacity-40 text-xs mt-1">·</span> 2/5
                            <button class="w-6 h-6 bg-[#D4B8E8] rounded-full flex items-center justify-center ml-1">
<span class="material-symbols-outlined text-white text-[14px]">close</span>
</button>
</div>
</div>
</div>
<!-- Divider -->
<div class="h-[1px] bg-[#F0EEE8] -mx-6 mb-8"></div>
<!-- Add Symptoms Section -->
<div class="mb-8">
<h3 class="text-[11px] font-bold tracking-[0.08em] text-[#767676] uppercase mb-4">Add Symptoms</h3>
<div class="flex flex-wrap gap-3">
<button class="h-[40px] px-5 rounded-[22px] bg-[#FAFAF8] border-[1.5px] border-[#E0DEDA] text-[#4A4A6A] text-[15px] font-medium hover:bg-[#F2EDEA] transition-colors">Night sweats</button>
<button class="h-[40px] px-5 rounded-[22px] bg-[#FAFAF8] border-[1.5px] border-[#E0DEDA] text-[#4A4A6A] text-[15px] font-medium hover:bg-[#F2EDEA] transition-colors">Mood changes</button>
<button class="h-[40px] px-5 rounded-[22px] bg-[#FAFAF8] border-[1.5px] border-[#E0DEDA] text-[#4A4A6A] text-[15px] font-medium hover:bg-[#F2EDEA] transition-colors">Headache</button>
<button class="h-[40px] px-5 rounded-[22px] bg-[#FAFAF8] border-[1.5px] border-[#E0DEDA] text-[#4A4A6A] text-[15px] font-medium hover:bg-[#F2EDEA] transition-colors">Skin dryness</button>
<button class="h-[40px] px-5 rounded-[22px] bg-[#FAFAF8] border-[1.5px] border-[#E0DEDA] text-[#4A4A6A] text-[15px] font-medium hover:bg-[#F2EDEA] transition-colors">Palpitations</button>
<button class="h-[40px] px-5 rounded-[22px] bg-[#FAFAF8] border-[1.5px] border-[#E0DEDA] text-[#4A4A6A] text-[15px] font-medium hover:bg-[#F2EDEA] transition-colors">Bloating</button>
<button class="h-[40px] px-5 rounded-[22px] bg-[#FAFAF8] border-[1.5px] border-[#E0DEDA] text-[#4A4A6A] text-[15px] font-medium hover:bg-[#F2EDEA] transition-colors">Dizziness</button>
<button class="h-[40px] px-5 rounded-[22px] bg-[#FAFAF8] border-[1.5px] border-[#E0DEDA] text-[#4A4A6A] text-[15px] font-medium hover:bg-[#F2EDEA] transition-colors">Low libido</button>
</div>
<button class="mt-6 text-[#6B4E8C] font-bold text-[15px] flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">add</span>
                        See all 40 symptoms
                    </button>
</div>
</div>
<!-- Sticky Footer -->
<footer class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-white via-white to-transparent pt-10">
<button class="w-full h-[52px] bg-[#6B4E8C] hover:bg-[#5A3D7B] active:scale-[0.98] transition-all text-white font-semibold text-[17px] rounded-[14px] shadow-lg shadow-[#6B4E8C]/20 mb-safe">
                    Save changes
                </button>
</footer>
</section>
</div>
<!-- Hidden Navigation required by Shell Logic but suppressed per Transactional focus -->
<nav class="hidden">
<div data-headline="Daily Journal" data-name="TopAppBar"></div>
<div data-icons='["edit_calendar", "auto_graph", "auto_stories", "settings"]' data-label_texts='["Today", "Insights", "Library", "Settings"]' data-name="BottomNavBar"></div>
</nav>
</body></html>
