<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Medication or Supplement</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#fef8f6",
                        "primary-fixed": "#f2dfd0",
                        "surface-container-low": "#f8f2f0",
                        "background": "#fef8f6",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e7e1df",
                        "secondary-fixed": "#edddf5",
                        "on-primary-fixed-variant": "#51443a",
                        "error": "#ba1a1a",
                        "surface-dim": "#ded9d7",
                        "secondary-container": "#edddf5",
                        "on-secondary-container": "#6c6074",
                        "on-primary-container": "#fffbff",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#683a31",
                        "outline-variant": "#d0c4bc",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-tertiary-container": "#fffbff",
                        "on-background": "#1d1b1a",
                        "surface-container-high": "#ede7e5",
                        "inverse-surface": "#32302f",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-secondary": "#ffffff",
                        "surface-container": "#f2edea",
                        "on-primary-fixed": "#231a11",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#341009",
                        "tertiary": "#814f45",
                        "on-surface-variant": "#4d453f",
                        "secondary": "#655a6e",
                        "primary-container": "#817266",
                        "surface": "#fef8f6",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#d6c3b5",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#6a5c50",
                        "primary": "#67594e",
                        "tertiary-container": "#9d675c",
                        "inverse-on-surface": "#f5f0ed",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "secondary-fixed-dim": "#d0c1d8",
                        "outline": "#7f756e",
                        "tertiary-fixed": "#ffdad3",
                        "surface-container-highest": "#e7e1df",
                        "on-secondary-fixed": "#211828",
                        "on-surface": "#1d1b1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": ["Noto Serif", "serif"],
                        "display": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    },
                    "fontSize": {}
                },
            },
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline { font-family: 'Noto Serif', serif; }
        
        /* Checkbox customization */
        .peer:checked ~ .peer-checked\:bg-primary-container {
            background-color: #817266;
        }
        .peer:checked ~ .peer-checked\:after\:translate-x-full::after {
            transform: translateX(100%);
        }
        .peer:checked ~ .peer-checked\:border-white::after {
            border-color: #ffffff;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-4">
<!-- Modal Container -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-[2rem] shadow-[0_24px_48px_-12px_rgba(29,27,26,0.12)] overflow-hidden flex flex-col relative">
<!-- TopAppBar (from JSON but adapted for this context) -->
<header class="flex items-center justify-between px-6 py-5 w-full bg-surface-bright/80 backdrop-blur-xl sticky top-0 z-20 border-b border-surface-container-low">
<h1 class="font-headline font-semibold text-primary text-xl tracking-tight">Add Medication</h1>
<button aria-label="Close" class="text-primary hover:opacity-80 transition-opacity p-2 -mr-2 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<!-- Content Canvas -->
<main class="flex-1 overflow-y-auto p-6 space-y-8 bg-surface">
<!-- Context Text -->
<div class="px-2">
<p class="font-body text-on-surface-variant text-base leading-relaxed">
                    Track other treatments alongside your daily regimen.
                </p>
</div>
<!-- Medication Name Input -->
<div class="space-y-3">
<label class="block font-body text-sm font-semibold text-on-surface pl-4" for="med-name">Medication name</label>
<div class="relative">
<input class="w-full bg-surface-container-highest text-on-surface placeholder-on-surface-variant/50 rounded-full px-6 py-4 font-body text-base border-none focus:ring-2 focus:ring-primary focus:outline-none transition-all" id="med-name" placeholder="e.g., Vitamin D, Magnesium" type="text"/>
</div>
</div>
<!-- Category Selection -->
<div class="space-y-3">
<label class="block font-body text-sm font-semibold text-on-surface pl-4">Category</label>
<div class="flex flex-wrap gap-2">
<button class="bg-secondary-container text-on-secondary-container border border-secondary-container px-4 py-2 rounded-full font-body text-sm font-medium transition-colors">Vitamins</button>
<button class="bg-surface-container-high text-on-surface-variant border border-transparent hover:bg-surface-container-highest px-4 py-2 rounded-full font-body text-sm font-medium transition-colors">Minerals</button>
<button class="bg-surface-container-high text-on-surface-variant border border-transparent hover:bg-surface-container-highest px-4 py-2 rounded-full font-body text-sm font-medium transition-colors">Herbal</button>
<button class="bg-surface-container-high text-on-surface-variant border border-transparent hover:bg-surface-container-highest px-4 py-2 rounded-full font-body text-sm font-medium transition-colors">Prescription</button>
<button class="bg-surface-container-high text-on-surface-variant border border-transparent hover:bg-surface-container-highest px-4 py-2 rounded-full font-body text-sm font-medium transition-colors">Other</button>
</div>
</div>
<!-- Dosage Input -->
<div class="space-y-3">
<label class="block font-body text-sm font-semibold text-on-surface pl-4" for="dose">Dose <span class="font-normal text-on-surface-variant">(optional)</span></label>
<input class="w-full bg-surface-container-highest text-on-surface placeholder-on-surface-variant/50 rounded-full px-6 py-4 font-body text-base border-none focus:ring-2 focus:ring-primary focus:outline-none transition-all" id="dose" placeholder="e.g., 2000 IU, 400 mg" type="text"/>
</div>
<!-- Frequency Selection -->
<div class="space-y-3">
<label class="block font-body text-sm font-semibold text-on-surface pl-4">Frequency</label>
<div class="grid grid-cols-2 gap-3">
<label class="flex items-center p-4 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer border border-transparent has-[:checked]:border-outline-variant has-[:checked]:bg-surface-container">
<input checked="" class="sr-only peer" name="frequency" type="radio" value="daily"/>
<span class="w-5 h-5 rounded-full border-2 border-outline peer-checked:border-[6px] peer-checked:border-primary flex-shrink-0 mr-3 transition-all"></span>
<span class="font-body text-sm text-on-surface">Daily</span>
</label>
<label class="flex items-center p-4 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer border border-transparent has-[:checked]:border-outline-variant has-[:checked]:bg-surface-container">
<input class="sr-only peer" name="frequency" type="radio" value="twice"/>
<span class="w-5 h-5 rounded-full border-2 border-outline peer-checked:border-[6px] peer-checked:border-primary flex-shrink-0 mr-3 transition-all"></span>
<span class="font-body text-sm text-on-surface">Twice daily</span>
</label>
<label class="flex items-center p-4 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer border border-transparent has-[:checked]:border-outline-variant has-[:checked]:bg-surface-container">
<input class="sr-only peer" name="frequency" type="radio" value="weekly"/>
<span class="w-5 h-5 rounded-full border-2 border-outline peer-checked:border-[6px] peer-checked:border-primary flex-shrink-0 mr-3 transition-all"></span>
<span class="font-body text-sm text-on-surface">Weekly</span>
</label>
<label class="flex items-center p-4 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer border border-transparent has-[:checked]:border-outline-variant has-[:checked]:bg-surface-container">
<input class="sr-only peer" name="frequency" type="radio" value="as_needed"/>
<span class="w-5 h-5 rounded-full border-2 border-outline peer-checked:border-[6px] peer-checked:border-primary flex-shrink-0 mr-3 transition-all"></span>
<span class="font-body text-sm text-on-surface">As needed</span>
</label>
</div>
</div>
<!-- Reminder Toggle -->
<div class="flex items-center justify-between p-5 rounded-xl bg-surface-container-low">
<div class="flex flex-col">
<span class="font-body text-base font-semibold text-on-surface">Set daily reminder</span>
<span class="font-body text-sm text-on-surface-variant">We'll notify you when it's time</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-dim peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
</main>
<!-- Action Buttons -->
<footer class="p-6 bg-surface-bright border-t border-surface-container-low space-y-3">
<button class="w-full py-4 px-6 rounded-[1.5rem] bg-gradient-to-br from-primary to-primary-container text-on-primary font-body text-lg font-medium shadow-[0_4px_12px_rgba(103,89,78,0.2)] hover:opacity-90 transition-opacity">
                Save medication
            </button>
<button class="w-full py-4 px-6 rounded-[1.5rem] bg-transparent text-primary font-body text-lg font-medium hover:bg-surface-container transition-colors">
                Cancel
            </button>
</footer>
</div>
</body></html>
