</div>

<input class="w-full bg-[#EEEEEE] border-2 border-[#9B8B7E] rounded-[6px] p-[12px] text-[14px] placeholder-stone-400 transition-all duration-200" placeholder="Create a secure password" type="password"/>
<div class="flex flex-col space-y-1 pl-1 pt-1">
<p class="text-[11px] text-stone-500 font-sans flex items-center"><span class="text-[#9B8B7E] mr-1">✓</span> At least 8 characters</p>
<p class="text-[11px] text-stone-500 font-sans flex items-center"><span class="text-[#9B8B7E] mr-1">✓</span> One uppercase letter</p>
<p class="text-[11px] text-stone-500 font-sans flex items-center"><span class="text-[#9B8B7E] mr-1">✓</span> One number</p>
<p class="text-[11px] text-stone-500 font-sans flex items-center"><span class="text-[#9B8B7E] mr-1">✓</span> One special character (!@#$%)</p>
</div>
</div><div class="flex flex-col space-y-1.5">
