<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 z-0 pointer-events-none" style="background-image: radial-gradient(circle at 80% 20%, rgba(216, 201, 224, 0.4) 0%, transparent 40%), radial-gradient(circle at 20% 80%, rgba(155, 139, 126, 0.2) 0%, transparent 40%);">
</div>
<main class="w-full max-w-md px-6 py-12 relative z-10 flex flex-col">
<header class="mb-12 text-center space-y-4">
<h1 class="font-headline text-4xl text-primary tracking-tight">MenoSync</h1>
<p class="font-body text-on-surface-variant text-lg">Welcome back to your serene space.</p>
</header>
<section class="bg-surface-container-lowest rounded-[1.5rem] p-8 shadow-[0_4px_24px_rgba(29,27,26,0.06)] flex flex-col space-y-6 relative">
<form class="flex flex-col space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="block font-label text-sm font-medium text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-error">mail</span>
<input class="w-full bg-error-container/20 text-on-surface rounded-full pl-12 pr-4 py-3 font-body text-base outline-none border border-error/50 focus:border-error focus:ring-1 focus:ring-error transition-all placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="your@email.com" type="email" value="sarah.j@example"/>
</div>
</div>
<div class="space-y-2">
<label class="block font-label text-sm font-medium text-on-surface-variant" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-error">lock</span>
<input class="w-full bg-error-container/20 text-on-surface rounded-full pl-12 pr-12 py-3 font-body text-base outline-none border border-error/50 focus:border-error focus:ring-1 focus:ring-error transition-all placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="Enter your password" type="password" value="********"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<p class="text-error text-sm mt-2 flex items-center gap-1 font-medium">
<span class="material-symbols-outlined text-[16px]">error</span>
                        Invalid email or password. Please try again.
                    </p>
</div>
<div class="flex justify-end pt-2">
<a class="font-label text-sm font-medium text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="pt-4">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-[1.5rem] py-4 font-label text-base font-semibold shadow-[0_4px_24px_rgba(29,27,26,0.06)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<div class="pt-6 border-t border-surface-container mt-6">
<p class="text-center font-body text-sm text-on-surface-variant">
                    Don't have an account yet? 
                    <a class="font-medium text-primary hover:text-primary-container transition-colors ml-1" href="#">Create one here</a>
</p>
</div>
</section>
