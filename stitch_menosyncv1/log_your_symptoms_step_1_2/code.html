<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync Daily Log</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#6c6074",
                        "primary-fixed": "#f2dfd0",
                        "on-surface": "#1d1b1a",
                        "on-secondary": "#ffffff",
                        "surface-container": "#f2edea",
                        "inverse-primary": "#d6c3b5",
                        "surface-container-highest": "#e7e1df",
                        "primary-container": "#817266",
                        "error": "#ba1a1a",
                        "background": "#F7F5F0",
                        "on-secondary-fixed-variant": "#4d4355",
                        "surface-container-high": "#ede7e5",
                        "tertiary-fixed": "#ffdad3",
                        "tertiary-container": "#9d675c",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#32302f",
                        "secondary-fixed-dim": "#d0c1d8",
                        "inverse-on-surface": "#f5f0ed",
                        "outline": "#7f756e",
                        "on-tertiary-fixed": "#341009",
                        "surface-dim": "#ded9d7",
                        "on-primary-fixed": "#231a11",
                        "secondary-fixed": "#edddf5",
                        "on-tertiary-container": "#fffbff",
                        "on-error-container": "#93000a",
                        "tertiary": "#814f45",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#F3E8FF",
                        "on-tertiary-fixed-variant": "#683a31",
                        "surface-tint": "#6a5c50",
                        "surface-variant": "#e7e1df",
                        "surface-container-low": "#f8f2f0",
                        "on-primary-container": "#fffbff",
                        "on-secondary-fixed": "#211828",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-primary-fixed-variant": "#51443a",
                        "surface-bright": "#fef8f6",
                        "outline-variant": "#E9D5FF",
                        "on-primary": "#ffffff",
                        "surface": "#F7F5F0",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "secondary": "#655a6e",
                        "primary": "#67594e",
                        "on-background": "#1d1b1a",
                        "on-surface-variant": "#4d453f",
                        "taupe": "#817266"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body { font-family: 'Manrope', sans-serif; background-color: #F7F5F0; }
        h1, h2, h3 { font-family: 'Noto Serif', serif; }
        .symptom-chip {
            @apply flex items-center gap-3 p-4 bg-white border border-outline-variant rounded-[12px] text-left transition-all duration-200 relative w-full;
        }
        .symptom-chip.selected {
            @apply bg-secondary-container border-taupe;
        }
        .check-badge {
            @apply absolute -top-1 -right-1 bg-[#4caf50] text-white rounded-full p-0.5 shadow-sm hidden;
        }
        .selected .check-badge {
            @apply block;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface min-h-screen flex flex-col">
<header class="w-full sticky top-0 z-50 bg-[#F7F5F0]/80 backdrop-blur-md">
<div class="flex items-center justify-between px-6 py-4 w-full">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-headline text-lg font-medium italic text-primary">Step 1 of 3</span>
<div class="w-10"></div>
</div>
<div class="w-full h-1 bg-surface-container overflow-hidden">
<div class="h-full bg-taupe" style="width: 33%"></div>
</div>
</header>
<main class="flex-grow px-6 pt-8 pb-32 max-w-md mx-auto w-full">
<section class="mb-8">
<h1 class="text-2xl font-bold tracking-tight text-primary leading-tight mb-2">
            What are you experiencing today?
        </h1>
<p class="text-on-surface-variant text-sm">Categorized Symptom Selection</p>
</section>
<div class="space-y-12">
<section>
<div class="flex items-center gap-2 mb-4">
<span class="text-xs font-bold uppercase tracking-wider text-taupe bg-taupe/10 px-2 py-1 rounded">1 of 3</span>
<h2 class="text-lg font-bold text-primary">Physical Well-being</h2>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="symptom-chip selected">
<div class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center text-orange-600">
<span class="material-symbols-outlined text-[20px]">local_fire_department</span>
</div>
<span class="text-on-surface font-semibold text-xs leading-tight">Hot Flashes</span>
<div class="check-badge">
<span class="material-symbols-outlined text-[12px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<button class="symptom-chip">
<div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">
<span class="material-symbols-outlined text-[20px]">water_drop</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Night Sweats</span>
</button>
<button class="symptom-chip">
<div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600">
<span class="material-symbols-outlined text-[20px]">bedtime</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Sleep Issues</span>
</button>
<button class="symptom-chip">
<div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-600">
<span class="material-symbols-outlined text-[20px]">fitness_center</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Joint Pain</span>
</button>
<button class="symptom-chip">
<div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600">
<span class="material-symbols-outlined text-[20px]">medical_services</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Headache</span>
</button>
<button class="symptom-chip">
<div class="w-8 h-8 rounded-full bg-yellow-100 flex items-center justify-center text-yellow-700">
<span class="material-symbols-outlined text-[20px]">battery_low</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Fatigue</span>
</button>
</div>
</section>
<section>
<div class="flex items-center gap-2 mb-4">
<span class="text-xs font-bold uppercase tracking-wider text-taupe bg-taupe/10 px-2 py-1 rounded">2 of 3</span>
<h2 class="text-lg font-bold text-primary">Emotional State</h2>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="symptom-chip">
<div class="w-8 h-8 rounded-full bg-purple-100 flex items-center justify-center text-purple-600">
<span class="material-symbols-outlined text-[20px]">mood</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Mood Changes</span>
</button>
<button class="symptom-chip">
<div class="w-8 h-8 rounded-full bg-cyan-100 flex items-center justify-center text-cyan-600">
<span class="material-symbols-outlined text-[20px]">psychology</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Brain Fog</span>
</button>
<button class="symptom-chip">
<div class="w-8 h-8 rounded-full bg-teal-100 flex items-center justify-center text-teal-600">
<span class="material-symbols-outlined text-[20px]">potted_plant</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Anxiety</span>
</button>
<button class="symptom-chip">
<div class="w-8 h-8 rounded-full bg-rose-100 flex items-center justify-center text-rose-600">
<span class="material-symbols-outlined text-[20px]">bolt</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Irritability</span>
</button>
</div>
</section>
<section>
<div class="flex items-center gap-2 mb-4">
<span class="text-xs font-bold uppercase tracking-wider text-taupe bg-taupe/10 px-2 py-1 rounded">3 of 3</span>
<h2 class="text-lg font-bold text-primary">Other Considerations</h2>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="symptom-chip">
<div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-blue-400">
<span class="material-symbols-outlined text-[20px]">opacity</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Vaginal Dryness</span>
</button>
<button class="symptom-chip">
<div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center text-green-600">
<span class="material-symbols-outlined text-[20px]">trending_up</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Weight Gain</span>
</button>
<button class="symptom-chip">
<div class="w-8 h-8 rounded-full bg-pink-100 flex items-center justify-center text-pink-600">
<span class="material-symbols-outlined text-[20px]">calendar_month</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Irregular Bleeding</span>
</button>
<button class="symptom-chip">
<div class="w-8 h-8 rounded-full bg-red-50 flex items-center justify-center text-red-400">
<span class="material-symbols-outlined text-[20px]">favorite</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Palpitations</span>
</button>
<button class="symptom-chip col-span-2">
<div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</div>
<span class="text-on-surface font-medium text-xs leading-tight">Other</span>
</button>
</div>
<div class="mt-6 p-5 bg-white rounded-xl border border-outline-variant/30 shadow-sm">
<h3 class="text-sm font-bold text-primary mb-3">Something else?</h3>
<textarea class="w-full bg-surface-container-low border-none rounded-xl p-4 font-body text-sm text-on-surface focus:ring-2 focus:ring-taupe/20 min-h-[80px] italic placeholder:text-gray-400" placeholder="Journal your thoughts today..."></textarea>
</div>
</section>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full p-6 bg-white/80 backdrop-blur-xl border-t border-surface-container-highest flex justify-center items-center z-50">
<button class="w-full max-w-md py-4 px-8 rounded-full bg-taupe text-white font-bold text-lg shadow-lg hover:opacity-90 transition-all active:scale-95 duration-150 flex items-center justify-center gap-2">
<span>Next → Select Severity</span>
</button>
</footer>
<div class="fixed top-0 right-0 -z-10 opacity-10 pointer-events-none">
<img alt="background" class="w-full h-screen object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAts6W1Pzme3wZE0CMhtaeED5H8XJ9qcUJfAhJYskXlXNw1ifTI6-6JxIfcVRQIK_GPa-leTROctEsNetFVmQCB_mLcAFUBM_KO4v-M36SY8QOVb3EfW6aUl7blitrT2ggLzz33AM23_vIPwTAbLXjiaExGieMpwD6dQ_HHiGJXjwer7xJlCWMQHS7ltN-233OUSSXIr4skHHOiGQmwKeEBN8BH_uBJeH-8__H7Co4AtoN8oduYkRTmELmO4NQDq7HSRG0-ZKjkkXo"/>
</div>

</body></html>
