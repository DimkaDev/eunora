<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verify Email - MenoSync</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#7f756e",
                        "primary": "#67594e",
                        "background": "#F7F5F0",
                        "on-primary": "#ffffff",
                        "on-surface": "#1d1b1a",
                        "primary-container": "#817266",
                        "on-surface-variant": "#4d453f",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "surface-container": "#f2edea",
                        "surface-container-highest": "#EEEEEE",
                        "secondary-container": "#e8f5e9",
                        "on-secondary-container": "#2e7d32",
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .tonal-transition {
            background: linear-gradient(180deg, #F7F5F0 0%, #f2edea 100%);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .code-field:focus {
            box-shadow: 0 0 0 2px #67594e;
        }
    </style>
<style>
        body {
            min-height: max(844px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface min-h-screen flex flex-col items-center">
<header class="w-full sticky top-0 z-50 bg-background flex justify-between items-center px-6 py-4">
<div class="flex items-center gap-4">
<button class="transition-all duration-300 ease-in-out active:scale-95 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline text-[17px] font-semibold text-on-surface">Verification</h1>
</div>
<div class="w-10"></div>
</header>
<main class="flex-1 w-full max-w-[340px] px-4 pt-8 pb-12 flex flex-col items-center text-center">
<div class="mb-8 flex flex-col items-center">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 0, 'wght' 300;">mail</span>
</div>
<h2 class="font-headline text-[22px] font-bold text-on-surface leading-tight mb-2">Verify Your Email</h2>
<p class="font-body text-[13px] text-on-surface-variant leading-relaxed">
                We sent a code to <span class="font-semibold text-primary">sarah@email.com</span>
</p>
</div>
<div class="w-full space-y-6">
<div class="text-left">
<label class="block font-label text-[13px] font-bold text-on-surface-variant mb-2 px-1">
                    Enter verification code
                </label>
<div class="relative group">
<input class="w-full h-16 bg-surface-container-highest border-2 border-transparent focus:border-primary text-center font-mono text-[28px] tracking-[0.5em] rounded-2xl transition-all outline-none pl-[0.5em] code-field" inputmode="numeric" maxlength="6" pattern="[0-9]*" placeholder="000000" type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-primary opacity-40 group-focus-within:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[20px]">content_paste</span>
</div>
</div>
<p class="font-body text-[11px] text-outline mt-3 px-1 flex items-center gap-1.5">
<span class="material-symbols-outlined text-[14px]">info</span>
                    Check your email (spam folder too)
                </p>
</div>
<div class="flex flex-col gap-3">
<button class="w-full py-4 bg-primary text-white font-label font-bold text-[15px] rounded-full shadow-lg shadow-primary/10 transition-all duration-300 active:scale-95">
                    Verify Email
                </button>
<div class="flex items-center gap-2">
<button class="flex-1 py-3 bg-white border-2 border-surface-container text-primary font-label font-bold text-[13px] rounded-full transition-all duration-300 active:scale-95 hover:bg-surface-container">
                        Resend Code
                    </button>
<div class="px-4 py-3 bg-surface-container/50 rounded-full flex items-center gap-1.5 text-outline font-label text-[12px] font-medium min-w-[100px] justify-center">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                        45s
                    </div>
</div>
</div>
</div>
<div class="mt-12">
<a class="text-primary underline underline-offset-4 font-label text-[13px] font-semibold transition-colors hover:text-primary-container" href="#">
                Use a different email
            </a>
</div>
<div class="mt-16 w-full space-y-3 opacity-30">
<div class="p-3 bg-secondary-container rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-on-secondary-container text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[12px] text-on-secondary-container font-medium">Verified!</span>
</div>
<div class="p-3 bg-error-container rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-error text-[20px]" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="text-[12px] text-on-error-container font-medium">Incorrect code. Try again.</span>
</div>
</div>
</main>
<div class="fixed top-[-5%] right-[-10%] w-[50%] h-[30%] rounded-full bg-primary/5 blur-[80px] -z-10"></div>
<div class="fixed bottom-[-5%] left-[-10%] w-[50%] h-[30%] rounded-full bg-primary/5 blur-[80px] -z-10"></div>

</body></html>
