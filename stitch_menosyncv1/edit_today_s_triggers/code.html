<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log Your Triggers - MenoSync</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",

                extend: {

                        "on-primary-fixed-variant": "#51443a",
                        "on-primary": "#ffffff",
                        "secondary": "#655a6e",
                        "outline": "#7f756e",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1d1b1a",
                        "surface-container-low": "#f8f2f0",
                        "on-secondary-fixed": "#211828",
                        "inverse-primary": "#d6c3b5",
                        "primary": "#67594e",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-container-high": "#ede7e5",
                        "surface-container-highest": "#e7e1df",
                        "surface-variant": "#e7e1df",
                        "inverse-on-surface": "#f5f0ed",
                        "surface-tint": "#6a5c50",
                        "secondary-container": "#edddf5",
                        "on-primary-fixed": "#231a11",
                        "background": "#fef8f6",
                        "on-surface-variant": "#4d453f",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-background": "#1d1b1a",
                        "on-tertiary-fixed": "#341009",
                        "tertiary-container": "#9d675c",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#32302f",
                        "surface": "#fef8f6",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#ffdad3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "3xl": "2rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .serif-font { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-blur-backdrop {
            backdrop-filter: blur(8px);
            background-color: rgba(29, 27, 26, 0.4);
        }
        .shadow-soft {
            box-shadow: 0 4px 24px rgba(29, 27, 26, 0.06);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen relative overflow-hidden">
<!-- Mock Background Content (Dashboard) -->
<div class="px-5 pt-20 space-y-8 opacity-40 grayscale-[0.2]">
<div class="flex items-center justify-between">
<div>
<h2 class="text-3xl serif-font font-bold text-primary italic">Good Morning,</h2>
<h1 class="text-4xl serif-font font-extrabold text-on-surface tracking-tight">Evelyn</h1>
</div>
<div class="w-12 h-12 rounded-full overflow-hidden bg-surface-container-highest">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="Portrait of a mature woman with a warm, serene expression, natural lighting, high-end wellness photography style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB8oedMzfVRCPWDZXJ6p78UhW9iXiTWdDeIc2lK3V_6mZhNIhiWWbs7KoNF_QUd6gOhL3RXa4aG754SOCYu6wahXDzFkJ9Nh0Jqrxm4SjyaRtD0zmBrODqs8JDSyY_9jhSoThqvPUwSlDT6uCR83d_B7juRmsOTuAazXCLwXXyofOirm7fl-EWm4J8FxKXIGAKjBhTos1rh63oMY_d0ykYP0xLVHnfsMdEMjbhfwyP0pUuLmnSakGlfN6-k0XbW7eEAQ9ide2MN_E0"/>
</div>
</div>
<!-- Weekly Progress Preview -->
<div class="bg-surface-container-lowest rounded-3xl p-6 shadow-soft">
<div class="flex justify-between items-end mb-4">
<span class="text-sm font-semibold text-primary uppercase tracking-widest">Symptom Trends</span>
<span class="text-xs text-on-surface-variant italic">Last 7 days</span>
</div>
<div class="flex justify-between items-center h-32 gap-3">
<div class="flex-1 bg-secondary-fixed rounded-t-full h-[40%]"></div>
<div class="flex-1 bg-secondary-fixed rounded-t-full h-[65%]"></div>
<div class="flex-1 bg-primary-container rounded-t-full h-[85%]"></div>
<div class="flex-1 bg-secondary-fixed rounded-t-full h-[55%]"></div>
<div class="flex-1 bg-secondary-fixed rounded-t-full h-[70%]"></div>
<div class="flex-1 bg-secondary-fixed rounded-t-full h-[45%]"></div>
<div class="flex-1 bg-secondary-fixed rounded-t-full h-[30%]"></div>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="aspect-square bg-surface-container rounded-3xl p-5 flex flex-col justify-between">
<span class="material-symbols-outlined text-primary">spa</span>
<span class="font-bold text-lg leading-tight">Cycle Day 14</span>
</div>
<div class="aspect-square bg-tertiary-fixed-dim/30 rounded-3xl p-5 flex flex-col justify-between">
<span class="material-symbols-outlined text-tertiary">thermostat</span>
<span class="font-bold text-lg leading-tight">Basal Temp 98.2°</span>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-blur-backdrop z-[60] flex flex-col justify-end">
<!-- Bottom Sheet Canvas -->
<div class="bg-surface rounded-t-3xl w-full max-h-[795px] overflow-hidden flex flex-col shadow-2xl relative">
<!-- Handle & Close Header -->
<div class="flex flex-col items-center pt-3 pb-2 relative">
<div class="w-10 h-1.5 bg-outline-variant/40 rounded-full mb-2"></div>
<div class="w-full flex justify-between items-center px-6">
<div class="w-10"></div> <!-- Spacer for symmetry -->
<h2 class="serif-font text-xl font-bold text-on-surface">Log Your Triggers</h2>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<p class="text-on-surface-variant text-sm font-medium mt-1">Adjust quantity or remove triggers</p>
</div>
<!-- Content Area -->
<div class="flex-1 overflow-y-auto px-6 pt-6 pb-24 space-y-8">
<!-- Section: Logged Today -->
<section>
<div class="flex items-center gap-2 mb-4">
<h3 class="text-xs font-bold text-primary uppercase tracking-[0.1em]">Logged Today</h3>
<div class="h-px flex-1 bg-outline-variant/20"></div>
</div>
<div class="space-y-4">
<!-- Caffeine Card -->
<div class="bg-surface-container-lowest rounded-2xl p-4 flex items-center gap-4 shadow-soft">
<div class="w-12 h-12 rounded-xl bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="coffee" style="font-variation-settings: 'FILL' 1;">coffee</span>
</div>
<div class="flex-1">
<p class="font-bold text-on-surface">Caffeine</p>
<p class="text-sm text-on-surface-variant">2 cups</p>
</div>
<div class="flex items-center bg-surface-container-high rounded-full px-2 py-1 gap-3">
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-container-lowest text-primary shadow-sm">
<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<span class="font-bold text-on-surface px-1">2</span>
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-container-lowest text-primary shadow-sm">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
<button class="text-outline hover:text-error transition-colors ml-2">
<span class="material-symbols-outlined text-[22px]">delete</span>
</button>
</div>
<!-- Stress Card -->
<div class="bg-surface-container-lowest rounded-2xl p-4 flex flex-col gap-4 shadow-soft">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-xl bg-secondary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-secondary" data-icon="psychology" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
<div class="flex-1">
<p class="font-bold text-on-surface">Stress</p>
<p class="text-sm text-on-surface-variant">Level: Moderate</p>
</div>
<button class="text-outline hover:text-error transition-colors ml-2">
<span class="material-symbols-outlined text-[22px]">delete</span>
</button>
</div>
<div class="flex bg-surface-container-low rounded-2xl p-1.5 gap-1.5">
<button class="flex-1 flex flex-col items-center justify-center py-2.5 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined mb-1">sentiment_satisfied</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Calm</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center py-2.5 rounded-xl bg-secondary-container text-on-secondary-container shadow-sm border border-secondary-fixed-dim/30">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">sentiment_neutral</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Moderate</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center py-2.5 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined mb-1">sentiment_dissatisfied</span>
<span class="text-[10px] font-bold uppercase tracking-wider">High</span>
</button>
</div>
</div>
</div>
</section>
<!-- Section: Add Triggers -->
<section>
<div class="flex items-center gap-2 mb-4">
<h3 class="text-xs font-bold text-primary uppercase tracking-[0.1em]">Add Triggers</h3>
<div class="h-px flex-1 bg-outline-variant/20"></div>
</div>
<div class="flex flex-wrap gap-3">
<button class="px-5 py-3 rounded-2xl bg-surface-container-high text-on-surface font-semibold text-sm hover:bg-surface-container-highest transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">fitness_center</span>
                            Exercise
                        </button>
<button class="px-5 py-3 rounded-2xl bg-surface-container-high text-on-surface font-semibold text-sm hover:bg-surface-container-highest transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">cloud</span>
                            Weather
                        </button>
<button class="px-5 py-3 rounded-2xl bg-surface-container-high text-on-surface font-semibold text-sm hover:bg-surface-container-highest transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">bedtime</span>
                            Poor Sleep
                        </button>
<button class="px-5 py-3 rounded-2xl bg-surface-container-high text-on-surface font-semibold text-sm hover:bg-surface-container-highest transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">restaurant</span>
                            Specific Foods
                        </button>
<button class="px-5 py-3 rounded-2xl border-2 border-dashed border-outline-variant/50 text-primary font-bold text-sm flex items-center gap-2 hover:border-primary/50 transition-colors">
<span class="material-symbols-outlined text-[18px]">add_circle</span>
                            Add custom
                        </button>
</div>
</section>
</div>
<!-- Fixed Footer Button -->
<div class="absolute bottom-0 left-0 w-full px-6 pb-10 pt-4 bg-gradient-to-t from-surface via-surface/90 to-transparent">
<button class="w-full h-16 bg-gradient-to-br from-primary to-primary-container text-white rounded-3xl font-bold text-lg shadow-lg shadow-primary/20 active:scale-95 transition-transform duration-200">
                    Done
                </button>
</div>
</div>
</div>
</body></html>
