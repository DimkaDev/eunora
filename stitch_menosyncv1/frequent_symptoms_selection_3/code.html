<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Frequent Symptoms Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#edddf5",
                        "surface-bright": "#fef8f6",
                        "on-primary": "#ffffff",
                        "outline": "#7f756e",
                        "on-tertiary-container": "#fffbff",
                        "on-primary-fixed-variant": "#51443a",
                        "secondary": "#655a6e",
                        "surface-container": "#f2edea",
                        "primary": "#67594e",
                        "on-secondary-fixed-variant": "#4d4355",
                        "outline-variant": "#d0c4bc",
                        "on-secondary-container": "#6c6074",
                        "on-surface-variant": "#4d453f",
                        "background": "#F7F5F0",
                        "surface-dim": "#ded9d7",
                        "surface-variant": "#e7e1df",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#341009",
                        "tertiary-container": "#9d675c",
                        "on-error-container": "#93000a",
                        "surface": "#F7F5F0",
                        "primary-fixed": "#f2dfd0",
                        "inverse-surface": "#32302f",
                        "secondary-fixed-dim": "#d0c1d8",
                        "secondary-container": "#edddf5",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#ffdad3",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#ede7e5",
                        "primary-fixed-dim": "#d6c3b5",
                        "surface-container-highest": "#e7e1df",
                        "on-primary-container": "#fffbff",
                        "surface-tint": "#6a5c50",
                        "inverse-primary": "#d6c3b5",
                        "inverse-on-surface": "#f5f0ed",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "error": "#ba1a1a",
                        "primary-container": "#817266",
                        "on-primary-fixed": "#231a11",
                        "on-background": "#1d1b1a",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f8f2f0",
                        "on-secondary-fixed": "#211828",
                        "tertiary": "#814f45",
                        "on-surface": "#1d1b1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .font-noto-serif { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .symptom-row-selected {
            background-color: #E8E0F0;
            border-color: #9B8B7E;
            border-width: 2px;
        }
        .circular-checkbox {
            @apply w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all;
        }
        .circular-checkbox-checked {
            @apply bg-primary border-primary;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F7F5F0] text-on-surface min-h-screen pb-40">
<header class="fixed top-0 w-full z-50 bg-[#F7F5F0]/80 backdrop-blur-xl flex items-center justify-between px-6 py-4 transition-opacity duration-300">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform text-[#9B8B7E]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-noto-serif italic text-lg text-[#9B8B7E]">Step 4 of 7</h1>
</div>
<div class="text-xl font-bold text-[#67594e]">MenoSync</div>
</header>
<main class="pt-24 px-6 max-w-2xl mx-auto">
<section class="mb-8">
<h2 class="font-headline text-[20px] font-bold text-[#1d1b1a] leading-tight mb-2">Your Most Frequent Symptoms</h2>
<p class="font-body text-[#7f756e] text-[12px] leading-relaxed">
                Select your most frequent ones. We'll emphasize tracking them in your daily log.
            </p>
</section>
<div class="relative mb-6">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="search">search</span>
<input class="w-full bg-[#f2edea] border-1 border-[#d0c4bc] rounded-xl py-3 pl-12 pr-6 text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary-container transition-all" placeholder="Search symptoms..." type="text"/>
</div>
<div class="space-y-8">
<div>
<h3 class="text-[14px] font-bold text-[#9B8B7E] uppercase tracking-wider mb-4 border-b border-outline-variant pb-2">Physical Symptoms</h3>
<div class="space-y-3">
<button class="w-full flex items-center justify-between bg-white p-4 rounded-[10px] border border-light-gray symptom-row-selected">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="thermostat">thermostat</span>
</div>
<div class="text-left">
<p class="font-bold text-sm text-on-surface">Hot Flashes</p>
<p class="text-[11px] text-on-surface-variant">Sudden waves of heat</p>
</div>
</div>
<div class="circular-checkbox circular-checkbox-checked">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</button>
<button class="w-full flex items-center justify-between bg-white p-4 rounded-[10px] border border-[#d0c4bc]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="water_drop">water_drop</span>
</div>
<div class="text-left">
<p class="font-bold text-sm text-on-surface">Night Sweats</p>
<p class="text-[11px] text-on-surface-variant">Heavy sweating at night</p>
</div>
</div>
<div class="circular-checkbox"></div>
</button>
<button class="w-full flex items-center justify-between bg-white p-4 rounded-[10px] border border-[#d0c4bc]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="accessibility_new">accessibility_new</span>
</div>
<div class="text-left">
<p class="font-bold text-sm text-on-surface">Joint Pain</p>
<p class="text-[11px] text-on-surface-variant">Aches and stiffness</p>
</div>
</div>
<div class="circular-checkbox"></div>
</button>
<button class="w-full flex items-center justify-between bg-white p-4 rounded-[10px] border border-[#d0c4bc]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="personal_injury">personal_injury</span>
</div>
<div class="text-left">
<p class="font-bold text-sm text-on-surface">Headaches</p>
<p class="text-[11px] text-on-surface-variant">Migraines or tension headaches</p>
</div>
</div>
<div class="circular-checkbox"></div>
</button>
<button class="w-full flex items-center justify-between bg-white p-4 rounded-[10px] border border-[#d0c4bc]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-[#ffdad3] flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" data-icon="opacity">opacity</span>
</div>
<div class="text-left">
<p class="font-bold text-sm text-on-surface">Vaginal Dryness</p>
<p class="text-[11px] text-on-surface-variant">Discomfort or reduced lubrication</p>
</div>
</div>
<div class="circular-checkbox"></div>
</button>
<button class="w-full flex items-center justify-between bg-white p-4 rounded-[10px] border border-[#d0c4bc]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="scale">scale</span>
</div>
<div class="text-left">
<p class="font-bold text-sm text-on-surface">Weight Changes</p>
<p class="text-[11px] text-on-surface-variant">Sudden weight gain or difficulty losing</p>
</div>
</div>
<div class="circular-checkbox"></div>
</button>
<button class="w-full flex items-center justify-between bg-white p-4 rounded-[10px] border border-[#d0c4bc]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-[#ffdad3] flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
</div>
<div class="text-left">
<p class="font-bold text-sm text-on-surface">Irregular Periods</p>
<p class="text-[11px] text-on-surface-variant">Unpredictable menstrual cycles</p>
</div>
</div>
<div class="circular-checkbox"></div>
</button>
</div>
</div>
<div>
<h3 class="text-[14px] font-bold text-[#9B8B7E] uppercase tracking-wider mb-4 border-b border-outline-variant pb-2">Emotional &amp; Cognitive</h3>
<div class="space-y-3">
<button class="w-full flex items-center justify-between bg-white p-4 rounded-[10px] border border-light-gray symptom-row-selected">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="bedtime">bedtime</span>
</div>
<div class="text-left">
<p class="font-bold text-sm text-on-surface">Sleep Issues</p>
<p class="text-[11px] text-on-surface-variant">Difficulty falling/staying asleep</p>
</div>
</div>
<div class="circular-checkbox circular-checkbox-checked">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</button>
<button class="w-full flex items-center justify-between bg-white p-4 rounded-[10px] border border-[#d0c4bc]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="sentiment_dissatisfied">sentiment_dissatisfied</span>
</div>
<div class="text-left">
<p class="font-bold text-sm text-on-surface">Mood Changes</p>
<p class="text-[11px] text-on-surface-variant">Anxiety, irritability, sadness</p>
</div>
</div>
<div class="circular-checkbox"></div>
</button>
<button class="w-full flex items-center justify-between bg-white p-4 rounded-[10px] border border-[#d0c4bc]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="cloud">cloud</span>
</div>
<div class="text-left">
<p class="font-bold text-sm text-on-surface">Brain Fog</p>
<p class="text-[11px] text-on-surface-variant">Difficulty concentrating or remembering</p>
</div>
</div>
<div class="circular-checkbox"></div>
</button>
</div>
</div>
<button class="w-full flex items-center justify-center gap-2 border-2 border-dashed border-[#9B8B7E] bg-transparent py-4 rounded-[10px] active:bg-[#f2edea] transition-all">
<span class="material-symbols-outlined text-[#9B8B7E]" data-icon="add">add</span>
<span class="font-bold text-sm text-[#9B8B7E] uppercase tracking-wider">Other Symptoms</span>
</button>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full bg-[#F7F5F0]/90 backdrop-blur-md px-6 pb-8 pt-4 flex flex-col items-center gap-4 shadow-[0_-10px_20px_rgba(0,0,0,0.02)]">
<button class="text-[12px] font-medium text-[#7f756e] hover:text-primary transition-colors tracking-tight">
            Skip this step
        </button>
<button class="w-full bg-[#9B8B7E] text-white py-4 rounded-[10px] font-bold text-[16px] shadow-sm active:scale-[0.98] transition-all">
            Continue
        </button>
</footer>

</body></html>
