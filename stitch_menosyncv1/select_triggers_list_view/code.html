<!-- Main Canvas -->
<main class="max-w-3xl mx-auto px-5 md:px-8 pt-8">
<!-- Header Section -->
<div class="mb-10 text-center md:text-left">
<h2 class="font-headline text-[2.5rem] leading-tight text-on-surface mb-3">Notice anything today?</h2>
<p class="font-body text-[1.125rem] text-on-surface-variant leading-relaxed max-w-2xl">
                Gently observe what might be affecting your body right now. Selecting potential triggers helps build your personal insights over time.
            </p>
</div>
<!-- Descriptive List View -->
<div class="flex flex-col space-y-4 mb-16">
<!-- List Item 1 -->
<button class="w-full text-left bg-surface-container-lowest rounded-xl p-5 hover:bg-surface-container-low transition-colors duration-200 group flex items-start space-x-5">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center flex-shrink-0 group-hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[24px]">local_cafe</span>
</div>
<div class="flex-1 pt-1">
<h3 class="font-body font-semibold text-[1.125rem] text-on-surface mb-1">Caffeine</h3>
<p class="font-body text-[0.875rem] text-on-surface-variant leading-snug">Coffee, black tea, green tea, or energy drinks consumed today.</p>
</div>
<div class="pt-2 pl-2">
<span class="material-symbols-outlined text-surface-variant text-[24px]">add_circle</span>
</div>
</button>
<!-- List Item 2 (Selected State) -->
<button class="w-full text-left bg-secondary-container rounded-xl p-5 transition-colors duration-200 group flex items-start space-x-5 shadow-[0_4px_24px_rgba(29,27,26,0.04)] relative overflow-hidden">

<div class="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent pointer-events-none"></div>
<div class="w-12 h-12 rounded-full bg-surface-container-lowest flex items-center justify-center flex-shrink-0 relative z-10">
<span class="material-symbols-outlined text-primary text-[24px]" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
<div class="flex-1 pt-1 relative z-10">
<h3 class="font-body font-semibold text-[1.125rem] text-on-surface mb-1">Stress</h3>
<p class="font-body text-[0.875rem] text-on-surface-variant leading-snug">Emotional tension, work pressure, or general anxiety.</p>
</div>
<div class="pt-2 pl-2 relative z-10">
<span class="material-symbols-outlined text-primary text-[24px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- List Item 3 -->
<button class="w-full text-left bg-surface-container-lowest rounded-xl p-5 hover:bg-surface-container-low transition-colors duration-200 group flex items-start space-x-5">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center flex-shrink-0 group-hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[24px]">nights_stay</span>
</div>
<div class="flex-1 pt-1">
<h3 class="font-body font-semibold text-[1.125rem] text-on-surface mb-1">Poor Sleep</h3>
<p class="font-body text-[0.875rem] text-on-surface-variant leading-snug">Difficulty falling asleep, waking often, or less than 6 hours.</p>
</div>
<div class="pt-2 pl-2">
<span class="material-symbols-outlined text-surface-variant text-[24px]">add_circle</span>
</div>
</button>
<!-- List Item 4 -->
<button class="w-full text-left bg-surface-container-lowest rounded-xl p-5 hover:bg-surface-container-low transition-colors duration-200 group flex items-start space-x-5">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center flex-shrink-0 group-hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[24px]">restaurant</span>
</div>
<div class="flex-1 pt-1">
<h3 class="font-body font-semibold text-[1.125rem] text-on-surface mb-1">Dietary Change</h3>
<p class="font-body text-[0.875rem] text-on-surface-variant leading-snug">Unusual or heavy meals, skipping meals, or specific food sensitivities.</p>
</div>
<div class="pt-2 pl-2">
<span class="material-symbols-outlined text-surface-variant text-[24px]">add_circle</span>
</div>
</button>
<!-- List Item 5 -->
<button class="w-full text-left bg-surface-container-lowest rounded-xl p-5 hover:bg-surface-container-low transition-colors duration-200 group flex items-start space-x-5">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center flex-shrink-0 group-hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[24px]">water_drop</span>
</div>
<div class="flex-1 pt-1">

<p class="font-body text-[0.875rem] text-on-surface-variant leading-snug">Feeling parched, dark urine, or drinking less water than usual.</p>
</div>
<div class="pt-2 pl-2">
<span class="material-symbols-outlined text-surface-variant text-[24px]">add_circle</span>
</div>
</button>
</div>
