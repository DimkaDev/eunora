<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Sign In Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-fixed-dim": "#f9b7a9",
                        "primary-container": "#817266",
                        "on-tertiary-container": "#fffbff",
                        "on-primary-fixed": "#231a11",
                        "inverse-primary": "#d6c3b5",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#e7e1df",
                        "surface-bright": "#fef8f6",
                        "on-error-container": "#93000a",
                        "background": "#fef8f6",
                        "surface": "#fef8f6",
                        "secondary-container": "#edddf5",
                        "on-surface-variant": "#4d453f",
                        "outline-variant": "#d0c4bc",
                        "on-surface": "#1d1b1a",
                        "inverse-on-surface": "#f5f0ed",
                        "on-secondary-fixed": "#211828",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#32302f",
                        "secondary-fixed-dim": "#d0c1d8",
                        "on-primary-fixed-variant": "#51443a",
                        "secondary-fixed": "#edddf5",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#fffbff",
                        "secondary": "#655a6e",
                        "on-secondary-container": "#6c6074",
                        "on-background": "#1d1b1a",
                        "surface-dim": "#ded9d7",
                        "outline": "#7f756e",
                        "on-error": "#ffffff",
                        "surface-variant": "#e7e1df",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#f2dfd0",
                        "primary": "#67594e",
                        "on-tertiary-fixed-variant": "#683a31",
                        "tertiary": "#814f45",
                        "surface-container": "#f2edea",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-tertiary-fixed": "#341009",
                        "tertiary-fixed": "#ffdad3",
                        "surface-tint": "#6a5c50",
                        "surface-container-low": "#f8f2f0",
                        "tertiary-container": "#9d675c",
                        "surface-container-high": "#ede7e5",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-primary": "#ffffff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Noto Serif", "serif"],
                        "display": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col">
<main class="flex-grow flex flex-col relative px-6 py-12 md:py-24 max-w-lg mx-auto w-full z-10">
<!-- Header -->
<header class="mb-12 text-center md:text-left flex flex-col gap-4">
<h1 class="font-display text-4xl text-primary font-normal tracking-tight">Welcome back</h1>
<p class="font-body text-on-surface-variant text-lg">Continue your wellness journey with MenoSync.</p>
</header>
<!-- Form Container -->
<div class="bg-surface-container-low p-8 rounded-xl flex flex-col gap-6 relative">
<!-- Loading Overlay to slightly dim inputs -->
<div class="absolute inset-0 bg-surface/40 rounded-xl z-20 pointer-events-none"></div>
<!-- Email Input -->
<div class="flex flex-col gap-2 relative z-10 opacity-70">
<label class="font-label text-sm text-on-surface-variant font-medium pl-4" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-highest rounded-full py-4 pl-12 pr-4 text-on-surface font-body outline-none border-none focus:ring-0 opacity-80 cursor-not-allowed" id="email" readonly="" type="email" value="sarah.j@example.com"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2 relative z-10 opacity-70">
<label class="font-label text-sm text-on-surface-variant font-medium pl-4" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-highest rounded-full py-4 pl-12 pr-4 text-on-surface font-body outline-none border-none focus:ring-0 opacity-80 cursor-not-allowed" id="password" readonly="" type="password" value="********"/>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end relative z-10 opacity-70 pointer-events-none">
<button class="text-primary font-label text-sm font-medium hover:opacity-80 transition-opacity" type="button">Forgot password?</button>
</div>
<!-- Action Button -->
<div class="mt-4 relative z-10">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-label font-semibold text-lg py-4 rounded-xl flex items-center justify-center gap-3 opacity-90 cursor-wait" disabled="" type="button">
<span class="material-symbols-outlined spin" data-icon="progress_activity">progress_activity</span>
                    Signing in...
                </button>
</div>
</div>
<!-- Footer -->
<div class="mt-12 text-center opacity-70 pointer-events-none">
<p class="font-body text-on-surface-variant text-sm">
                Don't have an account? 
                <button class="text-primary font-semibold hover:opacity-80 transition-opacity ml-1" type="button">Create one</button>
</p>
</div>
</main>
</body></html>
