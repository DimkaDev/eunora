<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Medication Overview | MenoSync</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#ede7e5",
                    "secondary-fixed-dim": "#d0c1d8",
                    "on-secondary-container": "#6c6074",
                    "on-primary-fixed-variant": "#51443a",
                    "on-tertiary": "#ffffff",
                    "on-primary-container": "#fffbff",
                    "surface-bright": "#fef8f6",
                    "primary-fixed": "#f2dfd0",
                    "inverse-on-surface": "#f5f0ed",
                    "inverse-primary": "#d6c3b5",
                    "inverse-surface": "#32302f",
                    "outline-variant": "#d0c4bc",
                    "secondary-container": "#edddf5",
                    "primary": "#67594e",
                    "on-primary": "#ffffff",
                    "on-error": "#ffffff",
                    "secondary": "#655a6e",
                    "primary-container": "#817266",
                    "on-surface": "#1d1b1a",
                    "surface-variant": "#e7e1df",
                    "error-container": "#ffdad6",
                    "secondary-fixed": "#edddf5",
                    "error": "#ba1a1a",
                    "tertiary": "#814f45",
                    "on-surface-variant": "#4d453f",
                    "on-tertiary-container": "#fffbff",
                    "primary-fixed-dim": "#d6c3b5",
                    "on-background": "#1d1b1a",
                    "surface-dim": "#ded9d7",
                    "surface-container-lowest": "#ffffff",
                    "surface-tint": "#6a5c50",
                    "on-tertiary-fixed-variant": "#683a31",
                    "outline": "#7f756e",
                    "surface-container": "#f2edea",
                    "on-error-container": "#93000a",
                    "on-secondary-fixed": "#211828",
                    "surface-container-low": "#f8f2f0",
                    "surface-container-highest": "#e7e1df",
                    "on-tertiary-fixed": "#341009",
                    "on-secondary-fixed-variant": "#4d4355",
                    "on-secondary": "#ffffff",
                    "background": "#fef8f6",
                    "tertiary-fixed": "#ffdad3",
                    "surface": "#fef8f6",
                    "tertiary-container": "#9d675c",
                    "on-primary-fixed": "#231a11",
                    "tertiary-fixed-dim": "#f9b7a9"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "2xl": "1rem",
                    "3xl": "1.5rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Noto Serif"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style type="text/tailwindcss">
    body { font-family: 'Manrope', sans-serif; background-color: #F7F5F0; }
    h1, h2, .font-serif { font-family: 'Noto Serif', serif; }
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d0c4bc; border-radius: 10px; }#add-medication-form { display: none; }
    #add-medication-form:target { display: block; }
    #medication-list:has(+ #add-medication-form:target) { display: none; }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-on-surface min-h-screen flex flex-col">
<header class="fixed top-0 w-full z-50 bg-[#F7F5F0]/80 backdrop-blur-md">
<div class="flex items-center justify-between px-6 py-4 w-full max-w-md mx-auto">
<button class="hover:bg-stone-200/50 transition-colors rounded-full p-2 flex items-center justify-center active:scale-95">
<span class="material-symbols-outlined text-stone-700">arrow_back</span>
</button>
<h1 class="font-serif italic text-xl text-stone-800">Your Medications &amp; HRT</h1>
<div class="w-10"></div>
</div>
</header>
<main class="flex-grow pt-20 pb-40 px-5 max-w-md mx-auto w-full">
<div class="space-y-6" id="medication-list">
<div class="space-y-2">
<div class="flex items-center justify-between">
<span class="text-[10px] font-medium uppercase tracking-wider text-stone-500 font-sans">Step 3 of 7</span>
<div class="flex-grow mx-4 h-1 bg-surface-container rounded-full overflow-hidden">
<div class="bg-primary h-full w-[42%]"></div>
</div>
</div>
<p class="text-[12px] text-stone-500 font-body leading-relaxed">
                Review your current medications or add new ones to your daily log.
            </p>
</div>
<div class="space-y-3 overflow-hidden">
<div class="relative bg-white p-4 rounded-2xl border border-surface-container flex items-center justify-between shadow-sm">
<button aria-label="Delete medication" class="absolute top-2 right-2 text-stone-300 hover:text-stone-500 transition-colors p-1 z-10">
<span class="material-symbols-outlined text-[16px]">delete</span>
</button>
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container/30 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[20px]">rectangle</span>
</div>
<div>
<h4 class="text-[14px] font-bold text-stone-800">Estradiol</h4>
<p class="text-[12px] text-stone-500">50 mcg • Twice weekly</p>
</div>
</div>
<button class="p-2 text-stone-400 hover:text-primary transition-colors mr-4">
<span class="material-symbols-outlined text-[20px]">edit_note</span>
</button>
</div>
<div class="relative w-full rounded-2xl bg-[#E8A89B]">
<div class="absolute inset-y-0 left-0 flex items-center px-5">
<span class="material-symbols-outlined text-white text-[28px]">delete</span>
</div>
<div class="bg-white p-4 rounded-2xl border border-surface-container flex items-center justify-between shadow-sm relative translate-x-24 w-full transition-transform">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container/30 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[20px]">pill</span>
</div>
<div>
<h4 class="text-[14px] font-bold text-stone-800">Utrogestan</h4>
<p class="text-[12px] text-stone-500">100 mg • Daily</p>
</div>
</div>
<button class="p-2 text-stone-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">edit_note</span>
</button>
</div>
</div>
</div>
<section class="p-4 bg-secondary-container/30 rounded-2xl border border-secondary-container/50">
<h3 class="text-[11px] font-bold text-on-secondary-container mb-2 uppercase tracking-wide">Quick Add</h3>
<div class="flex flex-wrap gap-2">
<button class="px-3 py-1.5 bg-white text-primary text-[11px] font-semibold rounded-full border border-primary/10 shadow-sm">Femoston</button>
<button class="px-3 py-1.5 bg-white text-primary text-[11px] font-semibold rounded-full border border-primary/10 shadow-sm">Magnesium</button>
<button class="px-3 py-1.5 bg-white text-primary text-[11px] font-semibold rounded-full border border-primary/10 shadow-sm">Vitamin D</button>
</div>
</section>
</div>
<div class="space-y-6" id="add-medication-form">
<div class="flex items-center gap-2 mb-4">
<a class="text-primary text-[13px] font-bold flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[18px]">chevron_left</span>
                Back to overview
            </a>
</div>
<h2 class="text-[20px] font-serif font-bold text-stone-800 leading-tight">Add New Medication</h2>
<form class="bg-white rounded-[20px] p-6 space-y-6 shadow-sm border border-surface-container">
<div class="space-y-2">
<label class="block text-[13px] font-bold text-on-surface">Medication Name</label>
<div class="relative">
<input class="w-full bg-[#EEEEEE] border-0 focus:ring-2 focus:ring-primary/50 rounded-xl px-4 py-3 text-[14px] placeholder:text-stone-400 transition-all" placeholder="e.g., Estradiol, Utrogestan" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-stone-400">search</span>
</div>
</div>
<div class="space-y-3">
<label class="block text-[13px] font-bold text-on-surface">How do you take it?</label>
<div class="grid grid-cols-1 gap-2 max-h-48 overflow-y-auto pr-1">
<label class="flex items-center p-3 rounded-xl border border-transparent bg-surface-container-low hover:bg-surface-container cursor-pointer transition-colors group">
<input class="sr-only peer" name="method" type="radio"/>
<span class="material-symbols-outlined text-primary mr-3 text-[20px]">rectangle</span>
<span class="text-[14px] font-medium text-stone-700 flex-grow">Patch (transdermal)</span>
<div class="w-4 h-4 border-2 border-stone-300 rounded-full peer-checked:border-primary peer-checked:bg-primary"></div>
</label>
<label class="flex items-center p-3 rounded-xl border border-transparent bg-surface-container-low hover:bg-surface-container cursor-pointer transition-colors group">
<input class="sr-only peer" name="method" type="radio"/>
<span class="material-symbols-outlined text-primary mr-3 text-[20px]">pill</span>
<span class="text-[14px] font-medium text-stone-700 flex-grow">Tablet</span>
<div class="w-4 h-4 border-2 border-stone-300 rounded-full peer-checked:border-primary peer-checked:bg-primary"></div>
</label>
<label class="flex items-center p-3 rounded-xl border border-transparent bg-surface-container-low hover:bg-surface-container cursor-pointer transition-colors group">
<input class="sr-only peer" name="method" type="radio"/>
<span class="material-symbols-outlined text-primary mr-3 text-[20px]">clean_hands</span>
<span class="text-[14px] font-medium text-stone-700 flex-grow">Gel or cream</span>
<div class="w-4 h-4 border-2 border-stone-300 rounded-full peer-checked:border-primary peer-checked:bg-primary"></div>
</label>
</div>
</div>
<div class="space-y-2">
<label class="block text-[13px] font-bold text-on-surface">Dose</label>
<div class="flex gap-2">
<input class="w-24 bg-[#EEEEEE] border-0 focus:ring-2 focus:ring-primary/50 rounded-xl px-4 py-3 text-[14px]" placeholder="50" type="number"/>
<select class="flex-grow bg-[#EEEEEE] border-0 focus:ring-2 focus:ring-primary/50 rounded-xl px-4 py-3 text-[14px] appearance-none">
<option>mcg</option>
<option>mg</option>
<option>pump</option>
</select>
</div>
</div>
<div class="space-y-3">
<label class="block text-[13px] font-bold text-on-surface">How often?</label>
<div class="flex flex-wrap gap-2">
<label class="cursor-pointer">
<input class="sr-only peer" name="freq" type="radio"/>
<div class="px-4 py-2 bg-surface-container-low text-stone-600 rounded-full text-[12px] font-medium peer-checked:bg-primary peer-checked:text-white transition-all">Daily</div>
</label>
<label class="cursor-pointer">
<input class="sr-only peer" name="freq" type="radio"/>
<div class="px-4 py-2 bg-surface-container-low text-stone-600 rounded-full text-[12px] font-medium peer-checked:bg-primary peer-checked:text-white transition-all">Twice weekly</div>
</label>
<label class="cursor-pointer">
<input class="sr-only peer" name="freq" type="radio"/>
<div class="px-4 py-2 bg-surface-container-low text-stone-600 rounded-full text-[12px] font-medium peer-checked:bg-primary peer-checked:text-white transition-all">As needed</div>
</label>
</div>
</div>
<button class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg transition-all active:scale-95" type="button">
                Save Medication
            </button>
</form>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full bg-[#F7F5F0]/80 backdrop-blur-md px-6 pt-4 pb-10 z-50">
<div class="max-w-md mx-auto flex flex-col gap-3">
<a class="w-full flex items-center justify-center gap-2 py-4 bg-white border-2 border-primary/20 text-primary font-bold text-[15px] rounded-2xl shadow-sm hover:bg-stone-50 transition-all active:scale-[0.98]" href="#add-medication-form" id="add-fab">
<span class="material-symbols-outlined text-[20px]">add</span>
            Add New Medication
        </a>
<button class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg shadow-primary/20 hover:shadow-xl transition-all active:scale-95">
            Continue to Next Step
        </button>
</div>
</footer>
<style>body:has(#add-medication-form:target) #add-fab { display: none; }
    body:has(#add-medication-form:target) footer { background: transparent; pointer-events: none; }
    body:has(#add-medication-form:target) footer > div > button { display: none; }
</style>
</body></html>
