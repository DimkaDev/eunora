<style>
        body { font-family: 'Manrope', sans-serif; background-color: #fef8f6; }
        .font-serif { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-nav { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex items-end justify-center">
<!-- Backdrop (Simulating Modal Context) -->
<div class="fixed inset-0 bg-on-surface/20 z-0">
<div class="p-6">
<h1 class="text-headline-md font-serif text-on-surface-variant opacity-40">Triggers Selection</h1>
</div>
</div>
<!-- Bottom Sheet Modal -->
<div class="relative z-10 w-full max-w-md bg-surface shadow-[0_-8px_40px_rgba(29,27,26,0.12)] rounded-t-[2.5rem] overflow-hidden flex flex-col max-h-[795px]">
<!-- Drag Handle & Header -->
<div class="flex flex-col items-center pt-3 pb-6">
<div class="w-12 h-1.5 bg-outline-variant/30 rounded-full mb-6"></div>
<div class="flex items-center justify-between w-full px-6">
<div class="w-10"></div> <!-- Spacer for centering -->
<h2 class="font-serif text-2xl font-bold text-on-surface tracking-tight text-center">Add Custom Trigger</h2>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</div>
<!-- Modal Content Scrollable Area -->
<div class="flex-1 overflow-y-auto px-6 space-y-10 pb-32">
<!-- Section 1: Trigger Name -->
<section class="space-y-3">
<label class="block text-sm font-semibold tracking-wide text-on-surface-variant flex items-center gap-1 ml-1">
                    Trigger name <span class="text-error">*</span>
</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-full px-6 py-4 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="e.g., Spicy foods, Late night work" type="text"/>
</div>
</section>
<!-- Section 2: Description -->
<section class="space-y-3">
<label class="block text-sm font-semibold tracking-wide text-on-surface-variant ml-1">
                    Description (optional)
                </label>
<div class="bg-surface-container-lowest rounded-xl p-1 shadow-sm">
<textarea class="w-full bg-transparent border-none rounded-xl px-5 py-4 text-on-surface placeholder:text-on-surface-variant/40 italic font-serif focus:ring-0 outline-none resize-none" placeholder="Briefly describe how this impacts you..." rows="3"></textarea>
</div>
</section>
<!-- Section 3: Category Selection -->
<section class="space-y-4">
<label class="block text-sm font-semibold tracking-wide text-on-surface-variant ml-1">
                    Category
                </label>
<div class="flex flex-wrap gap-2">
<!-- Category Chip: Selected -->
<button class="px-5 py-2.5 rounded-full bg-secondary-container text-on-secondary-container font-medium text-sm flex items-center gap-2 transition-all">
<span class="material-symbols-outlined text-lg" data-icon="restaurant">restaurant</span>
                        Diet
                    </button>
<!-- Category Chip: Unselected -->
<button class="px-5 py-2.5 rounded-full bg-surface-container-high text-on-surface-variant font-medium text-sm flex items-center gap-2 hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined text-lg" data-icon="fitness_center">fitness_center</span>
                        Activity
                    </button>
<button class="px-5 py-2.5 rounded-full bg-surface-container-high text-on-surface-variant font-medium text-sm flex items-center gap-2 hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined text-lg" data-icon="eco">eco</span>
                        Environment
                    </button>
<button class="px-5 py-2.5 rounded-full bg-surface-container-high text-on-surface-variant font-medium text-sm flex items-center gap-2 hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined text-lg" data-icon="psychology">psychology</span>
                        Stress
                    </button>
<button class="px-5 py-2.5 rounded-full bg-surface-container-high text-on-surface-variant font-medium text-sm flex items-center gap-2 hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined text-lg" data-icon="more_horiz">more_horiz</span>
                        Other
                    </button>
</div>
</section>
<!-- Decorative Image Anchor -->
<div class="pt-4 pb-2">
<div class="h-32 w-full rounded-2xl overflow-hidden relative group">
<img class="w-full h-full object-cover opacity-80 mix-blend-multiply" data-alt="soft aesthetic background showing blurred lavender sprigs on a warm cream surface with gentle sunlight casting shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuARrLGGrgT3RHQsVfS_KM7mcHy5p3gPkN6IeSBFn_zGptjzQqIAAuYeOnGaowr3OSSVJqnmJ-hOgY7wTH4lF78E0Lm0L6-S8RV1vU7FaW8R3WaI6heFeHg7-08cHl8erpWmZ2R5WNukS3ncVwKggrc5O1dSswJkbDv09Nqt_5aYj6ispiJBZG4qAtnIPmsyNGAQRQ8nSKhIWs-T2YbTE3GvPAfbk8NRf_3n3x-qlatlJhaeaehV2WtHifU1qYHGYFIFRSV_fDlRvS0"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface/80 to-transparent"></div>
</div>
</div>
</div>
<!-- Sticky Footer Actions -->
<div class="absolute bottom-0 left-0 right-0 p-6 glass-nav bg-surface/70 border-t border-outline-variant/10 flex gap-4">
<button class="flex-1 py-4 px-6 rounded-full font-semibold text-on-surface-variant bg-surface-container-high hover:bg-surface-container-highest transition-all duration-300">
                Cancel
            </button>
<button class="flex-[1.5] py-4 px-6 rounded-full font-semibold text-white bg-gradient-to-br from-primary to-primary-container shadow-lg shadow-primary/20 active:scale-95 transition-all duration-300">
                Add Trigger
            </button>
</div>
</div>
<!-- Hidden Bottom Nav (Suppressed per "The Destination Rule") -->
<!-- This is a modal focused task, so the shell is hidden to prioritize the canvas. -->
</body></html>
