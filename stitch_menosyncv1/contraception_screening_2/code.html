<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Health Setup - Contraception</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "primary": "#67594e",
                        "surface-dim": "#ded9d7",
                        "primary-container": "#817266",
                        "secondary-container": "#edddf5",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#f2dfd0",
                        "on-primary-fixed": "#231a11",
                        "on-primary-container": "#fffbff",
                        "secondary-fixed": "#edddf5",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "secondary": "#655a6e",
                        "tertiary": "#814f45",
                        "surface": "#F7F5F0",
                        "on-tertiary-fixed": "#341009",
                        "tertiary-fixed": "#ffdad3",
                        "on-secondary-fixed-variant": "#4d4355",
                        "tertiary-container": "#9d675c",
                        "surface-variant": "#e7e1df",
                        "surface-container": "#f2edea",
                        "surface-bright": "#fef8f6",
                        "inverse-on-surface": "#f5f0ed",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#fffbff",
                        "secondary-fixed-dim": "#d0c1d8",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#6a5c50",
                        "on-surface-variant": "#4d453f",
                        "on-background": "#1d1b1a",
                        "background": "#F7F5F0",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#51443a",
                        "inverse-surface": "#32302f",
                        "outline": "#7f756e",
                        "on-secondary-container": "#6c6074",
                        "on-secondary-fixed": "#211828",
                        "on-surface": "#1d1b1a",
                        "surface-container-low": "#f8f2f0",
                        "error": "#ba1a1a",
                        "outline-variant": "#d0c4bc",
                        "surface-container-highest": "#e7e1df",
                        "inverse-primary": "#d6c3b5",
                        "surface-container-high": "#ede7e5",
                        "primary-fixed-dim": "#d6c3b5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            min-height: 100dvh;
        }
        h1, h2, h3, h4, h5, h6, .font-headline {
            font-family: 'Noto Serif', serif;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1.25rem);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased flex flex-col overflow-x-hidden">
<header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md px-5 py-4 flex items-center justify-between">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center text-center">
<h1 class="font-headline text-lg font-bold text-on-surface leading-tight">Health Setup</h1>
<span class="font-body text-[11px] text-on-surface-variant uppercase tracking-wider">Step 4 of 7</span>
</div>
<div class="w-10"></div>
</header>
<div class="w-full bg-surface-container h-1">
<div class="bg-primary h-full w-4/7" style="width: 57.1%;"></div>
</div>
<main class="flex-1 w-full max-w-lg mx-auto px-5 py-8 pb-32 flex flex-col gap-10">
<section class="flex flex-col gap-6">
<div class="flex flex-col gap-2">
<h2 class="font-headline text-2xl font-bold text-on-surface leading-snug">
                Are you currently using any form of contraception?
            </h2>
<p class="font-body text-sm text-on-surface-variant italic">
                Optional — this helps us provide more tailored health insights.
            </p>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex flex-col items-center justify-center gap-3 p-6 rounded-2xl bg-primary text-on-primary shadow-lg transition-all border-2 border-primary ring-4 ring-primary/10">
<span class="material-symbols-outlined text-3xl" data-icon="check_circle">check_circle</span>
<span class="font-body text-lg font-bold">Yes</span>
</button>
<button class="flex flex-col items-center justify-center gap-3 p-6 rounded-2xl bg-surface-container-lowest text-on-surface-variant border-2 border-surface-variant/30 hover:border-primary/30 transition-all">
<span class="material-symbols-outlined text-3xl" data-icon="cancel">cancel</span>
<span class="font-body text-lg font-medium">No</span>
</button>
</div>
</section>
<div class="flex flex-col gap-10 animate-in fade-in slide-in-from-bottom-4 duration-700">
<section class="flex flex-col gap-4">
<div class="bg-secondary-container/20 rounded-2xl p-6 border border-secondary-container/40">
<label class="block font-headline text-xl text-secondary mb-4">"Great. What type are you using?"</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border-outline-variant/30 text-on-surface text-base rounded-2xl py-4 pl-4 pr-10 appearance-none focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body" id="contraception-type">
<option value="combination">Combination birth control pill</option>
<option selected="" value="progestin">Progestin-only pill</option>
<option value="copper-iud">Copper IUD</option>
<option value="hormonal-iud">Hormonal IUD</option>
<option value="implant">Subdermal implant</option>
<option value="injection">Injection</option>
<option value="barrier">Barrier method</option>
<option value="other">Other</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</section>
<section class="flex flex-col gap-4">
<div class="bg-secondary-container/20 rounded-2xl p-6 border border-secondary-container/40">
<label class="block font-headline text-xl text-secondary mb-4" for="brand-name">"And the brand name?"</label>
<input class="w-full bg-surface-container-lowest border-outline-variant/30 text-on-surface placeholder:text-on-surface-variant/40 text-base rounded-2xl py-4 px-5 focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body" id="brand-name" placeholder="e.g., Yasmin, Mirena" type="text" value="Cerazette"/>
</div>
</section>
<section class="flex flex-col gap-4">
<div class="bg-secondary-container/20 rounded-2xl p-6 border border-secondary-container/40">
<label class="block font-headline text-xl text-secondary mb-4" for="dose">"Lastly, do you know the dose?"</label>
<input class="w-full bg-surface-container-lowest border-outline-variant/30 text-on-surface placeholder:text-on-surface-variant/40 text-base rounded-2xl py-4 px-5 focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body" id="dose" placeholder="e.g., 30 mcg ethinyl estradiol" type="text"/>
<p class="mt-3 text-[11px] text-on-surface-variant/70 italic px-1">You can find this on your prescription packaging.</p>
</div>
</section>
</div>
<div class="mt-4 px-4 text-center">
<p class="font-headline italic text-on-surface-variant/60 text-sm">
            "Your inputs help us understand your hormonal cycle better."
        </p>
</div>
</main>
<div class="fixed bottom-0 left-0 right-0 p-5 bg-surface/90 backdrop-blur-xl border-t border-surface-variant/30 pb-safe">
<div class="max-w-lg mx-auto flex gap-4">
<button class="font-body text-sm font-semibold text-primary px-6 py-4 rounded-2xl hover:bg-surface-container-low transition-colors">
            Skip
        </button>
<button class="flex-1 bg-primary text-on-primary font-body text-base font-semibold py-4 px-8 rounded-2xl shadow-lg shadow-primary/20 hover:shadow-xl transition-all flex items-center justify-center gap-2">
            Confirm &amp; Continue
            <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>

</body></html>
