<!DOCTYPE html>

<style type="text/tailwindcss">
        @layer base {
            body { font-family: 'Manrope', sans-serif; background-color: #F7F5F0; }
            .serif { font-family: 'Noto Serif', serif; }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar { display: none; }
        .selected-radio {
            @apply border-[var(--primary-color)] bg-secondary-container !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="text-on-surface min-h-screen">
<header class="bg-[#F7F5F0]/80 backdrop-blur-md fixed top-0 w-full z-50">
<div class="flex items-center justify-between px-6 h-16 w-full max-w-screen-md mx-auto">
<button class="transition-all duration-300 ease-in-out active:scale-95 hover:bg-stone-200/50 rounded-full p-2">
<span class="material-symbols-outlined text-stone-700" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Noto_Serif'] text-xl font-semibold text-stone-700">Your Lifestyle Baseline</h1>
<div class="w-10"></div>
</div>
</header>
<main class="pt-20 pb-44 px-6 max-w-screen-md mx-auto">
<section class="mb-8">
<div class="flex justify-between items-end mb-4">
<span class="text-[10px] font-extrabold uppercase tracking-[0.2em] text-primary">Step 5 of 7</span>
<div class="w-32 h-1.5 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[71.4%]"></div>
</div>
</div>
<p class="text-on-surface-variant text-sm leading-relaxed max-w-[95%]">
            Help us understand your baseline. This identifies lifestyle patterns that may correlate with your symptoms.
        </p>
</section>
<div class="space-y-6">
<div class="bg-surface-container-lowest rounded-2xl p-6 relative overflow-hidden shadow-sm border border-stone-100">
<span class="material-symbols-outlined absolute -right-2 -top-2 text-primary/5 text-8xl pointer-events-none select-none">monitor_weight</span>
<label class="block text-primary font-bold text-xs uppercase tracking-wider mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-sm">scale</span>

            </label>
<div class="flex gap-4 relative z-10">
<div class="flex-1 bg-surface-container rounded-2xl px-6 py-4 flex items-center border border-transparent focus-within:border-primary/20 transition-all">
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface font-headline text-xl" placeholder="70" type="number"/>
</div>
<div class="flex bg-surface-container p-1 rounded-2xl w-32 border border-stone-100">
<button class="flex-1 rounded-xl text-xs font-bold py-2 bg-primary text-on-primary shadow-sm">kg</button>
<button class="flex-1 rounded-xl text-xs font-bold py-2 text-on-surface-variant hover:bg-stone-200/30">lbs</button>
</div>
</div>
</div>
<div class="bg-surface-container-lowest rounded-2xl p-6 relative overflow-hidden shadow-sm border border-stone-100">
<span class="material-symbols-outlined absolute -right-2 -top-2 text-primary/5 text-8xl pointer-events-none select-none">smoke_free</span>
<label class="block text-primary font-bold text-xs uppercase tracking-wider mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-sm">smoking_rooms</span>

            </label>
<div class="space-y-3 relative z-10">
<button class="w-full flex items-center justify-between p-4 rounded-2xl bg-surface-container/50 border border-transparent hover:border-primary/20 transition-all group">
<span class="font-medium text-sm">Never</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center group-hover:border-primary transition-all"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-2xl bg-surface-container/50 border border-transparent hover:border-primary/20 transition-all group">
<span class="font-medium text-sm">Former</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center group-hover:border-primary transition-all"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-2xl bg-secondary-container/60 border-2 border-primary/20 transition-all">
<span class="font-bold text-sm text-primary">Occasional</span>
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'wght' 700">check</span>
</div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-2xl bg-surface-container/50 border border-transparent transition-all group">
<span class="font-medium text-sm">Daily</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-2xl bg-surface-container/50 border border-transparent transition-all group">
<span class="font-medium text-sm">Prefer not to say</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all"></div>
</button>
</div>
</div>
<div class="bg-surface-container-lowest rounded-2xl p-6 relative overflow-hidden shadow-sm border border-stone-100">
<span class="material-symbols-outlined absolute -right-2 -top-2 text-primary/5 text-8xl pointer-events-none select-none">local_bar</span>
<label class="block text-primary font-bold text-xs uppercase tracking-wider mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-sm">wine_bar</span>

            </label>
<div class="space-y-3 relative z-10">
<button class="w-full flex items-center justify-between p-4 rounded-2xl bg-surface-container/50 border border-transparent transition-all group">
<span class="font-medium text-sm">Never</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant transition-all"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-2xl bg-secondary-container/60 border-2 border-primary/20 transition-all">
<span class="font-bold text-sm text-primary">Rarely</span>
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'wght' 700">check</span>
</div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-2xl bg-surface-container/50 border border-transparent transition-all group">
<span class="font-medium text-sm">Occasionally</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant transition-all"></div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-2xl bg-surface-container/50 border border-transparent transition-all group">
<span class="font-medium text-sm">Daily</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant transition-all"></div>
</button>
</div>
</div>
<div class="bg-surface-container-lowest rounded-2xl p-6 relative overflow-hidden shadow-sm border border-stone-100">

<label class="block text-primary font-bold text-xs uppercase tracking-wider mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-sm">sleep</span>

            </label>
<div class="flex items-center justify-center space-x-10 py-6 relative z-10">

<span class="material-symbols-outlined text-3xl" data-icon="remove">remove</span>
</button>
<div class="text-center">
<span class="font-headline text-5xl font-bold text-on-surface">7</span>
<span class="block text-[10px] font-black text-primary uppercase tracking-[0.2em] mt-1">Hours</span>
</div>

<span class="material-symbols-outlined text-3xl" data-icon="add">add</span>
</button>
</div>
</div>
<div class="bg-surface-container-lowest rounded-2xl p-6 relative overflow-hidden shadow-sm border border-stone-100">

<label class="block text-primary font-bold text-xs uppercase tracking-wider mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-sm">exercise</span>

<div class="space-y-3 relative z-10">
<button class="w-full flex items-center justify-between p-4 rounded-2xl bg-surface-container/50 border border-transparent transition-all group">

</button>
<button class="w-full flex items-center justify-between p-4 rounded-2xl bg-secondary-container/60 border-2 border-primary/20 transition-all">
<span class="font-bold text-sm text-primary">3-4x/week</span>
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'wght' 700">check</span>
</div>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-2xl bg-surface-container/50 border border-transparent transition-all group">
<span class="font-medium text-sm">Daily</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant transition-all"></div>
</button>
</div>
</div>
<div class="bg-surface-container-lowest rounded-2xl p-6 mb-12 relative overflow-hidden shadow-sm border border-stone-100">

<label class="block text-primary font-bold text-xs uppercase tracking-wider mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-sm">coffee</span>

<div class="grid grid-cols-2 gap-4 relative z-10">
<button class="flex flex-col items-center p-5 rounded-2xl bg-surface-container/50 gap-3 group transition-all hover:bg-stone-200/50">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="water_drop">water_drop</span>
<span class="text-[10px] font-bold uppercase tracking-widest">None</span>
</button>
<button class="flex flex-col items-center p-5 rounded-2xl bg-secondary-container/60 border-2 border-primary/20 gap-3 group">
<div class="relative">
<span class="material-symbols-outlined text-primary scale-110" data-icon="coffee" style="font-variation-settings: 'FILL' 1;">coffee</span>
<div class="absolute -top-2 -right-3 bg-primary rounded-full w-4 h-4 flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-white text-[10px]" style="font-variation-settings: 'wght' 800">check</span>

</div>
<span class="text-[10px] font-extrabold text-primary uppercase tracking-widest">Moderate</span>
</button>
<button class="flex flex-col items-center p-5 rounded-2xl bg-surface-container/50 gap-3 group transition-all hover:bg-stone-200/50">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="bolt">bolt</span>
<span class="text-[10px] font-bold uppercase tracking-widest">High</span>
</button>
<button class="flex flex-col items-center p-5 rounded-2xl bg-surface-container/50 gap-3 group transition-all hover:bg-stone-200/50">

<button class="w-full py-5 bg-primary text-on-primary rounded-2xl font-bold tracking-[0.1em] text-sm uppercase shadow-lg shadow-primary/20 transition-all active:scale-[0.98] hover:bg-primary/90">
            Continue
        </button>
<button class="w-full text-center text-[10px] font-extrabold text-on-surface-variant/50 uppercase tracking-[0.25em] hover:text-primary transition-colors">
            Skip this step
        </button>
</div>
</div>
<div class="fixed top-0 right-0 -z-10 w-[60%] h-[40%] bg-gradient-to-bl from-primary/5 to-transparent blur-[100px] pointer-events-none"></div>
