<style type="text/tailwindcss">
        body { font-family: 'Manrope', sans-serif; }
        .font-noto-serif { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .organic-overlay {
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 200 Q 50 150 100 200 T 200 200 T 300 200 T 400 200' fill='none' stroke='%239B8B7E' stroke-width='1' opacity='0.1'/%3E%3Cpath d='M0 150 Q 100 250 200 150 T 400 150' fill='none' stroke='%239B8B7E' stroke-width='1' opacity='0.05'/%3E%3Cpath d='M0 250 Q 80 180 160 250 T 320 250 T 400 250' fill='none' stroke='%239B8B7E' stroke-width='1' opacity='0.08'/%3E%3C/svg%3E");
            background-size: cover;
        }
        .card-stack-effect::before {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 5%;
            width: 90%;
            height: 100%;
            background: white;
            border-radius: 24px;
            z-index: -1;
            opacity: 0.4;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .card-stack-effect::after {
            content: '';
            position: absolute;
            bottom: -24px;
            left: 10%;
            width: 80%;
            height: 100%;
            background: white;
            border-radius: 24px;
            z-index: -2;
            opacity: 0.2;
            border: 1px solid rgba(0,0,0,0.05);
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface h-screen overflow-hidden flex flex-col">
<header class="w-full bg-surface/80 backdrop-blur-md z-50">
<div class="flex items-center justify-between px-6 h-16 w-full">
<button class="text-on-surface hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined !fill-none">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="font-noto-serif text-lg font-bold text-on-surface">MenoSync</span>
<div class="flex gap-1 mt-1">
<div class="h-1 w-4 bg-primary rounded-full"></div>
<div class="h-1 w-1 bg-outline-variant rounded-full"></div>
<div class="h-1 w-1 bg-outline-variant rounded-full"></div>
<div class="h-1 w-1 bg-outline-variant rounded-full"></div>
<div class="h-1 w-1 bg-outline-variant rounded-full"></div>
</div>
</div>
<button class="text-on-surface-variant font-label text-sm font-semibold">Skip</button>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-8 relative overflow-hidden">
<div class="absolute top-8 left-0 w-full px-8 text-center">
<p class="font-noto-serif text-xl text-on-surface leading-tight opacity-60">
            Tell us where you are in your journey...
        </p>
</div>
<div class="w-full max-w-sm aspect-[3/4] relative group">
<div class="card-stack-effect relative h-full w-full bg-secondary-container rounded-[40px] shadow-2xl flex flex-col items-center justify-between p-10 overflow-hidden border cursor-pointer active:scale-[0.97] transition-all duration-300 border-primary"><div class="absolute top-8 right-8 w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-md z-20">
<span class="material-symbols-outlined text-primary !text-2xl font-bold">check</span>
</div>
<div class="absolute inset-0 organic-overlay pointer-events-none opacity-40"></div>
<div class="mt-8">
<div class="w-24 h-24 bg-white/60 backdrop-blur-sm rounded-full flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined !text-[56px] text-[#9B8B7E] !fill-current" style="font-variation-settings: 'FILL' 1;">autorenew</span>
</div>
</div>
<div class="text-center z-10">
<h2 class="font-noto-serif text-2xl font-bold text-on-surface mb-4 leading-snug">
                    "My periods have become irregular"
                </h2>
<p class="font-body text-sm text-on-secondary-container opacity-80 max-w-[200px] mx-auto">
                    Not sure what's happening yet, but things are changing.
                </p>
</div>
<div class="mb-4 flex flex-col items-center gap-2">
<div class="px-6 py-2 bg-white/40 rounded-full border border-white/60 text-[10px] font-bold uppercase tracking-widest text-on-secondary-container">
                    Tap to Choose
                </div>
<span class="material-symbols-outlined text-primary animate-bounce">expand_more</span>
</div>
</div>
</div>
<div class="absolute left-[-20%] top-1/2 -translate-y-1/2 opacity-20 scale-75 pointer-events-none">
<div class="w-64 aspect-[3/4] bg-surface-container-highest rounded-[40px] border border-outline"></div>
</div>
<div class="absolute right-[-20%] top-1/2 -translate-y-1/2 opacity-20 scale-75 pointer-events-none">
<div class="w-64 aspect-[3/4] bg-surface-container-highest rounded-[40px] border border-outline"></div>
</div>
</main>
<footer class="w-full px-8 pb-12 pt-4 bg-transparent">
<div class="max-w-md mx-auto text-center">
<p class="font-body text-[11px] text-on-surface-variant mb-6 uppercase tracking-widest">
            Slide or tap to explore your options
        </p>
<div class="flex justify-between items-center gap-4">
<button class="flex-1 py-4 bg-surface-container-highest text-on-surface-variant rounded-2xl font-label text-sm font-bold active:scale-95 transition-transform">
                Previous
            </button>
<button class="flex-1 py-4 bg-primary text-white rounded-2xl font-label text-sm font-bold shadow-lg shadow-primary/20 active:scale-95 transition-transform">
                Next Path
            </button>
</div>
</div>
</footer>
<div class="fixed top-[-10%] right-[-10%] w-[40%] aspect-square bg-secondary-container/20 rounded-full blur-[100px] pointer-events-none -z-10"></div>
<div class="fixed bottom-[-5%] left-[-10%] w-[50%] aspect-square bg-primary-fixed/20 rounded-full blur-[100px] pointer-events-none -z-10"></div>
