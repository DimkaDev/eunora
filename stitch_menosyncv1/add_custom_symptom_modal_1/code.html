<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        darkMode: "class",

          extend: {

                    "surface-container-high": "#ede7e5",

                    "error-container": "#ffdad6",
                    "inverse-on-surface": "#f5f0ed",
                    "primary-fixed": "#f2dfd0",
                    "primary": "#67594e",
                    "secondary": "#655a6e",
                    "secondary-fixed-dim": "#d0c1d8",
                    "outline-variant": "#d0c4bc",
                    "surface-variant": "#e7e1df",
                    "tertiary": "#814f45",
                    "surface-container": "#f2edea",
                    "surface-bright": "#fef8f6",
                    "on-tertiary-container": "#fffbff",
                    "on-error": "#ffffff",
                    "on-secondary-fixed": "#211828",
                    "inverse-primary": "#d6c3b5",
                    "inverse-surface": "#32302f",
                    "tertiary-fixed": "#ffdad3",
                    "on-primary": "#ffffff",
                    "surface": "#fef8f6",
                    "error": "#ba1a1a",
                    "surface-container-lowest": "#ffffff",
                    "secondary-container": "#edddf5",
                    "on-surface-variant": "#4d453f",
                    "outline": "#7f756e",
                    "on-secondary-container": "#6c6074",
                    "tertiary-fixed-dim": "#f9b7a9",
                    "on-background": "#1d1b1a",

                    "primary-container": "#817266",
                    "on-surface": "#1d1b1a",

                    "on-error-container": "#93000a",
                    "surface-container-highest": "#e7e1df",

            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1.5rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Noto Serif"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]

        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-on-background/40 font-body min-h-screen flex items-end justify-center overflow-hidden">
<!-- Screen Content Placeholder (Background) -->
<div class="fixed inset-0 z-0 bg-[#1d1b1a]/40 backdrop-blur-sm"></div>
<!-- Bottom Sheet Modal -->
<div class="relative w-full max-w-lg bg-[#F7F5F0] rounded-t-[20px] shadow-2xl z-10 flex flex-col max-h-[813px] animate-slide-up">
<!-- Drag Handle & Top Bar -->
<div class="flex flex-col items-center pt-3 pb-2 w-full">
<div class="w-12 h-1.5 bg-outline-variant/40 rounded-full mb-4"></div>
<header class="w-full px-6 flex justify-between items-start">
<div class="space-y-1">
<h1 class="font-headline text-[22px] font-bold text-on-background leading-tight">Add Your Symptom</h1>
<p class="font-body text-[13px] text-outline leading-tight">Tell us what you're experiencing</p>
</div>
<button class="p-2 -mt-2 -mr-2 text-primary hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
</div>
<!-- Scrollable Form Area -->
<div class="flex-1 overflow-y-auto px-6 py-4 no-scrollbar space-y-8">
<!-- Symptom Name Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label text-sm font-semibold text-primary">Symptom name *</label>
<span class="text-[11px] text-outline tracking-wider">0/50</span>
</div>
<input class="w-full h-14 px-5 bg-surface-container-lowest border-none ring-1 ring-outline-variant/30 focus:ring-2 focus:ring-primary rounded-xl text-on-surface placeholder:text-outline-variant transition-all outline-none" placeholder="E.g., Tingling" type="text"/>
<p class="text-[11px] text-outline ml-1">Examples: Tingling, Dizziness</p>
</div>
<!-- Description Input -->
<div class="space-y-2">
<label class="font-label text-sm font-semibold text-primary">Description (optional)</label>
<textarea class="w-full p-5 bg-surface-container-lowest border-none ring-1 ring-outline-variant/30 focus:ring-2 focus:ring-primary rounded-xl text-on-surface placeholder:text-outline-variant transition-all outline-none resize-none" placeholder="E.g., Feels like pins and needles" rows="3"></textarea>
</div>
<!-- Category Selector -->
<div class="space-y-2">
<label class="font-label text-sm font-semibold text-primary">Category (optional)</label>
<div class="relative">
<select class="appearance-none w-full h-14 pl-5 pr-12 bg-surface-container-lowest border-none ring-1 ring-outline-variant/30 focus:ring-2 focus:ring-primary rounded-xl text-on-surface font-medium cursor-pointer transition-all outline-none">
<option disabled="" selected="" value="">Select a category</option>
<option value="vasomotor">Vasomotor (🔥)</option>
<option value="sleep">Sleep (😴)</option>
<option value="mood">Mood (😟)</option>
<option value="physical">Physical (💪)</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-primary">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Preset Suggestions -->
<div class="space-y-4">
<h3 class="font-label text-sm font-semibold text-primary">Common symptoms (quick add)</h3>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center py-3.5 px-4 bg-surface-container-low text-on-surface-variant font-medium text-sm rounded-xl hover:bg-secondary-container transition-colors active:scale-95 duration-200">
                        Tingling
                    </button>
<button class="flex items-center justify-center py-3.5 px-4 bg-surface-container-low text-on-surface-variant font-medium text-sm rounded-xl hover:bg-secondary-container transition-colors active:scale-95 duration-200">
                        Dizziness
                    </button>
<button class="flex items-center justify-center py-3.5 px-4 bg-surface-container-low text-on-surface-variant font-medium text-sm rounded-xl hover:bg-secondary-container transition-colors active:scale-95 duration-200">
                        Hot chest
                    </button>
<button class="flex items-center justify-center py-3.5 px-4 bg-surface-container-low text-on-surface-variant font-medium text-sm rounded-xl hover:bg-secondary-container transition-colors active:scale-95 duration-200">
                        Ringing ears
                    </button>
</div>
</div>
<!-- Info Banner -->
<div class="flex items-start gap-4 p-5 bg-secondary-fixed/30 rounded-xl">
<span class="material-symbols-outlined text-secondary mt-0.5" data-icon="lightbulb">lightbulb</span>
<p class="text-sm text-on-secondary-container/80 leading-relaxed font-medium">
                    Custom symptoms are saved to your profile so you can track them again later.
                </p>
</div>
<!-- Bottom Spacing for scroll overflow -->
<div class="h-8"></div>
</div>
<!-- Sticky Bottom Bar -->
<div class="p-6 pt-4 bg-surface-container-lowest border-t border-surface-container-high rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
<div class="flex gap-4">
<button class="w-1/2 h-14 flex items-center justify-center text-primary font-bold text-sm border-2 border-outline-variant/30 rounded-xl hover:bg-surface-container-low transition-all active:scale-95 duration-150">
                    Cancel
                </button>
<button class="w-1/2 h-14 flex items-center justify-center bg-outline-variant/30 text-outline font-bold text-sm rounded-xl cursor-not-allowed transition-all" disabled="">
                    Add Symptom
                </button>
</div>
</div>
</div>
<!-- Background Decoration Image (Editorial Feel) -->
<div class="hidden md:block fixed right-10 top-1/2 -translate-y-1/2 w-72 h-96 opacity-10 pointer-events-none rotate-3">
<img class="w-full h-full object-cover rounded-3xl grayscale" data-alt="abstract close-up of soft botanical textures and neutral tones suggesting a calm and serene atmosphere" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCz77aTLQwR4-nAkgF6OZAJSotR9tNC_pxXA990zs2CLyaN-wGeUkr0otfdwDRK1snTQ4eX-2BVR5KRbfdndPWrP94lC3-X3xF53kQBiHNSqpEPpDjWg_d-HskTp06Vxt9s8e_QvZBLQ6EFG_gxs5odGnE5l3v2u81pF5Htez5rbs1J4YvJGpfEp-cZUuYqgi_2dXu7F-37LRClsAsZW-Xo7v3-WA_M57FWQsWmlx_O_ItqUrI8rLUGm6BVjpQVbZ0I4EAt4txm2bw"/>
</div>
</body></html>
