<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Medication - MenoSync</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f5f0ed",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#4d453f",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-tertiary-fixed-variant": "#683a31",
                        "surface-container-highest": "#e7e1df",
                        "on-primary-fixed": "#231a11",
                        "surface-dim": "#ded9d7",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "primary-fixed": "#f2dfd0",
                        "inverse-surface": "#32302f",
                        "on-primary-container": "#fffbff",
                        "surface": "#fef8f6",
                        "tertiary": "#814f45",
                        "error": "#ba1a1a",
                        "secondary": "#655a6e",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#d6c3b5",
                        "surface-container-low": "#f8f2f0",
                        "surface-bright": "#fef8f6",
                        "surface-container-high": "#ede7e5",
                        "outline-variant": "#d0c4bc",
                        "inverse-primary": "#d6c3b5",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffdad3",
                        "on-secondary-fixed": "#211828",
                        "secondary-container": "#edddf5",
                        "primary-container": "#817266",
                        "surface-container": "#f2edea",
                        "secondary-fixed-dim": "#d0c1d8",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "on-background": "#1d1b1a",
                        "primary": "#67594e",
                        "background": "#fef8f6",
                        "on-error-container": "#93000a",
                        "surface-tint": "#6a5c50",
                        "outline": "#7f756e",
                        "on-secondary-container": "#6c6074",
                        "on-primary-fixed-variant": "#51443a",
                        "on-tertiary-container": "#fffbff",
                        "surface-variant": "#e7e1df",
                        "on-surface": "#1d1b1a",
                        "secondary-fixed": "#edddf5",
                        "tertiary-container": "#9d675c",
                        "on-tertiary-fixed": "#341009"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#1A1A2E]/40 min-h-screen flex items-end justify-center">
<!-- Modal Bottom Sheet Container -->
<div class="w-full max-w-lg bg-white rounded-t-[24px] shadow-2xl relative overflow-hidden flex flex-col max-h-[813px]">
<!-- Header Section -->
<header class="pt-3 px-6 pb-6 sticky top-0 bg-white z-10">
<div class="flex justify-center mb-6">
<div class="w-8 h-1 bg-surface-container-highest rounded-full"></div>
</div>
<div class="flex justify-between items-start">
<div class="space-y-0.5">
<h1 class="text-[20px] font-bold text-on-surface leading-tight">Edit Medication</h1>
<p class="text-[14px] text-secondary font-medium">Estradiol · Patch</p>
</div>
<button class="p-2 -mr-2 text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</div>
</header>
<!-- Content Area -->
<div class="flex-1 overflow-y-auto px-6 pb-24 hide-scrollbar">
<!-- Current Prescription Section -->
<section class="mb-8">
<h2 class="text-[12px] font-bold tracking-wider text-outline uppercase mb-4">Current prescription</h2>
<div class="flex gap-4">
<div class="flex-1 p-4 bg-surface-container-low rounded-xl">
<p class="text-[12px] text-on-surface-variant font-medium mb-1">Dose</p>
<p class="text-[16px] font-bold text-on-surface">50 mcg</p>
</div>
<div class="flex-1 p-4 bg-surface-container-low rounded-xl">
<p class="text-[12px] text-on-surface-variant font-medium mb-1">Frequency</p>
<p class="text-[16px] font-bold text-on-surface">Twice weekly</p>
</div>
</div>
</section>
<!-- Edit Fields Section -->
<section class="space-y-6">
<h2 class="text-[12px] font-bold tracking-wider text-outline uppercase">Update to</h2>
<!-- Dose Field -->
<div>
<label class="block text-[14px] font-semibold text-on-surface mb-3">Dose
<div class="flex gap-2">
<div class="flex-[2] relative">
<input class="w-full h-12 bg-surface-container-highest border-none rounded-full px-5 text-on-surface font-semibold focus:ring-2 focus:ring-primary/20 transition-all" type="number" value="75"/>
</div>
<div class="flex-[3] flex bg-surface-container-highest rounded-full p-1 h-12">
<button class="flex-1 rounded-full text-[13px] font-bold bg-white text-on-surface shadow-sm transition-all">mcg</button>
<button class="flex-1 rounded-full text-[13px] font-bold text-on-surface-variant hover:bg-surface-container-low transition-all">mg</button>
<button class="flex-1 rounded-full text-[13px] font-bold text-on-surface-variant hover:bg-surface-container-low transition-all">pump</button>
</div>
</div>
</label></div>
<!-- Frequency Field -->
<div>
<label class="block text-[14px] font-semibold text-on-surface mb-3">Frequency
<div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1 -mx-2 px-2">
<button class="whitespace-nowrap px-5 py-2.5 rounded-full bg-surface-container-highest text-on-surface-variant text-[14px] font-medium active:bg-secondary-container active:text-on-secondary-container transition-colors">Daily</button>
<button class="whitespace-nowrap px-5 py-2.5 rounded-full bg-secondary-container text-on-secondary-container text-[14px] font-bold ring-1 ring-inset ring-secondary-container">Twice weekly</button>
<button class="whitespace-nowrap px-5 py-2.5 rounded-full bg-surface-container-highest text-on-surface-variant text-[14px] font-medium active:bg-secondary-container transition-colors">Weekly</button>
<button class="whitespace-nowrap px-5 py-2.5 rounded-full bg-surface-container-highest text-on-surface-variant text-[14px] font-medium active:bg-secondary-container transition-colors">Monthly</button>
</div>
</label></div>
<!-- Toggle Row -->
<div class="flex items-center justify-between py-2">
<span class="text-[15px] font-medium text-on-surface">This is a prescription change</span>
<button class="w-12 h-6 bg-[#4F378A] rounded-full relative transition-colors">
<div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-sm"></div>
</button>
</div>
<!-- Warning Card -->
<div class="bg-[#FFF8EC] p-4 rounded-2xl flex gap-4">
<span class="material-symbols-outlined text-[#8B6E00] flex-shrink-0">warning</span>
<div class="space-y-1">
<p class="text-[14px] font-bold text-[#4F378A]">Dose change logged from 50 mcg -&gt; 75 mcg</p>
<p class="text-[13px] text-[#625B71] leading-relaxed">A before/after comparison will appear in 14 days</p>
</div>
</div>
<!-- Reason Field -->
<div>
<label class="block text-[14px] font-semibold text-on-surface mb-3">Reason (optional)</label>
<textarea class="w-full bg-surface-container-highest border-none rounded-2xl px-5 py-4 text-[15px] text-on-surface focus:ring-2 focus:ring-primary/20 transition-all min-h-[100px] resize-none" placeholder="e.g. Adjusted by GP for symptom relief"></textarea>
</div>
</section>
</div>
<!-- Sticky Bottom Actions -->
<footer class="p-6 bg-white flex flex-col gap-3 sticky bottom-0 border-t border-surface-container">
<button class="w-full h-14 bg-[#4F378A] text-white rounded-2xl font-bold text-[16px] shadow-lg active:scale-[0.98] transition-all">
                Save changes
            </button>
<button class="w-full h-12 bg-transparent text-[#625B71] rounded-2xl font-semibold text-[15px] active:bg-surface-container-low transition-all">
                Cancel
            </button>
</footer>
</div>
<!-- Hidden Map Anchor for data-location compliance (not visible in UI) -->
<div class="hidden" data-location="London" style=""></div>
</body></html>
