<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profile - MenoSync</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400..700;1,400..700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "secondary": "#655a6e",
                        "surface": "#fef8f6",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#f2dfd0",
                        "primary": "#67594e",
                        "on-primary-fixed": "#231a11",
                        "inverse-surface": "#32302f",
                        "on-background": "#1d1b1a",
                        "secondary-fixed": "#edddf5",
                        "surface-variant": "#e7e1df",
                        "inverse-primary": "#d6c3b5",
                        "background": "#fef8f6",
                        "on-secondary-fixed": "#211828",
                        "on-surface": "#1d1b1a",
                        "inverse-on-surface": "#f5f0ed",
                        "tertiary": "#814f45",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#fef8f6",
                        "on-tertiary": "#ffffff",
                        "outline": "#7f756e",
                        "on-tertiary-container": "#fffbff",
                        "on-primary-fixed-variant": "#51443a",
                        "surface-container-high": "#ede7e5",
                        "primary-fixed-dim": "#d6c3b5",
                        "surface-tint": "#6a5c50",
                        "tertiary-container": "#9d675c",
                        "on-surface-variant": "#4d453f",
                        "tertiary-fixed": "#ffdad3",
                        "surface-dim": "#ded9d7",
                        "surface-container-low": "#f8f2f0",
                        "on-primary-container": "#fffbff",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "secondary-fixed-dim": "#d0c1d8",
                        "surface-container": "#f2edea",
                        "on-tertiary-fixed-variant": "#683a31",
                        "outline-variant": "#d0c4bc",
                        "on-secondary-container": "#6c6074",
                        "surface-container-highest": "#e7e1df",
                        "secondary-container": "#edddf5",
                        "error": "#ba1a1a",
                        "primary-container": "#817266",
                        "on-tertiary-fixed": "#341009",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "display": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    },
                    "fontSize": {}
                },
            },
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen pb-24 selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#fef8f6]/70 dark:bg-[#1d1b1a]/70 backdrop-blur-md shadow-none hover:opacity-80 transition-opacity">
<div class="flex justify-between items-center px-5 h-16 w-full">
<button aria-label="Menu" class="text-[#67594e] dark:text-[#f2edea] p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="font-['Noto_Serif'] text-lg font-semibold tracking-tight text-[#67594e] dark:text-[#f2edea]">Profile</h1>
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-high">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A serene portrait of a mature woman, styled with soft, natural lighting in a premium, airy environment. The aesthetic is clean and modern, matching a sophisticated wellness app. Colors are muted taupes and warm whites." src="https://lh3.googleusercontent.com/aida/ADBb0uhXMQAM0I5cp27WfHNJWhtYt4M5TJYCAcv1lzKoQgqYjKoiMgPBCrVz_cyGaPJ96St0K48pXbbqIzLmmB0llOMrURsubpka-32Od1iozMkYNm9EyVUwfKmqO098Rv1ipMDR-omFscI8Ri7XFnZVuxuqfMMoNjnK2t4zl7B65ceRkof-V3YHs5V2Y3g7tIN-zdVfgh_PEUb21v-5Gztaw3E6gYaWrgtUVkcMdffEb_L1EloTMhlhH9IHol0"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-5 max-w-2xl mx-auto space-y-12">
<!-- Hero / Intro -->
<section class="space-y-4 pt-4">
<h2 class="font-headline text-4xl text-primary font-medium tracking-tight">Your Health Profile</h2>
<p class="text-on-surface-variant text-lg leading-relaxed max-w-[45ch]">
                Help us tailor MenoSync to your specific journey. Your information is kept securely and confidentially.
            </p>
</section>
<!-- Menopause Timeline -->
<section class="bg-surface-container rounded-[2rem] p-8 space-y-6 shadow-[0_4px_24px_rgba(29,27,26,0.02)]">
<div class="flex items-start gap-4">
<div class="p-3 bg-surface rounded-2xl text-primary shrink-0">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">calendar_clock</span>
</div>
<div>
<h3 class="font-headline text-2xl text-primary mb-2">Menopause Timeline</h3>
<p class="text-on-surface-variant text-base">Where are you currently in your transition?</p>
</div>
</div>
<div class="space-y-3 pt-2">
<label class="flex items-center p-4 bg-surface-container-lowest rounded-xl cursor-pointer hover:bg-surface transition-colors border outline-variant/15 border-transparent">
<input class="w-5 h-5 text-primary focus:ring-primary border-outline-variant bg-surface-container-highest" name="timeline" type="radio" value="perimenopause"/>
<span class="ml-4 text-on-surface text-lg font-medium">Perimenopause</span>
</label>
<label class="flex items-center p-4 bg-secondary-container rounded-xl cursor-pointer transition-colors border border-primary/20">
<input checked="" class="w-5 h-5 text-primary focus:ring-primary border-outline-variant bg-surface-container-highest" name="timeline" type="radio" value="menopause"/>
<span class="ml-4 text-on-surface text-lg font-medium">Menopause</span>
</label>
<label class="flex items-center p-4 bg-surface-container-lowest rounded-xl cursor-pointer hover:bg-surface transition-colors border outline-variant/15 border-transparent">
<input class="w-5 h-5 text-primary focus:ring-primary border-outline-variant bg-surface-container-highest" name="timeline" type="radio" value="postmenopause"/>
<span class="ml-4 text-on-surface text-lg font-medium">Postmenopause</span>
</label>
<label class="flex items-center p-4 bg-surface-container-lowest rounded-xl cursor-pointer hover:bg-surface transition-colors border outline-variant/15 border-transparent">
<input class="w-5 h-5 text-primary focus:ring-primary border-outline-variant bg-surface-container-highest" name="timeline" type="radio" value="unsure"/>
<span class="ml-4 text-on-surface text-lg font-medium">I'm not sure</span>
</label>
</div>
<div class="pt-4">
<label class="block mb-2 text-on-surface-variant text-base font-medium">When was your last period?</label>
<input class="w-full bg-surface-container-highest rounded-full px-6 py-4 text-on-surface border-none focus:ring-2 focus:ring-primary/50 text-lg" type="date"/>
</div>
</section>
<!-- HRT Status -->
<section class="bg-surface-container-low rounded-[2rem] p-8 space-y-6">
<div class="flex items-start gap-4">
<div class="p-3 bg-surface-container-lowest rounded-2xl text-tertiary shrink-0">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">medication</span>
</div>
<div>
<h3 class="font-headline text-2xl text-primary mb-2">Hormone Therapy (HRT)</h3>
<p class="text-on-surface-variant text-base">Are you currently taking any form of HRT?</p>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
<button class="bg-surface-container-lowest hover:bg-surface text-on-surface font-medium text-lg py-4 px-6 rounded-xl text-center transition-colors border outline-variant/15 border-transparent">
                    Yes, I am
                </button>
<button class="bg-surface-container-highest text-on-surface-variant font-medium text-lg py-4 px-6 rounded-xl text-center transition-colors border outline-variant/15 border-transparent">
                    No, I'm not
                </button>
<button class="bg-surface-container-highest text-on-surface-variant font-medium text-lg py-4 px-6 rounded-xl text-center transition-colors border outline-variant/15 border-transparent md:col-span-2">
                    I'm considering it
                </button>
</div>
</section>
<!-- Save Action -->
<div class="pt-8 pb-12 flex justify-center">
<button class="bg-gradient-to-br from-primary to-primary-container text-on-primary font-medium text-xl py-4 px-12 rounded-[1.5rem] shadow-[0_8px_24px_rgba(29,27,26,0.12)] hover:opacity-90 transition-opacity w-full md:w-auto">
                Save Profile
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full rounded-t-3xl z-50 bg-[#fef8f6]/70 dark:bg-[#1d1b1a]/70 backdrop-blur-md shadow-[0_-4px_24px_rgba(29,27,26,0.06)] bg-gradient-to-t from-[#fef8f6] md:hidden">
<div class="fixed bottom-0 left-0 w-full flex justify-around items-center px-6 pb-6 pt-3">
<button class="flex flex-col items-center justify-center text-[#9B8B7E] dark:text-[#817266] px-4 py-2 hover:bg-[#f2edea] dark:hover:bg-[#2d2a29] rounded-xl transition-all">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">auto_stories</span>
<span class="font-['Manrope'] text-[10px] font-medium tracking-wide uppercase">Journal</span>
</button>
<button class="flex flex-col items-center justify-center text-[#9B8B7E] dark:text-[#817266] px-4 py-2 hover:bg-[#f2edea] dark:hover:bg-[#2d2a29] rounded-xl transition-all">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">analytics</span>
<span class="font-['Manrope'] text-[10px] font-medium tracking-wide uppercase">Insights</span>
</button>
<button class="flex flex-col items-center justify-center bg-[#D8C9E0]/40 dark:bg-[#D8C9E0]/20 text-[#67594e] dark:text-[#f2edea] rounded-xl px-4 py-2 transition-all scale-90 duration-300 ease-out">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">sync_saved_locally</span>
<span class="font-['Manrope'] text-[10px] font-medium tracking-wide uppercase">Sync</span>
</button>
<button class="flex flex-col items-center justify-center text-[#9B8B7E] dark:text-[#817266] px-4 py-2 hover:bg-[#f2edea] dark:hover:bg-[#2d2a29] rounded-xl transition-all">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">menu_book</span>
<span class="font-['Manrope'] text-[10px] font-medium tracking-wide uppercase">Library</span>
</button>
</div>
</nav>
</body></html>
