<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f5f0ed",
                        "primary-fixed": "#f2dfd0",

                        "surface-container-high": "#ede7e5",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#231a11",
                        "secondary-fixed": "#edddf5",
                        "background": "#F7F5F0",
                        "secondary": "#655a6e",
                        "secondary-fixed-dim": "#d0c1d8",
                        "outline-variant": "#d0c4bc",
                        "on-secondary-fixed": "#211828",
                        "inverse-primary": "#d6c3b5",
                        "on-error": "#ffffff",
                        "tertiary": "#814f45",
                        "surface-container": "#f2edea",
                        "surface-bright": "#fef8f6",
                        "on-tertiary-container": "#fffbff",
                        "surface-variant": "#e7e1df",
                        "surface": "#fef8f6",
                        "tertiary-fixed": "#ffdad3",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#32302f",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "outline": "#7f756e",
                        "on-secondary-container": "#6c6074",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#edddf5",
                        "on-surface-variant": "#4d453f",

                        "surface-dim": "#ded9d7",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-primary-fixed-variant": "#51443a",
                        "on-background": "#1d1b1a",
                        "surface-tint": "#6a5c50",
                        "primary-container": "#817266",
                        "on-surface": "#1d1b1a",
                        "on-primary-container": "#fffbff",
                        "surface-container-highest": "#e7e1df",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-tertiary-fixed": "#341009",
                        "surface-container-low": "#f8f2f0",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 48
    }
.organic-card {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuApX5icWxpMXiqL0CNSWGKZCWNj_QF224j7WP6f7Yw6-r22D-GGLUaudPXmWR6rZ75b8snVOVxhZ0Mt_yGkWCD5OWUGIWzRviDzXUW5cM5ezlha9YNAT9Lf6pnh7tWJM7Hnp9egC7ZympTPKFc91v8y724T6FfzT--0HsGKS-rJ3FdeNREjEG7Poy4-SJGE8ya1Cvi387Lii23YjrVDgOm8MV_MhCS95LHsLW6tKfZwQpR41KXE2u5NIqCOZtbbR4T4SSAls14oE3Q);
    background-blend-mode: overlay
    }
.selected-card {
    @apply ring-2 ring-primary bg-surface-bright shadow-inner;
    }
.selected-card .check-circle {
    @apply flex ! important;
    }.irregular-1 {
    border-radius: 40px 35px 45px 30px/35px 40px 30px 45px
    }
.irregular-2 {
    border-radius: 35px 45px 30px 40px/45px 30px 40px 35px
    }
.irregular-3 {
    border-radius: 45px 30px 40px 35px/30px 45px 35px 40px
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface antialiased min-h-screen">
<header class="sticky top-0 z-50 bg-[#F7F5F0]/80 backdrop-blur-xl flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-200 hover:opacity-80 transition-opacity text-[#67594e]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-xl tracking-tight text-[#67594e]">Daily Journal</h1>
</div>
<button class="active:scale-95 duration-200 hover:opacity-80 transition-opacity text-[#67594e]">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<main class="max-w-md mx-auto px-6 pb-48 pt-8">
<div class="mb-12">
<h2 class="font-headline font-bold text-3xl text-on-surface leading-tight text-center">
                What might have caused this?
            </h2>
<p class="mt-4 text-on-surface-variant font-medium opacity-80 text-center px-4">
                Take a breath. Reflect on your day and select any triggers that resonate with your experience.
            </p>
</div>
<div class="flex flex-col gap-8">
<button class="selected-card organic-card irregular-1 relative flex flex-col items-center justify-center py-10 px-8 bg-white border border-outline-variant/30 transition-all active:scale-[0.98] duration-300 w-full shadow-sm hover:shadow-md">
<div class="mb-6">
<span class="material-symbols-outlined text-[56px] text-[#E67E22]" data-icon="coffee">coffee</span>
</div>
<div class="text-center">
<span class="block font-headline text-xl text-on-surface mb-1">Caffeine</span>
<p class="text-xs text-on-surface-variant uppercase tracking-widest opacity-60">Stimulation</p>
</div>
<div class="check-circle absolute top-4 right-6 hidden items-center justify-center bg-primary text-white rounded-full w-8 h-8 shadow-sm">
<span class="material-symbols-outlined text-[18px]" data-icon="check">check</span>
</div>
</button>
<button class="organic-card irregular-2 relative flex flex-col items-center justify-center py-10 px-8 bg-white border border-outline-variant/30 transition-all active:scale-[0.98] duration-300 w-full shadow-sm hover:shadow-md">
<div class="mb-6">
<span class="material-symbols-outlined text-[56px] text-[#C0392B]" data-icon="wine_bar">wine_bar</span>
</div>
<div class="text-center">
<span class="block font-headline text-xl text-on-surface mb-1">Alcohol</span>
<p class="text-xs text-on-surface-variant uppercase tracking-widest opacity-60">Depressant</p>
</div>
</button>
<button class="organic-card irregular-3 relative flex flex-col items-center justify-center py-10 px-8 bg-white border border-outline-variant/30 transition-all active:scale-[0.98] duration-300 w-full shadow-sm hover:shadow-md">
<div class="mb-6">
<span class="material-symbols-outlined text-[56px] text-[#4834D4]" data-icon="psychology_alt">psychology_alt</span>
</div>
<div class="text-center">
<span class="block font-headline text-xl text-on-surface mb-1">Stress</span>
<p class="text-xs text-on-surface-variant uppercase tracking-widest opacity-60">Emotional Load</p>
</div>
</button>
<button class="organic-card irregular-1 relative flex flex-col items-center justify-center py-10 px-8 bg-white border border-outline-variant/30 transition-all active:scale-[0.98] duration-300 w-full shadow-sm hover:shadow-md">
<div class="mb-6">
<span class="material-symbols-outlined text-[56px] text-[#27AE60]" data-icon="fitness_center">fitness_center</span>
</div>
<div class="text-center">
<span class="block font-headline text-xl text-on-surface mb-1">Exercise</span>
<p class="text-xs text-on-surface-variant uppercase tracking-widest opacity-60">Physical Activity</p>
</div>
</button>
<button class="organic-card irregular-2 relative flex flex-col items-center justify-center py-10 px-8 bg-white border border-outline-variant/30 transition-all active:scale-[0.98] duration-300 w-full shadow-sm hover:shadow-md">
<div class="mb-6">
<span class="material-symbols-outlined text-[56px] text-[#7F8C8D]" data-icon="thermostat">thermostat</span>
</div>
<div class="text-center">
<span class="block font-headline text-xl text-on-surface mb-1">Weather</span>
<p class="text-xs text-on-surface-variant uppercase tracking-widest opacity-60">Environment</p>
</div>
</button>
<button class="organic-card irregular-3 relative flex flex-col items-center justify-center py-10 px-8 bg-white border border-outline-variant/30 transition-all active:scale-[0.98] duration-300 w-full shadow-sm hover:shadow-md">
<div class="mb-6">
<span class="material-symbols-outlined text-[56px] text-[#3F51B5]" data-icon="bedtime">bedtime</span>
</div>
<div class="text-center">
<span class="block font-headline text-xl text-on-surface mb-1">Poor Sleep</span>
<p class="text-xs text-on-surface-variant uppercase tracking-widest opacity-60">Rest Quality</p>
</div>
</button>
<button class="organic-card irregular-1 relative flex flex-col items-center justify-center py-10 px-8 bg-white border border-outline-variant/30 transition-all active:scale-[0.98] duration-300 w-full shadow-sm hover:shadow-md">
<div class="mb-6">
<span class="material-symbols-outlined text-[56px] text-[#D35400]" data-icon="restaurant">restaurant</span>
</div>
<div class="text-center">
<span class="block font-headline text-xl text-on-surface mb-1">Foods</span>
<p class="text-xs text-on-surface-variant uppercase tracking-widest opacity-60">Nutrition</p>
</div>
</button>
<button class="irregular-2 relative flex flex-col items-center justify-center py-8 px-8 bg-transparent border-2 border-dashed border-outline-variant/40 transition-all active:scale-95 duration-200 w-full">
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-outline text-[40px]" data-icon="add_circle">add_circle</span>
<span class="block font-bold text-sm text-on-surface-variant">+ Add custom trigger</span>
</div>
</button>
</div>
<div class="mt-16 mb-12 p-10 rounded-[40px] bg-white/50 backdrop-blur-sm border border-white">
<h3 class="font-headline italic text-xl text-primary mb-4 text-center">Notice anything else?</h3>
<p class="font-body text-on-surface-variant text-base leading-relaxed text-center opacity-80">
                Sometimes the smallest changes in routine can impact how you feel. Take a moment to breathe and reflect on your day.
            </p>
</div>
</main>
<div class="fixed bottom-0 left-0 w-full z-50 bg-[#F7F5F0]/90 backdrop-blur-md px-6 py-6 border-t border-outline-variant/10 shadow-[0_-8px_30px_rgb(0,0,0,0.04)]">
<div class="max-w-md mx-auto flex items-center gap-4">
<button class="flex-1 py-4 px-6 rounded-3xl font-bold text-[#67594e] bg-[#EBE7E1] active:scale-95 transition-all">
                Back
            </button>
<button class="flex-[2] py-4 px-6 rounded-3xl font-bold text-white bg-gradient-to-br from-primary to-[#817266] shadow-lg shadow-primary/20 active:scale-95 transition-all">
                Save Reflection
            </button>
</div>
</div>

</body></html>
