<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Forgot Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#6c6074",
                        "surface-container-low": "#f8f2f0",
                        "on-surface": "#1d1b1a",
                        "on-secondary-fixed-variant": "#4d4355",
                        "surface-container-highest": "#e7e1df",
                        "primary": "#67594e",
                        "tertiary-container": "#9d675c",
                        "outline-variant": "#d0c4bc",
                        "on-tertiary-fixed": "#341009",
                        "surface-tint": "#6a5c50",
                        "background": "#fef8f6",
                        "surface-variant": "#e7e1df",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#211828",
                        "inverse-surface": "#32302f",
                        "on-tertiary-container": "#fffbff",
                        "inverse-on-surface": "#f5f0ed",
                        "outline": "#7f756e",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#d6c3b5",
                        "surface-container-high": "#ede7e5",
                        "surface-bright": "#fef8f6",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#683a31",
                        "surface-dim": "#ded9d7",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "tertiary": "#814f45",
                        "surface-container": "#f2edea",
                        "on-primary-fixed": "#231a11",
                        "secondary-container": "#edddf5",
                        "primary-container": "#817266",
                        "surface": "#fef8f6",
                        "on-surface-variant": "#4d453f",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "secondary": "#655a6e",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#d0c1d8",
                        "on-primary-fixed-variant": "#51443a",
                        "primary-fixed": "#f2dfd0",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#fffbff",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-background": "#1d1b1a",
                        "tertiary-fixed": "#ffdad3",
                        "secondary-fixed": "#edddf5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif", "serif"],
                        "display": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col items-center justify-center relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Shell (Suppressed content canvas logic) -->
<!-- Content Canvas -->
<main class="w-full max-w-md px-6 md:px-0 flex flex-col items-center relative z-10 py-12">
<!-- Brand Logo -->
<div class="mb-12">
<h1 class="font-headline text-3xl italic text-primary tracking-tight">MenoSync</h1>
</div>
<!-- Typography: Editorial Authority -->
<div class="text-center mb-10 w-full">
<h2 class="font-headline text-4xl text-on-surface mb-4 leading-tight">Reset Password</h2>
<p class="font-body text-on-surface-variant text-base px-4">Enter the email associated with your account, and we’ll send you a link to reset your password.</p>
</div>
<!-- Form Area -->
<form class="w-full flex flex-col space-y-8" onsubmit="event.preventDefault();">
<!-- Input Field Group -->
<div class="w-full relative group">
<label class="font-label text-sm font-medium text-on-surface-variant mb-2 block ml-4" for="email">Email Address</label>
<!-- Input Field: Pill shape, Surface Container Highest background -->
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-5 text-on-surface-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-surface-container-highest border-none text-on-surface font-body rounded-full py-4 pl-14 pr-6 focus:ring-0 focus:outline-none focus:shadow-[0_4px_24px_rgba(29,27,26,0.06)] transition-all duration-300 placeholder:text-outline placeholder:font-light" id="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col space-y-4 pt-4">
<!-- Primary Button: Gradient, rounded-xl -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-label text-lg font-semibold rounded-xl py-4 shadow-[0_4px_24px_rgba(29,27,26,0.06)] hover:opacity-90 active:scale-[0.98] transition-all duration-300 flex items-center justify-center space-x-2" type="submit">
<span>Send Reset Link</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
<!-- Tertiary Button: Text only -->
<button class="w-full bg-transparent text-primary font-label font-semibold py-3 hover:text-on-surface transition-colors duration-200" type="button">
                    Return to Log In
                </button>
</div>
</form>
</main>
<!-- Subtle Background Texture/Depth (Intentional Asymmetry) -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden z-0">
<div class="absolute -top-32 -left-32 w-96 h-96 bg-surface-container-low rounded-full blur-[100px] opacity-60"></div>
<div class="absolute top-1/2 -right-32 w-80 h-80 bg-surface-container rounded-full blur-[80px] opacity-40"></div>
</div>
</body></html>
