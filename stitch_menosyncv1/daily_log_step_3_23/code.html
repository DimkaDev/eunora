<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log Your Symptoms | MenoSync Guided</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#67594e",
                        "surface": "#F7F5F0",
                        "taupe": "#9B8B7E",
                        "lavender-soft": "#E6E1F0",
                        "charcoal": "#333333",
                        "outline-soft": "#D0C4BC",
                        "on-surface": "#1d1b1a"
                    },
                    fontFamily: {
                        "serif": ["Noto Serif", "serif"],
                        "sans": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-surface text-on-surface font-sans overflow-hidden h-screen w-screen selection:bg-taupe/20;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .circular-slider-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        .progress-dot {
            width: 6px;
            height: 6px;
            border-radius: 99px;
            @apply bg-outline-soft/60;
        }
        .progress-dot.active {
            @apply bg-taupe w-5;
        }
        .glass-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .7; transform: scale(0.95); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col h-screen max-h-screen">
<header class="pt-8 px-6 pb-2 shrink-0">
<div class="flex justify-between items-center mb-6">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-sm text-primary">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex gap-1.5">
<div class="progress-dot"></div>
<div class="progress-dot"></div>
<div class="progress-dot active"></div>
</div>
<div class="w-10"></div>
</div>
<div class="w-full bg-outline-soft/30 h-1 rounded-full overflow-hidden">
<div class="bg-taupe h-full w-3/5 rounded-full transition-all duration-700"></div>
</div>
<p class="text-[10px] uppercase tracking-[0.2em] font-extrabold text-taupe mt-4 text-center">Step 3 of 5: Triggers</p>
</header>
<main class="flex-1 overflow-y-auto px-8 py-10 flex flex-col items-center">
<div class="flex flex-col items-center text-center max-w-md w-full" id="step-triggers">
<h2 class="serif text-3xl font-semibold text-charcoal mb-4 leading-snug">What might have triggered your symptoms today?</h2>
<p class="text-primary/60 text-base mb-12">Select any factors that feel relevant</p>
<div class="grid grid-cols-2 gap-5 w-full">
<button class="aspect-square flex flex-col items-center justify-center p-6 rounded-[2.5rem] bg-white border-2 border-transparent shadow-[0_8px_30px_rgb(0,0,0,0.04)] active:scale-95 transition-all">
<span class="material-symbols-outlined text-4xl mb-4 text-taupe" style="font-variation-settings: 'wght' 300;">coffee</span>
<span class="text-sm font-bold text-primary tracking-wide">Caffeine</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center p-6 rounded-[2.5rem] bg-white border-2 border-transparent shadow-[0_8px_30px_rgb(0,0,0,0.04)] active:scale-95 transition-all">
<span class="material-symbols-outlined text-4xl mb-4 text-taupe" style="font-variation-settings: 'wght' 300;">wine_bar</span>
<span class="text-sm font-bold text-primary tracking-wide">Alcohol</span>
</button>
<button class="aspect-square relative flex flex-col items-center justify-center p-6 rounded-[2.5rem] bg-white border-2 border-taupe shadow-md active:scale-95 transition-all ring-4 ring-taupe/5">
<div class="absolute top-4 right-4 bg-taupe text-white rounded-full p-1">
<span class="material-symbols-outlined text-[16px] block font-bold">check</span>
</div>
<span class="material-symbols-outlined text-4xl mb-4 text-taupe" style="font-variation-settings: 'FILL' 1;">psychology</span>
<span class="text-sm font-bold text-primary tracking-wide">Stress</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center p-6 rounded-[2.5rem] bg-white border-2 border-transparent shadow-[0_8px_30px_rgb(0,0,0,0.04)] active:scale-95 transition-all">
<span class="material-symbols-outlined text-4xl mb-4 text-taupe" style="font-variation-settings: 'wght' 300;">fitness_center</span>
<span class="text-sm font-bold text-primary tracking-wide">Exercise</span>
</button>
</div>
</div>
<div class="hidden flex flex-col items-center text-center max-w-md w-full h-full justify-center" id="step-sleep">
<h2 class="serif text-3xl font-semibold text-charcoal mb-4">How long did you rest?</h2>
<p class="text-primary/60 text-base mb-10">Slide to adjust your sleep duration</p>
<div class="circular-slider-container flex items-center justify-center mb-10">
<svg class="absolute w-full h-full -rotate-90 drop-shadow-sm" viewBox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="44" stroke="#E6E1F0" stroke-width="6"></circle>
<circle cx="50" cy="50" fill="none" r="44" stroke="#9B8B7E" stroke-dasharray="276" stroke-dashoffset="90" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="flex flex-col items-center z-10">
<span class="text-6xl font-bold text-primary tracking-tighter">7.5</span>
<span class="text-sm text-taupe font-extrabold uppercase tracking-[0.2em] mt-2">Hours</span>
</div>
</div>
</div>
<div class="hidden flex flex-col items-center text-center max-w-md w-full h-full justify-center" id="step-hydration">
<h2 class="serif text-3xl font-semibold text-charcoal mb-4">Are you feeling hydrated?</h2>
<div class="mt-12 mb-16 relative flex flex-col items-center">
<div class="w-56 h-56 rounded-full bg-white flex items-center justify-center border-2 border-taupe/10 shadow-2xl mb-12">
<span class="material-symbols-outlined text-8xl text-taupe glass-pulse">water_drop</span>
</div>
<div class="flex items-center gap-10">
<button class="w-16 h-16 rounded-full bg-white shadow-lg text-taupe flex items-center justify-center text-3xl active:scale-90 transition-transform">−</button>
<div class="text-center min-w-[80px]">
<p class="text-6xl font-bold text-primary">6</p>
<p class="text-xs uppercase tracking-[0.2em] text-taupe font-extrabold mt-1">Glasses</p>
</div>
<button class="w-16 h-16 rounded-full bg-white shadow-lg text-taupe flex items-center justify-center text-3xl active:scale-90 transition-transform">+</button>
</div>
</div>
</div>
</main>
<footer class="p-8 pb-10 bg-surface/90 backdrop-blur-md shrink-0">
<div class="flex flex-col items-center max-w-lg mx-auto">
<div class="flex gap-4 w-full mb-6">
<button class="flex-1 py-5 bg-white border border-outline-soft/60 text-primary font-bold rounded-[2.5rem] active:scale-95 duration-200 transition-all text-xs uppercase tracking-[0.2em]">
                    Back
                </button>
<button class="flex-[2.2] py-5 bg-taupe text-white font-bold rounded-[2.5rem] shadow-xl shadow-taupe/30 active:scale-95 duration-200 transition-all flex items-center justify-center gap-3 text-xs uppercase tracking-[0.2em]">
                    Continue <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
<button class="mb-6 flex items-center gap-2 text-taupe/80 hover:text-taupe transition-colors active:opacity-60 group">
<span class="material-symbols-outlined text-lg group-hover:scale-110 transition-transform">add_circle</span>
<span class="text-xs font-bold uppercase tracking-[0.15em]">Add Symptom</span>
</button>
<div class="flex justify-center gap-2">
<div class="h-1.5 w-1.5 bg-taupe rounded-full"></div>
<div class="h-1.5 w-1.5 bg-taupe rounded-full"></div>
<div class="h-1.5 w-4 bg-taupe rounded-full"></div>
<div class="h-1.5 w-1.5 bg-taupe/20 rounded-full"></div>
<div class="h-1.5 w-1.5 bg-taupe/20 rounded-full"></div>
</div>
</div>
</footer>

</body></html>
