<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#817266",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "inverse-surface": "#32302f",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f8f2f0",
                        "surface-container-highest": "#e7e1df",
                        "surface-container": "#f2edea",
                        "on-primary-fixed": "#231a11",
                        "secondary-fixed": "#edddf5",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#9d675c",
                        "on-primary": "#ffffff",
                        "secondary-container": "#edddf5",
                        "secondary-fixed-dim": "#d0c1d8",
                        "on-tertiary-container": "#fffbff",
                        "on-secondary-fixed": "#211828",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-surface": "#1d1b1a",
                        "surface": "#fef8f6",
                        "tertiary-fixed": "#ffdad3",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-primary-container": "#fffbff",
                        "surface-tint": "#6a5c50",
                        "outline": "#7f756e",
                        "on-surface-variant": "#4d453f",
                        "outline-variant": "#d0c4bc",
                        "surface-container-high": "#ede7e5",
                        "surface-bright": "#fef8f6",
                        "on-tertiary": "#ffffff",
                        "on-background": "#1d1b1a",
                        "inverse-primary": "#d6c3b5",
                        "secondary": "#655a6e",
                        "on-tertiary-fixed": "#341009",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f5f0ed",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "primary": "#67594e",
                        "on-secondary-container": "#6c6074",
                        "on-primary-fixed-variant": "#51443a",
                        "background": "#fef8f6",
                        "primary-fixed": "#f2dfd0",
                        "surface-variant": "#e7e1df",
                        "on-secondary-fixed-variant": "#4d4355",
                        "surface-dim": "#ded9d7",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#814f45"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
            font-size: 20px;
        }
        .bg-glass {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        body {
            overflow: hidden;height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface flex flex-col">
<header class="flex items-center justify-between px-5 pt-4 pb-2 bg-surface/70">
<div class="flex items-center gap-2">
<button class="hover:opacity-80 active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<span class="font-headline italic font-bold text-primary text-sm">MenoSync</span>
</div>
<div class="text-on-surface-variant font-label text-[10px] tracking-widest uppercase">Step 3 of 3</div>
</header>
<main class="flex-1 px-5 overflow-hidden flex flex-col gap-4">
<div class="space-y-1">
<div class="flex items-center justify-between">
<h1 class="font-headline text-2xl font-medium text-on-surface">Journal Triggers</h1>
<div class="w-16 h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full w-full bg-primary rounded-full"></div>
</div>
</div>
<p class="font-body text-xs text-on-surface-variant">Efficiency view active</p>
</div>
<div class="bg-surface-container-lowest rounded-2xl shadow-sm border border-surface-container overflow-hidden">
<div class="flex items-center justify-between p-4 border-b border-surface-container-low">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/60">coffee</span>
<div>
<span class="text-sm font-semibold">Caffeine</span>
<span class="block text-[10px] text-on-surface-variant uppercase tracking-tighter">Cups</span>
</div>
</div>
<div class="flex items-center gap-2 bg-surface-container-low rounded-lg p-1">
<button class="w-7 h-7 flex items-center justify-center bg-surface-container-lowest rounded-md shadow-sm text-primary active:bg-surface-container">
<span class="material-symbols-outlined !text-base">remove</span>
</button>
<span class="w-10 text-center font-bold text-sm">2</span>
<button class="w-7 h-7 flex items-center justify-center bg-surface-container-lowest rounded-md shadow-sm text-primary active:bg-surface-container">
<span class="material-symbols-outlined !text-base">add</span>
</button>
</div>
</div>
<div class="flex items-center justify-between p-4 border-b border-surface-container-low">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/60">wine_bar</span>
<div>
<span class="text-sm font-semibold">Alcohol</span>
<span class="block text-[10px] text-on-surface-variant uppercase tracking-tighter">Glasses</span>
</div>
</div>
<div class="flex items-center gap-2 bg-surface-container-low rounded-lg p-1">
<button class="w-7 h-7 flex items-center justify-center bg-surface-container-lowest rounded-md shadow-sm text-primary">
<span class="material-symbols-outlined !text-base">remove</span>
</button>
<span class="w-10 text-center font-bold text-sm">1</span>
<button class="w-7 h-7 flex items-center justify-center bg-surface-container-lowest rounded-md shadow-sm text-primary">
<span class="material-symbols-outlined !text-base">add</span>
</button>
</div>
</div>
<div class="flex flex-col p-4 border-b border-surface-container-low gap-2">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/60">psychology</span>
<span class="text-sm font-semibold">Stress Intensity</span>
</div>
<span class="text-[10px] text-on-surface-variant uppercase font-medium">1 = Calm, 5 = Peak</span>
</div>
<div class="flex justify-between gap-1 mt-1">
<button class="flex-1 py-1.5 rounded-md text-xs font-bold bg-surface-container-low text-on-surface-variant hover:bg-secondary-container transition-colors">1</button>
<button class="flex-1 py-1.5 rounded-md text-xs font-bold bg-secondary-container text-on-secondary-container border border-secondary-fixed-dim">2</button>
<button class="flex-1 py-1.5 rounded-md text-xs font-bold bg-surface-container-low text-on-surface-variant">3</button>
<button class="flex-1 py-1.5 rounded-md text-xs font-bold bg-surface-container-low text-on-surface-variant">4</button>
<button class="flex-1 py-1.5 rounded-md text-xs font-bold bg-surface-container-low text-on-surface-variant">5</button>
</div>
</div>
<div class="flex flex-col p-4 gap-3">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/60">restaurant</span>
<span class="text-sm font-semibold">Food Triggers?</span>
</div>
<div class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-9 h-5 bg-surface-container-highest rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary-container"></div>
</div>
</div>
<input class="w-full bg-surface-container-low border-none rounded-lg px-3 py-2 text-xs font-medium text-on-surface-variant placeholder:text-outline-variant focus:ring-1 focus:ring-primary-fixed" placeholder="Quick note (e.g., Spicy dinner, High salt)..." type="text"/>
</div>
</div>
<div class="px-4 py-3 bg-secondary-fixed/20 rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-primary-container !text-base">lightbulb</span>
<p class="text-[11px] font-body text-on-surface-variant leading-tight">
<span class="font-bold text-primary">Efficiency Tip:</span> Log triggers as they happen to avoid recall bias.
            </p>
</div>
</main>
<footer class="px-5 py-6 bg-surface flex gap-3">
<button class="flex-1 py-3 px-4 rounded-xl bg-surface-container-high text-on-surface font-bold text-xs uppercase tracking-widest active:scale-95 transition-all">
            Back
        </button>
<button class="flex-[2] py-3 px-4 rounded-xl bg-primary text-white font-bold text-xs uppercase tracking-widest shadow-lg shadow-primary/20 active:scale-95 transition-all">
            Save Log
        </button>
</footer>

</body></html>
