<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bullet Journal - Symptom Log</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@500&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "journal-bg": "#F9F9F7",
                        "ink": "#2D2D2D",
                        "ink-muted": "#6B6B6B",
                        "dot-grid": "#E5E5E1",
                        "paper-white": "#FFFFFF"
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                        "handwritten": ["Caveat", "cursive"],
                        "heading": ["Space+Grotesk", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body { 
                @apply font-sans bg-journal-bg text-ink;
                background-image: radial-gradient(#E5E5E1 1px, transparent 1px);
                background-size: 24px 24px;
                -webkit-tap-highlight-color: transparent;
            }
        }
        .bujo-card {
            @apply bg-paper-white border border-dot-grid shadow-sm;
        }
        .intensity-pill {
            @apply transition-all duration-200 border-2 border-transparent;
        }
        .intensity-pill.active {
            @apply border-ink bg-paper-white scale-105 shadow-sm;
        }
        .glass-footer {
            @apply bg-journal-bg/90 border-t border-dot-grid backdrop-blur-sm;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center">
<header class="w-full fixed top-0 z-50 bg-journal-bg/80 backdrop-blur-md border-b border-dot-grid">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-xl mx-auto">
<button class="w-10 h-10 flex items-center justify-center hover:bg-black/5 rounded-full transition-colors">
<span class="material-symbols-outlined text-ink">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="font-heading font-bold text-xs uppercase tracking-widest text-ink">Symptom Log</span>
<div class="flex gap-1.5 mt-2">
<div class="w-1.5 h-1.5 rounded-full border border-ink/30"></div>
<div class="w-1.5 h-1.5 rounded-full bg-ink"></div>
<div class="w-1.5 h-1.5 rounded-full border border-ink/30"></div>
</div>
</div>
<div class="w-10 text-right">
<span class="font-handwritten text-xl text-ink-muted">Today</span>
</div>
</div>
</header>
<main class="flex-1 w-full max-w-xl px-6 pt-24 pb-36 overflow-y-auto no-scrollbar">
<section class="mb-10 mt-4">
<h2 class="font-heading text-3xl font-bold tracking-tight mb-2">How are you feeling?</h2>
<p class="font-handwritten text-xl text-ink-muted leading-none">Note down any changes...</p>
</section>
<div class="grid grid-cols-1 gap-6">
<article class="bujo-card p-6 flex flex-col gap-6">
<div class="flex items-center justify-between border-b border-dot-grid pb-4">
<div class="flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center bg-zinc-50 border border-dot-grid">
<span class="material-symbols-outlined text-ink text-2xl" style="font-variation-settings: 'wght' 300;">thermostat</span>
</div>
<div>
<h3 class="font-heading font-bold text-lg leading-tight uppercase tracking-wide">Hot Flashes</h3>
<p class="font-handwritten text-lg text-ink-muted -mt-0.5">Sudden warmth</p>
</div>
</div>
<button class="text-ink-muted hover:text-ink">
<span class="material-symbols-outlined text-xl">more_horiz</span>
</button>
</div>
<div class="space-y-6">
<div>
<p class="text-[10px] font-bold uppercase tracking-[0.15em] text-ink-muted mb-4">Intensity level</p>
<div class="grid grid-cols-3 gap-2">
<button class="intensity-pill flex flex-col items-center justify-center py-4 bg-zinc-50 border border-dot-grid group">
<span class="text-xs font-bold uppercase tracking-tighter text-ink-muted group-hover:text-ink">Mild</span>
</button>
<button class="intensity-pill active flex flex-col items-center justify-center py-4 group">
<span class="text-xs font-bold uppercase tracking-tighter text-ink">Moderate</span>
</button>
<button class="intensity-pill flex flex-col items-center justify-center py-4 bg-zinc-50 border border-dot-grid group">
<span class="text-xs font-bold uppercase tracking-tighter text-ink-muted group-hover:text-ink">High</span>
</button>
</div>
</div>
<div class="pt-4 border-t border-dot-grid">
<p class="text-[10px] font-bold uppercase tracking-[0.15em] text-ink-muted mb-4">Duration</p>
<div class="flex items-center justify-between bg-zinc-50 border border-dot-grid p-1">
<button class="w-12 h-12 flex items-center justify-center hover:bg-white transition-colors">
<span class="material-symbols-outlined text-lg">remove</span>
</button>
<div class="flex items-baseline gap-2">
<span class="text-2xl font-heading font-bold">30</span>
<span class="text-xs font-bold uppercase text-ink-muted">Minutes</span>
</div>
<button class="w-12 h-12 flex items-center justify-center hover:bg-white transition-colors">
<span class="material-symbols-outlined text-lg">add</span>
</button>
</div>
</div>
</div>
</article>
<article class="bujo-card p-6 flex flex-col gap-6">
<div class="flex items-center justify-between border-b border-dot-grid pb-4">
<div class="flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center bg-zinc-50 border border-dot-grid">
<span class="material-symbols-outlined text-ink text-2xl" style="font-variation-settings: 'wght' 300;">bedtime</span>
</div>
<div>
<h3 class="font-heading font-bold text-lg leading-tight uppercase tracking-wide">Night Sweats</h3>
<p class="font-handwritten text-lg text-ink-muted -mt-0.5">Impact on sleep</p>
</div>
</div>
<button class="text-ink-muted hover:text-ink">
<span class="material-symbols-outlined text-xl">more_horiz</span>
</button>
</div>
<div>
<p class="text-[10px] font-bold uppercase tracking-[0.15em] text-ink-muted mb-4">How was last night?</p>
<div class="grid grid-cols-3 gap-2">
<button class="intensity-pill flex flex-col items-center justify-center py-4 bg-zinc-50 border border-dot-grid group">
<span class="text-xs font-bold uppercase tracking-tighter text-ink-muted">Light</span>
</button>
<button class="intensity-pill flex flex-col items-center justify-center py-4 bg-zinc-50 border border-dot-grid group">
<span class="text-xs font-bold uppercase tracking-tighter text-ink-muted">Moderate</span>
</button>
<button class="intensity-pill active flex flex-col items-center justify-center py-4 group">
<span class="text-xs font-bold uppercase tracking-tighter text-ink">Heavy</span>
</button>
</div>
</div>
</article>
<article class="bujo-card p-6 flex flex-col gap-6">
<div class="flex items-center justify-between border-b border-dot-grid pb-4">
<div class="flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center bg-zinc-50 border border-dot-grid">
<span class="material-symbols-outlined text-ink text-2xl" style="font-variation-settings: 'wght' 300;">mood</span>
</div>
<div>
<h3 class="font-heading font-bold text-lg leading-tight uppercase tracking-wide">Mood Changes</h3>
<p class="font-handwritten text-lg text-ink-muted -mt-0.5">Emotional check-in</p>
</div>
</div>
<button class="text-ink-muted hover:text-ink">
<span class="material-symbols-outlined text-xl">more_horiz</span>
</button>
</div>
<div>
<p class="text-[10px] font-bold uppercase tracking-[0.15em] text-ink-muted mb-4">Current state</p>
<div class="grid grid-cols-3 gap-2">
<button class="intensity-pill active flex flex-col items-center justify-center py-4 group">
<span class="text-xs font-bold uppercase tracking-tighter text-ink">Calm</span>
</button>
<button class="intensity-pill flex flex-col items-center justify-center py-4 bg-zinc-50 border border-dot-grid group">
<span class="text-xs font-bold uppercase tracking-tighter text-ink-muted">Tense</span>
</button>
<button class="intensity-pill flex flex-col items-center justify-center py-4 bg-zinc-50 border border-dot-grid group">
<span class="text-xs font-bold uppercase tracking-tighter text-ink-muted">Anxious</span>
</button>
</div>
</div>
</article>
</div>
<div class="mt-12 mb-8 flex flex-col items-center">
<button class="w-16 h-16 border border-dashed border-ink/40 flex items-center justify-center bg-paper-white hover:border-ink transition-all active:scale-95 group">
<span class="material-symbols-outlined text-ink-muted group-hover:text-ink text-3xl">add</span>
</button>
<p class="font-handwritten text-xl text-ink-muted mt-3">Add another symptom...</p>
</div>
</main>
<footer class="fixed bottom-0 w-full glass-footer z-50">
<div class="max-w-xl mx-auto px-6 py-6 flex gap-4">
<button class="flex-1 h-12 border border-ink text-ink font-heading font-bold text-xs tracking-widest uppercase hover:bg-ink hover:text-white transition-all active:scale-95">
            Back
        </button>
<button class="flex-[2] h-12 bg-ink text-white font-heading font-bold text-xs tracking-widest uppercase flex items-center justify-center gap-2 hover:bg-ink/90 transition-all active:scale-95">
            Log Entry <span class="material-symbols-outlined text-lg">check</span>
</button>
</div>
</footer>

</body></html>
