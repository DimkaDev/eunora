<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Medication Setup | MenoSync</title>

                    "on-background": "#1d1b1a",
                    "surface-dim": "#ded9d7",

                    "surface-tint": "#6a5c50",

<style>
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, .font-serif { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d0c4bc; border-radius: 10px; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#fef8f6] text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation Anchor (Manual Implementation of TopAppBar JSON Logic) -->
<header class="fixed top-0 w-full z-50 bg-stone-50/70 dark:bg-stone-900/70 backdrop-blur-md">
<div class="flex items-center justify-between px-6 py-4 w-full max-w-screen-xl mx-auto">
<button class="hover:bg-stone-200/50 transition-colors rounded-full p-2 flex items-center justify-center active:scale-95 duration-150 ease-in-out">
<span class="material-symbols-outlined text-stone-700">arrow_back</span>
</button>
<h1 class="font-serif italic text-xl text-stone-800">Medication Setup</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-5 max-w-md mx-auto w-full">
<!-- Progress & Header Text -->
<div class="mb-8 space-y-2">
<div class="flex items-center justify-between">
<span class="text-[10px] font-medium uppercase tracking-wider text-stone-500 font-sans">Step 3 of 7</span>
<div class="flex-grow mx-4 h-1 bg-surface-container rounded-full overflow-hidden">
<div class="bg-primary h-full w-[42%]"></div>
</div>
</div>
<h2 class="text-[20px] font-serif font-bold text-stone-800 leading-tight">Your Medications &amp; HRT</h2>
<p class="text-[12px] text-stone-500 font-body leading-relaxed">
                Let's log what you're taking. This helps us track effectiveness and show you patterns.
            </p>
</div>
<!-- Quick Add Section -->
<section class="mb-8 p-5 bg-secondary-container/50 rounded-2xl border border-secondary-container">
<h3 class="text-[13px] font-bold text-on-secondary-container mb-3 uppercase tracking-wide">Quick Add Common HRT</h3>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 bg-white text-primary text-[12px] font-semibold rounded-full shadow-sm hover:shadow-md transition-all active:scale-95">Estradiol</button>
<button class="px-4 py-2 bg-white text-primary text-[12px] font-semibold rounded-full shadow-sm hover:shadow-md transition-all active:scale-95">Utrogestan</button>
<button class="px-4 py-2 bg-white text-primary text-[12px] font-semibold rounded-full shadow-sm hover:shadow-md transition-all active:scale-95">Femoston</button>
</div>
</section>
<!-- Medication Form Card -->
<form class="bg-white rounded-[20px] p-6 space-y-8 shadow-sm border border-surface-container">
<!-- Field 1: Medication Name -->
<div class="space-y-2">
<label class="block text-[13px] font-bold text-on-surface">Medication Name</label>
<div class="relative">
<input class="w-full bg-[#EEEEEE] border-0 focus:ring-2 focus:ring-primary/50 rounded-xl px-4 py-3 text-[14px] placeholder:text-stone-400 transition-all" placeholder="Start typing (e.g., Estradiol, Utrogestan)" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-stone-400">search</span>
</div>
</div>
<!-- Field 2: Method -->
<div class="space-y-3">
<label class="block text-[13px] font-bold text-on-surface">How do you take it?</label>
<div class="grid grid-cols-1 gap-2">
<!-- Custom Radio Item -->
<label class="flex items-center p-3 rounded-xl border border-transparent bg-surface-container-low hover:bg-surface-container cursor-pointer transition-colors group">
<input class="sr-only peer" name="method" type="radio"/>
<span class="material-symbols-outlined text-primary mr-3 text-[20px]">rectangle</span>
<span class="text-[14px] font-medium text-stone-700 flex-grow">Patch (transdermal)</span>
<div class="w-5 h-5 border-2 border-stone-300 rounded-full peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-all">
<div class="w-2 h-2 bg-white rounded-full opacity-0 peer-checked:opacity-100"></div>
</div>
</label>
<label class="flex items-center p-3 rounded-xl border border-transparent bg-surface-container-low hover:bg-surface-container cursor-pointer transition-colors group">
<input class="sr-only peer" name="method" type="radio"/>
<span class="material-symbols-outlined text-primary mr-3 text-[20px]">pill</span>
<span class="text-[14px] font-medium text-stone-700 flex-grow">Tablet</span>
<div class="w-5 h-5 border-2 border-stone-300 rounded-full peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-all">
<div class="w-2 h-2 bg-white rounded-full opacity-0 peer-checked:opacity-100"></div>
</div>
</label>
<label class="flex items-center p-3 rounded-xl border border-transparent bg-surface-container-low hover:bg-surface-container cursor-pointer transition-colors group">
<input class="sr-only peer" name="method" type="radio"/>
<span class="material-symbols-outlined text-primary mr-3 text-[20px]">clean_hands</span>
<span class="text-[14px] font-medium text-stone-700 flex-grow">Gel or cream (topical)</span>
<div class="w-5 h-5 border-2 border-stone-300 rounded-full peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-all">
<div class="w-2 h-2 bg-white rounded-full opacity-0 peer-checked:opacity-100"></div>
</div>
</label>
<label class="flex items-center p-3 rounded-xl border border-transparent bg-surface-container-low hover:bg-surface-container cursor-pointer transition-colors group">
<input class="sr-only peer" name="method" type="radio"/>
<span class="material-symbols-outlined text-primary mr-3 text-[20px]">air</span>
<span class="text-[14px] font-medium text-stone-700 flex-grow">Spray</span>
<div class="w-5 h-5 border-2 border-stone-300 rounded-full peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-all">
<div class="w-2 h-2 bg-white rounded-full opacity-0 peer-checked:opacity-100"></div>
</div>
</label>
<!-- Simplified more options toggle for layout -->
<button class="text-[12px] font-bold text-primary flex items-center justify-center pt-2 hover:underline" type="button">
                        Show 4 more methods <span class="material-symbols-outlined text-[16px] ml-1">expand_more</span>
</button>
</div>
</div>
<!-- Field 3: Dose -->
<div class="space-y-2">
<label class="block text-[13px] font-bold text-on-surface">Dose</label>
<div class="flex gap-2">
<input class="w-24 bg-[#EEEEEE] border-0 focus:ring-2 focus:ring-primary/50 rounded-xl px-4 py-3 text-[14px]" type="number" value="50"/>
<select class="flex-grow bg-[#EEEEEE] border-0 focus:ring-2 focus:ring-primary/50 rounded-xl px-4 py-3 text-[14px] appearance-none">
<option>mcg</option>
<option>mg</option>
<option>pump</option>
<option>applicator</option>
</select>
</div>
</div>
<!-- Field 4: Frequency -->
<div class="space-y-3">
<label class="block text-[13px] font-bold text-on-surface">How often?</label>
<div class="flex flex-wrap gap-2">
<label class="cursor-pointer">
<input class="sr-only peer" name="freq" type="radio"/>
<div class="px-4 py-2 bg-surface-container-low text-stone-600 rounded-full text-[12px] font-medium peer-checked:bg-primary peer-checked:text-white transition-all">Daily</div>
</label>
<label class="cursor-pointer">
<input checked="" class="sr-only peer" name="freq" type="radio"/>
<div class="px-4 py-2 bg-surface-container-low text-stone-600 rounded-full text-[12px] font-medium peer-checked:bg-primary peer-checked:text-white transition-all">Twice weekly</div>
</label>
<label class="cursor-pointer">
<input class="sr-only peer" name="freq" type="radio"/>
<div class="px-4 py-2 bg-surface-container-low text-stone-600 rounded-full text-[12px] font-medium peer-checked:bg-primary peer-checked:text-white transition-all">Weekly</div>
</label>
<label class="cursor-pointer">
<input class="sr-only peer" name="freq" type="radio"/>
<div class="px-4 py-2 bg-surface-container-low text-stone-600 rounded-full text-[12px] font-medium peer-checked:bg-primary peer-checked:text-white transition-all">As needed</div>
</label>
</div>
</div>
<!-- Field 5: Notes -->
<div class="space-y-2">
<label class="block text-[13px] font-bold text-on-surface">Notes <span class="text-stone-400 font-normal">(optional)</span></label>
<textarea class="w-full bg-[#EEEEEE] border-0 focus:ring-2 focus:ring-primary/50 rounded-xl px-4 py-3 text-[14px] resize-none" placeholder="Add any extra details here..." rows="2"></textarea>
</div>
<!-- Add Another Button -->
<button class="w-full flex items-center justify-center gap-2 py-4 border-2 border-primary/20 text-primary font-bold text-[14px] rounded-xl hover:bg-primary/5 transition-all" type="button">
<span class="material-symbols-outlined">add</span>
                Add Another Medication
            </button>
</form>
<!-- Illustration / Mood Decor -->
<div class="mt-12 opacity-80 mix-blend-multiply flex justify-center">
<div class="w-32 h-32 rounded-full overflow-hidden grayscale">
<img alt="zen-like wellness scene" class="w-full h-full object-cover" data-alt="Soft focused close-up of delicate dried flowers and stones on a textured linen surface with warm morning sunlight" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtWL4AykE8V9JCMtemWAbCNllXKTcSNg47QWMheLDHZ4Ap-vOtx3kAoKkAEIW9e5eeJVq2M4H774lhoFEIUvzo8z29ooU7l-cU6_ERBR3YPD3up-RlLb-b1ZV3X0CWGr3cGgJNpA5rKOPdgolcmOL7ZQb_FirKRLorCvY-4U2ryEGjwy-dVQ_8MacoVKwN5OIFy7RH37kiEL36gpWiJQlt1t8-VR_F_AR4kIhuEratpyuGuDTdhtqb6ZxdpFyeKx9-OiY75fMyL6c"/>
</div>
</div>
</main>
<!-- Bottom Actions Layer -->
<footer class="fixed bottom-0 left-0 w-full bg-stone-50/70 backdrop-blur-md px-6 pt-4 pb-8 z-50">
<div class="max-w-md mx-auto space-y-4">
<button class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg shadow-primary/20 hover:shadow-xl hover:-translate-y-0.5 transition-all active:scale-95">
                Continue
            </button>
<button class="w-full text-center text-[13px] font-bold text-stone-500 hover:text-primary transition-colors">
                Skip for now
            </button>
</div>
</footer>
<!-- Hidden Navigation Filter (as per instructions: Suppress on Transactional screens) -->
<!-- The BottomNavBar and FAB are suppressed here as this is a linear "Setup/Onboarding" screen -->
</body></html>
