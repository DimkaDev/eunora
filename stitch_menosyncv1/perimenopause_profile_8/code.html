<span class="block text-xl font-medium text-[#3A3A3A] pt-1">Over 1 year</span>

<label class="flex items-start p-6 rounded-2xl border-2 border-gray-100 bg-gray-50/50 hover:bg-gray-50 cursor-pointer transition-all">
