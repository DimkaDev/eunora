<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Journal Your Influences</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#fef8f6",
                        "primary-fixed": "#f2dfd0",
                        "primary-container": "#817266",
                        "on-surface-variant": "#4d453f",
                        "surface-container-high": "#ede7e5",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#341009",
                        "on-secondary-container": "#6c6074",
                        "inverse-surface": "#32302f",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#edddf5",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#ded9d7",
                        "secondary-fixed-dim": "#d0c1d8",
                        "surface-container-low": "#f8f2f0",
                        "on-primary-fixed": "#231a11",
                        "on-primary-container": "#fffbff",
                        "surface": "#fef8f6",
                        "secondary": "#655a6e",
                        "tertiary-fixed": "#ffdad3",
                        "surface-container-highest": "#e7e1df",
                        "on-background": "#1d1b1a",
                        "on-surface": "#1d1b1a",
                        "surface-variant": "#e7e1df",
                        "primary": "#67594e",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f5f0ed",
                        "surface-container": "#f2edea",
                        "inverse-primary": "#d6c3b5",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-tertiary-container": "#fffbff",
                        "on-primary": "#ffffff",
                        "background": "#fef8f6",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "tertiary": "#814f45",
                        "secondary-container": "#edddf5",
                        "on-secondary-fixed": "#211828",
                        "outline-variant": "#d0c4bc",
                        "on-primary-fixed-variant": "#51443a",
                        "surface-tint": "#6a5c50",
                        "outline": "#7f756e",
                        "error": "#ba1a1a",
                        "tertiary-container": "#9d675c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3 { font-family: 'Noto Serif', serif; }
        .glass-header {
            background: rgba(254, 248, 246, 0.7);
            backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-50 glass-header shadow-sm shadow-stone-200/20">
<div class="flex justify-between items-center px-5 h-16 w-full">
<button class="text-[#67594e] hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-xl tracking-tight text-[#67594e] font-bold">Step 3 of 3</h1>
<button class="text-[#67594e] hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Progress Bar at 100% -->
<div class="w-full h-1.5 bg-surface-container-highest overflow-hidden">
<div class="h-full w-full bg-gradient-to-r from-primary to-primary-container"></div>
</div>
</header>
<main class="px-6 pt-8 max-w-md mx-auto">
<div class="mb-10">
<h2 class="text-3xl font-headline mb-2 text-on-surface">Journal Your Influences</h2>
<p class="text-on-surface-variant font-body">Reflect on small habits that may affect your cycle balance today.</p>
</div>
<!-- Influences Grid/Stack -->
<div class="space-y-6">
<!-- Caffeine Stepper -->
<section class="bg-surface-container-lowest p-6 rounded-xl shadow-sm border border-outline-variant/10">
<div class="flex items-center justify-between mb-6">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-secondary-fixed flex items-center justify-center rounded-full">
<span class="material-symbols-outlined text-on-secondary-fixed-variant" data-icon="coffee">coffee</span>
</div>
<h3 class="font-body font-semibold text-lg">Caffeine</h3>
</div>
</div>
<div class="flex items-center justify-center gap-8">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<div class="text-center">
<span class="block text-3xl font-headline text-on-surface">2</span>
<span class="text-[11px] uppercase tracking-widest text-on-surface-variant font-bold">Cups</span>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</section>
<!-- Alcohol Stepper -->
<section class="bg-surface-container-lowest p-6 rounded-xl shadow-sm border border-outline-variant/10">
<div class="flex items-center justify-between mb-6">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-secondary-fixed flex items-center justify-center rounded-full">
<span class="material-symbols-outlined text-on-secondary-fixed-variant" data-icon="wine_bar">wine_bar</span>
</div>
<h3 class="font-body font-semibold text-lg">Alcohol</h3>
</div>
</div>
<div class="flex items-center justify-center gap-8">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<div class="text-center">
<span class="block text-3xl font-headline text-on-surface">0</span>
<span class="text-[11px] uppercase tracking-widest text-on-surface-variant font-bold">Glasses</span>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</section>
<!-- Stress Intensity Scale -->
<section class="bg-surface-container-lowest p-6 rounded-xl shadow-sm border border-outline-variant/10">
<div class="flex items-center gap-3 mb-6">
<div class="w-10 h-10 bg-secondary-fixed flex items-center justify-center rounded-full">
<span class="material-symbols-outlined text-on-secondary-fixed-variant" data-icon="psychology">psychology</span>
</div>
<h3 class="font-body font-semibold text-lg">Stress Intensity</h3>
</div>
<div class="grid grid-cols-3 gap-3">
<button class="flex flex-col items-center gap-2 p-3 rounded-xl bg-surface-container-high/50 hover:bg-surface-container-high transition-colors">
<span class="text-2xl">😊</span>
<span class="text-[11px] font-medium text-on-surface-variant">Calm</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-xl bg-secondary-container text-on-secondary-container ring-1 ring-secondary/20">
<span class="text-2xl">😐</span>
<span class="text-[11px] font-bold">Moderate</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-xl bg-surface-container-high/50 hover:bg-surface-container-high transition-colors">
<span class="text-2xl">😟</span>
<span class="text-[11px] font-medium text-on-surface-variant">High</span>
</button>
</div>
</section>
<!-- Food Triggers Toggle -->
<section class="bg-surface-container-lowest p-6 rounded-xl shadow-sm border border-outline-variant/10">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-secondary-fixed flex items-center justify-center rounded-full">
<span class="material-symbols-outlined text-on-secondary-fixed-variant" data-icon="restaurant">restaurant</span>
</div>
<div>
<h3 class="font-body font-semibold text-lg">Food Triggers</h3>
<p class="text-xs text-on-surface-variant">Sugar, spicy, or fried foods?</p>
</div>
</div>
<!-- Styled Toggle -->
<div class="relative inline-flex items-center cursor-pointer">
<div class="w-12 h-6 bg-surface-container-highest rounded-full transition-colors"></div>
<div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform translate-x-6 bg-primary shadow-sm"></div>
</div>
</div>
</section>
<!-- Personal Reflection -->
<section class="space-y-3">
<h3 class="font-body font-semibold text-lg px-2">Evening Thoughts</h3>
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/10 p-4">
<textarea class="w-full bg-transparent border-none focus:ring-0 font-headline italic text-on-surface placeholder:text-outline/60 min-h-[120px] resize-none" placeholder="Journal your thoughts today... How do you feel emotionally?"></textarea>
</div>
</section>
</div>
</main>
<!-- Final Action Button Container -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-surface via-surface to-transparent pointer-events-none">
<div class="max-w-md mx-auto pointer-events-auto">
<button class="w-full h-16 bg-gradient-to-r from-primary to-primary-container text-white rounded-full text-lg font-bold shadow-lg shadow-primary/20 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
                Save Log
                <span class="material-symbols-outlined" data-icon="done_all">done_all</span>
</button>
</div>
</div>
<!-- BottomNavBar (Suppressed for focused journal flow as per UI mandate) -->
</body></html>
