<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wellness Journal - Quick Log</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Caveat:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "cream": "#FDFBF7",
                        "taupe": "#9B8B7E",
                        "soft-pink": "#FDE2E4",
                        "soft-lavender": "#E2E2FB",
                        "soft-sage": "#E2F0CB",
                        "soft-peach": "#FFE5D9",
                        "text-main": "#5D544F",
                        "text-muted": "#9A8C83"
                    },
                    fontFamily: {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "handwritten": ["Caveat", "cursive"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body { 
                @apply font-body bg-cream text-text-main antialiased;
                -webkit-tap-highlight-color: transparent;
            }
        }
        .compact-organic-card {
            border-radius: 24px 12px 24px 12px;
        }
        .sticker-mini {
            box-shadow: 2px 3px 0px rgba(0,0,0,0.04);
            border: 2px solid white;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-footer {
            background: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(12px);
        }
        .intensity-btn {
            @apply flex-1 flex flex-col items-center justify-center py-2 transition-all active:scale-90;
        }
        .intensity-btn.active {
            @apply bg-white shadow-sm rounded-xl;
        }
        .duration-input {
            @apply w-12 text-center bg-transparent border-none p-0 focus:ring-0 font-headline font-bold text-lg text-text-main;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center">
<header class="w-full fixed top-0 z-50 bg-cream/90 backdrop-blur-md">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-xl mx-auto">
<button class="text-taupe active:scale-90">
<span class="material-symbols-outlined font-bold">chevron_left</span>
</button>
<div class="flex flex-col items-center">
<span class="font-handwritten text-lg text-taupe leading-tight">Quick Log</span>
<div class="flex gap-1 mt-0.5">
<div class="w-1.5 h-1.5 rounded-full bg-taupe/20"></div>
<div class="w-3 h-1.5 rounded-full bg-taupe"></div>
<div class="w-1.5 h-1.5 rounded-full bg-taupe/20"></div>
</div>
</div>
<button class="text-taupe active:scale-90">
<span class="material-symbols-outlined text-xl">calendar_today</span>
</button>
</div>
</header>
<main class="flex-1 w-full max-w-xl px-4 pt-24 pb-36 overflow-y-auto no-scrollbar">
<section class="mb-8 px-2">
<h2 class="font-headline text-2xl font-bold text-text-main mb-1">Today's Reflection</h2>
<p class="text-text-muted text-sm italic font-medium">Rapid logging for a busy day</p>
</section>
<div class="space-y-4">
<article class="bg-white/60 p-4 compact-organic-card border border-white shadow-sm hover:shadow-md transition-shadow">
<div class="flex items-center gap-4 mb-4">
<div class="w-12 h-12 flex-shrink-0 bg-soft-pink sticker-mini rounded-2xl flex items-center justify-center transform -rotate-3">
<span class="material-symbols-outlined text-text-main text-xl" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<div class="flex-1">
<h3 class="font-headline text-lg font-bold text-text-main">Hot Flashes</h3>
<p class="font-handwritten text-sm text-taupe -mt-0.5">Sudden warmth</p>
</div>
<div class="flex items-center gap-2 bg-taupe/5 px-3 py-1.5 rounded-full border border-taupe/10">
<span class="text-[10px] font-bold text-text-muted uppercase tracking-wider">Dur:</span>
<input class="duration-input" type="number" value="15"/>
<span class="text-[10px] font-bold text-text-muted">min</span>
</div>
</div>
<div class="bg-soft-sage/20 rounded-2xl p-1 flex border border-white/50">
<button class="intensity-btn">
<span class="text-xl">😌</span>
<span class="text-[8px] font-bold uppercase tracking-tighter text-text-muted mt-0.5">Mild</span>
</button>
<button class="intensity-btn active">
<span class="text-xl">😐</span>
<span class="text-[8px] font-bold uppercase tracking-tighter text-text-main mt-0.5">Mod</span>
</button>
<button class="intensity-btn">
<span class="text-xl">🥵</span>
<span class="text-[8px] font-bold uppercase tracking-tighter text-text-muted mt-0.5">High</span>
</button>
</div>
</article>
<article class="bg-white/60 p-4 compact-organic-card border border-white shadow-sm hover:shadow-md transition-shadow">
<div class="flex items-center gap-4 mb-4">
<div class="w-12 h-12 flex-shrink-0 bg-soft-lavender sticker-mini rounded-2xl flex items-center justify-center transform rotate-2">
<span class="material-symbols-outlined text-text-main text-xl" style="font-variation-settings: 'FILL' 1;">bedtime</span>
</div>
<div class="flex-1">
<h3 class="font-headline text-lg font-bold text-text-main">Night Sweats</h3>
<p class="font-handwritten text-sm text-taupe -mt-0.5">Sleep impact</p>
</div>
<div class="flex items-center gap-2 bg-taupe/5 px-3 py-1.5 rounded-full border border-taupe/10">
<span class="text-[10px] font-bold text-text-muted uppercase tracking-wider">Dur:</span>
<input class="duration-input" type="number" value="10"/>
<span class="text-[10px] font-bold text-text-muted">min</span>
</div>
</div>
<div class="bg-soft-lavender/20 rounded-2xl p-1 flex border border-white/50">
<button class="intensity-btn active">
<span class="text-xl">😴</span>
<span class="text-[8px] font-bold uppercase tracking-tighter text-text-main mt-0.5">Light</span>
</button>
<button class="intensity-btn">
<span class="text-xl">💧</span>
<span class="text-[8px] font-bold uppercase tracking-tighter text-text-muted mt-0.5">Damp</span>
</button>
<button class="intensity-btn">
<span class="text-xl">🌊</span>
<span class="text-[8px] font-bold uppercase tracking-tighter text-text-muted mt-0.5">Heavy</span>
</button>
</div>
</article>
<article class="bg-white/60 p-4 compact-organic-card border border-white shadow-sm hover:shadow-md transition-shadow">
<div class="flex items-center gap-4 mb-4">
<div class="w-12 h-12 flex-shrink-0 bg-soft-sage sticker-mini rounded-2xl flex items-center justify-center transform -rotate-1">
<span class="material-symbols-outlined text-text-main text-xl" style="font-variation-settings: 'FILL' 1;">sentiment_satisfied</span>
</div>
<div class="flex-1">
<h3 class="font-headline text-lg font-bold text-text-main">Mood Changes</h3>
<p class="font-handwritten text-sm text-taupe -mt-0.5">Emotional pulse</p>
</div>
<div class="flex items-center gap-2 bg-taupe/5 px-3 py-1.5 rounded-full border border-taupe/10">
<span class="text-[10px] font-bold text-text-muted uppercase tracking-wider">Dur:</span>
<input class="duration-input" type="number" value="--"/>
<span class="text-[10px] font-bold text-text-muted">min</span>
</div>
</div>
<div class="bg-soft-sage/20 rounded-2xl p-1 flex border border-white/50">
<button class="intensity-btn">
<span class="text-xl">✨</span>
<span class="text-[8px] font-bold uppercase tracking-tighter text-text-muted mt-0.5">Calm</span>
</button>
<button class="intensity-btn">
<span class="text-xl">☁️</span>
<span class="text-[8px] font-bold uppercase tracking-tighter text-text-muted mt-0.5">Mixed</span>
</button>
<button class="intensity-btn active">
<span class="text-xl">⛈️</span>
<span class="text-[8px] font-bold uppercase tracking-tighter text-text-main mt-0.5">Tense</span>
</button>
</div>
</article>
<button class="w-full py-4 rounded-3xl border-2 border-dashed border-taupe/30 flex items-center justify-center gap-2 text-taupe/60 hover:bg-white/40 transition-colors">
<span class="material-symbols-outlined text-xl">add_circle</span>
<span class="text-xs font-bold tracking-widest uppercase">Add Symptom</span>
</button>
</div>
</main>
<footer class="fixed bottom-0 w-full glass-footer border-t border-taupe/10 z-50">
<div class="max-w-xl mx-auto px-6 py-5 flex gap-3">
<button class="w-14 h-14 rounded-2xl border border-taupe/20 text-taupe flex items-center justify-center active:scale-95 transition-all">
<span class="material-symbols-outlined">close</span>
</button>
<button class="flex-1 h-14 rounded-2xl bg-taupe text-white font-bold text-sm tracking-widest shadow-md shadow-taupe/20 active:scale-95 transition-all flex items-center justify-center gap-2">
                COMPLETE LOG <span class="material-symbols-outlined text-base">check</span>
</button>
</div>
</footer>

</body></html>
