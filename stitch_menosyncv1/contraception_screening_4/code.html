<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Health Setup - Contraception</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "primary": "#67594e",
                        "surface-dim": "#ded9d7",
                        "primary-container": "#817266",
                        "secondary-container": "#edddf5",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#f2dfd0",
                        "on-primary-fixed": "#231a11",
                        "on-primary-container": "#fffbff",
                        "secondary-fixed": "#edddf5",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "secondary": "#655a6e",
                        "tertiary": "#814f45",
                        "surface": "#fef8f6",
                        "on-tertiary-fixed": "#341009",
                        "tertiary-fixed": "#ffdad3",
                        "on-secondary-fixed-variant": "#4d4355",
                        "tertiary-container": "#9d675c",
                        "surface-variant": "#e7e1df",
                        "surface-container": "#f2edea",
                        "surface-bright": "#fef8f6",
                        "inverse-on-surface": "#f5f0ed",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#fffbff",
                        "secondary-fixed-dim": "#d0c1d8",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#6a5c50",
                        "on-surface-variant": "#4d453f",
                        "on-background": "#1d1b1a",
                        "background": "#fef8f6",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#51443a",
                        "inverse-surface": "#32302f",
                        "outline": "#7f756e",
                        "on-secondary-container": "#6c6074",
                        "on-secondary-fixed": "#211828",
                        "on-surface": "#1d1b1a",
                        "surface-container-low": "#f8f2f0",
                        "error": "#ba1a1a",
                        "outline-variant": "#d0c4bc",
                        "surface-container-highest": "#e7e1df",
                        "inverse-primary": "#d6c3b5",
                        "surface-container-high": "#ede7e5",
                        "primary-fixed-dim": "#d6c3b5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        h1, h2, h3, h4, h5, h6, .font-headline {
            font-family: 'Noto Serif', serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Back-to-Main Exception for Setup Flow) -->
<header class="sticky top-0 z-50 bg-surface/70 backdrop-blur-md px-5 py-4 flex items-center justify-between border-b-0">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-highest transition-colors focus:outline-none focus:ring-2 focus:ring-primary/20">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline text-lg font-bold text-on-surface leading-tight tracking-[-0.015em]">Health Setup</h1>
<span class="font-body text-xs text-on-surface-variant mt-0.5">Step 4 of 7</span>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Progress Indicator (Soft Gradient "Veil" approach) -->
<div class="w-full bg-surface-container-low h-1 mt-2">
<div class="bg-gradient-to-r from-primary to-primary-container h-full rounded-r-full w-4/7" style="width: 57%;"></div>
</div>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-5 py-8 pb-32 max-w-2xl mx-auto w-full">
<header class="mb-8 pl-2 pr-4">
<h2 class="font-headline text-3xl font-bold text-on-surface mb-2">Contraception</h2>
<p class="font-body text-base text-on-surface-variant">(Optional - but helpful for understanding your health)</p>
</header>
<!-- Main Card Container -->
<div class="bg-surface-container-lowest rounded-[1.5rem] p-6 shadow-[0_4px_24px_rgba(29,27,26,0.06)] flex flex-col gap-6">
<!-- Question & Toggle -->
<div class="flex items-center justify-between gap-4">
<label class="font-body text-lg font-medium text-on-surface cursor-pointer flex-1" for="contraception-toggle">
                    Are you currently using any form of contraception?
                </label>
<!-- Custom Toggle Switch (ON State) -->
<div class="relative inline-block w-14 h-8 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-surface-container-lowest border-4 border-primary appearance-none cursor-pointer translate-x-7 z-10 top-1 left-1 checked:border-surface-container-lowest" id="contraception-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-8 rounded-full bg-primary cursor-pointer" for="contraception-toggle"></label>
</div>
</div>
<!-- Conditional Section (Visible when ON) -->
<div class="bg-secondary-container/30 rounded-xl p-5 mt-2 flex flex-col gap-5 border border-secondary-container/50">
<!-- Dropdown: What type? -->
<div class="flex flex-col gap-2">
<label class="font-body text-sm font-semibold text-on-surface" for="contraception-type">What type?</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border-outline-variant/30 text-on-surface text-base rounded-full py-3.5 pl-4 pr-10 appearance-none focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body" id="contraception-type">
<option disabled="" value="">Select an option</option>
<option value="combination">Combination birth control pill</option>
<option selected="" value="progestin">Progestin-only pill</option>
<option value="copper-iud">Copper IUD</option>
<option value="hormonal-iud">Hormonal IUD</option>
<option value="implant">Subdermal implant</option>
<option value="injection">Injection</option>
<option value="barrier">Barrier method</option>
<option value="other">Other</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Input: Brand Name -->
<div class="flex flex-col gap-2">
<label class="font-body text-sm font-semibold text-on-surface" for="brand-name">Brand name <span class="font-normal text-on-surface-variant">(if applicable)</span></label>
<input class="w-full bg-surface-container-lowest border-outline-variant/30 text-on-surface placeholder:text-on-surface-variant/50 text-base rounded-full py-3.5 px-4 focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body" id="brand-name" placeholder="e.g., Yasmin, Mirena" type="text" value="Cerazette"/>
</div>
<!-- Input: Dose -->
<div class="flex flex-col gap-2">
<label class="font-body text-sm font-semibold text-on-surface" for="dose">Dose <span class="font-normal text-on-surface-variant">(if applicable)</span></label>
<input class="w-full bg-surface-container-lowest border-outline-variant/30 text-on-surface placeholder:text-on-surface-variant/50 text-base rounded-full py-3.5 px-4 focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body" id="dose" placeholder="e.g., 30 mcg ethinyl estradiol" type="text"/>
</div>
</div>
</div>
<!-- Reflection Space (Optional subtle addition for editorial feel) -->
<div class="mt-8 px-2">
<p class="font-headline italic text-on-surface-variant text-center text-sm opacity-70">
                Understanding your hormonal balance helps us curate a better experience.
            </p>
</div>
</main>
<!-- Sticky Bottom CTA -->
<div class="fixed bottom-0 left-0 right-0 p-5 bg-surface/80 backdrop-blur-xl border-t border-surface-variant/50 pb-safe">
<div class="max-w-2xl mx-auto flex gap-4">
<button class="font-body text-sm font-semibold text-primary px-6 py-4 rounded-xl hover:bg-surface-container-low transition-colors">
                Skip
            </button>
<button class="flex-1 bg-gradient-to-br from-primary to-primary-container text-on-primary font-body text-base font-semibold py-4 px-8 rounded-xl shadow-md shadow-primary/20 hover:shadow-lg hover:shadow-primary/30 transition-all flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
<!-- Tailwind Checkbox Styling Overrides for Toggle -->
<style>
        .toggle-checkbox:checked {
            right: 0;
            border-color: #ffffff;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #67594e; /* primary */
        }
        .toggle-label {
            background-color: #d0c4bc; /* outline-variant */
            transition: background-color 0.2s ease-in;
        }
        .toggle-checkbox {
            transition: transform 0.2s ease-in, border-color 0.2s ease-in;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1.25rem);
        }
    </style>
</body></html>
