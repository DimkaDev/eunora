<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log Your Symptoms - Centered Serenity</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "cream": "#F9F8F6",
                        "taupe": "#9B8B7E",
                        "soft-pink": "#FDF6F4",
                        "soft-lavender": "#F6F4F9",
                        "soft-sage": "#F4F7F4",
                        "text-main": "#4A443F",
                        "text-muted": "#9A938F"
                    },
                    fontFamily: {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
    @layer base {
        body { 
            @apply font-body bg-cream text-text-main;
            -webkit-tap-highlight-color: transparent;
        }
    }
    .fluid-severity-bar {
        background: rgba(155, 139, 126, 0.08);
        border-radius: 100px;
        position: relative;
        display: flex;
        padding: 4px;
        height: 64px;
    }
    .severity-pill {
        @apply flex-1 flex flex-col items-center justify-center transition-all duration-300 rounded-full;
        z-index: 10;
    }
    .severity-pill.active {
        @apply bg-white shadow-sm;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .glass-footer {
        background: rgba(249, 248, 246, 0.9);
        backdrop-filter: blur(16px);
    }
    .symptom-card {
        @apply transition-all duration-300 ease-in-out border border-black/5;
        border-radius: 48px;
    }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center">
<header class="w-full fixed top-0 z-50 bg-cream/80 backdrop-blur-md">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-xl mx-auto">
<button class="text-taupe hover:opacity-70 transition-opacity active:scale-95">
<span class="material-symbols-outlined">arrow_back_ios</span>
</button>
<h1 class="font-headline text-sm font-bold text-taupe tracking-wide">STEP 2 OF 3</h1>
<div class="w-10"></div>
</div>
<div class="px-8 pb-4 max-w-xl mx-auto">
<div class="w-full bg-taupe/10 h-1 rounded-full overflow-hidden">
<div class="bg-taupe h-full w-[66%] transition-all duration-700"></div>
</div>
</div>
</header>
<main class="flex-1 w-full max-w-xl px-6 pt-32 pb-40 overflow-y-auto no-scrollbar">
<section class="mb-12 text-center">
<h2 class="font-headline text-3xl font-bold text-text-main mb-3">Centered Serenity</h2>
<p class="text-text-muted text-base">How are you feeling today?</p>
</section>
<div class="space-y-8">
<article class="symptom-card bg-soft-pink p-8">
<div class="flex flex-col items-center text-center mb-10">
<div class="w-16 h-16 rounded-full bg-white flex items-center justify-center shadow-sm mb-4">
<span class="material-symbols-outlined text-taupe text-3xl" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<h3 class="font-headline text-xl font-bold text-text-main">Hot Flashes</h3>
</div>
<div class="space-y-10">
<div>
<p class="text-[10px] font-bold uppercase tracking-[0.2em] text-center text-text-muted mb-5">Intensity</p>
<div class="fluid-severity-bar">
<button class="severity-pill">
<span class="text-2xl filter grayscale opacity-40">😊</span>
<span class="text-[10px] font-bold text-text-muted mt-1">Mild</span>
</button>
<button class="severity-pill active">
<span class="text-2xl">😐</span>
<span class="text-[10px] font-bold text-taupe mt-1">Moderate</span>
</button>
<button class="severity-pill">
<span class="text-2xl filter grayscale opacity-40">😟</span>
<span class="text-[10px] font-bold text-text-muted mt-1">Severe</span>
</button>
</div>
</div>
<div>
<p class="text-[10px] font-bold uppercase tracking-[0.2em] text-center text-text-muted mb-5">Duration</p>
<div class="flex items-center justify-between bg-white/60 rounded-[32px] p-2 h-20">
<button class="w-14 h-14 flex items-center justify-center bg-white rounded-full text-taupe shadow-sm active:scale-90 transition-transform">
<span class="material-symbols-outlined">remove</span>
</button>
<div class="flex items-baseline gap-2">
<span class="text-3xl font-headline font-bold text-text-main">30</span>
<span class="text-sm font-medium text-text-muted">min</span>
</div>
<button class="w-14 h-14 flex items-center justify-center bg-white rounded-full text-taupe shadow-sm active:scale-90 transition-transform">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
</div>
</article>
<article class="symptom-card bg-soft-lavender p-8">
<div class="flex flex-col items-center text-center mb-10">
<div class="w-16 h-16 rounded-full bg-white flex items-center justify-center shadow-sm mb-4">
<span class="material-symbols-outlined text-taupe text-3xl" style="font-variation-settings: 'FILL' 1;">bedtime</span>
</div>
<h3 class="font-headline text-xl font-bold text-text-main">Night Sweats</h3>
</div>
<div class="space-y-10">
<div>
<p class="text-[10px] font-bold uppercase tracking-[0.2em] text-center text-text-muted mb-5">Intensity</p>
<div class="fluid-severity-bar">
<button class="severity-pill">
<span class="text-2xl filter grayscale opacity-40">😊</span>
<span class="text-[10px] font-bold text-text-muted mt-1">Mild</span>
</button>
<button class="severity-pill">
<span class="text-2xl filter grayscale opacity-40">😐</span>
<span class="text-[10px] font-bold text-text-muted mt-1">Moderate</span>
</button>
<button class="severity-pill active">
<span class="text-2xl">😟</span>
<span class="text-[10px] font-bold text-taupe mt-1">Severe</span>
</button>
</div>
</div>
<div>
<p class="text-[10px] font-bold uppercase tracking-[0.2em] text-center text-text-muted mb-5">Duration</p>
<div class="flex items-center justify-between bg-white/60 rounded-[32px] p-2 h-20">
<button class="w-14 h-14 flex items-center justify-center bg-white rounded-full text-taupe shadow-sm active:scale-90 transition-transform">
<span class="material-symbols-outlined">remove</span>
</button>
<div class="flex items-baseline gap-2">
<span class="text-3xl font-headline font-bold text-text-main">15</span>
<span class="text-sm font-medium text-text-muted">min</span>
</div>
<button class="w-14 h-14 flex items-center justify-center bg-white rounded-full text-taupe shadow-sm active:scale-90 transition-transform">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
</div>
</article>
<article class="symptom-card bg-soft-sage p-8">
<div class="flex flex-col items-center text-center mb-10">
<div class="w-16 h-16 rounded-full bg-white flex items-center justify-center shadow-sm mb-4">
<span class="material-symbols-outlined text-taupe text-3xl" style="font-variation-settings: 'FILL' 1;">sentiment_neutral</span>
</div>
<h3 class="font-headline text-xl font-bold text-text-main">Mood Changes</h3>
</div>
<div class="space-y-10">
<div>
<p class="text-[10px] font-bold uppercase tracking-[0.2em] text-center text-text-muted mb-5">Intensity</p>
<div class="fluid-severity-bar">
<button class="severity-pill active">
<span class="text-2xl">😊</span>
<span class="text-[10px] font-bold text-taupe mt-1">Mild</span>
</button>
<button class="severity-pill">
<span class="text-2xl filter grayscale opacity-40">😐</span>
<span class="text-[10px] font-bold text-text-muted mt-1">Moderate</span>
</button>
<button class="severity-pill">
<span class="text-2xl filter grayscale opacity-40">😟</span>
<span class="text-[10px] font-bold text-text-muted mt-1">Severe</span>
</button>
</div>
</div>
</div>
</article>
</div>
<div class="mt-12 px-4">
<button class="w-full py-8 border-2 border-dashed border-taupe/20 rounded-[48px] flex flex-col items-center gap-2 group hover:bg-white transition-colors">
<span class="material-symbols-outlined text-taupe/60 text-3xl group-hover:scale-110 transition-transform">add_circle</span>
<span class="text-sm font-bold text-taupe/80 tracking-widest uppercase">Add Symptom</span>
</button>
</div>
</main>
<footer class="fixed bottom-0 w-full glass-footer border-t border-taupe/5 z-50 pb-safe-area-inset-bottom">
<div class="max-w-xl mx-auto px-6 py-6 flex gap-4">
<button class="flex-1 h-16 rounded-[32px] border border-taupe/20 text-taupe font-bold text-sm tracking-widest uppercase active:scale-95 transition-all">
            Back
        </button>
<button class="flex-[2] h-16 rounded-[32px] bg-taupe text-white font-bold text-sm tracking-widest uppercase shadow-xl shadow-taupe/20 active:scale-95 transition-all flex items-center justify-center gap-2">
            Next: Triggers
        </button>
</div>
</footer>

</body></html>
