<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #fef8f6;
        }
        .serif-text {
            font-family: 'Noto Serif', serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface antialiased overflow-hidden">
<!-- Top Navigation Shell (Suppressed as per Onboarding rule) -->
<!-- Main Content Canvas -->
<main class="relative h-screen flex flex-col overflow-hidden max-w-md mx-auto">
<!-- Top 40%: Illustrative Area -->
<section class="h-[40%] relative w-full overflow-hidden">
<!-- Tonal layering: Subtle background glow -->
<div class="absolute inset-0 bg-gradient-to-b from-secondary-fixed/30 to-transparent"></div>
<div class="w-full h-full flex items-center justify-center p-8">
<div class="relative w-full h-full rounded-[3rem] overflow-hidden">
<img alt="Gentle wellness and abstract menopause imagery" class="w-full h-full object-cover grayscale-[20%] sepia-[10%] opacity-90" data-alt="Abstract soft-toned wellness and lifestyle photography" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBtal90IzOgHWFTozog_Z33vE4WL8G-Z65dVHRHMlJRWS5GLkVPmyX2GyoWhWL3OnjCOd_CVADsB4PUspYdT34y6YN9M1K4TSouLoXqQkT2C2FGyC_IKgQ0aMwwed02VgTVH4-ew0qAPK_wK5vdCvt5LXw9dNHI3cRq0WxtDYthNHxs9NBNyUWTvF2BP6RsovkpdNtieT23ZZRj1TMzXTYY86mEH62q6MSWcKaQeperWOVOnbZF2e4fQ4ApRKAH1Paj7GWvHN_QoSM"/>
<!-- Glassmorphism overlay on image corner -->
<div class="absolute top-6 left-6 bg-surface-container/70 backdrop-blur-md px-4 py-2 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="spa">spa</span>
<span class="text-[10px] font-bold tracking-[0.1em] text-primary uppercase">MenoSync</span>
</div>
</div>
</div>
</section>
<!-- Middle 30%: Hero Text Area -->
<section class="h-[30%] px-10 flex flex-col justify-center text-left">
<h1 class="serif-text text-4xl font-bold tracking-tight text-on-surface leading-tight mb-4">
                Welcome to MenoSync
            </h1>
<p class="text-primary-container font-medium text-[15px] leading-relaxed mb-4">
                Track your symptoms, understand your body, reclaim your life
            </p>
<p class="text-on-surface-variant/80 text-[13px] leading-relaxed max-w-[90%]">
                A private, supportive space to log daily symptoms and discover patterns that matter to you.
            </p>
</section>
<!-- Bottom 30%: Call-to-action Buttons -->
<section class="h-[30%] px-10 flex flex-col justify-end pb-12">
<div class="space-y-4">
<!-- Primary Button: Create Account -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 rounded-full font-bold text-[15px] shadow-sm active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    Create Account
                </button>
<!-- Secondary Button: Sign In -->
<button class="w-full bg-transparent border-2 border-primary text-primary py-[14px] rounded-full font-bold text-[15px] active:scale-[0.98] transition-all flex items-center justify-center">
                    Sign In
                </button>
</div>
<!-- Legal/Privacy text -->
<div class="mt-8 text-center">
<p class="text-[9px] uppercase tracking-widest text-outline/60 font-medium">
                    By continuing, you agree to our <span class="underline decoration-outline/20">Privacy Policy</span>
</p>
</div>
</section>
<!-- Bottom decorative element for editorial feel -->
<div class="absolute -bottom-16 -right-16 w-48 h-48 bg-tertiary-fixed-dim/20 rounded-full blur-3xl"></div>
</main>
<!-- Navigation suppression check: BottomNavBar is hidden for onboarding -->
<!-- The "Destination" Rule applied: Login/Signup flows suppress the shell -->
