<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log Your Symptoms | MenoSync Guided</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#67594e",
                        "surface": "#F7F5F0",
                        "taupe": "#9B8B7E",
                        "lavender-soft": "#E6E1F0",
                        "charcoal": "#333333",
                        "outline-soft": "#D0C4BC",
                        "on-surface": "#1d1b1a"
                    },
                    fontFamily: {
                        "serif": ["Noto Serif", "serif"],
                        "sans": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-surface text-on-surface font-sans overflow-hidden h-screen w-screen;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 99px;
            @apply bg-outline-soft;
        }
        .progress-dot.active {
            @apply bg-taupe w-6;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col">
<header class="pt-8 px-6 pb-4 bg-surface">
<div class="flex justify-between items-center mb-6">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-sm text-primary">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex gap-2">
<div class="progress-dot"></div>
<div class="progress-dot"></div>
<div class="progress-dot active"></div>
</div>
<div class="w-10"></div>
</div>
<div class="w-full bg-outline-soft/30 h-1 rounded-full overflow-hidden">
<div class="bg-taupe h-full w-3/5 rounded-full transition-all duration-500"></div>
</div>
<p class="text-[10px] uppercase tracking-[0.2em] font-bold text-taupe mt-3 text-center">Step 3 of 5: Triggers</p>
</header>
<main class="flex-1 overflow-y-auto px-6 pt-4 pb-48">
<div class="flex flex-col items-center text-center max-w-md mx-auto" id="step-triggers">
<h2 class="serif text-2xl font-semibold text-charcoal mb-4 leading-relaxed">What might have triggered your symptoms?</h2>
<p class="text-primary/60 text-sm mb-10">Select all that apply to today's entry</p>
<div class="flex flex-wrap justify-center gap-3 w-full">
<button class="flex items-center gap-2 px-5 py-3 rounded-full bg-white border border-outline-soft/50 shadow-sm hover:border-taupe/40 transition-all text-sm font-semibold text-primary">
<span class="material-symbols-outlined text-xl text-taupe">coffee</span>
                    Caffeine
                </button>
<button class="flex items-center gap-2 px-5 py-3 rounded-full bg-white border border-outline-soft/50 shadow-sm hover:border-taupe/40 transition-all text-sm font-semibold text-primary">
<span class="material-symbols-outlined text-xl text-taupe">wine_bar</span>
                    Alcohol
                </button>
<button class="flex items-center gap-2 px-5 py-3 rounded-full bg-lavender-soft border border-taupe shadow-sm transition-all text-sm font-bold text-primary">
<span class="material-symbols-outlined text-xl text-taupe" style="font-variation-settings: 'FILL' 1;">psychology</span>
                    Stress
                    <span class="material-symbols-outlined text-sm bg-taupe text-white rounded-full">check</span>
</button>
<button class="flex items-center gap-2 px-5 py-3 rounded-full bg-white border border-outline-soft/50 shadow-sm hover:border-taupe/40 transition-all text-sm font-semibold text-primary">
<span class="material-symbols-outlined text-xl text-taupe">fitness_center</span>
                    Exercise
                </button>
<button class="flex items-center gap-2 px-5 py-3 rounded-full bg-white border border-outline-soft/50 shadow-sm hover:border-taupe/40 transition-all text-sm font-semibold text-primary">
<span class="material-symbols-outlined text-xl text-taupe">thermostat</span>
                    Weather
                </button>
<button class="flex items-center gap-2 px-5 py-3 rounded-full bg-white border border-outline-soft/50 shadow-sm hover:border-taupe/40 transition-all text-sm font-semibold text-primary">
<span class="material-symbols-outlined text-xl text-taupe">restaurant</span>
                    Foods
                </button>
<button class="flex items-center gap-2 px-5 py-3 rounded-full bg-white border border-outline-soft/50 shadow-sm hover:border-taupe/40 transition-all text-sm font-semibold text-primary">
<span class="material-symbols-outlined text-xl text-taupe">bedtime</span>
                    Late Night
                </button>
<button class="flex items-center gap-2 px-5 py-3 rounded-full bg-white border border-outline-soft/50 shadow-sm hover:border-taupe/40 transition-all text-sm font-semibold text-primary">
<span class="material-symbols-outlined text-xl text-taupe">travel_explore</span>
                    Travel
                </button>
<button class="flex items-center gap-2 px-5 py-3 rounded-full bg-white border border-outline-soft/50 shadow-sm hover:border-taupe/40 transition-all text-sm font-semibold text-primary">
<span class="material-symbols-outlined text-xl text-taupe">medication</span>
                    Medicine
                </button>
<button class="flex items-center gap-2 px-5 py-3 rounded-full bg-white border border-outline-soft/50 shadow-sm hover:border-taupe/40 transition-all text-sm font-semibold text-primary">
<span class="material-symbols-outlined text-xl text-taupe">smoking_rooms</span>
                    Smoking
                </button>
</div>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full p-6 pt-2 bg-surface/90 backdrop-blur-md z-40">
<div class="max-w-lg mx-auto flex flex-col gap-5">
<button class="w-max mx-auto px-6 py-2 border border-outline-soft bg-outline-soft/10 text-taupe font-semibold rounded-full active:scale-95 duration-200 transition-all flex items-center justify-center gap-2 text-xs uppercase tracking-widest">
<span class="material-symbols-outlined text-lg">add</span>
                Add Custom Symptom
            </button>
<div class="flex gap-4">
<button class="flex-1 py-5 bg-white border border-outline-soft text-primary font-bold rounded-[2rem] active:scale-95 duration-200 transition-all text-sm uppercase tracking-widest">
                    Back
                </button>
<button class="flex-[2] py-5 bg-taupe text-white font-bold rounded-[2rem] shadow-lg shadow-taupe/20 active:scale-95 duration-200 transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-[0.2em]">
                    Continue <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
<div class="mt-2 flex justify-center gap-1.5 opacity-30">
<div class="h-1 w-4 bg-taupe rounded-full"></div>
<div class="h-1 w-1 bg-taupe rounded-full"></div>
<div class="h-1 w-1 bg-taupe rounded-full"></div>
<div class="h-1 w-1 bg-taupe rounded-full"></div>
<div class="h-1 w-1 bg-taupe rounded-full"></div>
</div>
</div>
</footer>

</body></html>
