<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#6c6074",
                        "surface-dim": "#ded9d7",
                        "on-surface": "#1d1b1a",
                        "secondary-fixed-dim": "#d0c1d8",
                        "secondary-fixed": "#edddf5",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "secondary": "#655a6e",
                        "outline-variant": "#d0c4bc",
                        "inverse-surface": "#32302f",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#ede7e5",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#f2edea",
                        "on-tertiary": "#ffffff",
                        "surface": "#fef8f6",
                        "on-tertiary-fixed": "#341009",
                        "on-secondary-fixed": "#211828",
                        "secondary-container": "#edddf5",
                        "on-surface-variant": "#4d453f",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "tertiary-container": "#9d675c",
                        "primary": "#67594e",
                        "primary-fixed-dim": "#d6c3b5",
                        "tertiary-fixed": "#ffdad3",
                        "outline": "#7f756e",
                        "surface-container-low": "#f8f2f0",
                        "surface-bright": "#fef8f6",
                        "inverse-on-surface": "#f5f0ed",
                        "on-primary": "#ffffff",
                        "surface-tint": "#6a5c50",
                        "background": "#fef8f6",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-primary-container": "#fffbff",
                        "on-background": "#1d1b1a",
                        "error": "#ba1a1a",
                        "primary-container": "#817266",
                        "on-tertiary-container": "#fffbff",
                        "surface-variant": "#e7e1df",
                        "on-primary-fixed-variant": "#51443a",
                        "tertiary": "#814f45",
                        "on-tertiary-fixed-variant": "#683a31",
                        "surface-container-highest": "#e7e1df",
                        "on-primary-fixed": "#231a11",
                        "inverse-primary": "#d6c3b5",
                        "primary-fixed": "#f2dfd0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
            body { 
                @apply bg-[#fef8f6] font-body text-on-surface;
                min-height: 100dvh;
            }
            .serif { font-family: 'Noto Serif', serif; }
            ::-webkit-scrollbar { display: none; }
        }input[type="range"] {
            @apply appearance-none bg-surface-container h-3 rounded-full outline-none;
        }
        input[type="range"]::-webkit-slider-thumb {
            @apply appearance-none w-8 h-8 rounded-full bg-primary border-4 border-white shadow-lg cursor-pointer;
        }.question-view {
            @apply flex flex-col h-full opacity-100 transition-opacity duration-300;
        }
        .question-view:not(.active) {
            @apply hidden;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col">
<header class="fixed top-0 w-full z-50 bg-[#fef8f6]/80 backdrop-blur-md border-b border-surface-variant/20">
<div class="flex items-center justify-between px-6 h-16 w-full max-w-screen-md mx-auto">
<button class="active:scale-95 transition-transform p-2 -ml-2">
<span class="material-symbols-outlined text-stone-700">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="text-[10px] font-bold uppercase tracking-[0.2em] text-primary leading-none mb-1">Step 5 of 7</span>
<div class="w-24 h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[71.4%]"></div>
</div>
</div>
<div class="w-10"></div>
</div>
</header>
<main class="flex-1 flex flex-col pt-20 pb-32 px-6 max-w-screen-md mx-auto w-full">
<div class="question-view active">
<div class="mb-10 text-center">
<h2 class="serif text-3xl font-semibold text-on-surface mb-4">What's your current weight?</h2>
<p class="text-on-surface-variant text-base leading-relaxed">
                    This identifies lifestyle patterns that may correlate with your symptoms.
                </p>
</div>
<div class="flex-1 flex flex-col justify-center space-y-12">
<div class="text-center">
<div class="inline-flex items-baseline gap-2">
<span class="serif text-7xl font-bold text-primary">70</span>
<span class="text-2xl font-bold text-on-surface-variant uppercase">kg</span>
</div>
</div>
<div class="px-4">
<input class="w-full" max="150" min="40" type="range" value="70"/>
<div class="flex justify-between mt-4 text-xs font-bold text-outline uppercase tracking-widest">
<span>40 kg</span>
<span>150 kg</span>
</div>
</div>
<div class="flex justify-center">
<div class="inline-flex bg-surface-container-high p-1.5 rounded-full shadow-inner">
<button class="px-8 py-2.5 rounded-full text-sm font-bold bg-primary text-on-primary shadow-sm">Metric (kg)</button>
<button class="px-8 py-2.5 rounded-full text-sm font-bold text-on-surface-variant">Imperial (lbs)</button>
</div>
</div>
</div>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full px-6 pt-6 pb-10 bg-gradient-to-t from-[#fef8f6] via-[#fef8f6] to-transparent z-50">
<div class="max-w-screen-md mx-auto flex flex-col gap-4">
<button class="w-full py-5 bg-primary text-on-primary rounded-2xl font-bold tracking-widest text-base uppercase shadow-2xl transition-all active:scale-[0.98]">
                Continue
            </button>
<button class="w-full text-center text-xs font-bold text-on-surface-variant/60 uppercase tracking-[0.2em] hover:text-primary transition-colors py-2">
                Skip this question
            </button>
</div>
</footer>
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary-fixed/20 rounded-full blur-[100px]"></div>
<div class="absolute bottom-48 -left-24 w-72 h-72 bg-secondary-fixed/30 rounded-full blur-[80px]"></div>
</div>

</body></html>
