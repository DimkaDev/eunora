<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Symptom | MenoSync</title>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tap-highlight-none {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #fef8f6;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-4">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-on-surface/40 backdrop-blur-sm z-40"></div>
<!-- Main Modal Container -->
<main class="relative z-50 w-full max-w-xl bg-surface-container shadow-2xl rounded-[2rem] overflow-hidden flex flex-col max-h-[795px]">
<!-- TopAppBar (Based on JSON) -->
<header class="sticky top-0 w-full bg-[#fef8f6]/70 dark:bg-stone-900/70 backdrop-blur-xl z-10">
<div class="flex items-center justify-between px-6 py-4 w-full">
<div class="flex flex-col">
<h1 class="font-['Noto_Serif'] text-xl tracking-tight text-[#67594e]">Add Symptom</h1>
<p class="font-body text-[12px] text-on-surface-variant/70">Tell us what you're experiencing</p>
</div>
<button class="material-symbols-outlined text-[#67594e] hover:opacity-80 transition-opacity scale-95 active:duration-150 p-2" data-icon="close">close</button>
</div>
</header>
<!-- Content Canvas -->
<div class="flex-1 overflow-y-auto px-6 py-8 space-y-8 scroll-smooth">
<!-- Form Section -->
<section class="space-y-6">
<!-- Symptom Name Input -->
<div class="space-y-2">
<label class="font-label text-sm font-semibold text-on-surface-variant ml-2">Symptom name *</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-full px-6 py-4 text-on-surface placeholder:text-outline/60 focus:ring-2 focus:ring-primary/20 transition-all" placeholder="E.g., Hot chest, Tingling fingers" type="text"/>
</div>
<!-- Quick-add Preset Buttons (Asymmetric Pill layout) -->
<div class="flex flex-wrap gap-2 pt-2 ml-1">
<button class="bg-surface-container-high hover:bg-secondary-container transition-colors px-4 py-2 rounded-full text-xs font-semibold text-on-surface-variant">Tingling fingers</button>
<button class="bg-surface-container-high hover:bg-secondary-container transition-colors px-4 py-2 rounded-full text-xs font-semibold text-on-surface-variant">Dizziness</button>
<button class="bg-surface-container-high hover:bg-secondary-container transition-colors px-4 py-2 rounded-full text-xs font-semibold text-on-surface-variant">Hot chest</button>
</div>
</div>
<!-- Category Dropdown -->
<div class="space-y-2">
<label class="font-label text-sm font-semibold text-on-surface-variant ml-2">Category</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-highest border-none rounded-full px-6 py-4 text-on-surface focus:ring-2 focus:ring-primary/20 transition-all">
<option>Other</option>
<option>Vasomotor</option>
<option>Sleep</option>
<option>Mood</option>
<option>Physical</option>
<option>Medical</option>
</select>
<div class="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
</div>
<!-- Description Text Area (Reflection Space) -->
<div class="space-y-2">
<label class="font-label text-sm font-semibold text-on-surface-variant ml-2">Description (Optional)</label>
<div class="bg-surface-container-lowest rounded-[1.5rem] p-1 shadow-sm">
<textarea class="w-full bg-transparent border-none rounded-[1.5rem] px-5 py-4 text-on-surface font-headline italic placeholder:text-outline/40 focus:ring-0 resize-none" placeholder="E.g., Feels like pins and needles" rows="4"></textarea>
</div>
</div>
</section>
<!-- Info Banner (Tonal Shift) -->
<section class="bg-secondary-container/40 rounded-2xl p-5 flex gap-4 items-start border border-secondary-container">
<span class="material-symbols-outlined text-secondary mt-0.5" data-icon="info" data-weight="fill" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body text-sm text-on-secondary-container leading-relaxed">
                    Any custom symptoms you add will be saved securely to your library for future logs and deeper insights.
                </p>
</section>
<!-- Decorative Visual Element -->
<div class="relative h-32 rounded-[2rem] overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-r from-primary/10 to-secondary-container/30"></div>
<img alt="Wellness visual" class="w-full h-full object-cover mix-blend-multiply opacity-20 transition-transform duration-700 group-hover:scale-110" data-alt="abstract soft focus view of smooth silk fabric in lavender and taupe tones with gentle morning light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA-xS2ycmGsyro1Hq0-WBsSHAQsJjpmvxqfGeWkuZj8B_lbjhy5Vqv-7pwG6sUFayoKwjgvn6cwQmQKk17C9FIC9TjSDvESh7lI6gaeJcqq_0IGXB2yw71yXwblh7y7fui-Rcz7yeoAaCX-NXO4mh4XPNljaZ7UBxnRLwdAMKSD4a_H5P5BBcya-AGhTMEw1eq4XdhjDQTLJR1FCwECnQ3O1DanN7lDCeqcEQQZjsgcvKNBGOJ3iyuhW0ky15m_M8EetN-eKpq8M3w"/>
<div class="absolute inset-0 flex items-center justify-center">
<span class="font-headline italic text-primary/60 text-lg">Your journey, curated by you.</span>
</div>
</div>
</div>
<!-- Sticky Bottom Actions -->
<footer class="p-6 bg-surface-container-lowest border-t border-outline-variant/10 flex items-center justify-between gap-4">
<button class="flex-1 py-4 text-primary font-semibold hover:bg-surface-container-high rounded-full transition-colors">
                Cancel
            </button>
<button class="flex-[2] py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-semibold rounded-full shadow-lg shadow-primary/20 scale-100 active:scale-95 transition-all">
                Add Symptom
            </button>
</footer>
</main>
<!-- Bottom Nav Bar Simulation (Inactive for Modal) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-2 bg-[#fef8f6]/70 backdrop-blur-xl rounded-t-[1.5rem] shadow-[0_-4px_24px_0_rgba(29,27,26,0.06)] md:hidden pointer-events-none opacity-20">
<div class="flex flex-col items-center justify-center text-[#9B8B7E] px-5 py-2">
<span class="material-symbols-outlined" data-icon="auto_stories">auto_stories</span>
<span class="font-['Manrope'] text-[10px] uppercase tracking-widest font-semibold mt-1">Journal</span>
</div>
<div class="flex flex-col items-center justify-center text-[#9B8B7E] px-5 py-2">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="font-['Manrope'] text-[10px] uppercase tracking-widest font-semibold mt-1">Insights</span>
</div>
<div class="flex flex-col items-center justify-center text-[#9B8B7E] px-5 py-2">
<span class="material-symbols-outlined" data-icon="local_library">local_library</span>
<span class="font-['Manrope'] text-[10px] uppercase tracking-widest font-semibold mt-1">Library</span>
</div>
<div class="flex flex-col items-center justify-center text-[#9B8B7E] px-5 py-2">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Manrope'] text-[10px] uppercase tracking-widest font-semibold mt-1">Settings</span>
</div>
</nav>
</body></html>
