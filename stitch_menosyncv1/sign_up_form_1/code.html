<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-variant": "#e7e1df",
                        "on-primary-fixed": "#231a11",
                        "on-tertiary-fixed": "#341009",
                        "on-secondary": "#ffffff",
                        "tertiary": "#814f45",
                        "on-secondary-fixed-variant": "#4d4355",
                        "secondary-fixed": "#edddf5",
                        "surface-container-high": "#ede7e5",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-tertiary-container": "#fffbff",
                        "surface-container": "#f2edea",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f8f2f0",
                        "outline-variant": "#d0c4bc",
                        "background": "#fef8f6",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-secondary-fixed": "#211828",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "on-surface": "#1d1b1a",
                        "inverse-primary": "#d6c3b5",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e7e1df",
                        "inverse-on-surface": "#f5f0ed",
                        "surface": "#fef8f6",
                        "secondary-fixed-dim": "#d0c1d8",
                        "primary": "#67594e",
                        "on-surface-variant": "#4d453f",
                        "on-primary-container": "#fffbff",
                        "on-error-container": "#93000a",
                        "surface-dim": "#ded9d7",
                        "on-primary-fixed-variant": "#51443a",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#1d1b1a",
                        "primary-container": "#817266",
                        "outline": "#7f756e",
                        "secondary-container": "#edddf5",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#9d675c",
                        "on-secondary-container": "#6c6074",
                        "tertiary-fixed": "#ffdad3",
                        "surface-tint": "#6a5c50",
                        "surface-bright": "#fef8f6",
                        "primary-fixed": "#f2dfd0",
                        "inverse-surface": "#32302f",
                        "secondary": "#655a6e"
                    },
                    fontFamily: {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tonal-transition {
            background-image: linear-gradient(to bottom, rgba(254, 248, 246, 0.8), rgba(254, 248, 246, 0));
        }
        input:focus, select:focus {
            background-color: #E8E0F0 !important;
            outline: none;
            border-color: #9B8B7E !important;
            box-shadow: 0 0 0 2px rgba(155, 139, 126, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F7F5F0] font-body text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-stone-50/70 dark:bg-stone-900/70 backdrop-blur-md flex items-center px-6 py-4 w-full tonal-transition">
<button class="text-stone-700 dark:text-stone-300 hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="ml-4 font-serif text-stone-800 dark:text-stone-100 headline-md text-[28px] font-semibold leading-tight">Create Your MenoSync Account</h1>
</header>
<main class="flex-1 flex flex-col items-center justify-start pt-32 pb-12 px-6">
<!-- Form Container -->
<div class="w-full max-width-[380px] max-w-[380px] flex flex-col space-y-5">
<!-- Email Input -->
<div class="flex flex-col space-y-2">
<label class="font-bold text-[12px] uppercase tracking-wider text-on-surface-variant">Email Address</label>
<input class="w-full bg-[#EEEEEE] border-2 border-[#9B8B7E] rounded-[6px] p-[12px] text-[14px] placeholder-stone-400 transition-all duration-200" placeholder="you@email.com" type="email"/>
</div>
<!-- Password Input -->
<div class="flex flex-col space-y-1.5">
<label class="font-bold text-[12px] uppercase tracking-wider text-on-surface-variant">Password</label>
<input class="w-full bg-[#EEEEEE] border-2 border-[#9B8B7E] rounded-[6px] p-[12px] text-[14px] placeholder-stone-400 transition-all duration-200" placeholder="Create a secure password" type="password"/>
<p class="text-[10px] text-stone-500 pl-1">At least 8 characters</p>
</div>
<!-- Age Range Radio Buttons -->
<div class="flex flex-col space-y-3 pt-2">
<label class="font-bold text-[12px] uppercase tracking-wider text-on-surface-variant">Age Range</label>
<div class="grid grid-cols-3 gap-3">
<label class="flex items-center space-x-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-5 h-5 border-2 border-[#9B8B7E] rounded-full checked:bg-[#9B8B7E] transition-all" name="age" type="radio"/>
<div class="absolute w-2 h-2 bg-white rounded-full opacity-0 peer-checked:opacity-100"></div>
</div>
<span class="text-[14px] text-on-surface">40-44</span>
</label>
<label class="flex items-center space-x-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-5 h-5 border-2 border-[#9B8B7E] rounded-full checked:bg-[#9B8B7E] transition-all" name="age" type="radio"/>
<div class="absolute w-2 h-2 bg-white rounded-full opacity-0 peer-checked:opacity-100"></div>
</div>
<span class="text-[14px] text-on-surface">45-49</span>
</label>
<label class="flex items-center space-x-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-5 h-5 border-2 border-[#9B8B7E] rounded-full checked:bg-[#9B8B7E] transition-all" name="age" type="radio"/>
<div class="absolute w-2 h-2 bg-white rounded-full opacity-0 peer-checked:opacity-100"></div>
</div>
<span class="text-[14px] text-on-surface">50-54</span>
</label>
<label class="flex items-center space-x-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-5 h-5 border-2 border-[#9B8B7E] rounded-full checked:bg-[#9B8B7E] transition-all" name="age" type="radio"/>
<div class="absolute w-2 h-2 bg-white rounded-full opacity-0 peer-checked:opacity-100"></div>
</div>
<span class="text-[14px] text-on-surface">55-59</span>
</label>
<label class="flex items-center space-x-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-5 h-5 border-2 border-[#9B8B7E] rounded-full checked:bg-[#9B8B7E] transition-all" name="age" type="radio"/>
<div class="absolute w-2 h-2 bg-white rounded-full opacity-0 peer-checked:opacity-100"></div>
</div>
<span class="text-[14px] text-on-surface">60+</span>
</label>
</div>
</div>
<!-- Menopause Stage Dropdown -->
<div class="flex flex-col space-y-2 pt-2">
<label class="font-bold text-[12px] text-on-surface-variant">Where are you in your menopause journey?</label>
<div class="relative">
<select class="w-full appearance-none bg-[#F3F3F3] border-2 border-[#9B8B7E] rounded-[6px] p-[12px] text-[14px] text-on-surface cursor-pointer focus:ring-0">
<option disabled="" selected="" value="">Select your stage</option>
<option>Not sure</option>
<option>Early perimenopause</option>
<option>Active perimenopause</option>
<option>Early menopause</option>
<option>Post-menopause</option>
</select>
<div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-stone-500" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-8 space-y-6">
<button class="w-full bg-[#9B8B7E] text-white py-[14px] rounded-full font-semibold text-[15px] shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200">
                    Create Account
                </button>
<div class="text-center">
<a class="text-blue-600 font-medium text-[13px] hover:underline transition-all" href="#">
                        Already have account? Sign in
                    </a>
</div>
</div>
<!-- Editorial Quote/Support Element -->
<div class="pt-12 border-t border-[#9B8B7E]/10">
<p class="font-serif italic text-stone-500 text-center text-sm leading-relaxed">
                    "This is the start of a more supported, <br/>harmonious transition."
                </p>
</div>
</div>
</main>
<!-- Bottom Ornamentation (Visual Polish) -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary-container opacity-20 pointer-events-none"></div>
</body></html>
