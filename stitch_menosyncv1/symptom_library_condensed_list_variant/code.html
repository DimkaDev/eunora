<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Symptom Selection Library - Condensed List</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'serene-cream': '#F7F5F0',
            'serene-taupe': '#9B8B7E',
            'serene-lavender': '#D8C9E0',
            'serene-dark': '#5C4A3D', // Darker brown for text
            'serene-bg-card': '#EFEBE4', // Slightly darker cream for selected state
          },
          fontFamily: {
            'serif': ['Georgia', 'Cambria', '"Times New Roman"', 'Times', 'serif'],
            'sans': ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style data-purpose="custom-utilities">
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>
<body class="bg-serene-cream font-sans text-serene-dark antialiased overflow-hidden flex flex-col h-screen max-w-md mx-auto relative shadow-2xl">
<!-- BEGIN: Header Section -->
<header class="bg-serene-cream px-4 pt-12 pb-4 flex items-center justify-between sticky top-0 z-10 border-b border-serene-taupe/20">
<button aria-label="Go back" class="text-serene-dark hover:text-serene-taupe transition-colors p-2 -ml-2">
<i class="fas fa-arrow-left text-lg"></i>
</button>
<h1 class="font-serif text-xl font-bold tracking-tight">Symptom Library</h1>
<button aria-label="Search" class="text-serene-dark hover:text-serene-taupe transition-colors p-2 -mr-2">
<i class="fas fa-search text-lg"></i>
</button>
</header>
<!-- END: Header Section -->
<!-- BEGIN: Main Content Area (Scrollable) -->
<main class="flex-1 overflow-y-auto no-scrollbar pb-24">
<!-- Search Bar (Sticky within scrollable area) -->
<div class="px-4 py-3 sticky top-0 bg-serene-cream z-10">
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<i class="fas fa-search text-serene-taupe text-sm"></i>
</div>
<input class="block w-full pl-9 pr-3 py-2 bg-serene-taupe/10 border-transparent rounded-lg text-sm text-serene-dark placeholder-serene-taupe focus:border-serene-taupe focus:ring-1 focus:ring-serene-taupe focus:bg-white transition-colors" placeholder="Search all symptoms..." type="text"/>
</div>
</div>
<!-- Add Custom Symptom Action -->
<div class="px-4 mb-4">
<button class="w-full flex items-center justify-between p-3 bg-white rounded-xl border border-serene-taupe/20 shadow-sm active:bg-serene-cream transition-colors">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-serene-lavender/30 flex items-center justify-center text-serene-dark">
<i class="fas fa-plus text-xs"></i>
</div>
<span class="font-medium text-sm text-serene-dark">+ Add your own symptom</span>
</div>
<i class="fas fa-chevron-right text-serene-taupe text-xs"></i>
</button>
</div>
<!-- Symptom List grouped by category -->
<div class="px-4 space-y-6">
<!-- Category: Vasomotor Symptoms -->
<section data-purpose="symptom-category">
<div class="flex items-center gap-3 mb-2">
<h2 class="font-serif text-base font-bold text-serene-dark whitespace-nowrap">Vasomotor Symptoms</h2>
<div class="h-px bg-serene-taupe/30 flex-grow"></div>
</div>
<ul class="bg-white rounded-xl border border-serene-taupe/20 overflow-hidden divide-y divide-serene-taupe/10 shadow-sm">
<!-- Selected Symptom Item -->
<li class="flex items-center justify-between p-3 bg-serene-bg-card active:bg-serene-taupe/10 transition-colors cursor-pointer" data-state="selected">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 flex items-center justify-center text-serene-dark text-lg">
<i class="fa-solid fa-temperature-arrow-up"></i>
</div>
<span class="text-sm font-medium text-serene-dark">Hot flashes</span>
</div>
<div class="w-5 h-5 rounded-full bg-serene-dark text-white flex items-center justify-center">
<i class="fas fa-check text-[10px]"></i>
</div>
</li>
<!-- Unselected Symptom Item -->
<li class="flex items-center justify-between p-3 active:bg-serene-cream transition-colors cursor-pointer" data-state="unselected">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 flex items-center justify-center text-serene-taupe text-lg">
<i class="fa-solid fa-moon"></i>
</div>
<span class="text-sm text-serene-dark">Night sweats</span>
</div>
<div class="w-5 h-5 rounded-full border border-serene-taupe/40 bg-transparent flex items-center justify-center"></div>
</li>
<!-- Unselected Symptom Item -->
<li class="flex items-center justify-between p-3 active:bg-serene-cream transition-colors cursor-pointer" data-state="unselected">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 flex items-center justify-center text-serene-taupe text-lg">
<i class="fa-regular fa-snowflake"></i>
</div>
<span class="text-sm text-serene-dark">Cold flashes</span>
</div>
<div class="w-5 h-5 rounded-full border border-serene-taupe/40 bg-transparent flex items-center justify-center"></div>
</li>
</ul>
</section>
<!-- Category: Emotional & Cognitive -->
<section data-purpose="symptom-category">
<div class="flex items-center gap-3 mb-2">
<h2 class="font-serif text-base font-bold text-serene-dark whitespace-nowrap">Emotional &amp; Cognitive</h2>
<div class="h-px bg-serene-taupe/30 flex-grow"></div>
</div>
<ul class="bg-white rounded-xl border border-serene-taupe/20 overflow-hidden divide-y divide-serene-taupe/10 shadow-sm">
<li class="flex items-center justify-between p-3 active:bg-serene-cream transition-colors cursor-pointer" data-state="unselected">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 flex items-center justify-center text-serene-taupe text-lg">
<i class="fa-solid fa-head-side-virus"></i>
</div>
<span class="text-sm text-serene-dark">Anxiety</span>
</div>
<div class="w-5 h-5 rounded-full border border-serene-taupe/40 bg-transparent flex items-center justify-center"></div>
</li>
<!-- Selected Symptom Item -->
<li class="flex items-center justify-between p-3 bg-serene-bg-card active:bg-serene-taupe/10 transition-colors cursor-pointer" data-state="selected">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 flex items-center justify-center text-serene-dark text-lg">
<i class="fa-solid fa-face-frown"></i>
</div>
<span class="text-sm font-medium text-serene-dark">Irritability</span>
</div>
<div class="w-5 h-5 rounded-full bg-serene-dark text-white flex items-center justify-center">
<i class="fas fa-check text-[10px]"></i>
</div>
</li>
<li class="flex items-center justify-between p-3 active:bg-serene-cream transition-colors cursor-pointer" data-state="unselected">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 flex items-center justify-center text-serene-taupe text-lg">
<i class="fa-solid fa-water"></i>
</div>
<span class="text-sm text-serene-dark">Mood swings</span>
</div>
<div class="w-5 h-5 rounded-full border border-serene-taupe/40 bg-transparent flex items-center justify-center"></div>
</li>
<li class="flex items-center justify-between p-3 active:bg-serene-cream transition-colors cursor-pointer" data-state="unselected">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 flex items-center justify-center text-serene-taupe text-lg">
<i class="fa-solid fa-cloud"></i>
</div>
<span class="text-sm text-serene-dark">Brain fog</span>
</div>
<div class="w-5 h-5 rounded-full border border-serene-taupe/40 bg-transparent flex items-center justify-center"></div>
</li>
</ul>
</section>
<!-- Category: Physical Wellbeing -->
<section data-purpose="symptom-category">
<div class="flex items-center gap-3 mb-2">
<h2 class="font-serif text-base font-bold text-serene-dark whitespace-nowrap">Physical Wellbeing</h2>
<div class="h-px bg-serene-taupe/30 flex-grow"></div>
</div>
<ul class="bg-white rounded-xl border border-serene-taupe/20 overflow-hidden divide-y divide-serene-taupe/10 shadow-sm">
<li class="flex items-center justify-between p-3 active:bg-serene-cream transition-colors cursor-pointer" data-state="unselected">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 flex items-center justify-center text-serene-taupe text-lg">
<i class="fa-solid fa-person-walking-with-cane"></i>
</div>
<span class="text-sm text-serene-dark">Joint pain</span>
</div>
<div class="w-5 h-5 rounded-full border border-serene-taupe/40 bg-transparent flex items-center justify-center"></div>
</li>
<!-- Selected Symptom Item -->
<li class="flex items-center justify-between p-3 bg-serene-bg-card active:bg-serene-taupe/10 transition-colors cursor-pointer" data-state="selected">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 flex items-center justify-center text-serene-dark text-lg">
<i class="fa-solid fa-battery-quarter"></i>
</div>
<span class="text-sm font-medium text-serene-dark">Fatigue</span>
</div>
<div class="w-5 h-5 rounded-full bg-serene-dark text-white flex items-center justify-center">
<i class="fas fa-check text-[10px]"></i>
</div>
</li>
</ul>
</section>
</div>
</main>
<!-- END: Main Content Area -->
<!-- BEGIN: Bottom Navigation -->
<nav class="bg-white border-t border-serene-taupe/20 pb-safe pt-2 absolute bottom-0 w-full rounded-t-2xl shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<div class="flex justify-around items-center px-2 pb-2">
<a class="flex flex-col items-center p-2 text-serene-taupe hover:text-serene-dark transition-colors w-16" href="#">
<i class="fas fa-book-open text-xl mb-1"></i>
<span class="text-[10px] font-medium tracking-wide uppercase">Journal</span>
</a>
<!-- Active Tab -->
<a class="flex flex-col items-center p-2 text-serene-dark relative w-16" href="#">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-1 bg-serene-dark rounded-b-full -mt-2"></div>
<i class="fas fa-book text-xl mb-1 mt-1"></i>
<span class="text-[10px] font-bold tracking-wide uppercase">Library</span>
</a>
<a class="flex flex-col items-center p-2 text-serene-taupe hover:text-serene-dark transition-colors w-16" href="#">
<i class="fas fa-chart-line text-xl mb-1"></i>
<span class="text-[10px] font-medium tracking-wide uppercase">Insights</span>
</a>
<a class="flex flex-col items-center p-2 text-serene-taupe hover:text-serene-dark transition-colors w-16" href="#">
<i class="fas fa-user text-xl mb-1"></i>
<span class="text-[10px] font-medium tracking-wide uppercase">Profile</span>
</a>
</div>
</nav>
<!-- END: Bottom Navigation -->
</body></html>
