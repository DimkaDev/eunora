<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Hormone Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#ded9d7",
                        "surface-container-high": "#ede7e5",
                        "inverse-surface": "#32302f",
                        "on-error-container": "#93000a",
                        "primary-container": "#817266",
                        "on-primary-container": "#fffbff",
                        "secondary-container": "#edddf5",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-primary-fixed": "#231a11",
                        "outline-variant": "#d0c4bc",
                        "on-primary-fixed-variant": "#51443a",
                        "on-tertiary-fixed": "#341009",
                        "on-tertiary-container": "#fffbff",
                        "primary-fixed": "#f2dfd0",
                        "secondary-fixed-dim": "#d0c1d8",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-secondary": "#ffffff",
                        "on-background": "#1d1b1a",
                        "outline": "#7f756e",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#edddf5",
                        "on-secondary-container": "#6c6074",
                        "on-tertiary-fixed-variant": "#683a31",
                        "error-container": "#ffdad6",
                        "surface-bright": "#fef8f6",
                        "surface-container-low": "#f8f2f0",
                        "on-surface-variant": "#4d453f",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#d6c3b5",
                        "surface-container-highest": "#e7e1df",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1d1b1a",
                        "surface-variant": "#e7e1df",
                        "tertiary-container": "#9d675c",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "background": "#fef8f6",
                        "surface-tint": "#6a5c50",
                        "inverse-on-surface": "#f5f0ed",
                        "surface-container": "#f2edea",
                        "tertiary": "#814f45",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdad3",
                        "surface": "#fef8f6",
                        "secondary": "#655a6e",
                        "on-secondary-fixed": "#211828",
                        "primary": "#67594e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body { font-family: 'Manrope', sans-serif; background-color: #F7F5F0; }
        .font-serif { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        ::-webkit-scrollbar { width: 0; background: transparent; }
        .learning-hub-card:has(input:checked) {
            @apply border-primary bg-primary-fixed/30 shadow-sm;
        }
        .cycle-toggle:has(input:checked) {
            @apply bg-primary text-white border-primary;
        }
        .medication-chip:has(input:checked) {
            @apply bg-secondary-container border-secondary ring-1 ring-secondary/20;
        }
        .insight-tile:has(input:checked) {
            @apply bg-tertiary-fixed border-tertiary/20;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface antialiased">
<header class="fixed top-0 w-full z-50 bg-[#F7F5F0]/80 backdrop-blur-xl px-5 pt-7 pb-3 border-b border-outline-variant/20">
<div class="flex items-center justify-between mb-1">
<button class="active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<span class="text-[9px] uppercase tracking-widest font-bold text-outline">Step 2e of 7</span>
</div>
<h1 class="font-serif text-[18px] font-semibold text-[#1d1b1a] leading-tight mb-0.5">Customized Condition Profile</h1>
<p class="text-[11px] text-on-surface-variant font-medium opacity-80 leading-relaxed">Efficiently setup tracking for your specific needs.</p>
</header>
<main class="pt-32 pb-44 px-4 space-y-4">
<section class="bg-surface-container-lowest rounded-xl p-4 shadow-sm border border-outline-variant/30">
<h2 class="font-headline text-base mb-3 text-on-surface font-bold">Conditions Managed</h2>
<div class="space-y-2">
<label class="learning-hub-card block p-3 rounded-lg border border-outline-variant/40 bg-surface-bright cursor-pointer transition-all">
<div class="flex items-start gap-3">
<input class="rounded border-outline-variant text-primary focus:ring-primary h-4 w-4 mt-1" type="checkbox"/>
<div>
<p class="font-bold text-sm text-primary">PCOS</p>
<p class="text-[11px] text-on-surface-variant leading-snug">Hormonal imbalances affecting metabolism and cycle regularity.</p>
</div>
</div>
</label>
<label class="learning-hub-card block p-3 rounded-lg border border-outline-variant/40 bg-surface-bright cursor-pointer transition-all">
<div class="flex items-start gap-3">
<input class="rounded border-outline-variant text-primary focus:ring-primary h-4 w-4 mt-1" type="checkbox"/>
<div>
<p class="font-bold text-sm text-primary">PMDD</p>
<p class="text-[11px] text-on-surface-variant leading-snug">Severe premenstrual symptoms requiring specialized mood support.</p>
</div>
</div>
</label>
<label class="learning-hub-card block p-3 rounded-lg border border-outline-variant/40 bg-surface-bright cursor-pointer transition-all">
<div class="flex items-start gap-3">
<input checked="" class="rounded border-outline-variant text-primary focus:ring-primary h-4 w-4 mt-1 peer/other" type="checkbox"/>
<div>
<p class="font-bold text-sm text-primary">Other</p>
<p class="text-[11px] text-on-surface-variant leading-snug">Managing a condition not listed above.</p>
</div>
</div>
</label>
<div class="pt-1">
<label class="block text-[9px] font-bold text-on-surface-variant mb-1 uppercase tracking-wider px-1">Specify Condition</label>
<textarea class="w-full rounded-lg border-outline-variant bg-white text-xs focus:border-primary focus:ring-primary/20 p-3 min-h-[60px] placeholder:text-outline-variant/60" placeholder="Type here..."></textarea>
</div>
</div>
</section>
<section class="bg-surface-container-lowest rounded-xl p-4 shadow-sm border border-outline-variant/30">
<h2 class="font-headline text-base mb-3 text-on-surface font-bold">Cycle Description</h2>
<div class="grid grid-cols-3 gap-2">
<label class="cycle-toggle flex flex-col items-center justify-center p-2.5 border border-outline-variant/40 rounded-lg cursor-pointer transition-all gap-1 bg-surface-bright">
<input class="hidden" type="checkbox"/>
<span class="material-symbols-outlined text-lg">waves</span>
<span class="text-[9px] font-bold uppercase">Irregular</span>
</label>
<label class="cycle-toggle flex flex-col items-center justify-center p-2.5 border border-outline-variant/40 rounded-lg cursor-pointer transition-all gap-1 bg-surface-bright">
<input checked="" class="hidden" type="checkbox"/>
<span class="material-symbols-outlined text-lg">opacity</span>
<span class="text-[9px] font-bold uppercase">Heavy</span>
</label>
<label class="cycle-toggle flex flex-col items-center justify-center p-2.5 border border-outline-variant/40 rounded-lg cursor-pointer transition-all gap-1 bg-surface-bright">
<input class="hidden" type="checkbox"/>
<span class="material-symbols-outlined text-lg">water_drop</span>
<span class="text-[9px] font-bold uppercase">Light</span>
</label>
<label class="cycle-toggle flex flex-col items-center justify-center p-2.5 border border-outline-variant/40 rounded-lg cursor-pointer transition-all gap-1 bg-surface-bright">
<input class="hidden" type="checkbox"/>
<span class="material-symbols-outlined text-lg">circle</span>
<span class="text-[9px] font-bold uppercase">Absent</span>
</label>
<label class="cycle-toggle flex flex-col items-center justify-center p-2.5 border border-outline-variant/40 rounded-lg cursor-pointer transition-all gap-1 bg-surface-bright">
<input class="hidden" type="checkbox"/>
<span class="material-symbols-outlined text-lg">calendar_today</span>
<span class="text-[9px] font-bold uppercase">Constant</span>
</label>
<label class="cycle-toggle flex flex-col items-center justify-center p-2.5 border border-outline-variant/40 rounded-lg cursor-pointer transition-all gap-1 bg-surface-bright">
<input class="hidden" type="checkbox"/>
<span class="material-symbols-outlined text-lg">blur_on</span>
<span class="text-[9px] font-bold uppercase">Mixed</span>
</label>
</div>
</section>
<section class="bg-surface-container-lowest rounded-xl p-4 shadow-sm border border-outline-variant/30">
<h2 class="font-headline text-base mb-3 text-on-surface font-bold">Taking for this condition</h2>
<div class="space-y-4">
<div class="space-y-2">
<div class="flex flex-wrap gap-2">
<label class="medication-chip inline-flex items-center px-4 py-1.5 rounded-full border border-outline-variant text-[11px] font-bold cursor-pointer transition-all">
<input checked="" class="hidden" type="checkbox"/>
                            Metformin
                        </label>
</div>
<div class="bg-surface-container-low border border-outline-variant/40 rounded-xl p-3 space-y-2">
<h4 class="text-xs font-bold text-primary mb-1">Metformin Details</h4>
<div class="grid grid-cols-2 gap-2">
<div class="space-y-1">
<label class="block text-[8px] font-bold text-outline-variant uppercase tracking-widest">Dose</label>
<input class="w-full bg-white border border-outline-variant/20 rounded-md text-xs px-2 py-1.5 focus:ring-1 focus:ring-secondary/50" placeholder="e.g. 500mg" type="text" value="500mg"/>
</div>
<div class="space-y-1">
<label class="block text-[8px] font-bold text-outline-variant uppercase tracking-widest">Frequency</label>
<input class="w-full bg-white border border-outline-variant/20 rounded-md text-xs px-2 py-1.5 focus:ring-1 focus:ring-secondary/50" placeholder="e.g. 2x daily" type="text" value="Twice daily"/>
</div>
</div>
</div>
</div>
<div class="flex flex-wrap gap-1.5">
<label class="medication-chip inline-flex items-center px-3 py-1.5 rounded-full border border-outline-variant text-[10px] font-bold cursor-pointer transition-all opacity-70">
<input class="hidden" type="checkbox"/>
                        Birth control
                    </label>
<label class="medication-chip inline-flex items-center px-3 py-1.5 rounded-full border border-outline-variant text-[10px] font-bold cursor-pointer transition-all opacity-70">
<input class="hidden" type="checkbox"/>
                        Spironolactone
                    </label>
<label class="medication-chip inline-flex items-center px-3 py-1.5 rounded-full border border-outline-variant text-[10px] font-bold cursor-pointer transition-all opacity-70">
<input class="hidden" type="checkbox"/>
                        Inositol
                    </label>
<label class="medication-chip inline-flex items-center px-3 py-1.5 rounded-full border border-outline-variant text-[10px] font-bold cursor-pointer transition-all opacity-70">
<input class="hidden" type="checkbox"/>
                        HRT
                    </label>
</div>
</div>
</section>
<section class="bg-surface-container-lowest rounded-xl p-4 shadow-sm border border-outline-variant/30">
<h2 class="font-headline text-base mb-3 text-on-surface font-bold">Key Symptoms</h2>
<div class="grid grid-cols-3 gap-2">
<label class="insight-tile flex flex-col items-center gap-1.5 p-2 border border-outline-variant/20 rounded-lg cursor-pointer transition-all bg-surface-bright">
<input class="hidden" type="checkbox"/>
<span class="material-symbols-outlined text-base text-primary/70">schedule</span>
<span class="text-[9px] font-semibold text-center leading-tight">Cycle Irreg.</span>
</label>
<label class="insight-tile flex flex-col items-center gap-1.5 p-2 border border-outline-variant/20 rounded-lg cursor-pointer transition-all bg-surface-bright">
<input checked="" class="hidden" type="checkbox"/>
<span class="material-symbols-outlined text-base text-primary/70">water_drop</span>
<span class="text-[9px] font-semibold text-center leading-tight">Heavy Flow</span>
</label>
<label class="insight-tile flex flex-col items-center gap-1.5 p-2 border border-outline-variant/20 rounded-lg cursor-pointer transition-all bg-surface-bright">
<input class="hidden" type="checkbox"/>
<span class="material-symbols-outlined text-base text-primary/70">mood</span>
<span class="text-[9px] font-semibold text-center leading-tight">Mood Swings</span>
</label>
<label class="insight-tile flex flex-col items-center gap-1.5 p-2 border border-outline-variant/20 rounded-lg cursor-pointer transition-all bg-surface-bright">
<input class="hidden" type="checkbox"/>
<span class="material-symbols-outlined text-base text-primary/70">face</span>
<span class="text-[9px] font-semibold text-center leading-tight">Hormonal Acne</span>
</label>
<label class="insight-tile flex flex-col items-center gap-1.5 p-2 border border-outline-variant/20 rounded-lg cursor-pointer transition-all bg-surface-bright">
<input class="hidden" type="checkbox"/>
<span class="material-symbols-outlined text-base text-primary/70">content_cut</span>
<span class="text-[9px] font-semibold text-center leading-tight">Hair Growth</span>
</label>
<label class="insight-tile flex flex-col items-center gap-1.5 p-2 border border-outline-variant/20 rounded-lg cursor-pointer transition-all bg-surface-bright">
<input class="hidden" type="checkbox"/>
<span class="material-symbols-outlined text-base text-primary/70">monitor_weight</span>
<span class="text-[9px] font-semibold text-center leading-tight">Weight Shift</span>
</label>
</div>
</section>
<section class="grid grid-cols-2 gap-3">
<div class="bg-surface-container-lowest rounded-xl p-3 border border-outline-variant/30">
<p class="text-[10px] font-bold uppercase text-outline-variant mb-2">Specialist Care?</p>
<div class="flex gap-2">
<label class="flex-1 text-center py-1.5 rounded-md border border-outline-variant/30 text-[11px] font-bold cursor-pointer has-[:checked]:bg-primary has-[:checked]:text-white">
<input checked="" class="hidden" name="spec" type="radio"/> Yes
                    </label>
<label class="flex-1 text-center py-1.5 rounded-md border border-outline-variant/30 text-[11px] font-bold cursor-pointer has-[:checked]:bg-primary has-[:checked]:text-white">
<input class="hidden" name="spec" type="radio"/> No
                    </label>
</div>
</div>
<div class="bg-surface-container-lowest rounded-xl p-3 border border-outline-variant/30">
<p class="text-[10px] font-bold uppercase text-outline-variant mb-2">Conceiving?</p>
<div class="flex gap-2">
<label class="flex-1 text-center py-1.5 rounded-md border border-outline-variant/30 text-[11px] font-bold cursor-pointer has-[:checked]:bg-primary has-[:checked]:text-white">
<input class="hidden" name="con" type="radio"/> Yes
                    </label>
<label class="flex-1 text-center py-1.5 rounded-md border border-outline-variant/30 text-[11px] font-bold cursor-pointer has-[:checked]:bg-primary has-[:checked]:text-white">
<input checked="" class="hidden" name="con" type="radio"/> No
                    </label>
</div>
</div>
</section>
</main>
<footer class="fixed bottom-0 w-full bg-[#F7F5F0]/90 backdrop-blur-md px-5 pt-3 pb-7 border-t border-outline-variant/20">
<button class="w-full py-3.5 bg-primary text-white rounded-xl font-bold text-xs tracking-widest uppercase active:scale-95 transition-transform shadow-lg shadow-primary/20">
            Continue Profile
        </button>
<div class="mt-3 flex items-center justify-center gap-4">
<button class="text-[10px] font-bold text-primary uppercase tracking-widest">Back</button>
<div class="w-px h-2 bg-outline-variant/50"></div>
<button class="text-[10px] font-bold text-outline uppercase tracking-widest">Skip Setup</button>
</div>
</footer>

</body></html>
