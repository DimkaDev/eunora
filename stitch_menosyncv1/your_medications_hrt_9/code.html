<!DOCTYPE html>

<style>
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, .font-serif { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d0c4bc; border-radius: 10px; }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-[#fef8f6] text-on-surface min-h-screen flex flex-col">
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-surface-container">
<div class="flex items-center justify-between px-6 py-3 w-full max-w-screen-xl mx-auto">
<button class="hover:bg-stone-200/50 transition-colors rounded-full p-2 flex items-center justify-center active:scale-95 duration-150 ease-in-out">
<span class="material-symbols-outlined text-stone-700">arrow_back</span>
</button>
<h1 class="font-serif italic text-lg text-stone-800">Medication Setup</h1>
<div class="w-10"></div>
</div>
</header>
<main class="flex-grow pt-20 pb-36 px-5 max-w-md mx-auto w-full">
<div class="mb-6">
<div class="flex items-center justify-between mb-2">
<span class="text-[10px] font-bold uppercase tracking-wider text-stone-400 font-sans">Step 3 of 7</span>
<span class="text-[10px] font-bold text-primary">42% Complete</span>
</div>
<div class="w-full h-1 bg-surface-container rounded-full overflow-hidden">
<div class="bg-primary h-full w-[42%] transition-all duration-700 ease-out"></div>
</div>
</div>
<section class="mb-6 p-4 bg-primary/5 rounded-2xl border border-primary/10">
<div class="flex items-start gap-3">
<div class="p-2 bg-primary/10 rounded-lg shrink-0">
<span class="material-symbols-outlined text-primary text-[20px]">monitor_heart</span>
</div>
<div>
<h3 class="text-[14px] font-bold text-primary mb-1 leading-tight">Your HRT is MenoSync</h3>
<p class="text-[12px] text-stone-600 leading-normal">
                        Tracking your medications daily allows MenoSync to correlate symptom relief with your specific dosage. 
                        <a class="text-primary font-bold hover:underline inline-flex items-center" href="#">Learn More <span class="material-symbols-outlined text-[14px] ml-0.5">open_in_new</span></a>
</p>
</div>
</div>
</section>
<div class="mb-6 space-y-1">
<h2 class="text-[22px] font-serif font-bold text-stone-800 leading-tight">Current Medications</h2>
<p class="text-[13px] text-stone-500 font-body">Log your hormone therapy and other regular medications.</p>
</div>
<form class="bg-white rounded-[24px] p-6 space-y-6 shadow-sm border border-surface-container/50">
<div class="space-y-3">
<label class="block text-[13px] font-bold text-on-surface">Medication Name</label>
<div class="relative">
<input class="w-full bg-[#EEEEEE] border-0 focus:ring-2 focus:ring-primary/50 rounded-xl px-4 py-3 text-[14px] placeholder:text-stone-400 transition-all" placeholder="Search (e.g., Estradiol, Utrogestan)" type="text" value="Est"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-stone-400">search</span>
</div>
<div class="space-y-2">
<div class="flex flex-wrap gap-2 pt-1">
<button class="px-3 py-1.5 bg-secondary-container/60 text-on-secondary-container text-[12px] font-bold rounded-lg border border-secondary-container flex items-center gap-1 hover:bg-secondary-container transition-all" type="button">
<span class="material-symbols-outlined text-[16px]">add</span> Estradiol
                        </button>
<button class="px-3 py-1.5 bg-stone-100 text-stone-600 text-[12px] font-bold rounded-lg border border-stone-200 flex items-center gap-1 hover:bg-stone-200 transition-all" type="button">
<span class="material-symbols-outlined text-[16px]">add</span> Estriol
                        </button>
<button class="px-3 py-1.5 bg-stone-100 text-stone-600 text-[12px] font-bold rounded-lg border border-stone-200 flex items-center gap-1 hover:bg-stone-200 transition-all" type="button">
<span class="material-symbols-outlined text-[16px]">add</span> Estring
                        </button>
</div>
<button class="text-[11px] font-bold text-primary flex items-center gap-1 opacity-80 hover:opacity-100" type="button">
                        See all 12 results <span class="material-symbols-outlined text-[14px]">chevron_right</span>
</button>
</div>
</div>
<div class="space-y-3">
<label class="block text-[13px] font-bold text-on-surface">How do you take it?</label>
<div class="grid grid-cols-2 gap-2">
<label class="relative cursor-pointer">
<input checked="" class="sr-only peer" name="method" type="radio"/>
<div class="flex items-center p-3 rounded-xl border border-stone-100 bg-stone-50/50 peer-checked:border-primary peer-checked:bg-primary/5 transition-all h-full">
<span class="material-symbols-outlined text-primary/70 mr-2 text-[18px]">rectangle</span>
<span class="text-[13px] font-medium text-stone-700">Patch</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="sr-only peer" name="method" type="radio"/>
<div class="flex items-center p-3 rounded-xl border border-stone-100 bg-stone-50/50 peer-checked:border-primary peer-checked:bg-primary/5 transition-all h-full">
<span class="material-symbols-outlined text-primary/70 mr-2 text-[18px]">pill</span>
<span class="text-[13px] font-medium text-stone-700">Tablet</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="sr-only peer" name="method" type="radio"/>
<div class="flex items-center p-3 rounded-xl border border-stone-100 bg-stone-50/50 peer-checked:border-primary peer-checked:bg-primary/5 transition-all h-full">
<span class="material-symbols-outlined text-primary/70 mr-2 text-[18px]">clean_hands</span>
<span class="text-[13px] font-medium text-stone-700">Gel/Cream</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="sr-only peer" name="method" type="radio"/>
<div class="flex items-center p-3 rounded-xl border border-stone-100 bg-stone-50/50 peer-checked:border-primary peer-checked:bg-primary/5 transition-all h-full">
<span class="material-symbols-outlined text-primary/70 mr-2 text-[18px]">more_horiz</span>
<span class="text-[13px] font-medium text-stone-700">Other</span>
</div>
</label>
</div>
</div>
<div class="flex gap-4">
<div class="flex-1 space-y-2">
<label class="block text-[13px] font-bold text-on-surface">Dose</label>
<div class="flex">
<input class="w-16 bg-[#EEEEEE] border-0 border-r border-stone-300 rounded-l-xl px-3 py-3 text-[14px] focus:ring-0" type="number" value="50"/>
<select class="flex-grow bg-[#EEEEEE] border-0 rounded-r-xl px-2 py-3 text-[13px] focus:ring-0 appearance-none">
<option>mcg</option>
<option>mg</option>
<option>pump</option>
</select>
</div>
</div>
<div class="flex-1 space-y-2">
<label class="block text-[13px] font-bold text-on-surface">Frequency</label>
<select class="w-full bg-[#EEEEEE] border-0 rounded-xl px-3 py-3 text-[13px] focus:ring-2 focus:ring-primary/50">
<option>Daily</option>
<option selected="">Twice weekly</option>
<option>Weekly</option>
<option>As needed</option>
</select>
</div>
</div>
<div class="space-y-2">
<label class="block text-[13px] font-bold text-on-surface flex justify-between">
                    Notes <span class="text-stone-400 font-normal italic">Optional</span>
</label>
<textarea class="w-full bg-[#EEEEEE] border-0 focus:ring-2 focus:ring-primary/50 rounded-xl px-4 py-3 text-[13px] resize-none" placeholder="Any details for your doctor..." rows="1"></textarea>
</div>
<button class="w-full flex items-center justify-center gap-2 py-3 border-2 border-dashed border-stone-200 text-stone-500 font-bold text-[13px] rounded-xl hover:bg-stone-50 hover:border-primary/20 hover:text-primary transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
                Add Another Medication
            </button>
</form>
<div class="mt-8 flex justify-center">
<div class="w-24 h-24 rounded-full overflow-hidden opacity-60">
<img alt="wellness" class="w-full h-full object-cover grayscale" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtWL4AykE8V9JCMtemWAbCNllXKTcSNg47QWMheLDHZ4Ap-vOtx3kAoKkAEIW9e5eeJVq2M4H774lhoFEIUvzo8z29ooU7l-cU6_ERBR3YPD3up-RlLb-b1ZV3X0CWGr3cGgJNpA5rKOPdgolcmOL7ZQb_FirKRLorCvY-4U2ryEGjwy-dVQ_8MacoVKwN5OIFy7RH37kiEL36gpWiJQlt1t8-VR_F_AR4kIhuEratpyuGuDTdhtqb6ZxdpFyeKx9-OiY75fMyL6c"/>
</div>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md px-6 pt-4 pb-8 z-50 border-t border-surface-container">
<div class="max-w-md mx-auto space-y-3">
<button class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
                Continue
            </button>
<button class="w-full text-center text-[13px] font-bold text-stone-400 hover:text-primary transition-colors">
                Skip for now
            </button>
</div>
</footer>

</body></html>
