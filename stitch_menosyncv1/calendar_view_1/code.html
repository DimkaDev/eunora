<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Daily Snapshot</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-error": "#ffffff",
                      "primary-fixed": "#f2dfd0",
                      "surface-container": "#f2edea",
                      "surface": "#fef8f6",
                      "surface-tint": "#6a5c50",
                      "secondary-fixed": "#edddf5",
                      "background": "#fef8f6",
                      "on-primary-container": "#fffbff",
                      "surface-bright": "#fef8f6",
                      "tertiary-fixed-dim": "#f9b7a9",
                      "inverse-on-surface": "#f5f0ed",
                      "error-container": "#ffdad6",
                      "on-secondary-fixed": "#211828",
                      "surface-dim": "#ded9d7",
                      "secondary-fixed-dim": "#d0c1d8",
                      "tertiary-fixed": "#ffdad3",
                      "on-tertiary-container": "#fffbff",
                      "primary": "#67594e",
                      "surface-container-highest": "#e7e1df",
                      "on-surface-variant": "#4d453f",
                      "on-surface": "#1d1b1a",
                      "on-background": "#1d1b1a",
                      "surface-container-lowest": "#ffffff",
                      "secondary-container": "#edddf5",
                      "tertiary-container": "#9d675c",
                      "outline": "#7f756e",
                      "on-secondary": "#ffffff",
                      "on-primary": "#ffffff",
                      "surface-variant": "#e7e1df",
                      "surface-container-high": "#ede7e5",
                      "primary-fixed-dim": "#d6c3b5",
                      "on-primary-fixed": "#231a11",
                      "secondary": "#655a6e",
                      "primary-container": "#817266",
                      "on-primary-fixed-variant": "#51443a",
                      "error": "#ba1a1a",
                      "on-secondary-container": "#6c6074",
                      "inverse-surface": "#32302f",
                      "inverse-primary": "#d6c3b5",
                      "outline-variant": "#d0c4bc",
                      "tertiary": "#814f45",
                      "on-secondary-fixed-variant": "#4d4355",
                      "surface-container-low": "#f8f2f0",
                      "on-tertiary-fixed-variant": "#683a31",
                      "on-tertiary-fixed": "#341009",
                      "on-tertiary": "#ffffff",
                      "on-error-container": "#93000a"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "2xl": "1rem",
                      "3xl": "1.5rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Noto Serif"],
                      "body": ["Manrope"],
                      "label": ["Manrope"]
              }
            },
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Manrope', sans-serif; }
        .font-noto-serif { font-family: 'Noto Serif', serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface selection:bg-secondary-fixed antialiased min-h-screen">
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md">
<div class="flex justify-between items-center px-6 h-16 w-full max-w-screen-xl mx-auto">
<button class="text-[#9B8B7E] hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<h1 class="font-noto-serif text-xl font-bold tracking-tight text-[#1d1b1a]">March 2025</h1>
<button class="text-[#9B8B7E] hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</header>
<main class="pt-16 pb-32">
<div class="bg-surface sticky top-16 z-40 border-b border-surface-container-high/50 pb-4">
<div class="flex overflow-x-auto hide-scrollbar px-6 gap-3 py-2">
<button class="flex-shrink-0 w-14 flex flex-col items-center py-3 rounded-2xl bg-surface-container-lowest border border-transparent">
<span class="text-[10px] font-bold text-stone-400 uppercase mb-1">Mon</span>
<span class="text-sm font-bold">10</span>
<div class="w-1 h-1 rounded-full bg-tertiary-fixed mt-1"></div>
</button>
<button class="flex-shrink-0 w-14 flex flex-col items-center py-3 rounded-2xl bg-surface-container-lowest border border-transparent">
<span class="text-[10px] font-bold text-stone-400 uppercase mb-1">Tue</span>
<span class="text-sm font-bold">11</span>
</button>
<button class="flex-shrink-0 w-14 flex flex-col items-center py-3 rounded-2xl bg-primary shadow-lg shadow-primary/20">
<span class="text-[10px] font-bold text-white/70 uppercase mb-1">Wed</span>
<span class="text-sm font-extrabold text-white">12</span>
<div class="w-1.5 h-1.5 rounded-full bg-tertiary-fixed mt-1"></div>
<div class="w-4 h-0.5 rounded-full bg-white/40 mt-1"></div>
</button>
<button class="flex-shrink-0 w-14 flex flex-col items-center py-3 rounded-2xl bg-surface-container-lowest border border-transparent">
<span class="text-[10px] font-bold text-stone-400 uppercase mb-1">Thu</span>
<span class="text-sm font-bold">13</span>
</button>
<button class="flex-shrink-0 w-14 flex flex-col items-center py-3 rounded-2xl bg-surface-container-lowest border border-transparent">
<span class="text-[10px] font-bold text-stone-400 uppercase mb-1">Fri</span>
<span class="text-sm font-bold">14</span>
<div class="w-1 h-1 rounded-full bg-tertiary-fixed mt-1"></div>
</button>
<button class="flex-shrink-0 w-14 flex flex-col items-center py-3 rounded-2xl bg-surface-container-lowest border-2 border-primary-fixed relative">
<div class="absolute -top-1 -right-1 w-2 h-2 bg-primary rounded-full"></div>
<span class="text-[10px] font-bold text-stone-400 uppercase mb-1">Sat</span>
<span class="text-sm font-bold">15</span>
<span class="material-symbols-outlined text-[10px] text-amber-500 mt-1" style="font-variation-settings: 'FILL' 1;">bolt</span>
</button>
<button class="flex-shrink-0 w-14 flex flex-col items-center py-3 rounded-2xl bg-surface-container-lowest border border-transparent">
<span class="text-[10px] font-bold text-stone-400 uppercase mb-1">Sun</span>
<span class="text-sm font-bold">16</span>
</button>
<button class="flex-shrink-0 w-14 flex flex-col items-center py-3 rounded-2xl bg-surface-container-lowest border border-transparent">
<span class="text-[10px] font-bold text-stone-400 uppercase mb-1">Mon</span>
<span class="text-sm font-bold">17</span>
</button>
</div>
</div>
<div class="px-6 py-6 space-y-8">
<div class="flex justify-between items-end">
<div>
<span class="text-primary font-bold text-xs uppercase tracking-widest">Selected Log</span>
<h2 class="font-noto-serif text-3xl font-bold text-on-surface mt-1">Wednesday, 12 March</h2>
</div>
<button class="bg-secondary-container p-2 rounded-xl text-secondary hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined block">share</span>
</button>
</div>
<section class="space-y-4">
<div class="flex items-center justify-between">
<h3 class="font-bold text-sm text-stone-500 uppercase tracking-wider">HRT Intake</h3>
<span class="text-[10px] text-teal-600 font-bold bg-teal-50 px-2 py-0.5 rounded-full">Dose Confirmed</span>
</div>
<div class="grid grid-cols-2 gap-3">
<div class="flex items-center gap-3 bg-surface-container-lowest p-4 rounded-2xl border border-teal-100 shadow-sm">
<div class="w-10 h-10 rounded-full bg-teal-50 flex items-center justify-center text-teal-600">
<span class="material-symbols-outlined">medication</span>
</div>
<div>
<p class="text-xs font-bold text-stone-400">Estradiol</p>
<p class="text-sm font-bold text-on-surface">Taken at 8:15 AM</p>
</div>
<span class="material-symbols-outlined ml-auto text-teal-500">check_circle</span>
</div>
<div class="flex items-center gap-3 bg-surface-container-lowest p-4 rounded-2xl border border-teal-100 shadow-sm">
<div class="w-10 h-10 rounded-full bg-teal-50 flex items-center justify-center text-teal-600">
<span class="material-symbols-outlined">pill</span>
</div>
<div>
<p class="text-xs font-bold text-stone-400">Utrogestan</p>
<p class="text-sm font-bold text-on-surface">Taken at 9:00 PM</p>
</div>
<span class="material-symbols-outlined ml-auto text-teal-500">check_circle</span>
</div>
</div>
</section>
<section class="space-y-4">
<div class="flex items-center justify-between">
<h3 class="font-bold text-sm text-stone-500 uppercase tracking-wider">Symptoms Intensity</h3>
<button class="text-primary font-bold text-xs">+ Add New</button>
</div>
<div class="space-y-3">
<div class="bg-surface-container-lowest p-4 rounded-2xl border border-stone-100 space-y-3">
<div class="flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-xl">thermostat</span>
<span class="text-sm font-bold">Hot Flashes</span>
</div>
<span class="text-xs font-bold text-secondary bg-secondary-container px-2 py-0.5 rounded-full">3 / 5</span>
</div>
<input class="w-full h-1.5 bg-stone-100 rounded-lg appearance-none cursor-pointer accent-secondary" max="5" min="0" type="range" value="3"/>
</div>
<div class="bg-surface-container-lowest p-4 rounded-2xl border border-stone-100 space-y-3">
<div class="flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-xl">bedtime</span>
<span class="text-sm font-bold">Sleep Quality</span>
</div>
<span class="text-xs font-bold text-secondary bg-secondary-container px-2 py-0.5 rounded-full">2 / 5</span>
</div>
<input class="w-full h-1.5 bg-stone-100 rounded-lg appearance-none cursor-pointer accent-secondary" max="5" min="0" type="range" value="2"/>
</div>
</div>
</section>
<section class="grid grid-cols-1 gap-6">
<div class="space-y-4">
<h3 class="font-bold text-sm text-stone-500 uppercase tracking-wider">Daily Triggers</h3>
<div class="flex flex-wrap gap-2">
<button class="bg-tertiary-fixed/40 px-4 py-2 rounded-2xl flex items-center gap-2 border border-tertiary-fixed text-on-tertiary-fixed-variant">
<span class="text-sm">🍷 Alcohol</span>
<span class="material-symbols-outlined text-sm">close</span>
</button>
<button class="bg-tertiary-fixed/40 px-4 py-2 rounded-2xl flex items-center gap-2 border border-tertiary-fixed text-on-tertiary-fixed-variant">
<span class="text-sm">😰 Stress</span>
<span class="material-symbols-outlined text-sm">close</span>
</button>
<button class="bg-stone-100 px-4 py-2 rounded-2xl flex items-center gap-2 border border-stone-200 text-stone-500 border-dashed">
<span class="text-sm">+ Trigger</span>
</button>
</div>
</div>
<div class="space-y-4">
<h3 class="font-bold text-sm text-stone-500 uppercase tracking-wider">Quick Note</h3>
<textarea class="w-full bg-surface-container-lowest border border-stone-100 rounded-2xl p-4 text-sm font-noto-serif italic text-stone-600 focus:ring-primary-fixed focus:border-primary-fixed" placeholder="How are you feeling today?" rows="3">Had a work presentation today, felt a bit more anxious than usual in the morning.</textarea>
</div>
</section>
<div class="pt-4">
<button class="w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
                Save Snapshot
                <span class="material-symbols-outlined">check</span>
</button>
</div>
</div>
</main>
<nav class="fixed bottom-0 left-0 w-full px-8 pb-8 pt-4 flex justify-around items-center bg-surface/90 backdrop-blur-xl z-50 border-t border-stone-200/30">
<button class="flex flex-col items-center justify-center bg-secondary-container/50 text-secondary rounded-2xl px-5 py-2 active:scale-90 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">today</span>
<span class="text-[10px] font-bold uppercase tracking-wider mt-1">Today</span>
</button>
<button class="flex flex-col items-center justify-center text-stone-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">calendar_month</span>
<span class="text-[10px] font-bold uppercase tracking-wider mt-1">Calendar</span>
</button>
<button class="flex flex-col items-center justify-center text-stone-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">analytics</span>
<span class="text-[10px] font-bold uppercase tracking-wider mt-1">Insights</span>
</button>
<button class="flex flex-col items-center justify-center text-stone-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">auto_stories</span>
<span class="text-[10px] font-bold uppercase tracking-wider mt-1">Journal</span>
</button>
</nav>

</body></html>
