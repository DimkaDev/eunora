<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Verify Your Email</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed-dim": "#d0c1d8",
                      "on-error": "#ffffff",
                      "tertiary-container": "#9d675c",
                      "on-tertiary": "#ffffff",
                      "tertiary": "#814f45",
                      "outline": "#7f756e",
                      "error": "#ba1a1a",
                      "primary-fixed": "#f2dfd0",
                      "on-primary": "#ffffff",
                      "on-surface-variant": "#4d453f",
                      "inverse-surface": "#32302f",
                      "inverse-primary": "#d6c3b5",
                      "outline-variant": "#d0c4bc",
                      "primary-fixed-dim": "#d6c3b5",
                      "surface-tint": "#6a5c50",
                      "tertiary-fixed": "#ffdad3",
                      "surface-bright": "#fef8f6",
                      "on-tertiary-fixed-variant": "#683a31",
                      "on-primary-container": "#fffbff",
                      "surface": "#fef8f6",
                      "on-secondary-container": "#6c6074",
                      "surface-container-low": "#f8f2f0",
                      "inverse-on-surface": "#f5f0ed",
                      "surface-variant": "#e7e1df",
                      "on-secondary": "#ffffff",
                      "on-background": "#1d1b1a",
                      "background": "#fef8f6",
                      "secondary-container": "#edddf5",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed": "#211828",
                      "on-tertiary-container": "#fffbff",
                      "on-surface": "#1d1b1a",
                      "surface-container-highest": "#e7e1df",
                      "surface-container-high": "#ede7e5",
                      "on-secondary-fixed-variant": "#4d4355",
                      "surface-dim": "#ded9d7",
                      "surface-container": "#f2edea",
                      "secondary": "#655a6e",
                      "tertiary-fixed-dim": "#f9b7a9",
                      "on-primary-fixed": "#231a11",
                      "primary": "#67594e",
                      "on-primary-fixed-variant": "#51443a",
                      "error-container": "#ffdad6",
                      "secondary-fixed": "#edddf5",
                      "on-error-container": "#93000a",
                      "on-tertiary-fixed": "#341009",
                      "primary-container": "#817266"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Noto Serif"],
                      "body": ["Manrope"],
                      "label": ["Manrope"]
              }
            },
          },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-cream { background-color: #fef8f6; }
        #step-1 {
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #step-2 {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }#flow-trigger:checked ~ main #step-1 {
            margin-top: 0;
        }
        #flow-trigger:checked ~ main #enter-code-cta {
            display: none;
        }
        #flow-trigger:checked ~ main #step-2 {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        #resend-trigger:checked ~ #timer-container {
            display: block;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased overflow-x-hidden">
<input class="hidden peer" id="flow-trigger" type="checkbox"/>
<input class="hidden" id="resend-trigger" type="checkbox"/>
<header class="w-full top-0 sticky bg-surface/80 backdrop-blur-md flex items-center justify-between px-6 py-4 w-full z-20">
<div class="flex items-center gap-4">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-headline italic text-2xl text-primary">MenoSync</span>
</div>
</header>
<main class="min-h-[calc(100vh-72px)] flex flex-col items-center justify-center px-6 relative z-10">
<div class="w-full max-w-[340px] flex flex-col items-center">
<section class="flex flex-col items-center text-center gap-6 w-full mb-8" id="step-1">
<div class="w-20 h-20 rounded-full bg-surface-container flex items-center justify-center text-primary shadow-inner">
<span class="material-symbols-outlined text-[48px]">mail</span>
</div>
<div class="space-y-3">
<h1 class="font-headline text-[26px] font-semibold text-on-surface leading-tight">Verify Your Email</h1>
<p class="text-[14px] text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                        We sent a verification code to <br/>
<span class="font-semibold text-primary underline decoration-primary/20">sarah@email.com</span>
</p>
</div>
<label class="w-full py-5 mt-4 bg-gradient-to-r from-primary to-primary-container text-white rounded-2xl font-bold text-[16px] shadow-lg shadow-primary/20 hover:shadow-xl active:scale-[0.98] transition-all duration-300 cursor-pointer flex items-center justify-center gap-2" for="flow-trigger" id="enter-code-cta">
                    Enter My Code
                    <span class="material-symbols-outlined">keyboard_arrow_right</span>
</label>
</section>
<section class="w-full space-y-8" id="step-2">
<div class="space-y-4">
<label class="block text-[13px] font-bold text-on-surface-variant px-1 text-center" for="verification-code">
                        Enter verification code
                    </label>
<div class="relative">
<input class="w-full h-16 bg-surface-container-high border-2 border-outline-variant rounded-2xl text-center font-mono text-3xl tracking-[0.5em] text-on-surface placeholder:text-outline-variant/30 focus:outline-none focus:ring-4 focus:ring-secondary-container focus:border-secondary transition-all duration-300 shadow-sm" id="verification-code" maxlength="6" placeholder="000000" type="text"/>
</div>
<div class="flex items-center justify-center gap-2 text-on-surface-variant/70">
<span class="material-symbols-outlined text-sm">info</span>
<p class="text-[12px]">Check your email (spam folder too)</p>
</div>
</div>
<button class="w-full py-4 bg-primary text-white rounded-2xl font-bold text-[15px] shadow-md hover:opacity-95 active:scale-[0.98] transition-all duration-200">
                    Verify Email
                </button>
<div class="flex flex-col items-center gap-6 pt-4 border-t border-outline-variant/30">
<div class="flex flex-col items-center gap-4 w-full">
<p class="text-[13px] text-on-surface-variant/80">Didn't receive the code?</p>
<label class="text-center w-full py-3 bg-surface border-2 border-primary/40 text-primary rounded-xl font-bold text-[14px] hover:bg-surface-container-low transition-colors active:scale-[0.98] cursor-pointer" for="resend-trigger">
                            Resend Code
                        </label>
<div class="hidden" id="timer-container">
<p class="text-[12px] text-on-surface-variant/60 font-medium animate-pulse">
                                Resend in <span class="text-primary font-bold">45s</span>
</p>
</div>
</div>
<a class="block text-center text-[12px] text-on-surface-variant/70 font-semibold underline underline-offset-4 decoration-outline/30 hover:text-primary transition-colors py-2" href="#">
                        Use a different email
                    </a>
</div>
</section>
</div>
</main>
<div class="fixed top-[20%] -right-12 w-64 h-64 bg-secondary-container/10 rounded-full blur-[100px] pointer-events-none -z-0"></div>
<div class="fixed bottom-[10%] -left-12 w-80 h-80 bg-tertiary-fixed/10 rounded-full blur-[100px] pointer-events-none -z-0"></div>

</body></html>
