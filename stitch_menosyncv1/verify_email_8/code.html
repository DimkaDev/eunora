<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Verify Your Email</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#d0c1d8",
                        "on-error": "#ffffff",
                        "tertiary-container": "#9d675c",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#814f45",
                        "outline": "#7f756e",
                        "error": "#ba1a1a",
                        "primary-fixed": "#f2dfd0",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#4d453f",
                        "inverse-surface": "#32302f",
                        "inverse-primary": "#d6c3b5",
                        "outline-variant": "#d0c4bc",
                        "primary-fixed-dim": "#d6c3b5",
                        "surface-tint": "#6a5c50",
                        "tertiary-fixed": "#ffdad3",
                        "surface-bright": "#fef8f6",
                        "on-tertiary-fixed-variant": "#683a31",
                        "on-primary-container": "#fffbff",
                        "surface": "#fef8f6",
                        "on-secondary-container": "#6c6074",
                        "surface-container-low": "#f8f2f0",
                        "inverse-on-surface": "#f5f0ed",
                        "surface-variant": "#e7e1df",
                        "on-secondary": "#ffffff",
                        "on-background": "#1d1b1a",
                        "background": "#fef8f6",
                        "secondary-container": "#edddf5",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#211828",
                        "on-tertiary-container": "#fffbff",
                        "on-surface": "#1d1b1a",
                        "surface-container-highest": "#e7e1df",
                        "surface-container-high": "#ede7e5",
                        "on-secondary-fixed-variant": "#4d4355",
                        "surface-dim": "#ded9d7",
                        "surface-container": "#f2edea",
                        "secondary": "#655a6e",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "on-primary-fixed": "#231a11",
                        "primary": "#67594e",
                        "on-primary-fixed-variant": "#51443a",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#edddf5",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#341009",
                        "primary-container": "#817266"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            min-height: 100dvh;
            overflow: hidden;
        }
        .main-container {
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }#tab-help:checked ~ .content-slider {
            transform: translateY(-50%);
        }
        #tab-verify:checked ~ .content-slider {
            transform: translateY(0%);
        }
        .tab-indicator {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #tab-verify:checked ~ .tab-nav .indicator-verify {
            background-color: #67594e;
            color: white;
        }
        #tab-help:checked ~ .tab-nav .indicator-help {
            background-color: #67594e;
            color: white;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased">
<div class="main-container relative">
<header class="w-full bg-surface flex items-center justify-between px-6 py-4 z-20">
<div class="flex items-center gap-4">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-headline italic text-2xl text-primary">MenoSync</span>
</div>
</header>
<div class="flex-1 relative overflow-hidden">
<input checked="" class="hidden" id="tab-verify" name="view-toggle" type="radio"/>
<input class="hidden" id="tab-help" name="view-toggle" type="radio"/>
<div class="tab-nav absolute top-0 left-0 w-full flex px-6 gap-2 z-20">
<label class="indicator-verify flex-1 text-center py-2 text-[12px] font-bold uppercase tracking-widest rounded-full border border-primary/20 text-primary/60 cursor-pointer transition-all duration-300" for="tab-verify">
                Verification
            </label>
<label class="indicator-help flex-1 text-center py-2 text-[12px] font-bold uppercase tracking-widest rounded-full border border-primary/20 text-primary/60 cursor-pointer transition-all duration-300" for="tab-help">
                Get Help
            </label>
</div>
<div class="content-slider h-[200%] transition-transform duration-500 ease-out flex flex-col">
<section class="h-1/2 w-full flex flex-col items-center pt-16 px-6 gap-10">
<div class="flex flex-col items-center text-center gap-6">
<div class="w-20 h-20 rounded-full bg-surface-container flex items-center justify-center text-primary shadow-inner">
<span class="material-symbols-outlined text-[40px]">mail</span>
</div>
<div class="space-y-2">
<h1 class="font-headline text-[22px] font-semibold text-on-surface">Verify Your Email</h1>
<p class="text-[13px] text-on-surface-variant">
                            We sent a verification code to <span class="font-semibold text-primary">sarah@email.com</span>
</p>
</div>
</div>
<div class="w-full max-w-[340px] space-y-8">
<div class="space-y-4">
<label class="block text-[13px] font-bold text-on-surface-variant text-center" for="verification-code">
                            Enter verification code
                        </label>
<input class="w-full h-16 bg-surface-container-high border-2 border-outline-variant rounded-xl text-center font-mono text-3xl tracking-[0.4em] text-on-surface focus:ring-4 focus:ring-secondary-container focus:border-secondary transition-all" id="verification-code" maxlength="6" placeholder="000000" type="text"/>
<div class="flex items-center justify-center gap-2 text-on-surface-variant/70">
<span class="material-symbols-outlined text-sm">info</span>
<p class="text-[12px]">Check your email (spam folder too)</p>
</div>
</div>
<button class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-white rounded-xl font-bold text-[15px] shadow-lg active:scale-[0.98] transition-all">
                        Verify Email
                    </button>
</div>
<label class="mt-auto mb-8 flex flex-col items-center gap-2 text-on-surface-variant/40 animate-pulse cursor-pointer" for="tab-help">
<p class="text-[10px] font-bold uppercase tracking-[0.2em]">Help Options</p>
<span class="material-symbols-outlined">expand_more</span>
</label>
</section>
<section class="h-1/2 w-full bg-surface-container-low flex flex-col items-center pt-16 px-6">
<label class="mb-12 flex flex-col items-center gap-2 text-primary cursor-pointer" for="tab-verify">
<span class="material-symbols-outlined">expand_less</span>
<p class="text-[10px] font-bold uppercase tracking-[0.2em]">Back to Input</p>
</label>
<div class="w-full max-w-[340px] space-y-12">
<div class="flex flex-col items-center gap-6">
<div class="text-center space-y-2">
<p class="text-[15px] text-on-surface font-semibold">Didn't receive the code?</p>
<p class="text-[13px] text-on-surface-variant">Wait a moment before requesting a new one.</p>
</div>
<div class="w-full space-y-4">
<button class="w-full py-4 bg-surface border-2 border-primary text-primary rounded-xl font-bold text-[14px] hover:bg-surface-container transition-colors shadow-sm">
                                Resend Code
                            </button>
<div class="flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm text-primary">schedule</span>
<p class="text-[12px] text-on-surface-variant/60 font-medium">
                                    Resend in <span class="text-primary font-bold">45s</span>
</p>
</div>
</div>
</div>
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-surface-container-low px-2 text-on-surface-variant/50">or</span>
</div>
</div>
<div class="text-center">
<a class="inline-block text-[13px] text-primary font-semibold underline underline-offset-4 decoration-primary/30 hover:text-primary-container transition-colors" href="#">
                            Use a different email
                        </a>
</div>
</div>
</section>
</div>
</div>
</div>
<div class="fixed top-[20%] -right-12 w-48 h-48 bg-secondary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed bottom-[10%] -left-12 w-64 h-64 bg-tertiary-fixed/10 rounded-full blur-3xl pointer-events-none"></div>

</body></html>
