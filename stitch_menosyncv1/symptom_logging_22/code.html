<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Guided Journaling</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed-variant": "#683a31",
              "on-primary-fixed-variant": "#51443a",
              "on-error-container": "#93000a",
              "surface-container-low": "#f8f2f0",
              "background": "#fef8f6",
              "surface-tint": "#6a5c50",
              "outline-variant": "#d0c4bc",
              "on-surface": "#1d1b1a",
              "tertiary-fixed": "#ffdad3",
              "secondary-container": "#edddf5",
              "on-secondary-container": "#6c6074",
              "on-error": "#ffffff",
              "surface-container-highest": "#e7e1df",
              "inverse-on-surface": "#f5f0ed",
              "surface-container-high": "#ede7e5",
              "primary-container": "#817266",
              "secondary": "#655a6e",
              "primary-fixed": "#f2dfd0",
              "on-secondary-fixed-variant": "#4d4355",
              "secondary-fixed-dim": "#d0c1d8",
              "primary": "#67594e",
              "on-primary-container": "#fffbff",
              "on-tertiary": "#ffffff",
              "surface-dim": "#ded9d7",
              "error-container": "#ffdad6",
              "on-tertiary-container": "#fffbff",
              "tertiary": "#814f45",
              "inverse-surface": "#32302f",
              "on-secondary-fixed": "#211828",
              "on-background": "#1d1b1a",
              "on-primary-fixed": "#231a11",
              "secondary-fixed": "#edddf5",
              "on-surface-variant": "#4d453f",
              "surface-variant": "#e7e1df",
              "inverse-primary": "#d6c3b5",
              "surface-container-lowest": "#ffffff",
              "on-tertiary-fixed": "#341009",
              "surface-container": "#f2edea",
              "tertiary-container": "#9d675c",
              "outline": "#7f756e",
              "on-secondary": "#ffffff",
              "tertiary-fixed-dim": "#f9b7a9",
              "surface-bright": "#fef8f6",
              "primary-fixed-dim": "#d6c3b5",
              "error": "#ba1a1a",
              "on-primary": "#ffffff",
              "surface": "#fef8f6"
            },
            fontFamily: {
              "headline": ["Noto Serif"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
          },
        },
      }
    </script>
<style type="text/tailwindcss">
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .gradient-track {
        background: linear-gradient(90deg, #ffdad3 0%, #9B8B7E 100%);
      }
      .step-page {
        @apply min-h-[calc(100vh-140px)] flex flex-col justify-start w-full px-6 py-8;
      }
      .abstract-icon-bg {
        @apply relative flex items-center justify-center w-16 h-16 rounded-3xl overflow-hidden mb-4;
      }
      .symptom-card {
        @apply relative bg-white p-6 rounded-3xl shadow-sm border border-outline-variant/10 flex flex-col items-center justify-center text-center transition-all active:scale-95;
      }
      .symptom-card.selected {
        @apply border-2 border-primary ring-4 ring-primary/5;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen">
<nav class="w-full sticky top-0 z-50 bg-surface/90 backdrop-blur-md flex items-center justify-between px-6 py-4">
<div class="flex items-center gap-4">
<button class="text-[#9B8B7E] flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col">
<h1 class="font-headline text-xl font-bold tracking-tight text-on-surface leading-tight">Log Your Symptoms</h1>
<span class="text-[11px] font-medium text-outline uppercase tracking-[0.1em]">Today, 10:45 AM</span>
</div>
</div>
<div class="flex items-center gap-2">
<div class="h-1.5 w-16 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/5"></div>
</div>
<span class="material-symbols-outlined text-[#9B8B7E] text-xl">info</span>
</div>
</nav>
<main class="max-w-xl mx-auto">
<section class="step-page">
<div class="mb-10 text-center">
<h2 class="text-on-surface font-headline text-2xl font-bold mb-2">Select Symptoms</h2>
<p class="text-outline text-sm">Choose all that apply today</p>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="symptom-card selected">
<div class="abstract-icon-bg bg-tertiary-fixed/30">
<span class="material-symbols-outlined text-tertiary text-3xl" style="font-variation-settings: 'FILL' 1">thermometer</span>
<div class="absolute -top-1 -right-1 w-6 h-6 bg-primary rounded-full border-2 border-white flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[14px]" style="font-variation-settings: 'wght' 700">check</span>
</div>
</div>
<span class="text-sm font-bold text-on-surface">Hot Flashes</span>
</div>
<div class="symptom-card">
<div class="abstract-icon-bg bg-secondary-container">
<span class="material-symbols-outlined text-secondary text-3xl">sentiment_satisfied</span>
</div>
<span class="text-sm font-bold text-on-surface">Mood Changes</span>
</div>
<div class="symptom-card">
<div class="abstract-icon-bg bg-[#D8C9E0]/40">
<span class="material-symbols-outlined text-[#655a6e] text-3xl">bedtime</span>
</div>
<span class="text-sm font-bold text-on-surface text-center">Sleep Disturbs</span>
</div>
<div class="symptom-card">
<div class="abstract-icon-bg bg-tertiary-fixed-dim/30">
<span class="material-symbols-outlined text-tertiary-container text-3xl">water_drop</span>
</div>
<span class="text-sm font-bold text-on-surface">Dryness</span>
</div>
<div class="symptom-card">
<div class="abstract-icon-bg bg-primary-fixed/50">
<span class="material-symbols-outlined text-primary text-3xl">fitness_center</span>
</div>
<span class="text-sm font-bold text-on-surface">Joint Pain</span>
</div>
<div class="symptom-card">
<div class="abstract-icon-bg bg-surface-container-high">
<span class="material-symbols-outlined text-outline text-3xl">psychology</span>
</div>
<span class="text-sm font-bold text-on-surface">Brain Fog</span>
</div>
</div>
<button class="mt-8 py-4 border-2 border-dashed border-outline-variant/40 rounded-3xl text-sm font-semibold text-outline flex items-center justify-center gap-2 w-full">
<span class="material-symbols-outlined text-lg">add</span> Add Other Symptom
            </button>
</section>
</main>
<footer class="fixed bottom-0 w-full bg-surface/80 backdrop-blur-xl border-t border-outline-variant/10 px-6 pt-6 pb-10 max-w-xl left-1/2 -translate-x-1/2 z-50">
<div class="flex flex-col items-center gap-4">
<div class="flex items-center gap-2 opacity-60">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span class="text-[10px] font-bold text-outline tracking-widest uppercase">This data is private and encrypted</span>
</div>
<button class="w-full bg-primary text-white font-bold py-5 rounded-2xl text-sm shadow-xl shadow-primary/10 active:scale-95 transition-all">
                Save &amp; Continue
            </button>
</div>
</footer>
<style>
        body {
            overscroll-behavior-y: none;
        }
        main {
            padding-bottom: 160px;}
    </style>

</body></html>
