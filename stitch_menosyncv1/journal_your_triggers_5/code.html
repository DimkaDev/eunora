<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#817266",
                    "error": "#ba1a1a",
                    "on-error": "#ffffff",
                    "inverse-surface": "#32302f",
                    "error-container": "#ffdad6",
                    "surface-container-low": "#f8f2f0",
                    "surface-container-highest": "#e7e1df",
                    "surface-container": "#f2edea",
                    "on-primary-fixed": "#231a11",
                    "secondary-fixed": "#edddf5",
                    "on-error-container": "#93000a",
                    "tertiary-container": "#9d675c",
                    "on-primary": "#ffffff",
                    "secondary-container": "#edddf5",
                    "secondary-fixed-dim": "#d0c1d8",
                    "on-tertiary-container": "#fffbff",
                    "on-secondary-fixed": "#211828",
                    "on-tertiary-fixed-variant": "#683a31",
                    "on-surface": "#1d1b1a",
                    "surface": "#fef8f6",
                    "tertiary-fixed": "#ffdad3",
                    "primary-fixed-dim": "#d6c3b5",
                    "on-primary-container": "#fffbff",
                    "surface-tint": "#6a5c50",
                    "outline": "#7f756e",
                    "on-surface-variant": "#4d453f",
                    "outline-variant": "#d0c4bc",
                    "surface-container-high": "#ede7e5",
                    "surface-bright": "#fef8f6",
                    "on-tertiary": "#ffffff",
                    "on-background": "#1d1b1a",
                    "inverse-primary": "#d6c3b5",
                    "secondary": "#655a6e",
                    "on-tertiary-fixed": "#341009",
                    "on-secondary": "#ffffff",
                    "inverse-on-surface": "#f5f0ed",
                    "tertiary-fixed-dim": "#f9b7a9",
                    "primary": "#67594e",
                    "on-secondary-container": "#6c6074",
                    "on-primary-fixed-variant": "#51443a",
                    "background": "#fef8f6",
                    "primary-fixed": "#f2dfd0",
                    "surface-variant": "#e7e1df",
                    "on-secondary-fixed-variant": "#4d4355",
                    "surface-dim": "#ded9d7",
                    "surface-container-lowest": "#ffffff",
                    "tertiary": "#814f45"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1.5rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Noto Serif"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style type="text/tailwindcss">
    @layer utilities {
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-glass {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    }
</style>
<style>
    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }
    .vertical-slider-track {
        background: linear-gradient(to top, #d0c4bc 0%, #67594e 100%);
        border-radius: 9999px;
    }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface">
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 py-4 bg-[#fef8f6]/80 backdrop-blur-xl border-b border-surface-container">
<div class="flex items-center gap-4">
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<span class="font-headline italic font-bold text-primary">MenoSync</span>
</div>
<div class="text-on-surface-variant font-label text-[10px] tracking-widest uppercase">Step 3 of 3</div>
</header>
<main class="pt-20 px-5 max-w-md mx-auto pb-44">
<div class="mb-6">
<div class="flex justify-between items-baseline">
<h1 class="font-headline text-2xl font-semibold text-on-surface">Rapid Log</h1>
<span class="text-xs font-label text-on-surface-variant uppercase tracking-tighter">Triggers Dashboard</span>
</div>
<div class="mt-3 relative w-full h-1 bg-surface-container rounded-full overflow-hidden">
<div class="absolute top-0 left-0 h-full w-full bg-primary rounded-full"></div>
</div>
</div>
<div class="flex flex-col gap-3">
<div class="flex gap-3">
<section class="flex-1 bg-surface-container-lowest p-3 rounded-2xl border border-surface-container-highest shadow-sm">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-sm text-tertiary-container" style="font-variation-settings: 'FILL' 1;">coffee</span>
<h2 class="text-xs font-bold text-on-surface uppercase tracking-tight">Caffeine</h2>
</div>
<div class="grid grid-cols-2 gap-1 bg-surface-container-low p-1 rounded-lg">
<button class="text-[10px] py-1 rounded bg-white shadow-sm font-bold text-primary">0-1</button>
<button class="text-[10px] py-1 rounded text-on-surface-variant">2-3</button>
<button class="text-[10px] py-1 rounded text-on-surface-variant">4-5</button>
<button class="text-[10px] py-1 rounded text-on-surface-variant">6+</button>
</div>
</section>
<section class="flex-1 bg-surface-container-lowest p-3 rounded-2xl border border-surface-container-highest shadow-sm">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-sm text-tertiary-container" style="font-variation-settings: 'FILL' 1;">wine_bar</span>
<h2 class="text-xs font-bold text-on-surface uppercase tracking-tight">Alcohol</h2>
</div>
<div class="grid grid-cols-2 gap-1 bg-surface-container-low p-1 rounded-lg">
<button class="text-[10px] py-1 rounded bg-white shadow-sm font-bold text-primary">None</button>
<button class="text-[10px] py-1 rounded text-on-surface-variant">1 gl</button>
<button class="text-[10px] py-1 rounded text-on-surface-variant">2 gl</button>
<button class="text-[10px] py-1 rounded text-on-surface-variant">3+</button>
</div>
</section>
</div>
<div class="flex gap-3">
<section class="w-1/3 bg-surface-container-lowest p-3 rounded-2xl border border-surface-container-highest shadow-sm flex flex-col items-center">
<h2 class="text-[10px] font-bold text-on-surface uppercase tracking-tight mb-3">Stress</h2>
<div class="relative w-10 h-32 flex flex-col items-center justify-between py-2">
<div class="absolute w-2 h-full bg-surface-container-low rounded-full vertical-slider-track"></div>
<div class="z-10 w-8 h-8 rounded-full bg-white shadow-lg border-2 border-primary flex items-center justify-center">
<span class="text-[10px] font-bold text-primary">Med</span>
</div>
</div>
<div class="mt-2 text-[8px] text-on-surface-variant font-bold uppercase">High</div>
<div class="text-[8px] text-on-surface-variant font-bold uppercase mt-auto">Low</div>
</section>
<section class="flex-1 bg-surface-container-lowest p-3 rounded-2xl border border-surface-container-highest shadow-sm flex flex-col">
<div class="flex justify-between items-center mb-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-sm text-tertiary-container" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<h2 class="text-xs font-bold text-on-surface uppercase tracking-tight">Foods</h2>
</div>
<div class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-7 h-4 bg-surface-container-highest rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-primary-container"></div>
</div>
</div>
<textarea class="flex-grow w-full bg-surface-container-low border-none rounded-xl p-3 font-body text-on-surface-variant placeholder:text-outline-variant text-[11px] leading-snug resize-none" placeholder="Notes on diet or triggers..." rows="4"></textarea>
</section>
</div>
<div class="bg-secondary-fixed/20 p-3 rounded-xl flex items-center gap-3 border border-secondary-fixed/30">
<span class="material-symbols-outlined text-lg text-primary">lightbulb</span>
<p class="text-[11px] text-on-surface-variant leading-tight">
<span class="font-bold text-primary">Tip:</span> High sodium can worsen night sweats.
            </p>
</div>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full px-5 pb-6 pt-4 bg-glass bg-[#fef8f6]/90 border-t border-surface-container-highest">
<div class="flex gap-3 max-w-md mx-auto">
<button class="flex-1 py-3 px-4 rounded-xl bg-surface-container-high text-on-surface font-bold text-xs active:scale-95 transition-all">
            Back
        </button>
<button class="flex-[3] py-3 px-4 rounded-xl bg-primary text-white font-bold text-xs shadow-md active:scale-95 transition-all uppercase tracking-widest">
            Save Today's Log
        </button>
</div>
</footer>

</body></html>
