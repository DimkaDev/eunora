<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HRT Tracker - The Serene Curator</title>
<!-- Google Fonts: Noto Serif (Display/Headlines) & Manrope (Body/Labels) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration (Design System Tokens) -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-container": "#6c6074",
                        "surface-dim": "#ded9d7",
                        "surface-bright": "#fef8f6",
                        "surface-container-low": "#f8f2f0",
                        "surface": "#fef8f6",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#edddf5",
                        "surface-container-high": "#ede7e5",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "background": "#fef8f6",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "inverse-primary": "#d6c3b5",
                        "primary-container": "#817266",
                        "on-secondary-fixed": "#211828",
                        "inverse-surface": "#32302f",
                        "on-background": "#1d1b1a",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#f2dfd0",
                        "secondary": "#655a6e",
                        "on-secondary": "#ffffff",
                        "primary": "#67594e",
                        "surface-variant": "#e7e1df",
                        "on-tertiary-container": "#fffbff",
                        "on-tertiary-fixed-variant": "#683a31",
                        "surface-container-highest": "#e7e1df",
                        "inverse-on-surface": "#f5f0ed",
                        "secondary-fixed-dim": "#d0c1d8",
                        "secondary-container": "#edddf5",
                        "outline-variant": "#d0c4bc",
                        "on-secondary-fixed-variant": "#4d4355",
                        "tertiary-container": "#9d675c",
                        "surface-tint": "#6a5c50",
                        "on-surface-variant": "#4d453f",
                        "surface-container": "#f2edea",
                        "outline": "#7f756e",
                        "on-tertiary-fixed": "#341009",
                        "on-surface": "#1d1b1a",
                        "on-primary-fixed-variant": "#51443a",
                        "on-primary-fixed": "#231a11",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-primary-container": "#fffbff",
                        "tertiary-fixed": "#ffdad3",
                        "on-error": "#ffffff",
                        "tertiary": "#814f45"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem", /* Adjusted to 1.5rem per design system "rounded-xl (1.5rem) for most large containers" */
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Noto Serif", "serif"],
                        "display": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#fef8f6]/80 dark:bg-[#1d1b1a]/80 backdrop-blur-xl">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto scale-98 transition-transform duration-200">
<button class="text-[#9B8B7E] dark:text-[#817266] hover:opacity-80 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined text-2xl" data-icon="menu">menu</span>
</button>
<h1 class="font-serif text-2xl font-semibold tracking-tight text-[#67594e] dark:text-[#f2edea]">Your Journey</h1>
<button class="text-[#9B8B7E] dark:text-[#817266] hover:opacity-80 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined text-2xl" data-icon="user_profile_wellness">account_circle</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="pt-28 pb-32 px-5 md:px-8 max-w-2xl mx-auto flex flex-col gap-8">
<!-- Hero / Greeting -->
<section class="pl-2 pr-6">
<h2 class="font-headline text-4xl text-primary tracking-tight leading-tight">Good morning,<br/>Elena</h2>
<p class="font-body text-on-surface-variant text-lg mt-3 font-medium">Thursday, October 12</p>
</section>
<!-- Today's Protocol (Minimalist List) -->
<section class="bg-surface-container-low rounded-xl p-8 pt-7">
<h3 class="font-headline text-2xl text-on-surface mb-8">Today's Protocol</h3>
<div class="flex flex-col gap-6">
<!-- Dose Item 1 (Completed) -->
<div class="flex justify-between items-center group cursor-pointer">
<div class="flex flex-col gap-1">
<span class="font-body font-bold text-lg text-on-surface">Estradiol</span>
<span class="font-body text-sm text-on-surface-variant">2mg Pill • 8:00 AM</span>
</div>
<!-- Custom Toggle (Checked) -->
<div class="w-14 h-8 rounded-full bg-primary relative transition-colors duration-300 flex items-center px-1">
<div class="w-6 h-6 rounded-full bg-surface-container-lowest absolute right-1 shadow-sm transition-transform duration-300"></div>
</div>
</div>
<!-- Dose Item 2 (Pending) -->
<div class="flex justify-between items-center group cursor-pointer">
<div class="flex flex-col gap-1">
<span class="font-body font-bold text-lg text-on-surface">Progesterone</span>
<span class="font-body text-sm text-on-surface-variant">100mg Capsule • 9:00 PM</span>
</div>
<!-- Custom Toggle (Unchecked) -->
<div class="w-14 h-8 rounded-full bg-surface-variant relative transition-colors duration-300 flex items-center px-1">
<div class="w-6 h-6 rounded-full bg-surface-container-lowest absolute left-1 shadow-sm transition-transform duration-300"></div>
</div>
</div>
</div>
</section>
<!-- History (Vertical Pulse Line) -->
<section class="bg-surface-container rounded-xl p-8 pt-7 relative overflow-hidden">
<!-- Decorative gradient element in background -->
<div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-primary/5 to-transparent rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
<h3 class="font-headline text-2xl text-on-surface mb-8 relative z-10">Recent Pulse</h3>
<div class="relative pl-3">
<!-- The Pulse Line Background -->
<div class="absolute left-[15px] top-3 bottom-3 w-[2px] bg-surface-variant rounded-full z-0"></div>
<div class="flex flex-col gap-7 relative z-10">
<!-- Pulse Item 1 -->
<div class="flex items-start gap-6">
<div class="w-2.5 h-2.5 rounded-full bg-primary ring-4 ring-surface-container mt-1.5 flex-shrink-0"></div>
<div class="flex flex-col">
<span class="font-body font-bold text-base text-on-surface">Yesterday</span>
<span class="font-body text-sm text-on-surface-variant">Consistent • 2/2 Doses</span>
</div>
</div>
<!-- Pulse Item 2 -->
<div class="flex items-start gap-6">
<div class="w-2.5 h-2.5 rounded-full bg-primary ring-4 ring-surface-container mt-1.5 flex-shrink-0"></div>
<div class="flex flex-col">
<span class="font-body font-bold text-base text-on-surface">Tuesday</span>
<span class="font-body text-sm text-on-surface-variant">Consistent • 2/2 Doses</span>
</div>
</div>
<!-- Pulse Item 3 (Missed) -->
<div class="flex items-start gap-6">
<div class="w-2.5 h-2.5 rounded-full bg-surface-variant ring-4 ring-surface-container mt-1.5 flex-shrink-0"></div>
<div class="flex flex-col">
<span class="font-body font-bold text-base text-on-surface-variant">Monday</span>
<span class="font-body text-sm text-on-surface-variant">Partial • 1/2 Doses</span>
</div>
</div>
</div>
</div>
</section>
<!-- View Full Calendar CTA -->
<section class="mt-2">
<button class="w-full bg-surface-container-high hover:bg-surface-variant transition-colors duration-200 rounded-xl py-5 flex items-center justify-center gap-3">
<span class="material-symbols-outlined text-primary text-xl" data-icon="calendar_month">calendar_month</span>
<span class="font-body font-bold text-lg text-primary">View Full Calendar</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-[#f2edea]/70 dark:bg-[#2d2a29]/70 backdrop-blur-xl rounded-t-[1.5rem] shadow-[0_-4px_24px_0_rgba(29,27,26,0.06)] md:hidden">
<!-- Today (Active) -->
<button class="flex flex-col items-center justify-center bg-[#D8C9E0] dark:bg-[#817266] text-[#1d1b1a] dark:text-[#ffffff] rounded-2xl px-4 py-2 hover:bg-[#fef8f6]/50 dark:hover:bg-[#1d1b1a]/50 scale-95 transition-transform duration-200">
<span class="material-symbols-outlined mb-1 text-xl" data-icon="calendar_today" data-weight="fill" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
<span class="font-sans text-[11px] font-medium tracking-wide">Today</span>
</button>
<!-- History (Inactive) -->
<button class="flex flex-col items-center justify-center text-[#9B8B7E] dark:text-[#817266] px-4 py-2 hover:bg-[#fef8f6]/50 dark:hover:bg-[#1d1b1a]/50 rounded-2xl scale-95 transition-transform duration-200">
<span class="material-symbols-outlined mb-1 text-xl" data-icon="event_note">event_note</span>
<span class="font-sans text-[11px] font-medium tracking-wide">History</span>
</button>
<!-- Journal (Inactive) -->
<button class="flex flex-col items-center justify-center text-[#9B8B7E] dark:text-[#817266] px-4 py-2 hover:bg-[#fef8f6]/50 dark:hover:bg-[#1d1b1a]/50 rounded-2xl scale-95 transition-transform duration-200">
<span class="material-symbols-outlined mb-1 text-xl" data-icon="auto_stories">auto_stories</span>
<span class="font-sans text-[11px] font-medium tracking-wide">Journal</span>
</button>
<!-- Settings (Inactive) -->
<button class="flex flex-col items-center justify-center text-[#9B8B7E] dark:text-[#817266] px-4 py-2 hover:bg-[#fef8f6]/50 dark:hover:bg-[#1d1b1a]/50 rounded-2xl scale-95 transition-transform duration-200">
<span class="material-symbols-outlined mb-1 text-xl" data-icon="settings">settings</span>
<span class="font-sans text-[11px] font-medium tracking-wide">Settings</span>
</button>
</nav>
</body></html>
