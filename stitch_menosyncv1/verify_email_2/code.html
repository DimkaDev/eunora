<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verify Email - MenoSync</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#7f756e",
                        "on-primary-container": "#fffbff",
                        "on-secondary": "#ffffff",
                        "primary": "#67594e",
                        "background": "#fef8f6",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#d6c3b5",
                        "on-secondary-fixed-variant": "#4d4355",
                        "on-tertiary-fixed": "#341009",
                        "surface-bright": "#fef8f6",
                        "tertiary-fixed": "#ffdad3",
                        "surface-container-low": "#f8f2f0",
                        "secondary": "#655a6e",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "error": "#ba1a1a",
                        "on-surface": "#1d1b1a",
                        "primary-container": "#817266",
                        "on-tertiary-container": "#fffbff",
                        "on-primary-fixed-variant": "#51443a",
                        "secondary-fixed-dim": "#d0c1d8",
                        "on-surface-variant": "#4d453f",
                        "error-container": "#ffdad6",
                        "surface-dim": "#ded9d7",
                        "secondary-fixed": "#edddf5",
                        "surface-tint": "#6a5c50",
                        "on-primary-fixed": "#231a11",
                        "surface-container-high": "#ede7e5",
                        "on-error": "#ffffff",
                        "surface-variant": "#e7e1df",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#6c6074",
                        "tertiary": "#814f45",
                        "outline-variant": "#d0c4bc",
                        "on-error-container": "#93000a",
                        "surface-container": "#f2edea",
                        "surface": "#fef8f6",
                        "primary-fixed-dim": "#d6c3b5",
                        "secondary-container": "#edddf5",
                        "primary-fixed": "#f2dfd0",
                        "on-background": "#1d1b1a",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#211828",
                        "inverse-surface": "#32302f",
                        "tertiary-container": "#9d675c",
                        "on-tertiary-fixed-variant": "#683a31",
                        "inverse-on-surface": "#f5f0ed",
                        "surface-container-highest": "#e7e1df"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .tonal-transition {
            background: linear-gradient(180deg, #fef8f6 0%, #f2edea 100%);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 tonal-transition bg-[#fef8f6] dark:bg-[#1d1b1a] flex justify-between items-center w-full px-6 py-4">
<div class="flex items-center gap-4">
<button class="transition-all duration-300 ease-in-out active:scale-95 text-[#67594e] dark:text-[#f2edea]">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-noto-serif text-2xl font-semibold text-[#67594e] dark:text-[#f2edea]">Verify Email</h1>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 w-full max-w-[340px] px-4 pt-12 pb-20 flex flex-col items-center text-center">
<!-- Header Section -->
<div class="mb-10 flex flex-col items-center">
<div class="w-20 h-20 rounded-full bg-surface-container flex items-center justify-center mb-6 shadow-sm">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 0, 'wght' 300;">mail</span>
</div>
<h2 class="font-headline text-[22px] font-bold text-on-surface leading-tight mb-3">Verify Your Email</h2>
<p class="font-body text-[13px] text-on-surface-variant leading-relaxed px-2">
                We sent a verification code to <span class="font-semibold text-primary">sarah@email.com</span>
</p>
</div>
<!-- Code Input Section -->
<div class="w-full space-y-6">
<div class="text-left">
<label class="block font-label text-[13px] font-bold text-on-surface-variant mb-3 px-1">
                    Enter verification code
                </label>
<div class="flex justify-between gap-2">
<!-- Individual digit inputs for high-end feel -->
<input class="w-12 h-14 bg-surface-container-highest border-2 border-transparent focus:border-primary text-center font-mono text-[22px] rounded-xl transition-all outline-none" maxlength="1" type="text" value="8"/>
<input class="w-12 h-14 bg-surface-container-highest border-2 border-transparent focus:border-primary text-center font-mono text-[22px] rounded-xl transition-all outline-none" maxlength="1" type="text" value="4"/>
<input class="w-12 h-14 bg-surface-container-highest border-2 border-transparent focus:border-primary text-center font-mono text-[22px] rounded-xl transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-14 bg-surface-container-highest border-2 border-transparent focus:border-primary text-center font-mono text-[22px] rounded-xl transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-14 bg-surface-container-highest border-2 border-transparent focus:border-primary text-center font-mono text-[22px] rounded-xl transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-14 bg-surface-container-highest border-2 border-transparent focus:border-primary text-center font-mono text-[22px] rounded-xl transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
</div>
<p class="font-body text-[11px] text-outline mt-3 px-1 flex items-center gap-1.5">
<span class="material-symbols-outlined text-[14px]">info</span>
                    Check your email (spam folder too)
                </p>
</div>
<!-- Main CTA -->
<button class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-white font-label font-bold text-[15px] rounded-full shadow-lg shadow-primary/10 transition-all duration-300 active:scale-95">
                Verify Email
            </button>
</div>
<!-- Resend Section -->
<div class="mt-12 w-full space-y-4">
<p class="font-body text-[13px] text-on-surface-variant">
                Didn't receive the code?
            </p>
<div class="flex flex-col items-center gap-2">
<button class="w-full py-3.5 bg-surface-container-lowest border-2 border-outline-variant text-primary font-label font-bold text-[14px] rounded-full transition-all duration-300 active:scale-95 hover:bg-surface-container">
                    Resend Code
                </button>
<div class="flex items-center gap-2 text-outline font-label text-[12px] font-medium">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                    Resend in 45s
                </div>
</div>
</div>
<!-- Footer -->
<footer class="mt-auto pt-16">
<a class="text-primary underline underline-offset-4 font-label text-[13px] font-semibold transition-colors hover:text-primary-container" href="#">
                Use a different email
            </a>
</footer>
<!-- Optional Status References (As requested) -->
<div class="mt-20 w-full space-y-4 opacity-40">
<div class="p-4 bg-secondary-container rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-[#2e7d32]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[13px] text-on-secondary-container font-medium">Code verified successfully!</span>
</div>
<div class="p-4 bg-error-container rounded-xl flex items-center gap-3 border border-error/10">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="text-[13px] text-on-error-container font-medium text-left leading-tight">The code you entered is incorrect. Please try again.</span>
</div>
</div>
</main>
<!-- Visual Embellishment: Background Tonal Layering -->
<div class="fixed top-[-10%] right-[-10%] w-[60%] h-[40%] rounded-full bg-secondary-fixed/20 blur-[100px] -z-10"></div>
<div class="fixed bottom-[-5%] left-[-10%] w-[50%] h-[30%] rounded-full bg-tertiary-fixed/30 blur-[80px] -z-10"></div>
</body></html>
