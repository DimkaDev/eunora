<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trigger Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400..700;1,400..700&amp;family=Manrope:wght@400..700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed-dim": "#d6c3b5",
                    "primary": "#67594e",
                    "on-secondary-fixed": "#211828",
                    "on-primary": "#ffffff",
                    "surface-dim": "#ded9d7",
                    "secondary-fixed-dim": "#d0c1d8",
                    "on-tertiary": "#ffffff",
                    "on-surface": "#1d1b1a",
                    "surface-container-high": "#ede7e5",
                    "on-tertiary-fixed-variant": "#683a31",
                    "error": "#ba1a1a",
                    "surface-tint": "#6a5c50",
                    "secondary": "#655a6e",
                    "outline": "#7f756e",
                    "on-secondary": "#ffffff",
                    "error-container": "#ffdad6",
                    "surface-bright": "#fef8f6",
                    "on-tertiary-container": "#fffbff",
                    "primary-fixed": "#f2dfd0",
                    "surface-variant": "#e7e1df",
                    "surface": "#fef8f6",
                    "surface-container-highest": "#e7e1df",
                    "surface-container-lowest": "#ffffff",
                    "inverse-on-surface": "#f5f0ed",
                    "tertiary-container": "#9d675c",
                    "on-primary-fixed-variant": "#51443a",
                    "on-surface-variant": "#4d453f",
                    "secondary-fixed": "#edddf5",
                    "tertiary-fixed-dim": "#f9b7a9",
                    "on-error": "#ffffff",
                    "surface-container-low": "#f8f2f0",
                    "on-tertiary-fixed": "#341009",
                    "surface-container": "#f2edea",
                    "on-error-container": "#93000a",
                    "on-primary-container": "#fffbff",
                    "outline-variant": "#d0c4bc",
                    "background": "#fef8f6",
                    "on-background": "#1d1b1a",
                    "on-secondary-container": "#6c6074",
                    "tertiary-fixed": "#ffdad3",
                    "on-primary-fixed": "#231a11",
                    "secondary-container": "#edddf5",
                    "inverse-surface": "#32302f",
                    "tertiary": "#814f45",
                    "primary-container": "#817266",
                    "inverse-primary": "#d6c3b5",
                    "on-secondary-fixed-variant": "#4d4355"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {},
            "fontFamily": {
                    "headline": [
                            "Noto Serif"
                    ],
                    "display": [
                            "Noto Serif"
                    ],
                    "body": [
                            "Manrope"
                    ],
                    "label": [
                            "Manrope"
                    ]
            },
            "fontSize": {}
        },
        },
      }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        h1, h2, h3, h4, h5, h6, .font-headline, .font-display {
            font-family: 'Noto Serif', serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-stone-50/70 dark:bg-stone-900/70 backdrop-blur-xl flex justify-between items-center px-6 py-4 transition-opacity">
<button class="flex items-center justify-center p-2 rounded-full hover:opacity-80 transition-opacity text-stone-700 dark:text-stone-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-3xl font-serif text-stone-800 dark:text-stone-100 font-bold tracking-wide">Daily Reflection</h1>
<div class="flex items-center justify-center p-2 hover:opacity-80 transition-opacity">
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant/15 flex items-center justify-center text-primary font-bold text-sm">
                UP
            </div>
</div>
</header>
<!-- Main Content -->
<main class="pt-24 px-5 md:px-8 max-w-3xl mx-auto flex flex-col gap-8">
<!-- Header Section -->
<section class="flex flex-col gap-2">
<h2 class="text-2xl font-headline font-bold text-on-surface leading-tight">What triggers affected your mood today?</h2>
<p class="text-on-surface-variant font-body text-sm leading-relaxed">Select any factors that influenced your feelings or energy levels.</p>
</section>
<!-- Triggers Grid -->
<section class="grid grid-cols-2 gap-4">
<!-- Card 1 (Selected - Stress) -->
<button class="bg-secondary-container border border-outline-variant/30 rounded-xl p-6 flex flex-col items-center justify-center gap-3 shadow-[0_4px_24px_rgba(29,27,26,0.06)] hover:opacity-90 transition-all text-on-secondary-container transform scale-[1.02]">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">psychology</span>
<span class="font-body font-medium text-base">Stress</span>
</button>
<!-- Card 2 -->
<button class="bg-surface-container-lowest border border-outline-variant/15 rounded-xl p-6 flex flex-col items-center justify-center gap-3 shadow-[0_4px_24px_rgba(29,27,26,0.02)] hover:opacity-90 transition-all text-on-surface-variant">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 0;">nights_stay</span>
<span class="font-body font-medium text-base">Sleep</span>
</button>
<!-- Card 3 -->
<button class="bg-surface-container-lowest border border-outline-variant/15 rounded-xl p-6 flex flex-col items-center justify-center gap-3 shadow-[0_4px_24px_rgba(29,27,26,0.02)] hover:opacity-90 transition-all text-on-surface-variant">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 0;">restaurant</span>
<span class="font-body font-medium text-base">Diet</span>
</button>
<!-- Card 4 -->
<button class="bg-surface-container-lowest border border-outline-variant/15 rounded-xl p-6 flex flex-col items-center justify-center gap-3 shadow-[0_4px_24px_rgba(29,27,26,0.02)] hover:opacity-90 transition-all text-on-surface-variant">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 0;">fitness_center</span>
<span class="font-body font-medium text-base">Exercise</span>
</button>
<!-- Card 5 -->
<button class="bg-surface-container-lowest border border-outline-variant/15 rounded-xl p-6 flex flex-col items-center justify-center gap-3 shadow-[0_4px_24px_rgba(29,27,26,0.02)] hover:opacity-90 transition-all text-on-surface-variant">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 0;">groups</span>
<span class="font-body font-medium text-base">Social</span>
</button>
<!-- Card 6 -->
<button class="bg-surface-container-lowest border border-outline-variant/15 rounded-xl p-6 flex flex-col items-center justify-center gap-3 shadow-[0_4px_24px_rgba(29,27,26,0.02)] hover:opacity-90 transition-all text-on-surface-variant">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 0;">work</span>
<span class="font-body font-medium text-base">Work</span>
</button>
</section>
<!-- Custom Triggers -->
<section class="bg-surface-container rounded-xl p-6 flex flex-col gap-4 mt-4">
<h3 class="font-headline font-semibold text-lg text-on-surface">Add Custom Trigger</h3>
<div class="flex gap-2">
<input class="flex-1 bg-surface-container-highest rounded-full px-5 py-3 text-sm font-body text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary/50 border-none" placeholder="e.g. Traffic, Weather..." type="text"/>
<button class="bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-full px-6 py-3 font-body font-medium text-sm hover:opacity-90 transition-opacity flex items-center justify-center">
                    Add
                </button>
</div>
</section>
<!-- CTA -->
<div class="pt-8 flex justify-center">
<button class="bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-full px-12 py-4 font-body font-medium text-lg hover:opacity-90 transition-opacity shadow-[0_4px_24px_rgba(29,27,26,0.06)] w-full max-w-sm">
                Continue Reflection
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-stone-50/70 dark:bg-stone-900/70 backdrop-blur-xl shadow-[0_-4px_24px_rgba(29,27,26,0.06)] rounded-t-[2rem] md:hidden">
<button class="flex flex-col items-center justify-center bg-stone-200 dark:bg-stone-800 text-stone-900 dark:text-stone-50 rounded-2xl px-6 py-2 translate-y-[-2px] transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
<span class="font-sans text-[10px] uppercase tracking-widest mt-1">Journal</span>
</button>
<button class="flex flex-col items-center justify-center text-stone-500 dark:text-stone-400 px-6 py-2 hover:text-stone-700 dark:hover:text-stone-200 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">analytics</span>
<span class="font-sans text-[10px] uppercase tracking-widest mt-1">Insights</span>
</button>
<button class="flex flex-col items-center justify-center text-stone-500 dark:text-stone-400 px-6 py-2 hover:text-stone-700 dark:hover:text-stone-200 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">spa</span>
<span class="font-sans text-[10px] uppercase tracking-widest mt-1">Library</span>
</button>
<button class="flex flex-col items-center justify-center text-stone-500 dark:text-stone-400 px-6 py-2 hover:text-stone-700 dark:hover:text-stone-200 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-sans text-[10px] uppercase tracking-widest mt-1">Profile</span>
</button>
</nav>
</body></html>
