<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Emotive Logging</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        'cream': '#F7F5F0',
                        'charcoal': '#2D2D2A',
                        'terracotta': '#A65D4B',
                        'moss': '#5E6B54',
                        'ochre': '#C5954B',
                        'clay': '#8C7365',
                        'lavender-soft': '#E6E1EA',
                        'taupe': '#6D635B'
                    },
                    fontFamily: {
                        'serif': ['Noto Serif', 'serif'],
                        'sans': ['Manrope', 'sans-serif'],
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .asymmetric-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: minmax(120px, auto);
                gap: 1.25rem;
            }
            .card-tall { grid-row: span 2; }
            .card-wide { grid-column: span 2; }
            .abstract-shape {
                mask-size: contain;
                mask-repeat: no-repeat;
                mask-position: center;
                -webkit-mask-size: contain;
                -webkit-mask-repeat: no-repeat;
                -webkit-mask-position: center;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 48;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-cream text-charcoal min-h-screen flex flex-col font-sans">
<header class="w-full sticky top-0 z-50 bg-cream/90 backdrop-blur-md">
<div class="flex items-center justify-between px-6 py-4">
<button class="text-taupe hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="font-serif italic text-sm text-taupe">Step 1 of 3</span>
<span class="text-[10px] uppercase tracking-widest font-bold text-taupe/60">Symptom Logging</span>
</div>
<div class="w-10"></div>
</div>
<div class="w-full h-1 bg-taupe/10">
<div class="h-full bg-terracotta transition-all duration-500" style="width: 33%"></div>
</div>
</header>
<main class="flex-grow px-6 pt-8 pb-32 max-w-lg mx-auto w-full">
<section class="mb-10 text-center">
<h1 class="text-4xl font-serif font-bold text-charcoal leading-tight mb-4">
            What are you <span class="italic text-terracotta">feeling</span> today?
        </h1>
<div class="w-12 h-0.5 bg-clay/30 mx-auto mb-4"></div>
<p class="text-taupe font-medium text-sm px-4">Listen to your body's rhythm and select the imprints of today's experience.</p>
</section>
<div class="asymmetric-grid">
<button class="card-tall relative group flex flex-col justify-end p-5 rounded-[2rem] bg-white border border-lavender-soft text-left overflow-hidden ring-offset-2 transition-all hover:shadow-xl active:scale-[0.98]">
<div class="absolute top-0 right-0 w-32 h-32 bg-orange-100/50 rounded-full -translate-y-8 translate-x-8 blur-2xl group-hover:bg-orange-200 transition-colors"></div>
<div class="relative z-10 flex flex-col gap-4 h-full justify-between">
<span class="material-symbols-outlined text-5xl text-terracotta opacity-80">flare</span>
<div>
<h3 class="text-xl font-serif font-bold leading-none mb-1">Hot Flashes</h3>
<p class="text-[10px] text-taupe uppercase tracking-wider">Sudden intensity</p>
</div>
</div>
<div class="absolute top-4 right-4 w-6 h-6 bg-moss rounded-full flex items-center justify-center text-white scale-0 transition-transform duration-300">
<span class="material-symbols-outlined text-sm">check</span>
</div>
</button>
<button class="relative group flex flex-col justify-between p-5 rounded-[1.5rem] bg-white border-2 border-taupe bg-lavender-soft/30 text-left transition-all shadow-sm">
<span class="material-symbols-outlined text-3xl text-taupe/40">bedtime</span>
<h3 class="text-lg font-serif font-bold leading-tight">Sleep Issues</h3>
<div class="absolute top-3 right-3 w-6 h-6 bg-moss rounded-full flex items-center justify-center text-white scale-100">
<span class="material-symbols-outlined text-xs">check</span>
</div>
</button>
<button class="relative group flex flex-col justify-between p-5 rounded-[1.5rem] bg-white border border-lavender-soft text-left transition-all hover:bg-stone-50">
<span class="material-symbols-outlined text-3xl text-stone-300">cloud</span>
<h3 class="text-lg font-serif font-bold leading-tight">Brain Fog</h3>
</button>
<button class="card-wide relative flex items-center gap-6 p-6 rounded-[2rem] bg-white border border-lavender-soft text-left overflow-hidden transition-all hover:shadow-lg">
<div class="w-20 h-20 bg-moss/10 rounded-full flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-moss/20 to-transparent"></div>
<span class="material-symbols-outlined text-4xl text-moss">masks</span>
</div>
<div>
<h3 class="text-xl font-serif font-bold">Mood Changes</h3>
<p class="text-sm text-taupe italic">Shifting emotional tides</p>
</div>
</button>
<button class="relative group flex flex-col justify-between p-5 rounded-[1.5rem] bg-white border border-lavender-soft text-left transition-all">
<span class="material-symbols-outlined text-3xl text-blue-200">water_drop</span>
<h3 class="text-lg font-serif font-bold leading-tight">Night Sweats</h3>
</button>
<button class="card-tall relative flex flex-col justify-between p-5 rounded-[2.5rem] bg-clay/5 border border-lavender-soft text-left transition-all hover:bg-clay/10">
<div class="space-y-2">
<div class="w-12 h-1 bg-clay/20 rounded-full"></div>
<div class="w-8 h-1 bg-clay/20 rounded-full"></div>
</div>
<div class="space-y-4">
<span class="material-symbols-outlined text-5xl text-clay/60">battery_low</span>
<h3 class="text-2xl font-serif font-bold leading-tight">Fatigue</h3>
</div>
</button>
<button class="relative group flex flex-col justify-between p-5 rounded-[1.5rem] bg-white border border-lavender-soft text-left transition-all">
<span class="material-symbols-outlined text-3xl text-ochre/40">settings_accessibility</span>
<h3 class="text-lg font-serif font-bold leading-tight">Joint Pain</h3>
</button>
<button class="relative group flex flex-col justify-between p-5 rounded-[1.5rem] bg-white border border-lavender-soft text-left transition-all">
<span class="material-symbols-outlined text-3xl text-terracotta/30">psychology_alt</span>
<h3 class="text-lg font-serif font-bold leading-tight">Headache</h3>
</button>
<button class="card-wide relative flex items-center justify-between p-6 rounded-[2rem] bg-white border border-lavender-soft text-left overflow-hidden transition-all">
<div class="flex-1">
<h3 class="text-xl font-serif font-bold mb-1">Anxiety</h3>
<p class="text-sm text-taupe italic">Unsettled heart or mind</p>
</div>
<div class="w-16 h-16 flex items-center justify-center">
<div class="absolute w-12 h-12 bg-ochre/20 rounded-full animate-pulse"></div>
<span class="material-symbols-outlined text-4xl text-ochre relative">self_improvement</span>
</div>
</button>
<button class="relative group flex flex-col justify-between p-5 rounded-[1.5rem] bg-white border border-lavender-soft text-left transition-all">
<span class="material-symbols-outlined text-3xl text-taupe/30">bubble_chart</span>
<h3 class="text-lg font-serif font-bold leading-tight">Other</h3>
</button>
<button class="relative group flex flex-col justify-between p-5 rounded-[1.5rem] bg-white border border-lavender-soft text-left transition-all">
<span class="material-symbols-outlined text-3xl text-red-200">favorite</span>
<h3 class="text-lg font-serif font-bold leading-tight">Heart Flutters</h3>
</button>
</div>
<div class="mt-12 bg-white/40 border border-clay/10 rounded-[2.5rem] p-8 shadow-inner">
<div class="flex items-center gap-3 mb-6">
<span class="material-symbols-outlined text-clay">stylus_note</span>
<h3 class="text-xl font-serif font-bold text-taupe">Notes on today</h3>
</div>
<textarea class="w-full bg-transparent border-none p-0 font-serif text-lg text-charcoal placeholder:text-taupe/40 focus:ring-0 min-h-[120px] resize-none italic" placeholder="How does your body feel in words?"></textarea>
<div class="mt-4 border-t border-clay/10 pt-4 flex justify-end">
<span class="text-[10px] uppercase tracking-widest text-taupe/40 font-bold">Private &amp; Secure Log</span>
</div>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full p-6 bg-cream/80 backdrop-blur-xl border-t border-taupe/5 flex justify-center items-center z-50">
<button class="w-full max-w-md py-5 px-8 rounded-full bg-taupe text-cream font-bold text-lg shadow-2xl hover:shadow-taupe/20 transition-all active:scale-95 flex items-center justify-between">
<span class="pl-4">Next: Describe Severity</span>
<span class="material-symbols-outlined bg-white/10 p-2 rounded-full">arrow_forward</span>
</button>
</footer>
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] bg-terracotta/5 rounded-full blur-[120px]"></div>
<div class="absolute top-[40%] -right-[10%] w-[60%] h-[60%] bg-moss/5 rounded-full blur-[150px]"></div>
<div class="absolute -bottom-[10%] left-[20%] w-[40%] h-[40%] bg-ochre/5 rounded-full blur-[100px]"></div>
</div>

</body></html>
