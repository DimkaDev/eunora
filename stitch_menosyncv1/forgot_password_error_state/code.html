<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - Error</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#814f45",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffdad3",
                        "primary-fixed-dim": "#d6c3b5",
                        "on-primary-container": "#fffbff",
                        "on-primary-fixed-variant": "#51443a",
                        "on-primary-fixed": "#231a11",
                        "on-surface": "#1d1b1a",
                        "outline": "#7f756e",
                        "on-tertiary-fixed": "#341009",
                        "surface-container": "#f2edea",
                        "on-surface-variant": "#4d453f",
                        "surface-tint": "#6a5c50",
                        "tertiary-container": "#9d675c",
                        "outline-variant": "#d0c4bc",
                        "on-secondary-fixed-variant": "#4d4355",
                        "secondary-fixed-dim": "#d0c1d8",
                        "secondary-container": "#edddf5",
                        "inverse-on-surface": "#f5f0ed",
                        "surface-container-highest": "#e7e1df",
                        "on-tertiary-fixed-variant": "#683a31",
                        "surface-variant": "#e7e1df",
                        "on-tertiary-container": "#fffbff",
                        "primary": "#67594e",
                        "secondary": "#655a6e",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#f2dfd0",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "on-background": "#1d1b1a",
                        "inverse-surface": "#32302f",
                        "on-secondary-fixed": "#211828",
                        "primary-container": "#817266",
                        "inverse-primary": "#d6c3b5",
                        "tertiary-fixed-dim": "#f9b7a9",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "background": "#fef8f6",
                        "surface-container-high": "#ede7e5",
                        "secondary-fixed": "#edddf5",
                        "surface": "#fef8f6",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f8f2f0",
                        "surface-dim": "#ded9d7",
                        "surface-bright": "#fef8f6",
                        "on-secondary-container": "#6c6074"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif", "serif"],
                        "display": ["Noto Serif", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline { font-family: 'Noto Serif', serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-5">
<!-- TopAppBar Semantic Shell - Hidden due to Intentional Suppression (Transactional Page) -->
<main class="w-full max-w-md mx-auto space-y-8 animate-fade-in relative">
<!-- Subtle Background Glow -->
<div class="absolute -top-32 -left-16 w-64 h-64 bg-primary-fixed/30 rounded-full blur-3xl -z-10"></div>
<div class="absolute -bottom-32 -right-16 w-64 h-64 bg-secondary-fixed/20 rounded-full blur-3xl -z-10"></div>
<!-- Back Action -->
<button class="flex items-center text-primary font-medium text-sm hover:opacity-80 transition-opacity mb-8">
<span class="material-symbols-outlined text-lg mr-2" data-icon="arrow_back">arrow_back</span>
            Back to Login
        </button>
<!-- Header -->
<div class="space-y-4">
<h1 class="font-headline text-4xl text-on-surface font-semibold tracking-tight">Forgot Password</h1>
<p class="text-on-surface-variant font-body text-base leading-relaxed max-w-sm">
                Enter the email address associated with your account, and we'll send you a link to reset your password.
            </p>
</div>
<!-- Error Banner -->
<div class="bg-error-container/50 border border-error/20 rounded-xl p-4 flex items-start space-x-3">
<span class="material-symbols-outlined text-error mt-0.5" data-icon="error">error</span>
<p class="text-on-error-container font-body text-sm font-medium">
                Email not found. Please check and try again.
            </p>
</div>
<!-- Form Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Email Input Group -->
<div class="space-y-2 relative">
<label class="block text-sm font-medium text-on-surface ml-1" for="email">Email Address</label>
<div class="relative">
<!-- Glassmorphism Container with Error State -->
<div class="absolute inset-0 bg-surface-container-highest/80 backdrop-blur-md rounded-full border border-error pointer-events-none transition-all shadow-[0_4px_24px_0_rgba(29,27,26,0.02)]"></div>
<input class="relative w-full bg-transparent border-none rounded-full py-4 pl-12 pr-4 text-on-surface placeholder-on-surface-variant focus:ring-2 focus:ring-error focus:outline-none z-10 text-base" id="email" name="email" placeholder="e.g., sarah@example.com" type="email" value="sarah@wrongemail.com"/>
<!-- Icon -->
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none z-20">
<span class="material-symbols-outlined text-error" data-icon="mail">mail</span>
</div>
</div>
<!-- Error Message -->
<p class="text-error text-[11px] font-medium ml-4 mt-1 font-body">
                    We couldn't find an account associated with this email.
                </p>
</div>
<!-- Actions -->
<div class="pt-4">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 rounded-xl font-body text-title-sm font-semibold hover:opacity-90 transition-opacity shadow-[0_4px_24px_0_rgba(29,27,26,0.06)]" type="submit">
                    Send Reset Link
                </button>
</div>
<div class="text-center pt-2">
<button class="text-primary font-medium text-sm hover:underline font-body" type="button">
                    Need help? Contact Support
                 </button>
</div>
</form>
</main>
<!-- BottomNavBar Semantic Shell - Hidden due to Intentional Suppression (Transactional Page) -->
</body></html>
