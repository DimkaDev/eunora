<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MenoSync - Speed Logger</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        :root {
            --bg-color: #ffffff;
            --text-main: #121212;
            --text-muted: #666666;
            --border-color: #e5e5e5;
            --accent-color: #5d5dff;--charcoal: #1a1a1a;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
            font-size: 20px;
        }
        .symptom-row:active {
            background-color: #f9f9f9;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col">
<header class="sticky top-0 z-50 bg-white border-b border-gray-100">
<div class="flex items-center justify-between px-4 py-3">
<button class="w-10 h-10 flex items-center justify-start text-charcoal">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mb-1">Step 1 of 3</span>
<div class="w-32 h-1 bg-gray-100 rounded-full overflow-hidden">
<div class="h-full bg-charcoal w-1/3"></div>
</div>
</div>
<div class="w-10"></div>
</div>
</header>
<main class="flex-grow w-full max-w-md mx-auto px-5 py-6">
<section class="mb-8">
<h1 class="text-2xl font-bold tracking-tight text-charcoal">Symptoms</h1>
<p class="text-sm text-gray-500 mt-1">Tap to select all that apply.</p>
</section>
<div class="flex flex-col space-y-px bg-gray-100 border-y border-gray-100">
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">light_mode</span>
<span class="text-[15px] font-medium text-charcoal">Hot Flashes</span>
</div>
<div class="w-5 h-5 rounded-full border-2 border-charcoal bg-charcoal flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[14px]" style="font-variation-settings: 'wght' 700">check</span>
</div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">bedtime</span>
<span class="text-[15px] font-medium text-charcoal">Sleep Issues</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">psychology</span>
<span class="text-[15px] font-medium text-charcoal">Brain Fog</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">mood</span>
<span class="text-[15px] font-medium text-charcoal">Mood Changes</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">water_drop</span>
<span class="text-[15px] font-medium text-charcoal">Night Sweats</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">fitness_center</span>
<span class="text-[15px] font-medium text-charcoal">Joint Pain</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">medical_services</span>
<span class="text-[15px] font-medium text-charcoal">Headache</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">battery_low</span>
<span class="text-[15px] font-medium text-charcoal">Fatigue</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">opacity</span>
<span class="text-[15px] font-medium text-charcoal">Vaginal Dryness</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">trending_up</span>
<span class="text-[15px] font-medium text-charcoal">Weight Gain</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">calendar_month</span>
<span class="text-[15px] font-medium text-charcoal">Irregular Bleeding</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">favorite</span>
<span class="text-[15px] font-medium text-charcoal">Heart Palpitations</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">potted_plant</span>
<span class="text-[15px] font-medium text-charcoal">Anxiety</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">bolt</span>
<span class="text-[15px] font-medium text-charcoal">Irritability</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
<button class="group flex items-center justify-between py-4 px-2 bg-white hover:bg-gray-50 transition-colors w-full text-left">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-charcoal opacity-60">add_circle</span>
<span class="text-[15px] font-medium text-charcoal">Other</span>
</div>
<div class="w-5 h-5 rounded-full border border-gray-300"></div>
</button>
</div>
<div class="h-24"></div> 
</main>
<footer class="fixed bottom-0 left-0 w-full p-4 bg-white border-t border-gray-100 z-50">
<div class="max-w-md mx-auto">
<button class="w-full h-14 bg-charcoal text-white rounded-lg font-semibold text-base flex items-center justify-center gap-2 active:opacity-90">
<span>Next</span>
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</footer>

</body></html>
